  }
  const reviewStatus = cfg => { const all = reviewItems(cfg); const done = all.filter(x => x.item.verified === true).length; return { total: all.length, verified: done, unverified: all.length - done }; };

  // ---------- validation (problems that would make a room unsolvable) ----------
  function validate(cfg) {
    const errs = [];
    if (!String(cfg.meta?.title || "").trim()) errs.push("Settings: the escape room needs a title.");
    if (!(cfg.rooms || []).length) errs.push("Add at least one room.");
    (cfg.rooms || []).forEach((room, r) => {
      const where = `Room ${r + 1} (${room.title || "untitled"})`;
      if (room.type === "matching") {
        const m = matching(room);
        if (!m.answerCards.length) errs.push(`${where}: at least one card needs a clue.`);
        if ((room.cards || []).some(c => !String(c.term || "").trim())) errs.push(`${where}: every card needs a name.`);
        if (m.answer.includes("?")) errs.push(`${where}: too many cards for ${m.numbers ? "number codes (max 9)" : "letter codes (max 26)"}.`);
        const word = String(room.codeWord || "").replace(/\s+/g, "");
        if (!m.numbers && word && word.length !== m.answerCards.length) errs.push(`${where}: the code word "${word}" has ${word.length} letters but there are ${m.answerCards.length} clues.`);
      }
      if (room.type === "quiz") {
        if (!(room.questions || []).length) errs.push(`${where}: add at least one question.`);
        (room.questions || []).forEach((q, i) => {
          if (!String(q.prompt || "").trim()) errs.push(`${where}, question ${i + 1}: the question is empty.`);
          if (q.kind === "choice") {
            const ch = (q.choices || []).filter(c => String(c).trim());
            if (ch.length < 2) errs.push(`${where}, question ${i + 1}: needs at least 2 choices.`);
            if (!(q.correct >= 0 && q.correct < (q.choices || []).length && String(q.choices[q.correct]).trim())) errs.push(`${where}, question ${i + 1}: mark which choice is correct.`);
          } else if (!accepted(q.answers).length) errs.push(`${where}, question ${i + 1}: needs at least one accepted answer.`);
        });
      }
      if (room.hintsEnabled && HINT_ROOMS.includes(room.type) && !(room.hints || []).slice(0, 2).some(x => String(x || "").trim()))
        errs.push(`${where}: hints are turned on, but no hint has been written.`);
      if (room.type === "ordering" && (room.items || []).length < 2) errs.push(`${where}: needs at least 2 items to put in order.`);
      if (room.type === "sorting") {
        const cats = (room.categories || []).filter(c => String(c).trim());
        if (cats.length < 2) errs.push(`${where}: needs at least 2 categories.`);
        if (!(room.items || []).length) errs.push(`${where}: add at least one item to sort.`);
        (room.items || []).forEach((it, i) => { if (!(it.category >= 0 && it.category < (room.categories || []).length)) errs.push(`${where}, item ${i + 1}: pick its correct category.`); });
      }
      if (room.type === "reflection") {
        const keys = new Set((room.profiles || []).map(p => p.key));
        if (!keys.size) errs.push(`${where}: add at least one result profile.`);
        (room.questions || []).forEach((q, i) => (q.options || []).forEach((o, j) => {
          if (!keys.has(o.profile)) errs.push(`${where}, question ${i + 1}, option ${j + 1}: pick which result it counts toward.`);
        }));
      }
    });
    return errs;
  }

  // ---------- packing content into the game file ----------
  const encodeConfig = cfg => { const bytes = new TextEncoder().encode(JSON.stringify(cfg)); let s = ""; for (const b of bytes) s += String.fromCharCode(b); return btoa(s); };
  const decodeConfig = b64 => JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(String(b64).trim()), c => c.charCodeAt(0))));
  // Placeholders are built by concatenation so this code never matches itself once inlined into the game.
  const P_TITLE = "__ESCAPE_" + "TITLE__", P_CONFIG = "__ESCAPE_" + "CONFIG__";
  const buildGame = (template, cfg) => template.split(P_TITLE).join(esc(cfg.meta?.title || "Escape Room")).split(P_CONFIG).join(encodeConfig(cfg));
  // Pull the content back out of an exported game file (so a teacher can reopen and edit it).
  function configFromHtml(html) {
    const m = String(html).match(/<script id="escape-config" type="text\/plain">([\s\S]*?)<\/script>/);
    if (!m) throw new Error("This file isn't an escape room made with this editor.");
    return decodeConfig(m[1]);
  }

  // ---------- zip (stored, no compression) for SCORM packages ----------
  const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
  const crc32 = d => { let c = 0xFFFFFFFF; for (let i = 0; i < d.length; i++) c = CRC[(c ^ d[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
  function zip(files, date = new Date()) {
    const enc = new TextEncoder();
    const dosTime = (date.getHours() << 11) | (date.getMinutes() << 5) | (date.getSeconds() >> 1);
    const dosDate = ((date.getFullYear() - 1980) << 9) | ((date.getMonth() + 1) << 5) | date.getDate();
    const parts = [], central = []; let offset = 0;
    for (const f of files) {
      const name = enc.encode(f.name), data = typeof f.data === "string" ? enc.encode(f.data) : f.data, crc = crc32(data);
      const h = new DataView(new ArrayBuffer(30));
      h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true); h.setUint16(8, 0, true);
      h.setUint16(10, dosTime, true); h.setUint16(12, dosDate, true); h.setUint32(14, crc, true);
      h.setUint32(18, data.length, true); h.setUint32(22, data.length, true); h.setUint16(26, name.length, true); h.setUint16(28, 0, true);
      parts.push(new Uint8Array(h.buffer), name, data);
      const c = new DataView(new ArrayBuffer(46));
      c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true); c.setUint16(10, 0, true);
      c.setUint16(12, dosTime, true); c.setUint16(14, dosDate, true); c.setUint32(16, crc, true);
      c.setUint32(20, data.length, true); c.setUint32(24, data.length, true); c.setUint16(28, name.length, true);
      c.setUint32(42, offset, true);
      central.push(new Uint8Array(c.buffer), name);
      offset += 30 + name.length + data.length;
    }
    const cdSize = central.reduce((s, p) => s + p.length, 0);
    const e = new DataView(new ArrayBuffer(22));
    e.setUint32(0, 0x06054b50, true); e.setUint16(8, files.length, true); e.setUint16(10, files.length, true);
    e.setUint32(12, cdSize, true); e.setUint32(16, offset, true);
    const all = [...parts, ...central, new Uint8Array(e.buffer)];
    const out = new Uint8Array(all.reduce((s, p) => s + p.length, 0)); let p = 0;
    for (const a of all) { out.set(a, p); p += a.length; }
    return out;
  }
  const xml = s => esc(s);
  function manifest(title) {
    return `<?xml version="1.0" encoding="UTF-8"?>
<manifest identifier="EscapeRoom_${hash(title)}" version="1.0"
  xmlns="http://www.imsproject.org/xsd/imscp_rootv1p1p2"
  xmlns:adlcp="http://www.adlnet.org/xsd/adlcp_rootv1p2"
  xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
  xsi:schemaLocation="http://www.imsproject.org/xsd/imscp_rootv1p1p2 imscp_rootv1p1p2.xsd http://www.imsglobal.org/xsd/imsmd_rootv1p2p1 imsmd_rootv1p2p1.xsd http://www.adlnet.org/xsd/adlcp_rootv1p2 adlcp_rootv1p2.xsd">
  <metadata><schema>ADL SCORM</schema><schemaversion>1.2</schemaversion></metadata>
  <organizations default="ORG1">
    <organization identifier="ORG1">
      <title>${xml(title)}</title>
      <item identifier="ITEM1" identifierref="RES1"><title>${xml(title)}</title></item>
    </organization>
  </organizations>
  <resources>
    <resource identifier="RES1" type="webcontent" adlcp:scormtype="sco" href="index.html"><file href="index.html"/></resource>
  </resources>
</manifest>
`;
  }
  const scorm = (gameHtml, title, date) => zip([{ name: "imsmanifest.xml", data: manifest(title) }, { name: "index.html", data: gameHtml }], date);
  const fileSlug = s => String(s || "escape-room").normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^A-Za-z0-9]+/g, "-").replace(/^-|-$/g, "") || "escape-room";

  return { esc, fmt, paras, norm, accepted, hash, scramble, matching, LOOKS, look, initials, answerKey, HINT_ROOMS, hintRules, hintWarnings, reviewItems, reviewStatus, validate,
    encodeConfig, decodeConfig, buildGame, configFromHtml, zip, crc32, manifest, scorm, fileSlug };
})();
if (typeof module !== "undefined") module.exports = ER;

</script>
<script>
/* ===================== SCORM 1.2 (optional — runs only inside an LMS) ===================== */
const SCORM = (() => {
  let api = null;
  function find(w){ let n=0; while(w && !w.API && w.parent && w.parent!==w && n<10){ w=w.parent; n++; } return w && w.API ? w.API : null; }
  try { api = find(window) || (window.opener ? find(window.opener) : null); } catch(e){ api = null; }
  const ok = !!api;
  if (ok) { try { api.LMSInitialize("");
    if (api.LMSGetValue("cmi.core.lesson_status") === "not attempted") api.LMSSetValue("cmi.core.lesson_status","incomplete");
    api.LMSCommit(""); } catch(e){} }
  return {
    ok,
    name(){ if(!ok) return ""; try{ const n=api.LMSGetValue("cmi.core.student_name")||""; const p=n.split(","); return p.length===2? (p[1].trim()+" "+p[0].trim()):n; }catch(e){return ""} },
    complete(score, seconds){
      if(!ok) return;
      try{
        api.LMSSetValue("cmi.core.score.min","0"); api.LMSSetValue("cmi.core.score.max","100");
        api.LMSSetValue("cmi.core.score.raw", String(score));
        const h=String(Math.floor(seconds/3600)).padStart(4,"0"), m=String(Math.floor(seconds%3600/60)).padStart(2,"0"), s=String(seconds%60).padStart(2,"0");
        api.LMSSetValue("cmi.core.session_time", `${h}:${m}:${s}`);
        api.LMSSetValue("cmi.core.lesson_status","completed");
        api.LMSCommit("");
      }catch(e){}
    },
    finish(){ if(ok){ try{ api.LMSFinish(""); }catch(e){} } }
  };
})();
window.addEventListener("beforeunload", () => SCORM.finish());

/* ===================== Content ===================== */
const CFG = ER.decodeConfig(document.getElementById("escape-config").textContent);
const ROOMS = CFG.rooms || [];
const { esc, fmt, paras } = ER;

/* ===================== State ===================== */
const S = { room:0, start:null, hints:0, wrong:0, hintsShown:{}, wrongIn:{}, reflection:null, showKey:false };
const PREVIEW = CFG.__preview === true;   // set only by the editor's preview, never in exported games
let tick = null;
const $ = s => document.querySelector(s);
const stage = $("#stage");
const say = t => { $("#live").textContent = t; };

/* ===================== Motion on/off ===================== */
/* Animation is decoration here: every state is also shown without it. It is off when the device asks for
   reduced motion or when the student switches it off with the header button. The choice is remembered
   where the browser allows it (storage is often blocked inside an LMS frame, so that is optional). */
const MOTION_KEY = "escape-room-motion";
const RM = window.matchMedia ? window.matchMedia("(prefers-reduced-motion: reduce)") : { matches: false };
let motionOff = false;
try { motionOff = localStorage.getItem(MOTION_KEY) === "off"; } catch(e){}
const calm = () => RM.matches || motionOff;
function renderMotion(){
  const b = $("#motion-toggle"), off = calm();
  document.documentElement.dataset.motion = off ? "off" : "on";
  b.textContent = off ? "Motion: off" : "Motion: on";
  b.disabled = RM.matches;
  b.title = RM.matches ? "Your device is set to reduce motion, so animations stay off." : "Turn animations on or off";
  if (off) document.getElementById("confetti")?.remove();
}
$("#motion-toggle").onclick = () => {
  motionOff = !motionOff;
  try { localStorage.setItem(MOTION_KEY, motionOff ? "off" : "on"); } catch(e){}
  renderMotion(); say(motionOff ? "Animations are off." : "Animations are on.");
};
if (RM.addEventListener) RM.addEventListener("change", renderMotion); else if (RM.addListener) RM.addListener(renderMotion);
renderMotion();

function fmtTime(sec){ return String(Math.floor(sec/60)).padStart(2,"0")+":"+String(sec%60).padStart(2,"0"); }
function elapsed(){ return S.start ? Math.floor((Date.now()-S.start)/1000) : 0; }
function startTimer(){ if(!S.start){ S.start=Date.now(); tick=setInterval(()=>$("#timer").textContent=fmtTime(elapsed()),1000);} }

function renderDoors(){
  $("#doors").innerHTML = ROOMS.map((_,i)=>{
    const r=i+1; const cls = S.room>r ? "door open" : (S.room===r ? "door current" : "door");
    return `<div class="${cls}" title="Room ${r}">${S.room>r?"🔓":r}</div>`;
  }).join("");
}

const roomHints = room => (room.hintsEnabled && ER.HINT_ROOMS.includes(room.type)) ? (room.hints||[]).slice(0,2).filter(h => String(h||"").trim()) : [];
function hintBlock(room){
  if (!roomHints(room).length) return "";
  return `<div class="row hint-btn-wrap"><button class="ghost" id="hint-btn">💡 Get a hint</button><span class="lockednote" id="hint-note"></span></div><div id="hints"></div>`;
}
/* Hints unlock only after wrong tries in this room (teacher sets how many), so a student can't
   open the room and read the hint straight away. */
function updateHints(){
  const r = ROOMS[S.room-1]; const btn = $("#hint-btn"); if (!r || !btn) return;
  const list = roomHints(r), rules = ER.hintRules(CFG);
  const shown = S.hintsShown[S.room] || 0, wrong = S.wrongIn[S.room] || 0;
  $("#hints").innerHTML = list.slice(0,shown).map((h,i)=>`<div class="hint"><strong>Hint ${i+1}:</strong> ${fmt(h)}</div>`).join("");
  const note = $("#hint-note");
  if (shown >= list.length) { btn.disabled = true; btn.textContent = "No more hints"; note.textContent = ""; return; }
  const need = shown === 0 ? rules.first : Math.max(rules.second, rules.first);
  const left = need - wrong;
  btn.disabled = left > 0;
  btn.textContent = `💡 Get hint ${shown+1}`;
  note.textContent = left > 0 ? `Unlocks after ${left} more wrong ${left===1?"try":"tries"}.` : "";
}
function wireHints(room){
  const btn = $("#hint-btn"); if (!btn) return;
  btn.onclick = () => { const n = S.hintsShown[S.room] || 0; if (n >= roomHints(room).length || btn.disabled) return; S.hintsShown[S.room] = n+1; S.hints++; $("#hintCount").textContent = S.hints; updateHints(); };
  updateHints();
}

/* Lock feedback. The text in #msg always carries the result; the padlock's movement is extra. */
const X = (...px) => px.map(v => ({ transform: `translateX(${v}px)` })), R = (...deg) => deg.map(v => ({ transform: `rotate(${v}deg)` }));
function lockMove(kind){
  const l = stage.querySelector(".lock"); if (!l) return null;
  l.classList.toggle("nope", kind === "nope");
  if (calm() || !l.animate) return l;
  const lock = l.querySelector(".padlock");
  if (kind === "nope") {            // a tugged padlock: the plate shifts a few pixels and the padlock swings on its shackle
    l.animate(X(0, -5, 5, -4, 3, -1, 0), { duration: 420, easing: "ease-out" });
    if (lock) lock.animate(R(0, -12, 11, -7, 5, -2, 0), { duration: 460, easing: "ease-out" });
  }
  if (kind === "nudge") l.animate(X(0, 3, 0), { duration: 180, easing: "ease-out" });
  return l;
}
function fail(text){
  S.wrong++; S.wrongIn[S.room] = (S.wrongIn[S.room]||0) + 1; updateHints(); const m=$("#msg"); m.className="msg bad"; m.textContent=text; say(text);
  lockMove("nope");      // only the lock rattles, never the whole board
}
// Incomplete answer: tell the student, but don't count a wrong try (no penalty, no hint unlock).
function notYet(text){ const m=$("#msg"); m.className="msg bad"; m.textContent=text; say(text); lockMove("nudge"); }
function pass(text){
  const m=$("#msg"); m.className="msg good"; m.textContent=text; say(text);
  stage.querySelectorAll(".lock button, #answer").forEach(el => el.disabled = true);
  const l = lockMove("");
  if (l) {
    l.classList.add("unlocked");
    try { l.scrollIntoView({ block: "nearest", behavior: calm() ? "auto" : "smooth" }); } catch(e){}
    sparks(l.querySelector(".padlock"));
  }
  // The next room appears about 1.3 s after the lock opens. The door transition needs a moment to start, so leave earlier for it.
  setTimeout(() => go(S.room+1), !calm() && document.startViewTransition ? 1150 : 1300);
}
/* A dozen sparks fly off the padlock as it opens, then remove themselves. */
function sparks(at){
  if (!at || calm() || !at.animate) return;
  const box = document.createElement("span"); box.className = "sparks"; box.setAttribute("aria-hidden", "true");
  const N = 12, done = () => box.remove();
  for (let i = 0; i < N; i++) {
    const s = document.createElement("i"), a = (i / N) * Math.PI * 2 + Math.random() * .5, d = 26 + Math.random() * 30;
    box.append(s);
    s.animate([{ opacity: 1, transform: "translate(0,0) scale(1) rotate(0deg)" },
               { opacity: 0, transform: `translate(${(Math.cos(a)*d).toFixed(1)}px,${(Math.sin(a)*d - 8).toFixed(1)}px) scale(.3) rotate(140deg)` }],
              { duration: 480 + Math.random() * 220, delay: 330, easing: "cubic-bezier(.1,.7,.3,1)" });
  }
  at.append(box); setTimeout(done, 1200);
}
/* Moving between screens. With motion on, the board swings away like a door (View Transitions API);
   browsers without that get a short fade; with motion off the next screen simply appears.
   Whichever path runs, show() does all the work, so focus, hints, SCORM and the preview behave the same. */
let shown = false;
function go(n){
  const show = () => {
    S.room=n; renderDoors(); (n===0 ? intro : n>ROOMS.length ? finish : () => room(n))();
    if (PREVIEW) { teacherKey(); parent.postMessage({ er: "room", room: n }, "*"); }
    stage.focus(); window.scrollTo(0,0);
  };
  const first = !shown; shown = true;
  if (first || calm()) return show();
  if (document.startViewTransition) {
    window.scrollTo(0,0);          // look up at the door first, so the old board swings from where the new one will stand
    // The browser calls once() when it has photographed the old board. On a slow or busy machine that can
    // take a while, so the next screen is shown after 150 ms regardless; the game never waits on an animation.
    let did = false; const once = () => { if (!did) { did = true; show(); } };
    setTimeout(once, 150);
    try { const t = document.startViewTransition(once); if (t && t.ready) t.ready.catch(() => {}); return; } catch(e){}
    return once();
  }
  show();
  if (stage.animate) stage.animate([{ opacity: 0, transform: "translateY(8px)" }, { opacity: 1, transform: "none" }], { duration: 280, easing: "ease-out" });
}

/* Headings are written on in chalk when motion is on (--n = number of characters sets the pace). */
const titleHtml = t => `<span class="ttl write" style="--n:${Math.max(6, Math.min(30, Array.from(String(t||"")).length))}">${esc(t||"")}</span>`;
function roomHead(r, n){
  return `<h2><span class="rn">Room ${n}</span><span class="sep"> · </span>${titleHtml(r.title)}</h2>${paras(r.story,"story")}${r.reference?`<p class="ref">📖 ${fmt(r.reference)}</p>`:""}`;
}
/* The brass padlock is decoration only: CSS opens it when the lock row gets the class "unlocked". */
const PADLOCK = '<span class="padlock" aria-hidden="true"><svg viewBox="0 0 40 46" focusable="false">'
  + '<g class="shackle"><path d="M11 30V14a9 9 0 0 1 18 0v16" fill="none" stroke="#7d5912" stroke-width="5.4" stroke-linecap="round"/>'
  + '<path d="M11 30V14a9 9 0 0 1 18 0v16" fill="none" stroke="#f3d587" stroke-width="2.2" stroke-linecap="round"/></g>'
  + '<rect class="body" x="4.5" y="21.5" width="31" height="23" rx="4.5"/>'
  + '<path d="M9 22.5h22a3.5 3.5 0 0 1 3.5 3.5v2h-29v-2A3.5 3.5 0 0 1 9 22.5z" fill="#fff" opacity=".3"/>'
  + '<path d="M5.5 37h29v3a3.5 3.5 0 0 1-3.5 3.5H9A3.5 3.5 0 0 1 5.5 40z" fill="#3f2714" opacity=".22"/>'
  + '<g class="keyhole"><circle cx="20" cy="31" r="3.1"/><path d="M18.5 32h3l1 6h-5z"/></g></svg></span>';
/* The padlock is drawn for every lock, so a padlock emoji at the start of the teacher's label would show two. */
const lockText = s => fmt(String(s ?? "").replace(/^\s*(?:\u{1F512}|\u{1F513}|\u{1F510}|\u{1F50F})\uFE0F?\s*/u, ""));
const lockRow = (label, inner) => `<div class="lock">${PADLOCK}${lockText(label)?`<span><strong>${lockText(label)}</strong></span>`:""}${inner}<span class="msg" id="msg" role="status"></span></div>`;

/* ===================== Screens ===================== */
function intro(){
  const n = ROOMS.length;
  stage.innerHTML = `
  <h2>${titleHtml(CFG.intro?.heading || CFG.meta?.title || "")}</h2>
  ${paras(CFG.intro?.story, "story")}
  <div class="card">
    <strong>How to play</strong>
    <ul>
      <li>Solve the puzzle in each room to open its lock. There ${n===1?"is 1 room":`are ${n} rooms`}.</li>
      <li>Wrong answers ${CFG.scoring?.mode==="deductions" && CFG.scoring.wrongPenalty ? `cost ${CFG.scoring.wrongPenalty} points each, so think before you try` : "cost nothing, so keep trying"}.</li>
      ${ROOMS.some(r => roomHints(r).length) ? `<li>Stuck? Some rooms have hints that unlock after a wrong try. ${CFG.scoring?.mode==="deductions" && CFG.scoring.hintPenalty ? `Each hint costs ${CFG.scoring.hintPenalty} points.` : "They're counted, but they don't affect your grade."}</li>` : ""}
      <li>At the end you'll get a <strong>certificate</strong>${CFG.finish?.exitPassword ? " with the exit password" : ""}.</li>
    </ul>
    ${CFG.meta?.learningOutcome ? `<p class="small">Learning Outcome: <em>${fmt(CFG.meta.learningOutcome)}</em></p>` : ""}
  </div>
  <div class="row"><label for="pname"><strong>Your name:</strong></label>
    <input id="pname" name="name" type="text" class="free" style="width:16rem" value="${esc(SCORM.name())}" autocomplete="name">
    <button id="begin">Enter →</button></div>`;
  $("#begin").onclick = () => { S.player = ($("#pname").value||"").trim() || "Student"; startTimer(); go(1); };
}

function room(n){
  const r = ROOMS[n-1];
  ({ matching, quiz, ordering, sorting, reflection }[r.type] || unknown)(r, n);
  wireHints(r);
}
function unknown(r, n){ stage.innerHTML = roomHead(r,n) + `<p>This room type isn't supported.</p><button onclick="go(${n+1})">Skip</button>`; }

/* ---- Matching: cards with codes, numbered clues, enter the code ----
   room.look chooses how the cards are drawn: "cards" (default), "books" or "portraits". It changes the
   picture only. The term and its code are real text in every look, so screen readers get "Code L: Essentialism". */
const plain = s => String(s ?? "").replace(/\*+/g, "").trim();
const BOOK_COLORS = ["#5b3a7a", "#2f5d8a", "#8a4a26", "#2f6b3f", "#7a2a3f", "#6b5a1e"];
/* Size one spine from its title: short titles get one line, longer ones wrap to two or three (the book
   gets wider) and the text shrinks a little. Height also varies a bit per title so the row isn't uniform. */
function bookStyle(c, i, n, code){
  const t = plain(c.term), len = Array.from(t).length, longest = Math.max(0, ...t.split(/\s+/).map(w => Array.from(w).length));
  const MAX = 15.75, FIXED = 5.9, EM = .65;       // rem: tallest book, space used by the letter and bands, average letter width
  let fit = null;
  for (const [lines, fs] of [[1,1],[1,.9],[2,1],[2,.9],[3,.9],[3,.8]]) {
    const per = lines === 1 ? len : Math.max(Math.ceil(len/lines) + 3, Math.min(longest, 16));
    fit = { lines, fs, need: FIXED + per*EM*fs + (c.icon ? 1.6 : 0) };
    if (fit.need <= MAX) break;
  }
  const h = Math.min(MAX, Math.max(12 + (ER.hash(t) % 6) * .55, fit.need));
  const w = Math.max(3.75, fit.lines*fit.fs*1.32 + (c.detail ? 1.05 : 0) + 1.05);
  const cl = Array.from(code).length;
  let css = `--c:${BOOK_COLORS[i % BOOK_COLORS.length]};--h:${h.toFixed(2)}rem;--w:${w.toFixed(2)}rem;--fs:${fit.fs}rem;${cl > 1 ? `--ls:${cl === 2 ? 1.25 : .95}rem;` : ""}`;
  // the books at each end lean on their neighbours
  if (n > 1 && i === 0) css += "--tilt:2.5deg;--pivot:100% 100%;margin-right:.6rem;";
  else if (n > 2 && n <= 7 && i === n-1) css += "--tilt:-4deg;--pivot:0 100%;margin-left:1rem;";
  return css;
}
const LOOK = {
  cards: (m) => `<div class="grid">${m.display.map(c=>`<div class="card mcard"><div class="badge">${esc(m.code[c.k])}</div>
      ${c.icon?`<span class="icon" aria-hidden="true">${esc(c.icon)}</span>`:""}<div><strong>${fmt(c.term)}</strong>${c.detail?`<div class="small">${fmt(c.detail)}</div>`:""}</div></div>`).join("")}</div>`,
  books: (m) => `<ul class="shelf" role="list">${m.display.map((c,i)=>`<li style="--i:${i}"><div class="vol" style="${bookStyle(c, i, m.display.length, m.code[c.k])}">
      <span class="band" aria-hidden="true"></span>
      <span class="letter"><span class="sr">Code </span><b>${esc(m.code[c.k])}</b><span class="sr">: </span></span>
      <span class="title">${fmt(c.term)}${c.detail?` <small>${fmt(c.detail)}</small>`:""}</span>
      ${c.icon?`<span class="icon" aria-hidden="true">${esc(c.icon)}</span>`:""}<span class="band" aria-hidden="true"></span></div></li>`).join("")}</ul>`,
  portraits: (m) => `<ul class="gallery" role="list">${m.display.map((c,i)=>`<li class="portrait" style="--i:${i}">
      <div class="gilt" aria-hidden="true"><div class="sitter${c.icon?" pic":""}">${esc(c.icon || ER.initials(c.term))}</div></div>
      <strong>${fmt(c.term)}</strong>${c.detail?`<span class="yrs">${fmt(c.detail)}</span>`:""}
      <span class="plate"><span class="sr">Code </span>${m.numbers?`<small aria-hidden="true">No.</small>`:""}<b>${esc(m.code[c.k])}</b></span></li>`).join("")}</ul>`
};
function matching(r, n){
  const m = ER.matching(r), look = ER.look(r);
  const clueStyle = m.numbers ? "A" : "1";
  const clueName = i => m.numbers ? String.fromCharCode(65 + i) : String(i + 1);
  stage.innerHTML = roomHead(r,n) + LOOK[look](m) + `
    <h3>${esc(r.cluesHeading || "Clues")}</h3>
    ${look === "cards"
      ? `<ol class="clues" type="${clueStyle}">${m.answerCards.map(c=>`<li>${fmt(c.clue)}</li>`).join("")}</ol>`
      : `<ol class="clues catalog" role="list">${m.answerCards.map((c,i)=>`<li class="icard" style="--i:${i}"><span class="no">Clue ${clueName(i)}</span><p>${fmt(c.clue)}</p></li>`).join("")}</ol>`}
    ${lockRow("", `<label for="answer">${lockText(r.lockLabel) || "Lock"}:</label>
      <input id="answer" type="text" maxlength="${m.answer.length}" ${m.numbers?'inputmode="numeric"':""} autocomplete="off" autocapitalize="characters" spellcheck="false">
      <button id="try">Try it</button>`)}
    ${hintBlock(r)}`;
  const check = () => {
    const typed = $("#answer").value.replace(/\s+/g,"").toUpperCase();
    if (!typed) return notYet("Type the code first.");
    if (typed === m.answer) pass(r.successMessage || "🔓 The lock opens!");
    else fail(r.failMessage || "The lock won't budge. Check each clue again.");
  };
  $("#try").onclick = check; $("#answer").onkeydown = e => { if (e.key==="Enter") check(); };
}

/* ---- Quiz: short-answer and multiple-choice questions; all must be right ---- */
function quiz(r, n){
  const qs = r.questions || [];
  stage.innerHTML = roomHead(r,n) + `<form id="qf" novalidate>${qs.map((q,i)=>`
    <fieldset><legend>${i+1}. ${fmt(q.prompt)}</legend>${
      q.kind==="choice"
        ? (q.choices||[]).map((c,j)=>String(c).trim()?`<label><input type="radio" name="q${i}" value="${j}"> ${fmt(c)}</label>`:"").join("")
        : `<input type="text" class="free" name="q${i}" aria-label="Answer to question ${i+1}" autocomplete="off" spellcheck="false">`
    }</fieldset>`).join("")}
    ${lockRow(r.lockLabel || "🔒 Question lock", `<button id="try" type="submit">Check answers</button>`)}</form>
    ${hintBlock(r)}`;
  $("#qf").onsubmit = e => {
    e.preventDefault();
    const blank = qs.some((q,i) => q.kind==="choice" ? !document.querySelector(`input[name=q${i}]:checked`) : !ER.norm(document.querySelector(`input[name=q${i}]`).value));
    if (blank) return notYet("Answer every question first.");
    let right = 0;
    qs.forEach((q,i) => {
      if (q.kind==="choice") { const v = document.querySelector(`input[name=q${i}]:checked`); if (v && +v.value === q.correct) right++; }
      else { const v = ER.norm(document.querySelector(`input[name=q${i}]`).value); if (v && ER.accepted(q.answers).includes(v)) right++; }
    });
    if (right === qs.length) pass(r.successMessage || "🔓 Every answer is right. The lock opens!");
    else fail(`${right} of ${qs.length} answers are correct.`);
  };
}

/* ---- Ordering: put items in the right order ---- */
function ordering(r, n){
  const items = r.items || [];
  let order = ER.scramble(items.length, (r.title||"") + items.map(i=>i.text).join("|"));
  const draw = () => {
    $("#order").innerHTML = order.map((idx,i)=>`<li><span class="pos">${i+1}.</span><span>${fmt(items[idx].text)}</span>
      <button class="mv ghost" aria-label="Move up" ${i===0?"disabled":""} data-i="${i}" data-d="-1">▲</button>
      <button class="mv ghost" aria-label="Move down" ${i===order.length-1?"disabled":""} data-i="${i}" data-d="1">▼</button></li>`).join("");
  };
  stage.innerHTML = roomHead(r,n) + `<ul class="list" id="order"></ul>
    ${lockRow(r.lockLabel || "🔒 Order lock", `<button id="try">Check order</button>`)}${hintBlock(r)}`;
  $("#order").onclick = e => {
    const b = e.target.closest("button[data-i]"); if (!b) return;
    const i = +b.dataset.i, d = +b.dataset.d, j = i + d;
    [order[i], order[j]] = [order[j], order[i]]; draw();
    const nb = $("#order").children[j].querySelectorAll("button")[d<0?0:1]; if (nb && !nb.disabled) nb.focus();
  };
  draw();
  $("#try").onclick = () => {
    const right = order.filter((v,i)=>v===i).length;
    if (right === order.length) {
      $("#order").innerHTML = order.map((idx,i)=>`<li><span class="pos">${i+1}.</span><span>${fmt(items[idx].text)}${items[idx].label?` <strong style="color:var(--gold)">(${fmt(items[idx].label)})</strong>`:""}</span></li>`).join("");
      pass(r.successMessage || "🔓 Everything is in order. The lock opens!");
    } else fail(`${right} of ${order.length} are in the correct position.`);
  };
}

/* ---- Sorting: put each item in a category ---- */
function sorting(r, n){
  const items = r.items || [], cats = r.categories || [];
  const pick = new Array(items.length).fill(null);
  stage.innerHTML = roomHead(r,n) + `<ul class="list scene">${items.map((it,i)=>`<li><span style="flex:1;min-width:220px">${fmt(it.text)}</span>
     <span class="seg" role="group" aria-label="Item ${i+1}">${cats.map((c,j)=>`<button data-i="${i}" data-v="${j}" aria-pressed="false">${esc(c)}</button>`).join("")}</span></li>`).join("")}</ul>
    ${lockRow(r.lockLabel || "📋 Sorting lock", `<button id="try">Submit</button>`)}${hintBlock(r)}`;
  stage.querySelectorAll(".seg button").forEach(b => b.onclick = () => {
    const i=+b.dataset.i; pick[i]=+b.dataset.v;
    b.parentElement.querySelectorAll("button").forEach(x=>{ const on=+x.dataset.v===pick[i]; x.classList.toggle("on",on); x.setAttribute("aria-pressed",on); });
  });
  $("#try").onclick = () => {
    if (pick.includes(null)) return notYet("Choose a category for every item first.");
    const right = pick.filter((p,i)=>p===items[i].category).length;
    if (right===items.length) pass(r.successMessage || "🔓 All sorted. The lock opens!");
    else fail(`${right} of ${items.length} are in the correct category.`);
  };
}

/* ---- Reflection: no wrong answers; result profile shown on the certificate ---- */
function reflection(r, n){
  const qs = r.questions || [];
  stage.innerHTML = roomHead(r,n) + `<form id="mf">${qs.map((q,qi)=>`<fieldset><legend>${qi+1}. ${fmt(q.prompt)}</legend>${(q.options||[]).map(o=>
     `<label><input type="radio" name="q${qi}" value="${esc(o.profile)}" required> ${fmt(o.text)}</label>`).join("")}</fieldset>`).join("")}
    ${lockRow("🪞", `<button id="try" type="submit">${esc(r.buttonLabel || "Continue")}</button>`)}</form>${hintBlock(r)}`;
  $("#mf").onsubmit = e => {
    e.preventDefault();
    const tally = {}; qs.forEach((q,qi)=>{ const v=document.querySelector(`input[name=q${qi}]:checked`); if (v) tally[v.value]=(tally[v.value]||0)+1; });
    const ranked = Object.entries(tally).sort((a,b)=>b[1]-a[1]);
    const prof = k => (r.profiles||[]).find(p=>p.key===k);
    S.reflection = { room:r, first: ranked[0] && prof(ranked[0][0]), second: ranked[1] && prof(ranked[1][0]) };
    pass(r.successMessage || "✨ Done!");
  };
}

/* ---- Finish ---- */
function score(){
  const sc = CFG.scoring || {};
  if (sc.mode !== "deductions") return 100;
  return Math.max(+sc.minScore||0, Math.min(100, 100 - S.hints*(+sc.hintPenalty||0) - S.wrong*(+sc.wrongPenalty||0)));
}
function finish(){
  clearInterval(tick);
  const secs = elapsed(), pts = score();
  const prefix = String(CFG.meta?.codePrefix || "ESC").replace(/[^A-Za-z0-9]/g,"").toUpperCase() || "ESC";
  const code = `${prefix}-${S.hints}${Math.min(S.wrong,9)}-${((secs*7919)+S.hints*31+S.wrong*17)%9000+1000}`;
  SCORM.complete(pts, secs);
  const f = CFG.finish || {}, R = S.reflection;
  stage.innerHTML = `
  <h2>${titleHtml("🎉 You Escaped!")}</h2>
  <div class="cert">
    <div class="small kicker">THIS CERTIFIES THAT</div>
    <div class="name">${esc(S.player)}</div>
    <div class="small">${fmt(f.certificateLine || "escaped the room")}</div>
    <p>Time: <strong>${fmtTime(secs)}</strong> · Hints used: <strong>${S.hints}</strong>${CFG.scoring?.mode==="deductions"?` · Score: <strong>${pts}%</strong>`:""} · ${new Date().toLocaleDateString()}</p>
    ${f.exitPassword ? `<div class="small">Exit password (enter this in your course quiz)</div><div class="code pass" id="exit-password" translate="no">${esc(f.exitPassword)}</div>` : ""}
    <div class="small gap">Personal completion code</div><div class="code" translate="no">${code}</div>
    <div class="seal" aria-hidden="true"><span>${prefix.length > 8 ? "★" : prefix.replace(/^([A-Z]+)(\d+)$/, "$1<br>$2")}</span></div>
  </div>
  ${R && R.first ? `<div class="result">
    <h3>🪞 ${esc(R.room.resultHeading || "Your result")}: ${esc(R.first.name)}</h3>
    ${paras(R.first.desc)}
    ${R.first.who ? `<p><strong>Thinkers to explore:</strong> ${fmt(R.first.who)}</p>` : ""}
    ${R.second && R.second !== R.first ? `<p><strong>Your second-strongest lean:</strong> ${esc(R.second.name)}${R.second.who?` (${fmt(R.second.who)})`:""}</p>` : ""}
    ${R.first.next ? `<p><strong>Next step:</strong> ${fmt(R.first.next)}</p>` : ""}
    ${R.room.resultNote ? `<p class="small" style="color:#24402f">${fmt(R.room.resultNote)}</p>` : ""}
  </div>` : ""}
  <div class="row"><button onclick="window.print()">🖨️ Print / save as PDF</button>
    <button class="ghost" onclick="location.reload()">Play again</button></div>
  ${f.instructions ? `<p class="small">${fmt(f.instructions)}</p>` : ""}`;
  celebrate();
}
/* One short burst of paper confetti as the seal lands. Drawn on a canvas that removes itself. */
let party = 0;
function celebrate(){
  clearTimeout(party);
  if (calm()) return;
  party = setTimeout(() => {
    const seal = stage.querySelector(".seal"); if (!seal || calm()) return;
    const r = seal.getBoundingClientRect();
    confetti(r.left + r.width/2, Math.max(60, Math.min(r.top + r.height/2, window.innerHeight * .8)));
  }, 730);
}
function confetti(x, y){
  document.getElementById("confetti")?.remove();
  const c = document.createElement("canvas"); c.id = "confetti"; c.setAttribute("aria-hidden", "true");
  const g = c.getContext && c.getContext("2d"); if (!g) return;
  const W = window.innerWidth, H = window.innerHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
  c.width = Math.round(W*dpr); c.height = Math.round(H*dpr); g.scale(dpr, dpr);
  document.body.append(c);
  const COLORS = ["#f7efda", "#e6b64c", "#f6d98a", "#c9483b", "#98dea5", "#fbf6e8"], LIFE = 1500;
  const bits = Array.from({ length: 60 }, (_, i) => {
    const a = -Math.PI/2 + (Math.random() - .5) * 2.4, v = 320 + Math.random() * 620;
    return { x, y, vx: Math.cos(a)*v, vy: Math.sin(a)*v, r: Math.random()*6.3, vr: (Math.random() - .5)*16, w: 6 + Math.random()*6, h: 4 + Math.random()*4, f: Math.random()*6.3, c: COLORS[i % COLORS.length] };
  });
  let raf = 0, last = performance.now(); const t0 = last;
  const done = () => { cancelAnimationFrame(raf); clearTimeout(kill); c.remove(); };
  const kill = setTimeout(done, LIFE + 1000);                 // in case frames are throttled (hidden tab or LMS frame)
  const frame = now => {
    const dt = Math.min(.034, (now - last)/1000), age = now - t0; last = now;
    if (age >= LIFE || calm()) return done();
    g.clearRect(0, 0, W, H); g.globalAlpha = Math.min(1, (LIFE - age)/350);
    for (const b of bits) {
      b.vy += 1500*dt; b.vx *= 1 - 1.8*dt; b.vy *= 1 - .8*dt; b.x += b.vx*dt; b.y += b.vy*dt; b.r += b.vr*dt; b.f += 9*dt;
      g.save(); g.translate(b.x, b.y); g.rotate(b.r); g.scale(1, Math.cos(b.f)); g.fillStyle = b.c; g.fillRect(-b.w/2, -b.h/2, b.w, b.h); g.restore();
    }
    raf = requestAnimationFrame(frame);
  };
  raf = requestAnimationFrame(frame);
}

/* ===================== Teacher preview (editor only) ===================== */
function teacherKey(){
  document.getElementById("teacher-key")?.remove();
  const r = ROOMS[S.room-1];
  if (!PREVIEW || !S.showKey || !r) return;
  const hints = roomHints(r);
  const box = document.createElement("div"); box.id = "teacher-key"; box.className = "teacher-key";
  box.innerHTML = `<h3>👩‍🏫 Answer (only you can see this in preview)</h3><ul>${ER.answerKey(r).map(l=>`<li>${fmt(l)}</li>`).join("")}</ul>`
    + (hints.length ? `<p class="small" style="margin:.5rem 0 .2rem">Hints (students unlock them after wrong tries):</p><ol>${hints.map(h=>`<li>${fmt(h)}</li>`).join("")}</ol>` : "");
  stage.append(box);
}
// Esc inside the preview frame should still close the editor's preview.
if (PREVIEW) document.addEventListener("keydown", e => { if (e.key === "Escape") parent.postMessage({ er: "escape" }, "*"); });
if (PREVIEW) window.addEventListener("message", e => {
  const d = e.data || {};
  if (d.er === "goto") { if (!S.player) S.player = "Preview Student"; startTimer(); go(Math.max(0, Math.min(ROOMS.length+1, d.room|0))); }
  if (d.er === "key") { S.showKey = !!d.on; teacherKey(); }
});

/* ===================== Start ===================== */
document.title = CFG.meta?.title || document.title;
$("#game-title").textContent = "🏫 " + (CFG.meta?.title || "Escape Room");
const review = ER.reviewStatus(CFG);
if (review.unverified) {
  const d = $("#draft"); d.hidden = false;
  d.textContent = `⚠️ Draft: ${review.unverified} of ${review.total} items haven't been checked by the instructor yet. Answers may contain errors.`;
}
renderDoors(); go(0);
