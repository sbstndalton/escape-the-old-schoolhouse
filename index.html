<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escape the Old Schoolhouse – EDU 216</title>
<style>
  :root{
    --board:#24402f; --board2:#1b3124; --chalk:#f4f1e6; --muted:#c9d3c4;
    --wood:#8a5a32; --wood2:#6b4425; --gold:#e8b84a; --red:#e06a5a; --ok:#7ccf8a;
    --card:#2d4d39;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:Georgia,"Times New Roman",serif;color:var(--chalk);
    background:radial-gradient(circle at 30% 20%,#2c4a37,#16281d 70%);min-height:100vh;line-height:1.5}
  header{background:linear-gradient(var(--wood),var(--wood2));padding:.6rem 1rem;display:flex;
    flex-wrap:wrap;gap:.75rem;align-items:center;justify-content:space-between;border-bottom:4px solid #4a2f19}
  header h1{font-size:1.15rem;margin:0;letter-spacing:.03em}
  .doors{display:flex;gap:.35rem}
  .door{width:2.1rem;height:2.1rem;border-radius:.3rem;display:grid;place-items:center;font-size:.85rem;
    background:#3d2716;border:2px solid #2a1a0e;color:#b99d82}
  .door.open{background:var(--gold);color:#3d2716;border-color:#a37a1f;font-weight:bold}
  .door.current{outline:2px solid var(--chalk)}
  .stats{font-family:ui-monospace,Menlo,monospace;font-size:.9rem;display:flex;gap:1rem}
  main{max-width:860px;margin:1.5rem auto;padding:0 1rem}
  .panel{background:var(--board);border:10px solid var(--wood);border-radius:.6rem;padding:1.5rem 1.6rem;
    box-shadow:0 10px 30px rgba(0,0,0,.45),inset 0 0 60px rgba(0,0,0,.35)}
  h2{margin-top:0;font-size:1.6rem;border-bottom:1px dashed rgba(244,241,230,.35);padding-bottom:.4rem}
  .story{font-style:italic;color:var(--muted)}
  .grid{display:grid;gap:.75rem}
  .g2{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
  .g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
  .card{background:var(--card);border:1px solid rgba(255,255,255,.12);border-radius:.45rem;padding:.75rem .9rem}
  .book{display:flex;gap:.7rem;align-items:center}
  .spine{min-width:2.4rem;height:3.4rem;border-radius:.2rem;display:grid;place-items:center;font-weight:bold;
    font-size:1.4rem;color:#fff;box-shadow:inset -4px 0 0 rgba(0,0,0,.25)}
  .portrait{text-align:center}
  .frame{width:4.2rem;height:4.2rem;margin:0 auto .35rem;border:5px solid var(--gold);border-radius:50%;
    display:grid;place-items:center;font-size:1.6rem;background:#1b3124}
  .plate{display:inline-block;background:var(--gold);color:#3d2716;font-weight:bold;border-radius:.2rem;
    padding:0 .45rem;font-family:ui-monospace,monospace}
  ol.clues li{margin:.4rem 0}
  .lock{margin-top:1.2rem;padding:1rem;background:#15261b;border-radius:.45rem;border:2px solid #0f1c13;
    display:flex;flex-wrap:wrap;gap:.6rem;align-items:center}
  .lock label{font-weight:bold}
  input[type=text]{font-family:ui-monospace,Menlo,monospace;font-size:1.3rem;letter-spacing:.35em;width:11rem;
    padding:.35rem .5rem;border-radius:.3rem;border:2px solid var(--gold);background:#0c160f;color:var(--chalk);
    text-transform:uppercase}
  button{font-family:inherit;font-size:1rem;cursor:pointer;border-radius:.35rem;border:0;padding:.5rem 1rem;
    background:var(--gold);color:#3d2716;font-weight:bold}
  button.ghost{background:transparent;color:var(--chalk);border:1px solid rgba(244,241,230,.5);font-weight:normal}
  button:disabled{opacity:.45;cursor:not-allowed}
  button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #fff;outline-offset:2px}
  .msg{min-height:1.5rem;font-weight:bold}
  .msg.bad{color:var(--red)} .msg.good{color:var(--ok)}
  .hint{margin-top:.8rem;padding:.6rem .8rem;border-left:4px solid var(--gold);background:rgba(232,184,74,.1)}
  .timeline{list-style:none;padding:0;margin:0}
  .timeline li{display:flex;align-items:center;gap:.5rem;margin:.4rem 0;background:var(--card);
    border:1px solid rgba(255,255,255,.12);border-radius:.4rem;padding:.45rem .6rem}
  .timeline li span{flex:1}
  .timeline .pos{font-family:ui-monospace,monospace;color:var(--gold);flex:0 0 1.6rem}
  .mv{padding:.2rem .55rem;font-size:.9rem}
  .scene li{margin:.5rem 0;display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;justify-content:space-between;
    background:var(--card);border-radius:.4rem;padding:.5rem .7rem;border:1px solid rgba(255,255,255,.12)}
  .scene ul{list-style:none;padding:0}
  .seg button{padding:.3rem .65rem;font-size:.85rem;background:#1b3124;color:var(--chalk);border:1px solid rgba(255,255,255,.3);font-weight:normal}
  .seg button.on{background:var(--gold);color:#3d2716;font-weight:bold}
  fieldset{border:1px solid rgba(255,255,255,.2);border-radius:.45rem;margin:0 0 .8rem;padding:.6rem .9rem}
  legend{font-weight:bold;padding:0 .3rem}
  fieldset label{display:block;margin:.25rem 0;cursor:pointer}
  .result{background:#f4f1e6;color:#24402f;border-radius:.45rem;padding:1rem 1.2rem}
  .result h3{margin-top:0}
  .cert{border:6px double var(--gold);border-radius:.5rem;padding:1.4rem;text-align:center;background:#1b3124}
  .code{font-family:ui-monospace,monospace;font-size:1.5rem;color:var(--gold);letter-spacing:.1em}
  .small{font-size:.88rem;color:var(--muted)}
  .row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;margin-top:1rem}
  .sr{position:absolute;left:-9999px}
  .shake{animation:shake .4s}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
  @media print{header,.row button{display:none}body{background:#fff;color:#000}.cert{background:#fff;color:#000}}
</style>
</head>
<body>
<header>
  <h1>🏫 Escape the Old Schoolhouse</h1>
  <div class="doors" id="doors" aria-label="Progress"></div>
  <div class="stats"><span>⏱ <span id="timer">00:00</span></span><span>💡 <span id="hintCount">0</span></span></div>
</header>
<main><div class="panel" id="stage" tabindex="-1"></div></main>
<div class="sr" aria-live="polite" id="live"></div>

<script>
/* ===================== SCORM 1.2 (optional — runs only inside an LMS) ===================== */
const SCORM = (() => {
  let api = null;
  function find(w){ let n=0; while(w && !w.API && w.parent && w.parent!==w && n<10){ w=w.parent; n++; } return w && w.API ? w.API : null; }
  try { api = find(window) || (window.opener ? find(window.opener) : null); } catch(e){ api = null; }
  const ok = !!api;
  if (ok) { try { api.LMSInitialize(""); 
    if (api.LMSGetValue("cmi.core.lesson_status") === "not attempted") api.LMSSetValue("cmi.core.lesson_status","incomplete");
    api.LMSCommit(""); } catch(e){} }
  return {
    ok,
    name(){ if(!ok) return ""; try{ const n=api.LMSGetValue("cmi.core.student_name")||""; const p=n.split(","); return p.length===2? (p[1].trim()+" "+p[0].trim()):n; }catch(e){return ""} },
    complete(score, seconds){
      if(!ok) return;
      try{
        api.LMSSetValue("cmi.core.score.min","0"); api.LMSSetValue("cmi.core.score.max","100");
        api.LMSSetValue("cmi.core.score.raw", String(score));
        const h=String(Math.floor(seconds/3600)).padStart(4,"0"), m=String(Math.floor(seconds%3600/60)).padStart(2,"0"), s=String(seconds%60).padStart(2,"0");
        api.LMSSetValue("cmi.core.session_time", `${h}:${m}:${s}`);
        api.LMSSetValue("cmi.core.lesson_status","completed");
        api.LMSCommit("");
      }catch(e){}
    },
    finish(){ if(ok){ try{ api.LMSFinish(""); }catch(e){} } }
  };
})();
window.addEventListener("beforeunload", () => SCORM.finish());

/* ===================== State ===================== */
const S = { room:0, start:null, hints:0, wrong:0, hintsShown:{}, philosophy:null };
let tick = null;
const $ = s => document.querySelector(s);
const stage = $("#stage");
const say = t => { $("#live").textContent = t; };
const enc = s => btoa(s.trim().toUpperCase());   // light obfuscation of answers

function fmt(sec){ return String(Math.floor(sec/60)).padStart(2,"0")+":"+String(sec%60).padStart(2,"0"); }
function elapsed(){ return S.start ? Math.floor((Date.now()-S.start)/1000) : 0; }
function startTimer(){ if(!S.start){ S.start=Date.now(); tick=setInterval(()=>$("#timer").textContent=fmt(elapsed()),1000);} }

function renderDoors(){
  const labels=["1","2","3","4","5"];
  $("#doors").innerHTML = labels.map((l,i)=>{
    const r=i+1; const cls = S.room>r ? "door open" : (S.room===r ? "door current" : "door");
    return `<div class="${cls}" title="Room ${r}">${S.room>r?"🔓":l}</div>`;
  }).join("");
}

function hintBlock(id, hints){
  return `<div class="row"><button class="ghost" onclick="showHint('${id}')" id="hb-${id}">💡 Get a hint</button></div>
          <div id="h-${id}"></div>`;
}
const HINTS = {};
function showHint(id){
  const list = HINTS[id]; const n = S.hintsShown[id] || 0;
  if (n >= list.length) return;
  S.hintsShown[id] = n+1; S.hints++; $("#hintCount").textContent = S.hints;
  $("#h-"+id).innerHTML = list.slice(0,n+1).map((h,i)=>`<div class="hint"><strong>Hint ${i+1}:</strong> ${h}</div>`).join("");
  if (n+1 >= list.length) { const b=$("#hb-"+id); b.disabled=true; b.textContent="No more hints"; }
}

function fail(msgEl, text){
  S.wrong++; msgEl.className="msg bad"; msgEl.textContent=text; say(text);
  stage.classList.remove("shake"); void stage.offsetWidth; stage.classList.add("shake");
}
function pass(msgEl, text, next){
  msgEl.className="msg good"; msgEl.textContent=text; say(text);
  setTimeout(next, 1300);
}
function go(n){ S.room=n; renderDoors(); ROOMS[n](); stage.focus(); window.scrollTo(0,0); }

/* ===================== Rooms ===================== */
const ROOMS = [];

/* ---- Intro ---- */
ROOMS[0] = () => {
  stage.innerHTML = `
  <h2>The Door Clicks Shut Behind You…</h2>
  <p class="story">You came to the old county schoolhouse, now a museum of education history, to research your Philosophy assignment.
  You lost track of time in the archives. When you look up, the lights are dim, the caretaker has gone home, and every door is locked.</p>
  <p class="story">A note is pinned to the chalkboard: <em>"Only someone who understands where our ideas about school came from may leave.
  Five rooms. Five locks. Good luck, future educator."</em></p>
  <div class="card">
    <strong>How to play</strong>
    <ul>
      <li>Solve the puzzle in each room to open its lock. There are 5 rooms.</li>
      <li>Wrong answers cost nothing, so keep trying.</li>
      <li>Stuck? Each room has hints. They're counted, but they don't affect your grade.</li>
      <li>At the end you'll get a <strong>completion code</strong> and a profile of your own educational philosophy.</li>
    </ul>
    <p class="small">Learning Outcome: <em>Explore your own personal philosophy of education based on the historical and philosophical foundations of education.</em></p>
  </div>
  <div class="row"><label for="pname"><strong>Your name:</strong></label>
    <input id="pname" type="text" style="letter-spacing:normal;text-transform:none;width:16rem;font-size:1rem" value="${SCORM.name()}" autocomplete="name">
    <button id="begin">Enter the schoolhouse →</button></div>`;
  $("#begin").onclick = () => { S.player = ($("#pname").value||"").trim() || "Future Educator"; startTimer(); go(1); };
};

/* ---- Room 1: The Library (philosophies) ---- */
HINTS.r1 = [
  "Each numbered description matches one philosophy book. Write down the letter on that book's spine for descriptions 1 through 5, in order.",
  "Description 1 (basics, core skills, discipline) is <strong>Essentialism</strong>, and description 5 (learning by doing) is <strong>Progressivism</strong>.",
  "The answer is a five-letter word for what every student does in school."
];
ROOMS[1] = () => {
  const books = [
    ["Existentialism","#7b4fa0","E"],["Essentialism","#2f6fa3","L"],["Perennialism","#a3542f","A"],
    ["Progressivism","#3f8a4a","N"],["Social Reconstructionism","#a32f5c","R"]
  ];
  stage.innerHTML = `
  <h2>Room 1 · The Library</h2>
  <p class="story">Five dusty books glow on the shelf, each with one letter painted on its spine. A librarian's card catalog lists five
  descriptions, but the titles have been torn off. The lock on the library door takes a <strong>5-letter word</strong>.</p>
  <div class="grid g2">${books.map(b=>`<div class="card book"><div class="spine" style="background:${b[1]}">${b[2]}</div><div><strong>${b[0]}</strong></div></div>`).join("")}</div>
  <h3>Card Catalog</h3>
  <ol class="clues">
    <li>All students should master a common core of basic knowledge and skills (the "3 R's," history, science). Teachers are authorities, and the classroom is orderly and disciplined. <span class="small">(William Bagley, E. D. Hirsch)</span></li>
    <li>Each student is a free individual who must make choices and create meaning in their own life. The curriculum emphasizes personal choice, the arts, and self-reflection. <span class="small">(Jean-Paul Sartre, Maxine Greene)</span></li>
    <li>Truth is universal and unchanging, so every student should study the same enduring ideas found in the "Great Books" of Western civilization. <span class="small">(Robert Hutchins, Mortimer Adler)</span></li>
    <li>Schools should be agents of change. Students study real social problems like poverty and injustice and work to build a fairer society. <span class="small">(George Counts, Paulo Freire)</span></li>
    <li>Education should be child-centered and grow out of students' interests and experiences. Learning happens through hands-on problem solving and cooperation. <span class="small">(John Dewey)</span></li>
  </ol>
  <div class="lock"><label for="a1">🔒 Library lock:</label><input id="a1" type="text" maxlength="5" autocomplete="off">
    <button id="t1">Try it</button><span class="msg" id="m1"></span></div>
  ${hintBlock("r1")}`;
  const check = () => {
    if (enc($("#a1").value) === "TEVBUk4=") pass($("#m1"),"🔓 Click! The library door swings open.",()=>go(2));
    else fail($("#m1"),"The lock won't budge. Check which philosophy matches each description.");
  };
  $("#t1").onclick = check; $("#a1").onkeydown = e => { if(e.key==="Enter") check(); };
};

/* ---- Room 2: Portrait Gallery (philosophers) ---- */
HINTS.r2 = [
  "Each clue describes one philosopher. Find their portrait, then read the number on its brass plate. Enter the four numbers in the order of the clues (A, B, C, D).",
  "Clue A is John Dewey, and Clue C is Paulo Freire.",
  "Clue B is Maria Montessori, and Clue D is Horace Mann."
];
ROOMS[2] = () => {
  const people = [
    ["🏛️","Plato","c. 428–348 BCE",7],["🌿","Jean-Jacques Rousseau","1712–1778",3],["🔔","Horace Mann","1796–1859",4],
    ["🧸","Maria Montessori","1870–1952",1],["🔬","John Dewey","1859–1952",9],["⚖️","George Counts","1889–1974",2],
    ["✊","Paulo Freire","1921–1997",5],["📚","Mortimer Adler","1902–2001",8]
  ];
  stage.innerHTML = `
  <h2>Room 2 · The Portrait Gallery</h2>
  <p class="story">Eight portraits line the hallway. Each has a numbered brass plate. A keypad by the far door asks for a <strong>4-digit code</strong>,
  and someone has scratched four clues into the wall.</p>
  <div class="grid g4">${people.map(p=>`<div class="card portrait"><div class="frame" aria-hidden="true">${p[0]}</div><strong>${p[1]}</strong><div class="small">${p[2]}</div><span class="plate">${p[3]}</span></div>`).join("")}</div>
  <h3>Scratched on the wall</h3>
  <ol class="clues" type="A">
    <li>I believed school should be a small democratic community where children learn by doing. I wrote <em>Democracy and Education</em> (1916).</li>
    <li>I was one of Italy's first women physicians. I designed a "prepared environment" with child-sized materials so young children could direct their own learning.</li>
    <li>I criticized the "banking concept" of education, where teachers deposit facts into passive students. I called for dialogue and critical consciousness instead.</li>
    <li>I led the "common school" movement, calling free, tax-supported public education "the great equalizer of the conditions of men."</li>
  </ol>
  <div class="lock"><label for="a2">🔢 Keypad:</label><input id="a2" type="text" maxlength="4" inputmode="numeric" autocomplete="off">
    <button id="t2">Enter</button><span class="msg" id="m2"></span></div>
  ${hintBlock("r2")}`;
  const check = () => {
    if (enc($("#a2").value) === "OTE1NA==") pass($("#m2"),"🔓 Beep-beep! The gallery door unlocks.",()=>go(3));
    else fail($("#m2"),"ERROR. Check each clue against the portraits.");
  };
  $("#t2").onclick = check; $("#a2").onkeydown = e => { if(e.key==="Enter") check(); };
};

/* ---- Room 3: The Timeline ---- */
HINTS.r3 = [
  "Use the ▲ and ▼ buttons to sort the events from oldest (top) to newest (bottom). When you check, the lock tells you how many are in the right spot.",
  "Plato is the oldest by more than 2,000 years. Next comes the Enlightenment (Rousseau, 1700s), then the 1800s common school movement.",
  "Twentieth-century order: Montessori (1907), then Dewey (1916), then Freire (1968), then Adler (1982)."
];
ROOMS[3] = () => {
  const correct = [
    "Plato describes the education of philosopher-kings in <em>The Republic</em>.",
    "Rousseau publishes <em>Émile</em>, arguing that children learn best through nature and experience.",
    "Horace Mann becomes the first secretary of the Massachusetts Board of Education.",
    "Maria Montessori opens the first Casa dei Bambini (Children's House) in Rome.",
    "John Dewey publishes <em>Democracy and Education</em>.",
    "Paulo Freire writes <em>Pedagogy of the Oppressed</em>.",
    "Mortimer Adler publishes <em>The Paideia Proposal</em>, calling for one rigorous curriculum for all students."
  ];
  const years = ["c. 375 BCE","1762","1837","1907","1916","1968","1982"];
  let order = [4,1,6,2,0,5,3];
  const draw = () => {
    $("#tl").innerHTML = order.map((idx,i)=>`<li><span class="pos">${i+1}.</span><span>${correct[idx]}</span>
      <button class="mv ghost" aria-label="Move up" ${i===0?"disabled":""} onclick="mv(${i},-1)">▲</button>
      <button class="mv ghost" aria-label="Move down" ${i===order.length-1?"disabled":""} onclick="mv(${i},1)">▼</button></li>`).join("");
  };
  window.mv = (i,d) => { const j=i+d; [order[i],order[j]]=[order[j],order[i]]; draw(); const b=$("#tl").children[j].querySelectorAll("button")[d<0?0:1]; if(b && !b.disabled) b.focus(); };
  stage.innerHTML = `
  <h2>Room 3 · The History Hall</h2>
  <p class="story">A long wooden timeline covers the wall, but someone has knocked the event cards out of order. A brass lock is wired to the
  timeline. It will open only when every card is in <strong>chronological order</strong>, oldest at the top.</p>
  <ul class="timeline" id="tl"></ul>
  <div class="lock"><span>🔒 Timeline lock</span><button id="t3">Check order</button><span class="msg" id="m3"></span></div>
  ${hintBlock("r3")}`;
  draw();
  $("#t3").onclick = () => {
    const right = order.filter((v,i)=>v===i).length;
    if (right === order.length) {
      $("#tl").innerHTML = order.map((idx,i)=>`<li><span class="pos">${i+1}.</span><span>${correct[idx]} <strong style="color:var(--gold)">(${years[idx]})</strong></span></li>`).join("");
      pass($("#m3"),"🔓 The timeline lights up and the lock drops open!",()=>go(4));
      setTimeout(()=>{}, 0);
    } else fail($("#m3"),`${right} of ${order.length} cards are in the correct position.`);
  };
};

/* ---- Room 4: Classroom Observation ---- */
HINTS.r4 = [
  "<strong>Traditional/classical</strong>: teacher-centered, a set body of content, mastery through instruction and practice. <strong>Progressive</strong>: student-centered, inquiry, real-world problems, collaboration.",
  "Exactly half of the observations are traditional and half are progressive.",
  "The four progressive ones: the paper towel experiment, the class garden, the community project, and the class meeting."
];
ROOMS[4] = () => {
  const items = [
    ["Desks sit in straight rows facing the teacher's desk and chalkboard.","T"],
    ["Students design their own experiment to find out which brand of paper towel absorbs the most water.","P"],
    ["The teacher lectures on the causes of the Civil War while students copy notes from the board.","T"],
    ["Small groups plan and plant a class garden, measuring plots (math) and tracking plant growth (science).","P"],
    ["Students recite multiplication tables together in timed drills until they've memorized them.","T"],
    ["Each student chooses a local issue to research and presents solutions to community members.","P"],
    ["The class works through the textbook chapter by chapter, with a unit test at the end of each one.","T"],
    ["The class holds a meeting to discuss a playground problem and vote on new classroom rules.","P"]
  ];
  const pick = new Array(items.length).fill(null);
  stage.innerHTML = `
  <h2>Room 4 · The Observation Room</h2>
  <p class="story">Behind a one-way mirror, you watch scenes from classrooms across the decades play out on old film reels.
  An observer's clipboard hangs on the door: label every observation as <strong>Traditional (classical)</strong> or <strong>Progressive</strong> to unlock it.</p>
  <div class="scene"><ul>${items.map((it,i)=>`<li><span style="flex:1;min-width:220px">🎞️ ${it[0]}</span>
     <span class="seg" role="group" aria-label="Observation ${i+1}">
       <button data-i="${i}" data-v="T" aria-pressed="false">Traditional</button>
       <button data-i="${i}" data-v="P" aria-pressed="false">Progressive</button></span></li>`).join("")}</ul></div>
  <div class="lock"><span>📋 Clipboard lock</span><button id="t4">Submit observations</button><span class="msg" id="m4"></span></div>
  ${hintBlock("r4")}`;
  stage.querySelectorAll(".seg button").forEach(b => b.onclick = () => {
    const i=+b.dataset.i; pick[i]=b.dataset.v;
    b.parentElement.querySelectorAll("button").forEach(x=>{ const on=x.dataset.v===pick[i]; x.classList.toggle("on",on); x.setAttribute("aria-pressed",on); });
  });
  $("#t4").onclick = () => {
    if (pick.includes(null)) return fail($("#m4"),"Label every observation first.");
    const right = pick.filter((p,i)=>p===items[i][1]).length;
    if (right===items.length) pass($("#m4"),"🔓 Sharp eye! The observation room door opens.",()=>go(5));
    else fail($("#m4"),`${right} of ${items.length} observations are labeled correctly.`);
  };
};

/* ---- Room 5: The Mirror (personal philosophy) ---- */
const PHIL = {
  ESS:{name:"Essentialism", who:"William Bagley, E. D. Hirsch Jr.", desc:"You believe every student deserves a strong foundation in core knowledge and skills, taught clearly by a knowledgeable teacher in an orderly classroom.", ppt:"Consider William Bagley for your Philosophy PowerPoint, and look into his critique of progressive education in the 1930s."},
  PER:{name:"Perennialism", who:"Robert Hutchins, Mortimer Adler (with roots in Plato and Aristotle)", desc:"You value timeless ideas, great works, and the same rigorous intellectual education for every student.", ppt:"Consider Mortimer Adler (<em>The Paideia Proposal</em>) or Plato for your Philosophy PowerPoint."},
  PRO:{name:"Progressivism", who:"John Dewey (with roots in Rousseau)", desc:"You see learning as active and experiential. It should grow out of students' interests and real problems, and classrooms should be small democracies.", ppt:"Consider John Dewey for your Philosophy PowerPoint, and look into his Laboratory School at the University of Chicago."},
  SOC:{name:"Social Reconstructionism", who:"George Counts, Paulo Freire", desc:"You see schools as engines of social change, places where students learn to question injustice and act to improve their communities.", ppt:"Consider Paulo Freire (<em>Pedagogy of the Oppressed</em>) or George Counts for your Philosophy PowerPoint."},
  EXI:{name:"Existentialism", who:"Jean-Paul Sartre, Maxine Greene, A. S. Neill", desc:"You put the individual student at the center. School should help each person discover who they are and take responsibility for their own choices.", ppt:"Consider Maxine Greene or A. S. Neill (Summerhill School) for your Philosophy PowerPoint."},
  MON:{name:"Child-Centered / Montessori", who:"Maria Montessori", desc:"You trust children's natural drive to learn when they have a carefully prepared environment and the freedom to choose their work.", ppt:"Consider Maria Montessori for your Philosophy PowerPoint."}
};
const QS = [
  ["The main purpose of school is to…",[
    ["pass on the essential knowledge and skills every citizen needs.","ESS"],["develop the mind through humanity's greatest and most lasting ideas.","PER"],
    ["help students solve real problems and live in a democracy.","PRO"],["prepare students to recognize and fix injustice in society.","SOC"],
    ["help each student discover who they are and what they value.","EXI"]]],
  ["In my ideal classroom, the teacher is mainly…",[
    ["an expert who explains content clearly and keeps high standards.","ESS"],["a guide who leads students through the great books by asking questions.","PER"],
    ["a facilitator who sets up projects and supports students' inquiry.","PRO"],["a partner in dialogue who learns alongside students.","SOC"],
    ["an observer who prepares the space and steps back.","MON"]]],
  ["The curriculum should be based on…",[
    ["core subjects, including reading, writing, math, science, and history.","ESS"],["classic works of literature, philosophy, and science.","PER"],
    ["students' interests and real-world experiences.","PRO"],["current social issues and students' communities.","SOC"],
    ["students' own choices, the arts, and personal reflection.","EXI"]]],
  ["The best way to know whether a student has learned is…",[
    ["tests that measure mastery of the standards.","ESS"],["seminar discussion and writing about big ideas.","PER"],
    ["a project or product that solves a real problem.","PRO"],["action the student takes in the community.","SOC"],
    ["the student's own self-assessment and portfolio.","EXI"]]],
  ["A young child walks into my room. I want them to…",[
    ["learn the routines and basic skills that set them up for success.","ESS"],["hear great stories and start asking big questions.","PER"],
    ["explore, build, and play with classmates.","PRO"],["choose their own activity from shelves of hands-on materials.","MON"],
    ["feel free to be themselves and express their feelings.","EXI"]]],
  ["The educator I'd most like to have coffee with is…",[
    ["E. D. Hirsch, the cultural literacy advocate.","ESS"],["Mortimer Adler, the Great Books champion.","PER"],["John Dewey, the father of progressive education.","PRO"],
    ["Paulo Freire, the critical pedagogue.","SOC"],["Maria Montessori, the physician turned educator.","MON"]]]
];
HINTS.r5 = ["There are no wrong answers here. Answer honestly, and the mirror will reflect your own philosophy."];
ROOMS[5] = () => {
  stage.innerHTML = `
  <h2>Room 5 · The Mirror</h2>
  <p class="story">The last door has no keyhole, only a tall, old mirror. Words appear in the glass:
  <em>"You have learned the philosophies of others. Now show me your own."</em></p>
  <form id="mf">${QS.map((q,qi)=>`<fieldset><legend>${qi+1}. ${q[0]}</legend>${q[1].map((o,oi)=>
     `<label><input type="radio" name="q${qi}" value="${o[1]}" required> ${o[0]}</label>`).join("")}</fieldset>`).join("")}
  <div class="lock"><span>🪞</span><button type="submit">Look into the mirror</button><span class="msg" id="m5"></span></div></form>`;
  $("#mf").onsubmit = e => {
    e.preventDefault();
    const tally={}; QS.forEach((q,qi)=>{ const v=document.querySelector(`input[name=q${qi}]:checked`).value; tally[v]=(tally[v]||0)+1; });
    const ranked = Object.entries(tally).sort((a,b)=>b[1]-a[1]);
    S.philosophy = ranked[0][0]; S.second = ranked[1] ? ranked[1][0] : null;
    pass($("#m5"),"✨ The mirror shimmers and becomes a doorway…",()=>go(6));
  };
};

/* ---- Escape! ---- */
ROOMS[6] = () => {
  clearInterval(tick);
  const secs = elapsed(); const p = PHIL[S.philosophy]; const p2 = S.second ? PHIL[S.second] : null;
  const code = "EDU216-" + (["ESS","PER","PRO","SOC","EXI","MON"].indexOf(S.philosophy)+1) + S.hints + "-" + (((secs*7919)+S.hints*31)%9000+1000);
  SCORM.complete(100, secs);
  stage.innerHTML = `
  <h2>🎉 You Escaped!</h2>
  <div class="cert">
    <div class="small">THIS CERTIFIES THAT</div>
    <div style="font-size:1.6rem;margin:.3rem 0">${S.player.replace(/</g,"&lt;")}</div>
    <div class="small">escaped the Old Schoolhouse by mastering the historical and philosophical foundations of education</div>
    <p>Time: <strong>${fmt(secs)}</strong> · Hints used: <strong>${S.hints}</strong> · ${new Date().toLocaleDateString()}</p>
    <div class="small">Exit password (enter this in your course quiz)</div><div class="code" style="font-size:1.9rem">${atob("REVXRVkxOTE2")}</div>
    <div class="small" style="margin-top:.6rem">Personal completion code</div><div class="code" style="font-size:1.1rem">${code}</div>
  </div>
  <div class="result" style="margin-top:1rem">
    <h3>🪞 Your reflection: ${p.name}</h3>
    <p>${p.desc}</p>
    <p><strong>Thinkers to explore:</strong> ${p.who}</p>
    ${p2 && p2!==p ? `<p><strong>Your second-strongest lean:</strong> ${p2.name} (${p2.who})</p>`:""}
    <p><strong>Next step:</strong> ${p.ppt}</p>
    <p class="small" style="color:#24402f">Most teachers blend philosophies. Use this result as a starting point, not a label.</p>
  </div>
  <div class="row"><button onclick="window.print()">🖨️ Print / save as PDF</button>
    <button class="ghost" onclick="location.reload()">Play again</button></div>
  <p class="small">Enter the <strong>exit password</strong> in your course quiz, or submit your completion code or a screenshot of this page, as your instructor directs.</p>`;
};

renderDoors(); go(0);
</script>
