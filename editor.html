ody{height:auto;overflow:visible;background:#fff}\n  #scene,#view{position:static;display:block;width:auto;transform:none;background:#fff;overflow:visible}\n  #bg,#hud,#light,#grainfx,#doorfx,#examine,#pause,#teacher-key,#more,.dawn,.noprint,.pin,#confetti{display:none!important}\n  #stage{position:static;display:block;padding:0;overflow:visible}\n  .head{display:none}\n  .endrow{display:block}\n  .cert{max-width:none;max-height:none;overflow:visible;box-shadow:inset 0 0 0 1px #2a1d14,inset 0 0 0 .4rem #fff,inset 0 0 0 .46rem #2a1d14;background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}\n  .result{transform:none;box-shadow:none;background:#fff;margin-top:1rem;display:block;width:100%}\n  .result .clip{display:block;overflow:visible}\n  .note{color:#000;background:none;box-shadow:none;transform:none;clip-path:none;padding:0;margin-top:1rem;max-width:none}\n}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv id=\"scene\">\n  \u003cdiv id=\"bg\" aria-hidden=\"true\">\n    \u003cdiv class=\"wall\">\u003c/div>\u003cdiv class=\"floor\">\u003c/div>\u003cdiv class=\"win\">\u003c/div>\u003cdiv class=\"beam\">\u003c/div>\n    \u003csvg class=\"lantern\" viewBox=\"0 0 34 92\" focusable=\"false\">\u003cpath d=\"M17 0v40\" stroke=\"#6d5220\" stroke-width=\"1.6\" stroke-dasharray=\"3 2\"/>\u003cpath d=\"M9 44h16l-3-6h-10z\" fill=\"#3b2a0c\"/>\u003crect x=\"8\" y=\"44\" width=\"18\" height=\"30\" rx=\"2\" fill=\"#ffd28a\"/>\u003crect x=\"8\" y=\"44\" width=\"18\" height=\"30\" rx=\"2\" fill=\"none\" stroke=\"#3b2a0c\" stroke-width=\"2.4\"/>\u003cpath d=\"M17 44v30M8 59h18\" stroke=\"#3b2a0c\" stroke-width=\"1.6\"/>\u003cellipse cx=\"17\" cy=\"60\" rx=\"4\" ry=\"7\" fill=\"#fff6dc\"/>\u003cpath d=\"M6 74h22l-3 7H9z\" fill=\"#3b2a0c\"/>\u003ccircle cx=\"17\" cy=\"86\" r=\"3\" fill=\"none\" stroke=\"#6d5220\" stroke-width=\"1.6\"/>\u003c/svg>\n    \u003cdiv class=\"exit\">\u003cspan class=\"void\">\u003c/span>\u003cspan class=\"slab\">\u003ci>\u003c/i>\u003ci>\u003c/i>\u003cb>\u003c/b>\u003cb>\u003c/b>\u003c/span>\u003c/div>\u003cdiv class=\"dust\">\u003c/div>\n  \u003c/div>\n  \u003cdiv id=\"view\">\n  \u003cheader id=\"hud\">\n    \u003ca href=\"#stage\" id=\"skip\" class=\"skip\">Skip to the room\u003c/a>\n    \u003ch1 id=\"game-title\" class=\"sr\">\u003c/h1>\n    \u003cdiv class=\"hud-l\">\u003col id=\"doors\" role=\"list\" aria-label=\"Rooms\">\u003c/ol>\u003cbutton type=\"button\" id=\"draft\" hidden aria-expanded=\"false\" aria-controls=\"draft-more\">\u003c/button>\u003cp id=\"draft-more\" hidden>\u003c/p>\u003c/div>\n    \u003cdiv class=\"hud-r\">\n      \u003cbutton type=\"button\" id=\"sound-toggle\" role=\"switch\" aria-checked=\"true\" aria-label=\"Sound\">\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" focusable=\"false\" aria-hidden=\"true\">\u003cpath d=\"M6.5 16.5c1.2-1.4 1.6-3 1.6-5.6a3.9 3.9 0 0 1 7.8 0c0 2.600.4 4.200 1.600 5.600z\"/>\u003cpath d=\"M10.300 18.800a1.800 1.800 0 0 0 3.400 0M12 5V3.600M9.500 9.500c.2-1 .8-1.600 1.600-1.900M8.500 14.500h7\" />\u003cpath class=\"waves\" d=\"M3.500 8.500c-.6 1.500-.6 3 0 4.500M20.500 8.500c.6 1.500.6 3 0 4.500\"/>\u003cpath class=\"off\" d=\"M4 4l16 16\"/>\u003c/svg>\u003c/button>\n      \u003cdiv class=\"watchbox\">\u003cbutton type=\"button\" id=\"watch\" aria-haspopup=\"dialog\">\u003csvg viewBox=\"0 0 60 66\" focusable=\"false\" aria-hidden=\"true\">\n        \u003cdefs>\u003clinearGradient id=\"wg\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"1\">\u003cstop offset=\"0\" stop-color=\"#f4dc9c\"/>\u003cstop offset=\".45\" stop-color=\"#b08a3e\"/>\u003cstop offset=\".7\" stop-color=\"#c9a556\"/>\u003cstop offset=\"1\" stop-color=\"#5a4317\"/>\u003c/linearGradient>\n        \u003cradialGradient id=\"wf\" cx=\".4\" cy=\".35\" r=\".8\">\u003cstop offset=\"0\" stop-color=\"#fbf4e0\"/>\u003cstop offset=\"1\" stop-color=\"#cfc09a\"/>\u003c/radialGradient>\u003c/defs>\n        \u003ccircle cx=\"30\" cy=\"6.500\" r=\"4.200\" fill=\"none\" stroke=\"url(#wg)\" stroke-width=\"2.200\"/>\u003crect x=\"27\" y=\"9.500\" width=\"6\" height=\"5\" fill=\"url(#wg)\"/>\n        \u003ccircle cx=\"30\" cy=\"38\" r=\"25\" fill=\"url(#wg)\" stroke=\"#3b2a0c\" stroke-width=\"1\"/>\u003ccircle cx=\"30\" cy=\"38\" r=\"20.500\" fill=\"url(#wf)\" stroke=\"#3b2a0c\" stroke-width=\".8\"/>\n        \u003cg id=\"wticks\" stroke=\"#2a1d14\" stroke-linecap=\"round\">\u003c/g>\n        \u003cpath class=\"hand\" id=\"wmin\" d=\"M30 38V23.500\" stroke=\"#2a1d14\" stroke-width=\"1.800\" stroke-linecap=\"round\"/>\n        \u003cpath class=\"hand\" id=\"wsec\" d=\"M30 42V20.500\" stroke=\"#9b2218\" stroke-width=\"1\" stroke-linecap=\"round\"/>\n        \u003ccircle cx=\"30\" cy=\"38\" r=\"1.700\" fill=\"#2a1d14\"/>\u003cpath d=\"M14 27a19 19 0 0 1 14-9\" fill=\"none\" stroke=\"#fff\" stroke-width=\"1.600\" stroke-linecap=\"round\" opacity=\".55\"/>\u003c/svg>\n        \u003cspan class=\"wl\">Notebook\u003cspan class=\"sr\">: settings and help\u003c/span>\u003c/span>\u003c/button>\n        \u003cspan id=\"timer\" role=\"timer\" aria-label=\"Time so far\">00:00\u003c/span>\u003c/div>\n    \u003c/div>\n  \u003c/header>\n  \u003cmain id=\"stage\" tabindex=\"-1\">\u003c/main>\n  \u003c/div>\n  \u003cdiv id=\"more\" aria-hidden=\"true\" hidden>\u003csvg viewBox=\"0 0 16 16\" focusable=\"false\">\u003cpath d=\"M3 5.500 8 11l5-5.500\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003cspan>more below\u003c/span>\u003c/div>\n  \u003cdiv id=\"light\" aria-hidden=\"true\">\u003cdiv class=\"vig\">\u003c/div>\u003cdiv class=\"glow\">\u003c/div>\u003cdiv class=\"flare\">\u003c/div>\u003c/div>\n  \u003cdiv id=\"doorfx\" aria-hidden=\"true\">\u003ci>\u003c/i>\u003ci>\u003c/i>\u003c/div>\n  \u003cdiv id=\"grainfx\" aria-hidden=\"true\">\u003c/div>\n\u003c/div>\n\u003cdiv id=\"examine\" hidden role=\"dialog\" aria-modal=\"true\" aria-label=\"Looking closely\">\u003c/div>\n\u003cdiv id=\"pause\" hidden role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"pause-h\">\n  \u003cdiv class=\"book\">\u003cdiv class=\"page\">\n    \u003ch2 id=\"pause-h\">Notebook\u003c/h2>\n    \u003cp class=\"stat\">\u003cspan id=\"p-clock\">Time \u003cspan id=\"p-time\">00:00\u003c/span> · \u003c/span>Hints used \u003cspan id=\"hintCount\">0\u003c/span> · Wrong tries \u003cspan id=\"wrongCount\">0\u003c/span>\u003c/p>\n    \u003cul role=\"list\">\n      \u003cli>\u003cbutton type=\"button\" id=\"resume\">\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" focusable=\"false\">\u003cpath d=\"M6 3h11v18H6zM6 3l6 2.500v18L6 21M14.500 12.500v2\"/>\u003c/svg>\u003cspan class=\"lbl\">Back to the room\u003c/span>\u003cem aria-hidden=\"true\">Esc\u003c/em>\u003c/button>\u003c/li>\n      \u003cli>\u003cbutton type=\"button\" id=\"sound-toggle-2\" role=\"switch\" aria-checked=\"true\">\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" focusable=\"false\">\u003cpath d=\"M6.500 16.500c1.200-1.400 1.600-3 1.600-5.600a3.900 3.900 0 0 1 7.800 0c0 2.600.4 4.200 1.600 5.600zM10.300 18.800a1.800 1.800 0 0 0 3.400 0M12 5V3.600\"/>\u003c/svg>\u003cspan class=\"lbl\">Sound\u003c/span>\u003cem class=\"st\" aria-hidden=\"true\">on\u003c/em>\u003c/button>\u003c/li>\n      \u003cli>\u003cbutton type=\"button\" id=\"motion-toggle\" role=\"switch\" aria-checked=\"true\" aria-describedby=\"motion-why\">\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" focusable=\"false\">\u003ccircle cx=\"12\" cy=\"12\" r=\"8\"/>\u003cpath d=\"M12 4v3M12 17v3M4 12h3M17 12h3M12 12l3.500-3.500\"/>\u003c/svg>\u003cspan class=\"lbl\">Motion\u003c/span>\u003cem class=\"st\" aria-hidden=\"true\">on\u003c/em>\u003c/button>\n        \u003cp class=\"why\" id=\"motion-why\" hidden>Your device asks for less motion, so animations stay off.\u003c/p>\u003c/li>\n      \u003cli>\u003cbutton type=\"button\" id=\"contrast-toggle\" role=\"switch\" aria-checked=\"false\">\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" focusable=\"false\">\u003ccircle cx=\"12\" cy=\"12\" r=\"8\"/>\u003cpath d=\"M12 4a8 8 0 0 1 0 16z\" fill=\"currentColor\"/>\u003c/svg>\u003cspan class=\"lbl\">High contrast\u003c/span>\u003cem class=\"st\" aria-hidden=\"true\">off\u003c/em>\u003c/button>\u003c/li>\n      \u003cli>\u003cbutton type=\"button\" id=\"readable-toggle\" role=\"switch\" aria-checked=\"false\">\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" focusable=\"false\">\u003cpath d=\"M4 19 9.500 5h1L16 19M6 14.500h8M17 19v-6.500M17 12.500c.6-.9 1.400-1.300 2.300-1.300 1.200 0 1.700.8 1.700 2V19\"/>\u003c/svg>\u003cspan class=\"lbl\">Readable text\u003c/span>\u003cem class=\"st\" aria-hidden=\"true\">off\u003c/em>\u003c/button>\u003c/li>\n      \u003cli>\u003cbutton type=\"button\" id=\"clock-toggle\" role=\"switch\" aria-checked=\"false\">\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" focusable=\"false\">\u003ccircle cx=\"12\" cy=\"13\" r=\"7.500\"/>\u003cpath d=\"M12 9v4l2.500 2M10 3h4M4 4l16 16\"/>\u003c/svg>\u003cspan class=\"lbl\">Hide the clock\u003c/span>\u003cem class=\"st\" aria-hidden=\"true\">off\u003c/em>\u003c/button>\u003c/li>\n      \u003cli>\u003cbutton type=\"button\" id=\"restart\">\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" focusable=\"false\">\u003cpath d=\"M5 12a7 7 0 1 0 2.500-5.400M5 4v3.500h3.500\"/>\u003c/svg>\u003cspan>Start over\u003c/span>\u003c/button>\u003c/li>\n    \u003c/ul>\n    \u003ch3 class=\"howh\">How to play\u003c/h3>\n    \u003cul class=\"tips\">\n      \u003cli>There is no time limit. The clock only shows how long you have played, and it stops while this notebook is open.\u003c/li>\n      \u003cli>Papers: select one to read it up close. Esc or the close button puts it back.\u003c/li>\n      \u003cli>Combination locks: take the clues in order; the codes they point to, in that order, open the lock. Set each dial with the arrows above and below it or the arrow keys, or type the whole code in the box labelled “Type the whole code instead”. Then press “Pull the shackle”.\u003c/li>\n      \u003cli>Other locks: press the button named on the handle’s tag (“Check answers”, “Check order” or “Submit”).\u003c/li>\n      \u003cli>Every room has a Describe this room button. It lists everything in the room as text.\u003c/li>\n      \u003cli>Every sound comes with a message on screen, so the game plays the same with sound off.\u003c/li>\n    \u003c/ul>\n  \u003c/div>\u003c/div>\n\u003c/div>\n\u003cdiv class=\"sr\" aria-live=\"polite\" id=\"live\">\u003c/div>\n\u003c!-- The escape room's content (questions, answers, story). Edit it with editor.html, not by hand. -->\n\u003cscript id=\"escape-config\" type=\"text/plain\">__ESCAPE_CONFIG__\u003c/script>\n\u003cscript>\n/* Shared logic for the escape-room game and the teacher editor.\n * Runs in browsers (inlined into both pages by scripts/build.js) and in Node (build + tests). */\nconst ER = (() => {\n  // ---------- text ----------\n  const esc = s => String(s ?? \"\").replace(/[&\u003c>\"']/g, c => ({ \"&\": \"&amp;\", \"\u003c\": \"&lt;\", \">\": \"&gt;\", '\"': \"&quot;\", \"'\": \"&#39;\" }[c]));\n  // Plain text with **bold** and *italic*; everything else is escaped.\n  const fmt = s => esc(s).replace(/\\*\\*(.+?)\\*\\*/g, \"\u003cstrong>$1\u003c/strong>\").replace(/\\*(.+?)\\*/g, \"\u003cem>$1\u003c/em>\");\n  const paras = (s, cls = \"\") => String(s ?? \"\").split(/\\n\\s*\\n/).map(p => p.trim()).filter(Boolean)\n    .map(p => `\u003cp${cls ? ` class=\"${cls}\"` : \"\"}>${fmt(p).replace(/\\n/g, \"\u003cbr>\")}\u003c/p>`).join(\"\");\n  // For comparing typed answers: case, accents, punctuation and extra spaces don't matter.\n  // Letters that don't decompose into base letter + accent, so \"Søren\" matches \"Soren\".\n  const FOLD = { \"ø\": \"o\", \"æ\": \"ae\", \"œ\": \"oe\", \"ß\": \"ss\", \"ł\": \"l\", \"đ\": \"d\", \"ð\": \"d\", \"þ\": \"th\", \"ı\": \"i\" };\n  const norm = s => String(s ?? \"\").normalize(\"NFD\").replace(/[\\u0300-\\u036f]/g, \"\").toLowerCase()\n    .replace(/[øæœßłđðþı]/g, c => FOLD[c]).replace(/['\\u2018\\u2019`]/g, \"\")   // \"Plato's\" = \"Platos\"\n    .replace(/[^a-z0-9]+/g, \" \").trim();\n  const accepted = a => String(a ?? \"\").split(\"|\").map(norm).filter(Boolean);\n\n  // ---------- deterministic shuffle ----------\n  const hash = s => { let h = 2166136261; for (const c of String(s)) { h ^= c.codePointAt(0); h = Math.imul(h, 16777619); } return h >>> 0; };\n  const rng = seed => () => { seed |= 0; seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);\n    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };\n  function scramble(n, seedText) {\n    const idx = [...Array(n).keys()]; if (n \u003c 2) return idx;\n    const r = rng(hash(seedText));\n    for (let tries = 0; tries \u003c 20; tries++) {\n      for (let i = n - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [idx[i], idx[j]] = [idx[j], idx[i]]; }\n      if (idx.some((v, i) => v !== i)) break;\n    }\n    return idx;\n  }\n\n  // ---------- matching rooms: which code is on each card, and what the lock wants ----------\n  const LETTERS = \"ABCDEFGHIJKLMNOPQRSTUVWXYZ\", DIGITS = \"123456789\";\n  function matching(room) {\n    const cards = (room.cards || []).map((c, k) => ({ ...c, k }));\n    const answerCards = cards.filter(c => String(c.clue || \"\").trim());\n    const display = [...cards].sort((a, b) => String(a.term).localeCompare(String(b.term)));\n    const numbers = room.codeStyle === \"numbers\";\n    const code = {}; const used = new Set();\n    cards.forEach(c => { const v = String(c.code || \"\").replace(/\\s+/g, \"\").toUpperCase(); if (v) { code[c.k] = v; used.add(v); } });\n    const word = String(room.codeWord || \"\").replace(/\\s+/g, \"\").toUpperCase();\n    if (!numbers && word && word.length === answerCards.length) {\n      answerCards.forEach((c, i) => { if (!code[c.k]) { code[c.k] = word[i]; used.add(word[i]); } });\n    }\n    const pool = [...(numbers ? DIGITS : LETTERS)].filter(ch => !used.has(ch));\n    display.forEach(c => { if (!code[c.k]) code[c.k] = pool.shift() || \"?\"; });\n    return { cards, display, answerCards, numbers, code, answer: answerCards.map(c => code[c.k]).join(\"\") };\n  }\n\n  // ---------- matching rooms: how the cards are drawn (presentation only, never graded) ----------\n  // \"cards\" is the default and the fallback for anything unknown. Books need short names to fit on a\n  // spine, so a room with a very long name falls back to plain cards instead of clipping text.\n  const LOOKS = [\"cards\", \"books\", \"portraits\"];\n  const plain = s => String(s == null ? \"\" : s).replace(/\\*+/g, \"\").trim();\n  function look(room) {\n    const v = LOOKS.includes(room && room.look) ? room.look : \"cards\";\n    if (v === \"books\" && (room.cards || []).some(c => plain(c.term).length > 48)) return \"cards\";\n    return v;\n  }\n  // Initials for a portrait with no icon: \"Jean-Jacques Rousseau\" -> \"JJR\", \"Maria de la Cruz\" -> \"MC\".\n  const PARTICLES = new Set([\"de\", \"del\", \"della\", \"der\", \"di\", \"du\", \"la\", \"le\", \"of\", \"the\", \"van\", \"von\", \"and\", \"y\"]);\n  function initials(term) {\n    const words = plain(term).split(/[\\s\\-\\u2010-\\u2015]+/).map(w => w.replace(/^[^\\p{L}\\p{N}]+/u, \"\")).filter(Boolean);\n    const main = words.filter(w => !PARTICLES.has(w.toLowerCase()));\n    return (main.length ? main : words).slice(0, 3).map(w => Array.from(w)[0].toUpperCase()).join(\"\") || \"?\";\n  }\n\n  // ---------- answer key (teacher-only views: editor, preview, review sheet) ----------\n  // Returns plain-text lines that may use **bold** (render with fmt).\n  function answerKey(room) {\n    const t = room.type;\n    if (t === \"matching\") {\n      const m = matching(room);\n      const label = i => m.numbers ? String.fromCharCode(65 + i) : String(i + 1);\n      return [`Lock combination: **${m.answer}**`, ...m.answerCards.map((c, i) => `Clue ${label(i)} → ${c.term} (code ${m.code[c.k]})`)];\n    }\n    if (t === \"quiz\") return (room.questions || []).map((q, i) => `${i + 1}. ${q.prompt}  →  **${q.kind === \"choice\"\n      ? String((q.choices || [])[q.correct] ?? \"?\") : String(q.answers || \"\").split(\"|\").map(a => a.trim()).filter(Boolean).join(\" / \")}**`);\n    if (t === \"ordering\") return (room.items || []).map((it, i) => `${i + 1}. ${it.text}${it.label ? ` (**${it.label}**)` : \"\"}`);\n    if (t === \"sorting\") return (room.items || []).map(it => `${it.text}  →  **${(room.categories || [])[it.category] ?? \"?\"}**`);\n    if (t === \"reflection\") return [\"No wrong answers: any choices open the door. The most-chosen result is shown on the certificate.\"];\n    return [];\n  }\n\n  // ---------- hints ----------\n  const HINT_ROOMS = [\"matching\", \"quiz\", \"ordering\", \"sorting\"];        // rooms where a student can get it wrong\n  const hintRules = cfg => ({ first: Math.max(0, +(cfg.hintRules?.first ?? 1)), second: Math.max(0, +(cfg.hintRules?.second ?? 3)) });\n  // Hints that would hand over the answer instead of leading toward it.\n  function hintWarnings(room) {\n    const out = [];\n    const hints = (room.hints || []).slice(0, 2);\n    const has = (h, s) => { const a = norm(s); return a.length >= 3 && (\" \" + norm(h) + \" \").includes(\" \" + a + \" \"); };\n    hints.forEach((h, i) => {\n      if (!String(h || \"\").trim()) return;\n      const why = [];\n      if (room.type === \"matching\") {\n        const m = matching(room);\n        if (m.answer.length >= 3 && has(h, m.answer)) why.push(\"it contains the lock combination\");\n        const named = m.answerCards.filter(c => has(h, c.term)).length;\n        if (named >= 2) why.push(`it names ${named} of the answer cards`);\n      }\n      if (room.type === \"quiz\") {\n        const given = (room.questions || []).filter(q => q.kind === \"choice\" ? has(h, (q.choices || [])[q.correct]) : accepted(q.answers).some(a => a.length >= 4 && has(h, a))).length;\n        if (given) why.push(`it contains the answer to ${given} question${given > 1 ? \"s\" : \"\"}`);\n      }\n      if (room.type === \"sorting\") {\n        const listed = (room.items || []).filter(it => norm(it.text).length > 12 && norm(h).includes(norm(it.text).slice(0, 25))).length;\n        if (listed >= 2) why.push(`it quotes ${listed} of the items`);\n      }\n      if (room.type === \"ordering\") {\n        const labels = (room.items || []).map(it => norm(it.label)).filter(l => l.length >= 2);\n        if (labels.length >= 3 && labels.filter(l => (\" \" + norm(h) + \" \").includes(\" \" + l + \" \")).length >= 3) why.push(\"it lists most of the dates or labels\");\n      }\n      if (why.length) out.push({ hint: i, message: `Hint ${i + 1} may give away the answer: ${why.join(\" and \")}.` });\n    });\n    return out;\n  }\n\n  // ---------- review status ----------\n  // Every fact a student is graded on, so the teacher can check each one.\n  function reviewItems(cfg) {\n    const out = [];\n    (cfg.rooms || []).forEach((room, r) => {\n      const add = (list, label) => (list || []).fo nslateY(.1rem) scaleY(1.06)\", opacity: 1, offset: .7 }, { transform: \"none\" }], { duration: 320, easing: \"ease-out\" }); };\n  updateHints();\n}\n\n/* ===================== Locks ===================== */\n/* Lock feedback. The text in #msg always carries the result; the movement and the sound are extra. */\nconst X = (...px) => px.map(v => ({ transform: `translateX(${v}px)` })), R = (...deg) => deg.map(v => ({ transform: `rotate(${v}deg)` }));\nfunction lockMove(kind){\n  const l = stage.querySelector(\".lock\"); if (!l) return null;\n  l.classList.toggle(\"nope\", kind === \"nope\");\n  if (calm() || !l.animate) return l;\n  if (kind === \"nope\") {            // a tugged lock: it shifts a few pixels and the shackle or key jumps and falls back\n    l.animate(X(0, -6, 6, -4, 3, -1, 0), { duration: 420, easing: \"ease-out\" });\n    const sh = l.querySelector(\".shackle\"), key = l.querySelector(\".key\");\n    if (sh) sh.animate([0, -.5, .12, -.2, 0].map(v => ({ transform: `translateY(${v}rem)` })), { duration: 380, easing: \"ease-out\" });\n    if (key) key.animate(R(-38, -8, -46, -24, -38), { duration: 420, easing: \"ease-out\" });\n  }\n  if (kind === \"nudge\") l.animate(X(0, 3, 0), { duration: 180, easing: \"ease-out\" });\n  return l;\n}\n/* The result of a try is always brought into view (it may sit below the lock on a phone or a zoomed window),\n   clear of the \"more below\" tab; with motion off it jumps there. */\nfunction setMsg(cls, text){ const m=$(\"#msg\"); if (m) { m.className=\"msg \"+cls; m.textContent=text; if (text) reveal(m); } say(text); }\nfunction reveal(el){ try { el.scrollIntoView({ block: \"nearest\", behavior: calm() ? \"auto\" : \"smooth\" }); } catch(e){} cue(); }\nfunction count(right){ const c = $(\"#counter\"); if (!c) return; const d = c.firstElementChild; d.textContent = right;\n  if (!calm() && d.animate) d.animate([{ transform: \"translateY(-60%)\", opacity: 0 }, { transform: \"translateY(8%)\", opacity: 1, offset: .7 }, { transform: \"none\" }], { duration: 260, easing: \"ease-out\" }); }\nlet solvedRoom = -1;                  // once a room is solved its lock ignores further tries\nfunction fail(text, right){\n  if (solvedRoom === S.room) return;\n  S.wrong++; S.wrongIn[S.room] = (S.wrongIn[S.room]||0) + 1; updateHints(); setMsg(\"bad\", deco(text));\n  if (right != null) count(right);\n  SND.play(\"thud\"); lockMove(\"nope\");      // only the lock rattles, never the whole room\n}\n// Incomplete answer: tell the player, but don't count a wrong try (no penalty, no hint unlock).\nfunction notYet(text){ if (solvedRoom === S.room) return; setMsg(\"bad\", text); SND.play(\"press\"); lockMove(\"nudge\"); }\nfunction pass(text, right){\n  if (solvedRoom === S.room) return; solvedRoom = S.room;\n  setMsg(\"good\", deco(text)); if (right != null) count(right);\n  /* The controls are switched off. The one that has focus is only marked aria-disabled, so focus is not thrown away. */\n  stage.querySelectorAll(\".lock button, .mech button:not(.hb), #try, #answer, #mf input, #mf button\").forEach(el => { if (el.id === \"hint-btn\") return;\n    if (el === document.activeElement) el.setAttribute(\"aria-disabled\", \"true\"); else el.disabled = true; });\n  stage.querySelectorAll(\".dial\").forEach(d => { if (d !== document.activeElement) d.tabIndex = -1; d.setAttribute(\"aria-disabled\", \"true\"); });\n  const l = lockMove(\"\");\n  SND.play(l && l.classList.contains(\"klock\") ? \"turn\" : \"clunk\"); setTimeout(() => SND.play(\"chime\"), 260);\n  if (l) {\n    l.classList.add(\"unlocked\");\n    if (!calm() && l.animate) {\n      const hd = l.querySelector(\".key\");          // a handle is wound back a touch, thrown past its stop, and settles\n      if (hd) hd.animate(R(-38, -50, 66, 46, 52), { duration: 460, easing: \"ease-out\" });\n      const sh = l.querySelector(\".shackle\");      // the shackle springs (a dip first, then past its rest), then the whole padlock drops away\n      if (sh) { sh.animate([{ transform: \"translateY(0)\" }, { transform: \"translateY(.16rem) scaleY(.96)\", offset: .18 }, { transform: \"translateY(-2rem) scaleY(1.05)\", offset: .55 }, { transform: \"translateY(-1.4rem)\", offset: .8 }, { transform: \"translateY(-1.55rem)\" }], { duration: 420, easing: \"ease-out\" });\n        l.animate([{ transform: \"none\", opacity: 1 }, { transform: \"translateY(-.5rem) rotate(-3deg)\", opacity: 1, offset: .2 }, { transform: \"translateY(55vh) rotate(16deg)\", opacity: 0 }], { duration: 560, delay: 520, easing: \"cubic-bezier(.5,0,.9,.5)\", fill: \"forwards\" }); }\n      if (root.dataset.shape === \"wide\") { const ajar = [{ transform: \"none\" }, { transform: \"scaleX(1.012) skewY(.3deg)\", offset: .18 }, { transform: \"scaleX(.8) skewY(-2.4deg)\" }], o = { duration: 520, delay: l.classList.contains(\"dlock\") ? 640 : 520, easing: \"cubic-bezier(.5,0,.3,1)\", fill: \"forwards\" };\n        const slab = bg.querySelector(\".slab\");      // only the painted door swings ajar: the result and the plate under the lock stay upright\n        if (slab && getComputedStyle(slab.parentElement).display !== \"none\") { ajarFx.push(slab.animate(ajar, o)); setTimeout(() => SND.play(\"creak\"), o.delay); } }\n      const fl = $(\".flare\"); fl.animate([{ opacity: 0 }, { opacity: 1, offset: .25 }, { opacity: .25 }], { duration: 1100, easing: \"ease-out\" });\n    }\n  }\n  onward();\n}\n/* After a solve nothing moves on by itself: the result stays on screen (and in the live region), and a brass\n   push-plate under it takes the player on when they are ready. Focus moves to it, so Enter or Space goes on.\n   The last room's plate leads to the certificate. */\nfunction onward(){\n  const from = S.room, msg = stage.querySelector(\"#msg\"); if (!msg || $(\"#onward\")) return;\n  const b = document.createElement(\"button\");\n  b.type = \"button\"; b.id = \"onward\"; b.className = \"pushplate onward\";\n  b.innerHTML = `${ICON.door}\u003cspan>Go through the door\u003c/span>`;\n  b.onclick = () => { if (S.room === from) { SND.play(\"press\"); go(from+1); } };\n  msg.after(b); b.focus();\n}\nconst keyLock = (label, action, { form = \"\", total = 0, what = \"right\" } = {}) => `\u003cdiv class=\"lock klock\">\u003cdiv class=\"esc\">\u003cspan class=\"hole\" aria-hidden=\"true\">\u003c/span>\n    \u003cbutton id=\"try\" class=\"key\" ${form ? `type=\"submit\" form=\"${form}\"` : 'type=\"button\"'} title=\"${esc(action)} (the handle)\">${BIGKEY}\u003cspan class=\"sr\">${esc(action)}\u003c/span>\u003c/button>\u003c/div>\n  \u003cspan class=\"klabel paper\" aria-hidden=\"true\">${label ? `\u003csmall>${label}\u003c/small>` : \"\"}${esc(action)}\u003c/span>\n  ${total ? `\u003cspan class=\"counter\" id=\"counter\" aria-hidden=\"true\">\u003cspan>0\u003c/span>\u003cem>of\u003c/em>\u003cspan>${total}\u003c/span>\u003cem>${what}\u003c/em>\u003c/span>` : \"\"}\u003c/div>`;\n/* Under every lock: one plain sentence on how to work it, then the result of the last try (#msg; it is also\n   sent to the live region by setMsg). */\nconst mech = (inner, room) => `\u003cdiv class=\"mech\">${room.type === \"matching\" ? \"\" : `\u003ch3 class=\"sr\">The lock\u003c/h3>`}${inner}\u003cp class=\"how\" id=\"how\">${esc(ER.a11yHow(room))}\u003c/p>\u003cp class=\"msg\" id=\"msg\">\u003c/p>${hintBlock(room)}\u003c/div>`;\n\n/* The combination padlock: one dial per character. Each dial is a flat window with a strip of characters\n   that slides up or down a notch. #answer is a real text field kept in step with the dials, so typing\n   the code (or a screen reader, or a test) works exactly like turning them. */\nconst LETTERS = \"ABCDEFGHIJKLMNOPQRSTUVWXYZ\", DIGITS = \"0123456789\";\nfunction dialSymbols(answer){\n  let a = /^[0-9]+$/.test(answer) ? DIGITS : /^[A-Z]+$/.test(answer) ? LETTERS : LETTERS + DIGITS;\n  for (const ch of answer) if (!a.includes(ch)) a += ch;\n  return [\"\", ...a];\n}\nfunction dialLock(r, m){\n  const n = Array.from(m.answer).length, sym = dialSymbols(m.answer);\n  /* Reading and Tab order follow how the lock is worked: the dials, the box to type the code, then the shackle\n     that tries it. The shackle is drawn above the body with CSS (order:-1). */\n  return `\u003cdiv class=\"lock dlock\" style=\"--n:${n}\">\n    \u003cdiv class=\"lbody\">\u003ch3 class=\"lname\" id=\"lname\">${lockText(r.lockLabel) || \"Lock\"}\u003c/h3>\n      \u003cdiv class=\"dials\" role=\"group\" aria-labelledby=\"lname\" aria-describedby=\"how\">${Array.from({ length: n }, (_, k) => `\u003cdiv class=\"dial\" data-k=\"${k}\" role=\"spinbutton\" tabindex=\"0\" aria-label=\"Dial ${k+1} of ${n}\" aria-valuemin=\"0\" aria-valuemax=\"${sym.length-1}\" aria-valuenow=\"0\" aria-valuetext=\"blank\">\u003cspan class=\"nub\" data-d=\"1\" aria-hidden=\"true\">${ICON.up}\u003c/span>\u003cspan class=\"dwin\">\u003cspan class=\"strip\" aria-hidden=\"true\">\u003ci>\u003c/i>\u003ci>\u003c/i>\u003ci>\u003c/i>\u003c/span>\u003c/span>\u003cspan class=\"nub\" data-d=\"-1\" aria-hidden=\"true\">${ICON.down}\u003c/span>\u003c/div>`).join(\"\")}\u003c/div>\n      \u003cspan class=\"pull\" aria-hidden=\"true\">Pull the shackle to try\u003c/span>\u003c/div>\n    \u003clabel class=\"tag paper\">\u003cspan>Type the whole code instead\u003c/span>\u003cinput id=\"answer\" type=\"text\" maxlength=\"${n}\" ${m.numbers?'inputmode=\"numeric\"':\"\"} autocomplete=\"off\" autocapitalize=\"characters\" spellcheck=\"false\" aria-describedby=\"how\">\u003c/label>\n    \u003cbutton type=\"button\" id=\"try\" class=\"shackle\" title=\"Pull the shackle to try the lock\">${SHACKLE}\u003cspan class=\"sr\">Pull the shackle\u003c/span>\u003c/button>\u003c/div>`;\n}\nfunction wireDials(m, onTry){\n  const sym = dialSymbols(m.answer), L = sym.length, dials = [...stage.querySelectorAll(\".dial\")], inp = $(\"#answer\"), pos = dials.map(() => 0);\n  const face = v => sym[((v % L) + L) % L] || \"-\", abc = L === 27 && /^[A-Z]+$/.test(m.answer);\n  const live = () => !inp.disabled;\n  function paint(k, dir){\n    const d = dials[k], c = d.querySelectorAll(\".strip i\");\n    c[0].textContent = face(pos[k]-1); c[1].textContent = face(pos[k]); c[2].textContent = face(pos[k]+1);\n    d.setAttribute(\"aria-valuenow\", pos[k]); d.setAttribute(\"aria-valuetext\", !sym[pos[k]] ? \"blank\" : abc ? `${sym[pos[k]]}, ${pos[k]} of 26` : sym[pos[k]]);   // \"E, 5 of 26\" on a letter dial; just \"9\" on a number dial\n    const s = d.querySelector(\".strip\");\n    if (dir && !calm() && s.animate) s.animate([{ transform: `translateY(${-33.333 + dir*33.333}%)` }, { transform: `translateY(${-33.333 - dir*4}%)`, offset: .68 }, { transform: \"translateY(-33.333%)\" }], { duration: 160, easing: \"ease-out\" });\n  }\n  const sync = () => { inp.value = pos.map(v => sym[v]).join(\"\"); };\n  const step = (k, dir) => { if (!live()) return; pos[k] = (((pos[k] + dir) % L) + L) % L; paint(k, dir); sync(); SND.play(\"tick\"); };\n  const put = (k, i) => { if (!live()) return; const dir = i === pos[k] ? 0 : (i > pos[k] ? 1 : -1); pos[k] = i; paint(k, dir); sync(); SND.play(\"tick\"); };\n  dials.forEach((d, k) => {\n    paint(k, 0);\n    d.addEventListener(\"keydown\", e => {\n      if (e.ctrlKey || e.metaKey || e.altKey) return; const key = e.key; let used = true;\n      if (key === \"ArrowUp\") step(k, 1); else if (key === \"ArrowDown\") step(k, -1);\n      else if (key === \"ArrowLeft\") dials[k-1]?.focus(); else if (key === \"ArrowRight\") dials[k+1]?.focus();\n      else if (key === \"Home\") put(k, 0); else if (key === \"Delete\") put(k, 0);\n      else if (key === \"Backspace\") { put(k, 0); dials[k-1]?.focus(); }\n      else if (key === \"Enter\") onTry();\n      else if (key.length === 1 && key !== \" \") { const i = sym.indexOf(key.toUpperCase()); if (i > 0) { put(k, i); if (dials[k+1]) { say(`Dial ${k+1}: ${sym[i]}`); dials[k+1].focus(); } } else used = false; }\n      else used = false;\n      if (used) e.preventDefault();\n    });\n    let acc = 0;\n    d.addEventListener(\"wheel\", e => { e.preventDefault(); acc += e.deltaY; if (Math.abs(acc) >= 40) { step(k, acc > 0 ? 1 : -1); acc = 0; } }, { passive: false });\n    /* Pointer: the arrows and a tap on the window act on release (a click can be cancelled by sliding away);\n       dragging the window up or down turns it, and every drag has the arrows as its one-tap alternative. */\n    d.addEventListener(\"click\", e => { const nub = e.target.closest(\".nub\"); if (nub && live()) step(k, +nub.dataset.d); });\n    d.addEventListener(\"pointerdown\", e => {\n      if (!live() || (e.button != null && e.button > 0)) return;\n      d.focus(); if (e.target.closest(\".nub\")) return;\n      e.preventDefault();\n      let y = e.clientY, moved = false;\n      const mv = ev => { let dy = y - ev.clientY; while (Math.abs(dy) >= 18) { const s = dy > 0 ? 1 : -1; step(k, s); y -= s*18; dy = y - ev.clientY; moved = true; } };\n      const end = () => { d.removeEventListener(\"pointermove\", mv); d.removeEventListener(\"pointerup\", up); d.removeEventListener(\"pointercancel\", end); };\n      const up = () => { end(); if (!moved) step(k, 1); };\n      try { d.setPointerCapture(e.pointerId); } catch(err){}\n      d.addEventListener(\"pointermove\", mv); d.addEventListener(\"pointerup\", up); d.addEventListener(\"pointercancel\", end);\n    });\n  });\n  inp.addEventListener(\"input\", () => {\n    const chars = Array.from(inp.value.replace(/\\s+/g, \"\").toUpperCase());\n    dials.forEach((d, k) => { const i = Math.max(0, sym.indexOf(chars[k] || \"\")); const dir = i === pos[k] ? 0 : 1; pos[k] = i; paint(k, dir); });\n    SND.play(\"key\");\n  });\n  inp.addEventListener(\"keydown\", e => { if (e.key === \"Enter\") onTry(); });\n}\n\n/* ===================== Moving between screens ===================== */\n/* With motion on, the lantern dims, the screen changes in the dark, and two door leaves part to show the\n   next room as it rises into the light (all 2D: onst open = (el, s) => el.animate([{ transform: \"scaleX(1) skewY(0deg)\", opacity: 1 }, { transform: `scaleX(.55) skewY(${s*5}deg)`, opacity: 1, offset: .55 }, { transform: `scaleX(0) skewY(${s*9}deg)`, opacity: .7 }], { duration: 760, delay: 60, easing: \"cubic-bezier(.5,0,.3,1)\", fill: \"both\" });\n    fx.push(open(l, -1), open(r, 1));\n    fx.push(stage.animate([{ opacity: 0, transform: \"translateY(1.6rem) scale(.965)\" }, { opacity: 1, transform: \"translateY(-.15rem) scale(1.004)\", offset: .8 }, { opacity: 1, transform: \"none\" }], { duration: 760, delay: 180, easing: \"cubic-bezier(.2,.7,.3,1)\", fill: \"backwards\" }));\n    setTimeout(() => { if (S.room === n) { doors.style.display = \"\"; } }, 900);\n  }, 150);\n}\n\nconst roomHead = (r, n) => `\u003cdiv class=\"head\">\u003ch2 class=\"bplate\" tabindex=\"-1\">\u003cspan class=\"rn\">Room ${n}\u003c/span>\u003cspan class=\"sep\"> · \u003c/span>\u003cspan class=\"ttl\">${esc(r.title||\"\")}\u003c/span>\u003c/h2>${storyBtn(r.story, r.reference)}\u003cbutton type=\"button\" class=\"desc\" id=\"describe\" aria-haspopup=\"dialog\">${ICON.list}\u003cspan>Describe this room\u003c/span>\u003c/button>\u003c/div>`;\nfunction storyBtn(story, reference){\n  if (!String(story||\"\").trim() && !String(reference||\"\").trim()) return \"\";\n  const full = paras(story) + (reference ? `\u003cp class=\"ref\">${fmt(deco(reference))}\u003c/p>` : \"\");\n  return `\u003cdiv class=\"story\">\u003cdiv class=\"clip\">${inline(story || reference)}\u003c/div>\u003cbutton type=\"button\" class=\"go\" ${ex(full, { label: \"The note\" })}>Pick up the note to read it\u003c/button>\u003c/div>`;\n}\n/* \"Describe this room\": everything in the room as plain text in reading order (the note, each object with its\n   code, the clues, the lock and how to work it). It is built from the content by ER.a11yDescribe, plus where\n   the cards and stamps are right now. */\nlet roomState = null;\nfunction describeHtml(r, n){\n  const part = p => `\u003ch3>${fmt(p.h)}\u003c/h3>${(p.text || []).map(t => `\u003cp>${fmt(t)}\u003c/p>`).join(\"\")}${p.list ? `\u003c${p.ordered ? \"ol\" : \"ul\"}>${p.list.map(x => `\u003cli>${fmt(x)}\u003c/li>`).join(\"\")}\u003c/${p.ordered ? \"ol\" : \"ul\"}>` : \"\"}`;\n  return `\u003ch2>Room ${n} of ${ROOMS.length}: ${esc(r.title || \"\")}\u003c/h2>` + ER.a11yDescribe(r, roomState ? roomState() : {}).map(part).join(\"\");\n}\n\n/* ===================== Screens ===================== */\nfunction intro(){\n  root.dataset.screen = \"title\"; delete root.dataset.type;\n  const n = ROOMS.length, sc = CFG.scoring || {}, title = CFG.meta?.title || \"Escape Room\";\n  const wp = Math.max(0, +sc.wrongPenalty || 0), hp = Math.max(0, +sc.hintPenalty || 0);   // numbers only: these go into the page as they are\n  const rules = [\n    `Solve the puzzle in each room to open its lock. There ${n===1?\"is 1 room\":`are ${n} rooms`}.`,\n    `Wrong answers ${sc.mode===\"deductions\" && wp ? `cost ${wp} points each, so think before you try` : \"cost nothing, so keep trying\"}.`,\n    ROOMS.some(r => roomHints(r).length) ? `Stuck? Some rooms have a hint drawer that unlocks after a wrong try. ${sc.mode===\"deductions\" && hp ? `Each hint costs ${hp} points.` : \"Hints are counted, but they don't affect your grade.\"}` : \"\",\n    `At the end you'll get a \u003cstrong>certificate\u003c/strong>${CFG.finish?.exitPassword ? \" with the exit password\" : \"\"}.`,\n    \"Take your time: there is no time limit. Select any paper to read it up close. The Notebook button (the pocket watch) opens your notebook, where you can change sound, motion, contrast and text.\"\n  ].filter(Boolean);\n  const rulesHtml = `\u003ch2>House rules\u003c/h2>\u003cul>${rules.map(x => `\u003cli>${x}\u003c/li>`).join(\"\")}\u003c/ul>${CFG.meta?.learningOutcome ? `\u003cp class=\"ref\">Learning outcome: ${fmt(CFG.meta.learningOutcome)}\u003c/p>` : \"\"}`;\n  stage.innerHTML = `\n  \u003cdiv class=\"doorway\" aria-hidden=\"true\">\u003cdiv class=\"leafs\">\u003cdiv class=\"fan\">\u003c/div>\u003cdiv class=\"leaf\">\u003c/div>\u003cdiv class=\"leaf\">\u003c/div>\u003c/div>\u003cspan class=\"dknob\">\u003c/span>\u003c/div>\n  \u003cdiv class=\"head\">\n    \u003cp class=\"placard\">\u003cspan aria-hidden=\"true\">${esc(title)}\u003c/span>${CFG.meta?.course ? `\u003csmall>${esc(CFG.meta.course)}\u003c/small>` : \"\"}\u003c/p>\n    \u003ch2 class=\"said\" tabindex=\"-1\">${esc(CFG.intro?.heading || title)}\u003c/h2>\n    ${storyBtn(CFG.intro?.story)}\n  \u003c/div>\n  \u003cdiv class=\"obj\">\u003cdiv class=\"titlerow deskrow\">\n    \u003cdiv class=\"ledger\">\u003clabel for=\"pname\">Sign the guest ledger \u003cspan class=\"opt\">(your name, for the certificate)\u003c/span>\u003c/label>\n      \u003cdiv class=\"row\">\u003cspan aria-hidden=\"true\">Name\u003c/span>\u003cinput id=\"pname\" name=\"name\" type=\"text\" value=\"${esc(SCORM.name())}\" autocomplete=\"name\" maxlength=\"80\">\u003c/div>\n      \u003cp class=\"old\" aria-hidden=\"true\">~~ ~~~~ ~~~~~~ &nbsp; ~~~ ~~~~~~~ ~~ &nbsp; ~~~~~ ~~~\u003c/p>\u003c/div>\n    \u003cdiv class=\"rules paper\">\u003cspan class=\"pin\" aria-hidden=\"true\">\u003c/span>\u003cbutton type=\"button\" class=\"rb\" ${ex(rulesHtml, { label: \"House rules\" })}>House rules\u003c/button>\u003cspan>${rules[0]} ${rules[1]}\u003c/span>\u003c/div>\n    ${svg(\"0 0 40 60\", `\u003cpath d=\"M30 2C22 14 17 26 15.500 41l2 .500C21 28 26 16 33 4z\" fill=\"#d9cdb2\" stroke=\"#6b5a40\" stroke-width=\".7\"/>\u003cpath d=\"M16.500 41 31 4\" stroke=\"#6b5a40\" stroke-width=\".6\"/>\u003cpath d=\"M8 44h16v3l2 3v8H6v-8l2-3z\" fill=\"#1b2430\" stroke=\"#0b0f14\"/>\u003cpath d=\"M8 44h16v2.500H8z\" fill=\"#3d4a58\"/>\u003cpath d=\"M9 51v5\" stroke=\"#8fa3b5\" stroke-width=\"1.200\" stroke-linecap=\"round\" opacity=\".7\"/>`, 'class=\"ink\"')}\n  \u003c/div>\u003c/div>\n  \u003cbutton type=\"button\" id=\"begin\" class=\"pushplate\">Begin\u003csmall>push to enter\u003c/small>\u003c/button>`;\n  const begin = () => { S.player = ($(\"#pname\").value||\"\").trim() || \"Student\"; startTimer(); SND.play(\"press\"); go(1); };\n  $(\"#begin\").onclick = begin;\n  $(\"#pname\").onkeydown = e => { if (e.key === \"Enter\") begin(); };\n  $(\"#pname\").oninput = () => SND.play(\"key\");\n}\n\nfunction room(n){\n  const r = ROOMS[n-1];\n  root.dataset.screen = \"room\"; root.dataset.type = r.type;\n  const TYPES = { matching, quiz, ordering, sorting, reflection };\n  (Object.prototype.hasOwnProperty.call(TYPES, r.type) ? TYPES[r.type] : unknown)(r, n);\n  wireHints(r);\n  const desc = $(\"#describe\"); if (desc) desc.onclick = () => examine(describeHtml(r, n), { from: desc, label: \"Room description\", cls: \"about\" });\n}\nfunction unknown(r, n){ stage.innerHTML = roomHead(r,n) + `\u003cdiv class=\"obj\">\u003cp class=\"note\">This room type isn't supported.\u003c/p>\u003cp>\u003cbutton type=\"button\" class=\"pushplate small\" onclick=\"go(${n+1})\">Skip\u003c/button>\u003c/p>\u003c/div>`; }\n\n/* ---- Matching: objects with codes, numbered clues, turn the dials to the code ----\n   room.look chooses how the objects are drawn: \"cards\" (a catalogue drawer, the default), \"books\" or\n   \"portraits\". It changes the picture only. The term and its code are real text in every look, so screen\n   readers get \"Code L: Essentialism\". Every object and clue opens large in the examine view. */\nconst BOOK_COLORS = [\"#5a1d16\", \"#1f3a2b\", \"#27324a\", \"#4a3015\", \"#43203d\", \"#5c4a1c\"];\nconst PAINT = [\"#4a3a2a\", \"#2f3f3a\", \"#4a2f2a\", \"#34364a\"];\nconst objCard = (c, code) => `\u003cspan class=\"big\" aria-hidden=\"true\">${esc(code)}\u003c/span>\u003ch2>${fmt(c.term)}\u003c/h2>${c.detail ? `\u003cp class=\"sub\">${fmt(c.detail)}\u003c/p>` : \"\"}\u003cp class=\"sub\">Code ${esc(code)}\u003c/p>`;\nconst LOOK = {\n  cards: (m) => `\u003cdiv class=\"drawer\">\u003cul class=\"grid\" role=\"list\">${m.display.map((c,i)=>`\u003cli>\u003cbutton type=\"button\" class=\"mcard paper\" ${ex(objCard(c, m.code[c.k]), { label: plain(c.term) })}>\u003cspan class=\"badge\">\u003cspan class=\"sr\">Code \u003c/span>${esc(m.code[c.k])}\u003cspan class=\"sr\">: \u003c/span>\u003c/span>\n      \u003cstrong>${fmt(c.term)}\u003c/strong>${c.detail?`\u003cspan class=\"small\"> ${fmt(c.detail)}\u003c/span>`:\"\"}\u003c/button>\u003c/li>`).join(\"\")}\u003c/ul>\u003c/div>`,\n  /* Books lie in short piles with their spines facing out, so every title reads left to right (no sideways text). */\n  books: (m) => `\u003cul class=\"shelf\" role=\"list\">${m.display.map((c,i)=>{\n      const t = plain(c.term), h = ER.hash(t);\n      return `\u003cli style=\"--w:${84 + (h % 5) * 4}%;--x:${(h >> 4) % 3}\">\u003cbutton type=\"button\" class=\"vol\" style=\"--c:${BOOK_COLORS[i % BOOK_COLORS.length]}\" ${ex(objCard(c, m.code[c.k]), { label: t })}>\n      \u003cspan class=\"band\" aria-hidden=\"true\">\u003c/span>\n      \u003cspan class=\"letter\">\u003cspan class=\"sr\">Code \u003c/span>\u003cb>${esc(m.code[c.k])}\u003c/b>\u003cspan class=\"sr\">: \u003c/span>\u003c/span>\n      \u003cspan class=\"title\">${fmt(c.term)}${c.detail?` \u003csmall>${fmt(c.detail)}\u003c/small>`:\"\"}\u003c/span>\n      \u003cspan class=\"band\" aria-hidden=\"true\">\u003c/span>\u003c/button>\u003c/li>`; }).join(\"\")}\u003c/ul>`,\n  portraits: (m) => `\u003cul class=\"gallery\" role=\"list\" style=\"--cols:${m.display.length \u003c= 8 ? Math.max(4, m.display.length) : Math.ceil(m.display.length/2)};--colst:${m.display.length \u003c= 3 ? 3 : 4}\">${m.display.map((c,i)=>`\u003cli class=\"portrait\">\u003cbutton type=\"button\" ${ex(objCard(c, m.code[c.k]), { label: plain(c.term) })}>\n      \u003cspan class=\"gilt\" aria-hidden=\"true\">\u003cspan class=\"sitter\" style=\"--pc:${PAINT[ER.hash(plain(c.term)) % PAINT.length]}\">${bust(plain(c.term))}${c.icon?`\u003cspan class=\"ico\">${esc(c.icon)}\u003c/span>`:\"\"}\u003ci>${esc(ER.initials(c.term))}\u003c/i>\u003c/span>\u003c/span>\n      \u003cspan class=\"pname\">\u003cstrong>${fmt(c.term)}\u003c/strong>${c.detail?` \u003cspan class=\"yrs\">${fmt(c.detail)}\u003c/span>`:\"\"}\n      \u003cspan class=\"plate\">\u003cspan class=\"sr\"> Code \u003c/span>${m.numbers?`\u003csmall aria-hidden=\"true\">No.\u003c/small>`:\"\"}\u003cb>${esc(m.code[c.k])}\u003c/b>\u003c/span>\u003c/span>\u003c/button>\u003c/li>`).join(\"\")}\u003c/ul>`\n};\nfunction matching(r, n){\n  const m = ER.matching(r), look = ER.look(r), cn = m.answerCards.length;\n  const clueName = i => m.numbers ? String.fromCharCode(65 + i) : String(i + 1);\n  const things = look === \"books\" ? \"Books on the shelf\" : look === \"portraits\" ? \"Portraits on the wall\" : \"Cards in the drawer\";\n  stage.innerHTML = roomHead(r,n) + `\u003cdiv class=\"obj\">\u003ch3 class=\"sr\">${things}\u003c/h3>${LOOK[look](m)}\n    \u003ch3 class=\"cap\">${esc(r.cluesHeading || \"Clues\")}\u003c/h3>\n    \u003col class=\"clues\" role=\"list\" style=\"--per:${cn > 6 ? Math.ceil(cn/2) : Math.max(cn, 3)}\">${m.answerCards.map((c,i)=>`\u003cli style=\"--r:${(rot(i)*2.2).toFixed(2)}deg;--y:${((i*53)%5-2)*.14}rem\">\u003cdiv class=\"icard paper ruled\">\u003cspan class=\"pin\" aria-hidden=\"true\">\u003c/span>\u003cbutton type=\"button\" class=\"no\" ${ex(`\u003ch2>Clue ${clueName(i)}\u003c/h2>\u003cp>${fmt(c.clue)}\u003c/p>`, { cls: \"ruled\", label: \"Clue \" + clueName(i) })}>Clue ${clueName(i)}\u003c/button>\u003cspan class=\"p\">${fmt(c.clue)}\u003c/span>\u003c/div>\u003c/li>`).join(\"\")}\u003c/ol>\u003c/div>`\n    + mech(dialLock(r, m), r);\n  const check = () => {\n    const typed = $(\"#answer\").value.replace(/\\s+/g,\"\").toUpperCase();\n    if (!typed) return notYet(\"Type the code first.\");\n    if (typed === m.answer) pass(r.successMessage || \"The lock opens!\");\n    else fail(r.failMessage || \"The lock won't budge. Check each clue again.\");\n  };\n  $(\"#try\").onclick = check; wireDials(m, check);\n}\n\n/* ---- Quiz: question slips on the strongbox; typed answers and levers; all must be right ---- */\nfunction quiz(r, n){\n  const qs = r.questions || [];\n  stage.innerHTML = roomHead(r,n) + `\u003cdiv class=\"obj\">\u003cform id=\"qf\" novalidate>${qs.map((q,i)=>`\n    \u003cfieldset class=\"slip paper\" style=\"--r:${(rot(i)*.4).toFixed(2)}deg\">\u003cspan class=\"qn\" aria-hidden=\"true\">${i+1}\u003c/span>\u003clegend>\u003cspan class=\"sr\">${i+1}. \u003c/span>${fmt(q.prompt)}\u003c/legend>${\n      q.kind===\"choice\"\n        ? (q.choices||[]).map((c,j)=>String(c).trim()?`\u003clabel class=\"lever\">\u003cinput type=\"radio\" name=\"q${i}\" value=\"${j}\">\u003cspan class=\"lev\" aria-hidden=\"true\">\u003c/span>\u003cspan class=\"lt\">${fmt(c)}\u003c/span>\u003c/label>`:\"\").join(\"\")\n        : `\u003cspan class=\"typer\">\u003cinput type=\"text\" name=\"q${i}\" aria-label=\"Answer to question ${i+1}\" autocomplete=\"off\" spellcheck=\"false\">\u003c/span>`\n    }\u003c/fieldset>`).join(\"\")}\u003c/form>\u003c/div>`\n    + mech(`\u003cdiv class=\"sbox\">\u003cspan class=\"rivets\" aria-hidden=\"true\">\u003ci>\u003c/i>\u003ci>\u003c/i>\u003ci>\u003c/i>\u003ci>\u003c/i>\u003c/span>${keyLock(lockText(r.lockLabel) || \"Strongbox\", \"Check answers\", { form: \"qf\", total: qs.length })}\u003c/div>`, r);\n  wireInputs($(\"#qf\"));\n  $(\"#qf\").onsubmit = e => {\n    e.preventDefault();\n    const blank = qs.some((q,i) => q.kind===\"choice\" ? !document.querySelector(`input[name=q${i}]:checked`) : !ER.norm(document.querySelector(`input[name=q${i}]`).value));\n    if (blank) return notYet(\"Answer every question first.\");\n    let right = 0;\n    qs.forEach((q,i) => {\n      if (q.kind===\"choice\") { const v = document.querySelector(`input[name=q${i}]:checked`); if (v && +v.value === q.correct) right++; }\n      else { const v = ER.norm(document.querySelector(`input[name=q${i}]`).value); if (v && ER.accepted(q.answers).includes(v)) right++; }\n    });\n    if (right === qs.length) pass(r.successMessage || \"Every answer is right. The lock opens!\", right);\n    else fail(`${right} of ${qs.length} answers are correct.`, right);\n  };\n}\n/* Typewriter keys and lever throws: sound, and a one-notch carriage nudge on the typed line. */\nfunction wireInputs(form){\n  form.addEventListener(\"input\", e => { if (e.target.type !== \"text\") return; SND.play(\"key\");\n    const t = e.target.closest(\".typer\"); if (t && !calm() && t.animate) t.animate([{ transform: \"translateX(-2px)\" }, { transform: \"none\" }], { duration: 70 }); });\n  form.addEventListener(\"change\", e => { if (e.target.type === \"radio\") SND.play(\"clack\"); });\n  stage.querySelectorAll(\".klabel\").forEach(k => { k.style.pointerEvents = \"auto\"; k.style.cursor = \"pointer\"; k.onclick = () => $(\"#try\").click(); });\n}\n\n/* ---- Ordering: cards pinned along a string; move them with the studs or by dragging the number ---- */\nfunction ordering(r, n){\n  const items = r.items || [];\n  let order = ER.scramble(items.length, (r.title||\"\") + items.map(i=>i.text).join(\"|\"));\n  stage.innerHTML = roomHead(r,n) + `\u003cdiv class=\"obj\">\u003cdiv class=\"board\">\u003col id=\"order\" role=\"list\">${order.map((idx,i)=>`\u003cli class=\"paper\" data-idx=\"${idx}\" style=\"--r:${(rot(idx)*.45).toFixed(2)}deg\">\u003cspan class=\"grip\" title=\"Drag to move\" aria-hidden=\"true\">\u003cspan class=\"pos\">\u003c/span>\u003c/span>\u003cspan class=\"sr pn\">\u003c/span>\u003cspan class=\"t\" id=\"ot${idx}\">${fmt(items[idx].text)}\u003c/span>\n      \u003cbutton type=\"button\" class=\"stud\" aria-label=\"Move up\" data-d=\"-1\">${ICON.up}\u003c/button>\u003cbutton type=\"button\" class=\"stud\" aria-label=\"Move down\" data-d=\"1\">${ICON.down}\u003c/button>\u003c/li>`).join(\"\")}\u003c/ol>\u003c/div>\u003c/div>`\n    + mech(keyLock(lockText(r.lockLabel) || \"Order lock\", \"Check order\", { total: items.length, what: \"in place\" }), r);\n  roomState = () => ({ order });\n  const ol = $(\"#order\"); wireInputs(ol);\n  /* Each stud's name says which card it moves and where that card is now: \"Move up: Rousseau publishes Émile (now 3rd of 7)\". */\n  const nth = i => i + (i % 100 >= 11 && i % 100 \u003c= 13 ? \"th\" : [\"th\",\"st\",\"nd\",\"rd\"][i % 10] || \"th\");\n  const renum = () => { const k = [...ol.children]; k.forEach((li,i) => { li.querySelector(\".pos\").textContent = i+1; li.querySelector(\".pn\").textContent = `Position ${i+1} of ${k.length}: `;\n    const u = li.querySelector(\"[data-d='-1']\"), d = li.querySelector(\"[data-d='1']\"), what = `${li.querySelector(\".t\").textContent.trim()} (now ${nth(i+1)} of ${k.length})`;\n    if (u) { u.disabled = i===0; d.disabled = i===k.length-1; u.setAttribute(\"aria-label\", \"Move up: \" + what); d.setAttribute(\"aria-label\", \"Move down: \" + what); } }); order = k.map(li => +li.dataset.idx); };\n  const told = li => say(`Moved to position ${[...ol.children].indexOf(li)+1} of ${ol.children.length}: ${li.querySelector(\".t\").textContent}`);\n  // li itself never moves in the DOM (its neighbour does), so keyboard focus and a drag in progress survive.\n  const move = (li, d, quiet) => {\n    const sib = d \u003c 0 ? li.previousElementSibling : li.nextElementSibling; if (!sib) return false;\n    const a = li.getBoundingClientRect().top, b = sib.getBoundingClientRect().top;\n    if (d \u003c 0) ol.insertBefore(sib, li.nextSibling); else ol.insertBefore(sib, li);\n    renum(); SND.play(\"rustle\");\n    if (!calm() && li.animate) { const slide = (el, from) => el.animate([{ transform: `translateY(${from - el.getBoundingClientRect().top}px)` }, { transform: \"translateY(0)\" }], { duration: 190, easing: \"cubic-bezier(.3,1.4,.5,1)\" }); slide(sib, b); if (!quiet) slide(li, a); }\n    return true;\n  };\n  renum();\n  ol.addEventListener(\"click\", e => {\n    const b = e.target.closest(\"button[data-d]\"); if (!b || b.disabled) return;\n    const li = b.closest(\"li\"); if (move(li, +b.dataset.d)) told(li);\n    if (b.disabled) (li.querySelector(\"button[data-d]:not(:disabled)\") || stage).focus();\n  });\n  ol.addEventListener(\"pointerdown\", e => {\n    const g = e.target.closest(\".grip\"); if (!g || (e.button != null && e.button > 0)) return;\n    const li = g.closest(\"li\"); e.preventDefault(); li.classList.add(\"drag\");\n    const mid = el => { const q = el.getBoundingClientRect(); return q.top + q.height/2; };\n    const mv = ev => { let guard = 0; while (guard++ \u003c 20) { const p = li.previousElementSibling, x = li.nextElementSibling;\n      if (p && ev.clientY \u003c mid(p)) move(li, -1, true); else if (x && ev.clientY > mid(x)) move(li, 1, true); else break; } };\n    const up = () => { li.classList.remove(\"drag\"); told(li); g.removeEventListener(\"pointermove\", mv); g.removeEventListener(\"pointerup\", up); g.removeEventListener(\"pointercancel\", up); };\n    try { g.setPointerCapture(e.pointerId); } catch(err){}\n    g.addEventListener(\"pointermove\", mv); g.addEventListener(\"pointerup\", up); g.addEventListener(\"pointercancel\", up);\n  });\n  $(\"#try\").onclick = () => {\n    const right = order.filter((v,i)=>v===i).length;\n    if (right !== order.length) return fail(`${right} of ${order.length} are in the correct position.`, right);\n    [...ol.children].forEach((li, i) => {              // solved: the studs come off and each date is stamped on in red ink\n      li.querySelectorAll(\".stud\").forEach(b => b.remove()); li.querySelector(\".grip\").removeAttribute(\"title\");\n      const lab = items[+li.dataset.idx].label; if (!lab) return;\n      li.insertAdjacentHTML(\"beforeend\", `\u003cstrong class=\"when\">${fmt(lab)}\u003c/strong>`);\n      const w = li.lastElementChild;\n      if (!calm() && w.animate) { w.animate([{ transform: \"rotate(-5deg) scale(2.2)\", opacity: 0 }, { transform: \"rotate(-5deg) scale(.9)\", opacity: 1, offset: .7 }, { transform: \"rotate(-5deg) scale(1)\", opacity: .9 }], s the new question (the group's legend) with the option\n  };\n  paint();\n  form.addEventListener(\"change\", e => { if (e.target.type === \"radio\") { SND.play(\"clack\"); paint(); } });\n  form.querySelector(\".qnav\")?.addEventListener(\"click\", e => { const b = e.target.closest(\"button\"); if (b && b.dataset.go != null) show(+b.dataset.go, true); });\n  form.onsubmit = e => {\n    e.preventDefault();\n    if (qs.length && !answered(cur)) return notYet(\"Choose an answer first.\");\n    if (cur \u003c qs.length-1) return show(cur+1, true);\n    const miss = qs.findIndex((_,i) => !answered(i));\n    if (miss >= 0) { show(miss, true); return notYet(`Question ${miss+1} still needs an answer.`); }\n    const tally = {}; qs.forEach((q,qi)=>{ const v=form.querySelector(`input[name=q${qi}]:checked`); if (v) tally[v.value]=(tally[v.value]||0)+1; });\n    const ranked = Object.entries(tally).sort((a,b)=>b[1]-a[1]);\n    const prof = k => (r.profiles||[]).find(p=>p.key===k);\n    S.reflection = { room:r, first: ranked[0] && prof(ranked[0][0]), second: ranked[1] && prof(ranked[1][0]) };\n\n    pass(r.successMessage || \"Done!\");\n  };\n}\n\n\n/* ---- Finish ---- */\nfunction score(){\n  const sc = CFG.scoring || {};\n  if (sc.mode !== \"deductions\") return 100;\n  return Math.max(+sc.minScore||0, Math.min(100, 100 - S.hints*(+sc.hintPenalty||0) - S.wrong*(+sc.wrongPenalty||0)));\n}\nfunction finish(){\n  if (!S.end) S.end = Date.now();\n  clearInterval(tick); drawClock();\n  root.dataset.screen = \"end\"; delete root.dataset.type;\n  const secs = elapsed(), pts = score();\n  const prefix = String(CFG.meta?.codePrefix || \"ESC\").replace(/[^A-Za-z0-9]/g,\"\").toUpperCase() || \"ESC\";\n  const code = `${prefix}-${S.hints}${Math.min(S.wrong,9)}-${((secs*7919)+S.hints*31+S.wrong*17)%9000+1000}`;\n  SCORM.complete(pts, secs);\n  const f = CFG.finish || {}, R = S.reflection;\n  const resultHead = R && R.first ? `${esc(R.room.resultHeading || \"Your result\")}: ${esc(R.first 03c/div>\n    \u003c/div>\n    \u003cdiv class=\"side\">\n      ${resultHead ? `\u003cdiv class=\"result paper\">\u003cspan class=\"pin\" aria-hidden=\"true\">\u003c/span>\u003cbutton type=\"button\" class=\"h\" ${ex(`\u003ch2>${resultHead}\u003c/h2>${resultBody}`, { label: \"Your result\" })}>${resultHead}\u003c/button>\u003cspan class=\"clip\">${resultBody.replace(/\u003c(\\/?)p\\b/g, (_, s) => `\u003c${s}span${s ? \"\" : ' class=\"p\"'}`)}\u003c/span>\u003c/div>` : \"\"}\n      \u003cdiv class=\"titlerow noprint\" style=\"gap:.7rem\">\u003cbutton type=\"button\" class=\"pushplate small\" id=\"print\">Print / save as PDF\u003c/button>\n        \u003cbutton type=\"button\" class=\"pushplate small\" id=\"again\">Play again\u003c/button>\u003c/div>\n      ${f.instructions ? `\u003cp class=\"note\">${fmt(f.instructions)}\u003c/p>` : \"\"}\n    \u003c/div>\n  \u003c/div>\u003c/div>`;\n  /* Playing again throws away this certificate and its exit password, so the plate asks first, like \"Start over\". */\n  let againArmed = false;\n  $(\"#print\").onclick = () => window.print();\n  $(\"#again\").onclick = () => { if (againArmed) return location.reload(); againArmed = true;\n    const t = \"Play again? Your certificate and exit password will be lost. Press again to start over\";\n    $(\"#again\").textContent = t; say(t + \".\"); };\n  $(\"#again\").onblur = () => { if (!againArmed) return; againArmed = false; $(\"#again\").textContent = \"Play again\"; };\n  celebrate();\n}\n/* The wax seal is pressed into the paper, and one short burst of brass and paper flecks flies from it.\n   Drawn on a canvas that removes itself. */\nlet party = 0;\nfunction celebrate(){\n  clearTimeout(party);\n  if (calm()) return;\n  const seal = stage.querySelector(\".seal\");\n  if (seal && seal.animate) seal.animate([{ transform: \"rotate(-9deg) scale(2.1)\", opacity: 0 }, { transform: \"rotate(-9deg) scale(.9,.86)\", opacity: 1, offset: .72 }, { transform: \"rotate(-9deg) scale(1.04)\", offset: .88 }, { transform: \"rotate(-9deg) scale(1)\" }], { duration: 420, delay: 480, fill: \"backwards\", easing: \"ease-in\" });\n  party = setTimeout(() => {\n    const seal = stage.querySelector(\".seal\"); if (!seal || calm()) return;\n    SND.play(\"thump\");\n    const r = seal.getBoundingClientRect();\n    confetti(r.left + r.width/2, Math.max(60, Math.min(r.top + r.height/2, window.innerHeight * .8)));\n  }, 800);\n}\nfunction confetti(x, y){\n  document.getElementById(\"confetti\")?.remove();\n  const c = document.createElement(\"canvas\"); c.id = \"confetti\"; c.setAttribute(\"aria-hidden\", \"true\");\n  const g = c.getContext && c.getContext(\"2d\"); if (!g) return;\n  const W = window.innerWidth, H = window.innerHeight, dpr = Math.min(2, window.devicePixelRatio || 1);\n  c.width = Math.round(W*dpr); c.height = Math.round(H*dpr); g.scale(dpr, dpr);\n  document.body.append(c);\n  const COLORS = [\"#f1d38a\", \"#b08a3e\", \"#e9dcc0\", \"#8e1b1b\", \"#f6eed8\", \"#d2ae5e\"], LIFE = 1400;\n  const bits = Array.from({ length: 44 }, (_, i) => {\n    const a = -Math.PI/2 + (Math.random() - .5) * 2.6, v = 260 + Math.random() * 560;\n    return { x, y, vx: Math.cos(a)*v, vy: Math.sin(a)*v, r: Math.random()*6.3, vr: (Math.random() - .5)*16, w: 4 + Math.random()*6, h: 3 + Math.random()*4, f: Math.random()*6.3, c: COLORS[i % COLORS.length] };\n  });\n  let raf = 0, last = performance.now(); const t0 = last;\n  const done = () => { cancelAnimationFrame(raf); clearTimeout(kill); c.remove(); };\n  const kill = setTimeout(done, LIFE + 1000);                 // in case frames are throttled (hidden tab or LMS frame)\n  const frame = now => {\n    const dt = Math.min(.034, (now - last)/1000), age = now - t0; last = now;\n    if (age >= LIFE || calm()) return done();\n    g.clearRect(0, 0, W, H); g.globalAlpha = Math.min(1, (LIFE - age)/350);\n    for (const b of bits) {\n      b.vy += 1500*dt; b.vx *= 1 - 1.8*dt; b.vy *= 1 - .8*dt; b.x += b.vx*dt; b.y += b.vy*dt; b.r += b.vr*dt; b.f += 9*dt;\n      g.save(); g.translate(b.x, b.y); g.rotate(b.r); g.scale(1, Math.cos(b.f)); g.fillStyle = b.c; g.fillRect(-b.w/2, -b.h/2, b.w, b.h); g.restore();\n    }\n    raf = requestAnimationFrame(frame);\n  };\n  raf = requestAnimationFrame(frame);\n}\n\n/* ===================== Teacher preview (editor only) ===================== */\n/* The answers for the teacher: a strip in the page flow between the HUD and the room, so it never covers\n   anything. It is a labelled complementary landmark with its own heading, and \"Hide answers\" turns it off\n   (the editor's \"Show answers\" switch follows). */\nfunction teacherKey(){\n  const had = document.getElementById(\"teacher-key\"), back = had && had.contains(document.activeElement); had?.remove();\n  const r = ROOMS[S.room-1];\n  if (!PREVIEW || !S.showKey || !r) return;\n  const hints = roomHints(r);\n  const box = document.createElement(\"aside\"); box.id = \"teacher-key\"; box.setAttribute(\"aria-labelledby\", \"tk-h\");\n  box.innerHTML = `\u003cdiv class=\"tk-top\">\u003ch2 id=\"tk-h\">Answers for room ${S.room} \u003csmall>(only you see this, in the preview)\u003c/small>\u003c/h2>\u003cbutton type=\"button\" id=\"tk-hide\">${ICON.x}\u003cspan>Hide answers\u003c/span>\u003c/button>\u003c/div>`\n    + `\u003cul>${ER.answerKey(r).map(l=>`\u003cli>${fmt(l)}\u003c/li>`).join(\"\")}\u003c/ul>`\n    + (hints.length ? `\u003cp>Hints (students unlock them after wrong tries):\u003c/p>\u003col>${hints.map(h=>`\u003cli>${fmt(h)}\u003c/li>`).join(\"\")}\u003c/ol>` : \"\");\n  $(\"#hud\").after(box);\n  box.querySelector(\"#tk-hide\").onclick = () => { S.showKey = false; teacherKey(); parent.postMessage({ er: \"key\", on: false }, \"*\"); };\n  if (back) box.querySelector(\"#tk-hide\").focus();\n}\nif (PREVIEW) window.addEventListener(\"message\", e => {\n  const d = e.data || {};\n  // The teacher's rail keeps the keyboard: a jump from the rail changes the room without pulling focus into the game.\n  if (d.er === \"goto\") { if (!S.player) S.player = \"Preview Student\"; startTimer(); go(Math.max(0, Math.min(ROOMS.length+1, d.room|0)), { focus: false }); }\n  if (d.er === \"key\") { S.showKey = !!d.on; teacherKey(); }\n});\n\n/* ===================== Choosing the layout (never the text size) ===================== */\n/* Text size belongs to the reader: the root font size is never set from the window, so the browser's own\n   font-size setting and zoom both work, and every size in the game (all in rem) follows them. fit() only\n   picks the layout from how many text-widths fit: wide (objects left, the door and its lock right) or tall\n   (one column: phones held upright, narrow frames, and any window once the text is enlarged). The room is a\n   normal scrolling page inside #view, so nothing is cut off when it doesn't fit. */\nfunction fit(){\n  const em = parseFloat(getComputedStyle(root).fontSize) || 16, w = window.innerWidth / em, h = window.innerHeight / em;\n  const tall = w \u003c 60 || w / h \u003c .82;\n  root.dataset.shape = tall ? \"tall\" : \"wide\";\n  cue();\n}\n/* A small \"more below\" mark shows whenever the room continues past the bottom of the window. It steps aside\n   whenever it would sit on the result of a try or on the control that has focus. */\nfunction cue(){\n  const more = $(\"#more\"); more.hidden = !(view.scrollHeight - view.clientHeight - view.scrollTop > 24);\n  if (more.hidden) return;\n  const c = more.getBoundingClientRect(), msg = $(\"#msg\"), a = document.activeElement;\n  const hits = el => { const r = el.getBoundingClientRect(); return r.width > 0 && r.left \u003c c.right && r.right > c.left && r.top \u003c c.bottom && r.bottom > c.top; };\n  if ((msg && msg.textContent.trim() && hits(msg)) || (a && a !== stage && view.contains(a) && hits(a))) more.hidden = true;\n}\nview.addEventListener(\"scroll\", cue, { passive: true });\n/* Focus is never left out of sight: if the browser didn't scroll a focused control into the window, do it here. */\nview.addEventListener(\"focusin\", e => { const t = e.target, r = t.getBoundingClientRect && t.getBoundingClientRect(); if (!r || t === stage) return;\n  if (r.top \u003c 0 || r.bottom > window.innerHeight) { try { t.scrollIntoView({ block: \"nearest\" }); } catch(err){} } cue(); });\nview.addEventListener(\"focusout\", () => setTimeout(cue, 0));\ntry { new ResizeObserver(cue).observe(stage); } catch(e){}\n$(\"#skip\").onclick = e => { e.preventDefault(); (stage.querySelector(\"h2\") || stage).focus(); };\nwindow.addEventListener(\"resize\", fit);\ntry { document.fonts.ready.then(fit); } catch(e){}\n\n/* Parallax: the wall, window, lamp glow and dust drift a few pixels against each other as the pointer moves. */\nlet pend = false, px = 0, py = 0;\nwindow.addEventListener(\"pointermove\", e => {\n  if (calm() || e.pointerType === \"touch\") return;\n  px = (e.clientX / window.innerWidth) * 2 - 1; py = (e.clientY / window.innerHeight) * 2 - 1;\n  if (!pend) { pend = true; requestAnimationFrame(() => { pend = false; if (calm()) return; [bg, light].forEach(el => { el.style.setProperty(\"--px\", px.toFixed(3)); el.style.setProperty(\"--py\", py.toFixed(3)); }); }); }\n}, { passive: true });\ndocument.addEventListener(\"visibilitychange\", () => { if (document.hidden) root.dataset.away = \"1\"; else delete root.dataset.away; });\nbg.querySelector(\".dust\").innerHTML = Array.from({ length: 14 }, (_, i) => { const q = k => ((ER.hash(\"mote\" + i + k) % 1000) / 1000);\n  return `\u003ci style=\"left:${(38 + q(\"x\")*56).toFixed(1)}%;top:${(22 + q(\"y\")*60).toFixed(1)}%;--d:${(11 + q(\"d\")*12).toFixed(1)}s;--dl:${(-q(\"l\")*20).toFixed(1)}s;--mx:${((q(\"a\") - .5)*8).toFixed(1)}rem;--my:${(-4 - q(\"b\")*9).toFixed(1)}rem\">\u003c/i>`; }).join(\"\");\n\n/* ===================== Start ===================== */\nfunction start(){\n  if (/^[A-Za-z]{2,3}(-[A-Za-z0-9]{1,8})*$/.test(String(CFG.meta?.lang || \"\"))) root.lang = CFG.meta.lang;\n  document.title = CFG.meta?.title || document.title;\n  $(\"#game-title\").textContent = CFG.meta?.title || \"Escape Room\";\n  const review = ER.reviewStatus(CFG);\n  if (review.unverified) {\n    const d = $(\"#draft\"); d.hidden = false;\n    /* The note keeps one name; pressing it unfolds the details in the region it controls, just after it. */\n    d.innerHTML = `\u003cu>Draft\u003c/u>: answers not yet checked by your instructor`;\n    const more = $(\"#draft-more\"); more.textContent = `${review.unverified} of ${review.total} items haven't been checked by the instructor yet. Answers may contain errors.`;\n    d.onclick = () => { const open = d.getAttribute(\"aria-expanded\") !== \"true\"; d.setAttribute(\"aria-expanded\", open); more.hidden = !open; SND.play(\"rustle\"); };\n  }\n  fit(); renderDoors(); go(0);\n}\n/* A class link carries its own escape room in the address (#play=…), which is played instead of the one in this\n   file. Anyone can make a link, so its content is untrusted: ER.fromLink limits its size, keeps only the shapes the\n   game knows (no __preview), and validates it, and every text the game draws is escaped. A broken or cut-off link\n   gets a plain message and a way back, never a half-built room. */\nconst LINK = !PREVIEW && ER.hasLink(location.hash) ? location.hash : \"\";\nfunction linkProblem(err){\n  const words = ER.LINK_WORDS[err && err.kind] || ER.LINK_WORDS.incomplete, cut = words.indexOf(\". \");\n  root.dataset.screen = \"link\"; delete root.dataset.type;\n  document.title = \"The class link didn't open · Escape room\";\n  $(\"#game-title\").textContent = \"Escape room\"; $(\"#doors\").hidden = true;\n  stage.innerHTML = `\u003cdiv class=\"head\">\u003ch2 class=\"bplate\" tabindex=\"-1\">${esc(cut > 0 ? words.slice(0, cut) : words)}\u003c/h2>\u003c/div>\n    \u003cdiv class=\"obj\">\u003cdiv class=\"note paper linknote\" id=\"link-problem\">\u003cp>${esc(cut > 0 ? words.slice(cut + 2) : \"\")}\u003c/p>\n    \u003cp>Teachers share class links in Moodle, Canv const SAMPLE = {"schema":1,"meta":{"title":"Escape the Old Schoolhouse","course":"EDU 216","codePrefix":"EDU216","learningOutcome":"Explore your own personal philosophy of education based on the historical and philosophical foundations of education."},"intro":{"heading":"The Door Clicks Shut Behind You…","story":"You came to the old county schoolhouse, now a museum of education history, to research your Philosophy assignment. You lost track of time in the archives. When you look up, the lights are dim, the caretaker has gone home, and every door is locked.\n\nA note is pinned to the chalkboard: *\"Only someone who understands where our ideas about school came from may leave. Five rooms. Five locks. Good luck, future educator.\"*"},"scoring":{"mode":"completion","hintPenalty":5,"wrongPenalty":2,"minScore":50},"finish":{"exitPassword":"DEWEY1916","certificateLine":"escaped the Old Schoolhouse by mastering the historical and philosophical foundations of education","instructions":"Enter the **exit password** in your course quiz, or submit your completion code or a screenshot of this page, as your instructor directs."},"rooms":[{"type":"matching","title":"The Library","look":"books","codeStyle":"letters","codeWord":"LEARN","story":"Five dusty books glow on the shelf, each with one letter painted on its spine. A librarian's card catalog lists five descriptions, but the titles have been torn off. The lock on the library door takes a **5-letter word**.","cluesHeading":"Card Catalog","lockLabel":"🔒 Library lock","successMessage":"🔓 Click! The library door swings open.","failMessage":"The lock won't budge. Check which philosophy matches each description.","reference":"","cards":[{"term":"Essentialism","detail":"","icon":"","code":"","clue":"All students should master a common core of basic knowledge and skills: the “3 R’s,” history, and science. Teachers are the authorities, and the classroom is orderly and disciplined. (William C. Bagley, E. D. Hirsch Jr.)","source":"","veri const STORE = "escape-room-editor-v1";
const clone = o => JSON.parse(JSON.stringify(o));
/* Several escape rooms live in this browser, so making a second one never overwrites the first.
   LIB lists them ({ current, list: [{ id, title, created, updated }] }); each one's content is under STORE:id and its
   bookkeeping under STORE:id-meta. The single slot used before (STORE, STORE-meta) is moved into the list once. */
const LIB = "escape-room-library-v1";
const lsGet = k => { try { return localStorage.getItem(k); } catch(e){ return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); return true; } catch(e){ return false; } };
const lsDel = k => { try { localStorage.removeItem(k); } catch(e){} };
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const keyOf = (id, m) => `${STORE}:${id}${m ? "-meta" : ""}`;
function readLib(){
  let l = null; try { l = JSON.parse(lsGet(LIB)); } catch(e){}
  if (!l || !Array.isArray(l.list)) l = { current: null, list: [] };
  const old = lsGet(STORE);
  if (old && !l.list.length) {
    const id = newId(); let title = ""; try { title = JSON.parse(old).meta.title; } catch(e){}
    lsSet(keyOf(id), old); const m = lsGet(STORE + "-meta"); if (m) lsSet(keyOf(id, true), m);
    l.list.push({ id, title, created: Date.now(), updated: Date.now() }); l.current = id;
    if (lsSet(LIB, JSON.stringify(l))) { lsDel(STORE); lsDel(STORE + "-meta"); }
  }
  return l;
}
let lib = readLib();
let curId = lib.list.some(e => e.id === lib.current) ? lib.current : null;
const writeLib = () => lsSet(LIB, JSON.stringify(lib));
function load(id = curId){ if (!id) return null; try { return JSON.parse(lsGet(keyOf(id))) || null; } catch(e){ return null; } }
function readMeta(id = curId){ let m = null; try { m = JSON.parse(lsGet(keyOf(id, true))); } catch(e){} return m || { rev: 0, backupRev: 0, backupAt: 0, savedAt: 0 }; }

const tabOf = new Map();          // which index tab is open on each page (keyed by page name or room object)
