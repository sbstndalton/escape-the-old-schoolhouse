= true; show();\n    if (calm()) { doors.style.display = \"\"; return; }\n    const open = (el, s) => el.animate([{ transform: \"scaleX(1) skewY(0deg)\", opacity: 1 }, { transform: `scaleX(.55) skewY(${s*5}deg)`, opacity: 1, offset: .55 }, { transform: `scaleX(0) skewY(${s*9}deg)`, opacity: .7 }], { duration: 760, delay: 60, easing: \"cubic-bezier(.5,0,.3,1)\", fill: \"both\" });\n    fx.push(open(l, -1), open(r, 1));\n    fx.push(stage.animate([{ opacity: 0, transform: \"translateY(1.6rem) scale(.965)\" }, { opacity: 1, transform: \"translateY(-.15rem) scale(1.004)\", offset: .8 }, { opacity: 1, transform: \"none\" }], { duration: 760, delay: 180, easing: \"cubic-bezier(.2,.7,.3,1)\", fill: \"backwards\" }));\n    setTimeout(() => { if (S.room === n) { doors.style.display = \"\"; } }, 900);\n  }, 150);\n}\n\nconst roomHead = (r, n) => `\u003cdiv class=\"head\">\u003ch2 class=\"bplate\">\u003cspan class=\"rn\">Room ${n}\u003c/span>\u003cspan class=\"sep\"> · \u003c/span>\u003cspan class=\"ttl\">${esc(r.title||\"\")}\u003c/span>\u003c/h2>${storyBtn(r.story, r.reference)}\u003c/div>`;\nfunction storyBtn(story, reference){\n  if (!String(story||\"\").trim() && !String(reference||\"\").trim()) return \"\";\n  const full = paras(story) + (reference ? `\u003cp class=\"ref\">${fmt(deco(reference))}\u003c/p>` : \"\");\n  return `\u003cbutton type=\"button\" class=\"story\" ${ex(full, { label: \"The note\" })}>\u003cspan class=\"clip\">${inline(story || reference)}\u003c/span>\u003cspan class=\"go\">Read the note\u003c/span>\u003c/button>`;\n}\n\n/* ===================== Screens ===================== */\nfunction intro(){\n  root.dataset.screen = \"title\"; delete root.dataset.type;\n  const n = ROOMS.length, sc = CFG.scoring || {}, title = CFG.meta?.title || \"Escape Room\";\n  const rules = [\n    `Solve the puzzle in each room to open its lock. There ${n===1?\"is 1 room\":`are ${n} rooms`}.`,\n    `Wrong answers ${sc.mode===\"deductions\" && sc.wrongPenalty ? `cost ${sc.wrongPenalty} points each, so think before you try` : \"cost nothing, so keep trying\"}.`,\n    ROOMS.some(r => roomHints(r).length) ? `Stuck? Some rooms have a hint drawer that unlocks after a wrong try. ${sc.mode===\"deductions\" && sc.hintPenalty ? `Each hint costs ${sc.hintPenalty} points.` : \"Hints are counted, but they don't affect your grade.\"}` : \"\",\n    `At the end you'll get a \u003cstrong>certificate\u003c/strong>${CFG.finish?.exitPassword ? \" with the exit password\" : \"\"}.`,\n    \"Click any paper to read it up close. The pocket watch opens your notebook: sound, motion, start over.\"\n  ].filter(Boolean);\n  const rulesHtml = `\u003ch3>House rules\u003c/h3>\u003cul>${rules.map(x => `\u003cli>${x}\u003c/li>`).join(\"\")}\u003c/ul>${CFG.meta?.learningOutcome ? `\u003cp class=\"ref\">Learning outcome: ${fmt(CFG.meta.learningOutcome)}\u003c/p>` : \"\"}`;\n  stage.innerHTML = `\n  \u003cdiv class=\"doorway\">\u003cdiv class=\"leafs\" aria-hidden=\"true\">\u003cdiv class=\"fan\">\u003c/div>\u003cdiv class=\"leaf\">\u003c/div>\u003cdiv class=\"leaf\">\u003c/div>\u003c/div>\u003cspan class=\"dknob\" aria-hidden=\"true\">\u003c/span>\n    \u003cbutton type=\"button\" id=\"begin\" class=\"pushplate\">Begin\u003csmall>push to enter\u003c/small>\u003c/button>\u003c/div>\n  \u003cdiv class=\"head\">\n    \u003cdiv class=\"placard\">${esc(title)}${CFG.meta?.course ? `\u003csmall>${esc(CFG.meta.course)}\u003c/small>` : \"\"}\u003c/div>\n    \u003ch2 class=\"said\">${esc(CFG.intro?.heading || title)}\u003c/h2>\n    ${storyBtn(CFG.intro?.story)}\n  \u003c/div>\n  \u003cdiv class=\"obj\">\u003cdiv class=\"titlerow deskrow\">\n    \u003cdiv class=\"ledger\">\u003clabel for=\"pname\">Sign the guest ledger\u003c/label>\n      \u003cdiv class=\"row\">\u003cspan aria-hidden=\"true\">Name\u003c/span>\u003cinput id=\"pname\" name=\"name\" type=\"text\" value=\"${esc(SCORM.name())}\" autocomplete=\"name\" maxlength=\"80\">\u003c/div>\n      \u003cp class=\"old\" aria-hidden=\"true\">~~ ~~~~ ~~~~~~ &nbsp; ~~~ ~~~~~~~ ~~ &nbsp; ~~~~~ ~~~\u003c/p>\u003c/div>\n    \u003cbutton type=\"button\" class=\"rules paper\" ${ex(rulesHtml, { label: \"House rules\" })}>\u003cspan class=\"pin\" aria-hidden=\"true\">\u003c/span>\u003cb>House rules\u003c/b>\u003cspan>${rules[0]} ${rules[1]}\u003c/span>\u003c/button>\n    ${svg(\"0 0 40 60\", `\u003cpath d=\"M30 2C22 14 17 26 15.500 41l2 .500C21 28 26 16 33 4z\" fill=\"#d9cdb2\" stroke=\"#6b5a40\" stroke-width=\".7\"/>\u003cpath d=\"M16.500 41 31 4\" stroke=\"#6b5a40\" stroke-width=\".6\"/>\u003cpath d=\"M8 44h16v3l2 3v8H6v-8l2-3z\" fill=\"#1b2430\" stroke=\"#0b0f14\"/>\u003cpath d=\"M8 44h16v2.500H8z\" fill=\"#3d4a58\"/>\u003cpath d=\"M9 51v5\" stroke=\"#8fa3b5\" stroke-width=\"1.200\" stroke-linecap=\"round\" opacity=\".7\"/>`, 'class=\"ink\"')}\n  \u003c/div>\u003c/div>`;\n  const begin = () => { S.player = ($(\"#pname\").value||\"\").trim() || \"Student\"; startTimer(); SND.play(\"press\"); go(1); };\n  $(\"#begin\").onclick = begin;\n  $(\"#pname\").onkeydown = e => { if (e.key === \"Enter\") begin(); };\n  $(\"#pname\").oninput = () => SND.play(\"key\");\n}\n\nfunction room(n){\n  const r = ROOMS[n-1];\n  root.dataset.screen = \"room\"; root.dataset.type = r.type;\n  ({ matching, quiz, ordering, sorting, reflection }[r.type] || unknown)(r, n);\n  wireHints(r);\n}\nfunction unknown(r, n){ stage.innerHTML = roomHead(r,n) + `\u003cdiv class=\"obj\">\u003cp class=\"note\">This room type isn't supported.\u003c/p>\u003cp>\u003cbutton type=\"button\" class=\"pushplate small\" onclick=\"go(${n+1})\">Skip\u003c/button>\u003c/p>\u003c/div>`; }\n\n/* ---- Matching: objects with codes, numbered clues, turn the dials to the code ----\n   room.look chooses how the objects are drawn: \"cards\" (a catalogue drawer, the default), \"books\" or\n   \"portraits\". It changes the picture only. The term and its code are real text in every look, so screen\n   readers get \"Code L: Essentialism\". Every object and clue opens large in the examine view. */\nconst BOOK_COLORS = [\"#5a1d16\", \"#1f3a2b\", \"#27324a\", \"#4a3015\", \"#43203d\", \"#5c4a1c\"];\nconst PAINT = [\"#4a3a2a\", \"#2f3f3a\", \"#4a2f2a\", \"#34364a\"];\nconst objCard = (c, code) => `\u003cspan class=\"big\">${esc(code)}\u003c/span>\u003ch3>${fmt(c.term)}\u003c/h3>${c.detail ? `\u003cp class=\"sub\">${fmt(c.detail)}\u003c/p>` : \"\"}\u003cp class=\"sub\">Code ${esc(code)}\u003c/p>`;\nconst LOOK = {\n  cards: (m) => `\u003cdiv class=\"drawer\">\u003cul class=\"grid\" role=\"list\">${m.display.map((c,i)=>`\u003cli>\u003cbutton type=\"button\" class=\"mcard paper\" ${ex(objCard(c, m.code[c.k]), { label: plain(c.term) })}>\u003cspan class=\"badge\">\u003cspan class=\"sr\">Code \u003c/span>${esc(m.code[c.k])}\u003cspan class=\"sr\">: \u003c/span>\u003c/span>\n      \u003cstrong>${fmt(c.term)}\u003c/strong>${c.detail?`\u003cspan class=\"small\"> ${fmt(c.detail)}\u003c/span>`:\"\"}\u003c/button>\u003c/li>`).join(\"\")}\u003c/ul>\u003c/div>`,\n  books: (m) => `\u003cul class=\"shelf\" role=\"list\">${m.display.map((c,i)=>{\n      const t = plain(c.term), len = Array.from(t).length, two = len > 17;\n      const fs = len \u003c= 12 ? 1.02 : len \u003c= 17 ? .9 : len \u003c= 32 ? .84 : .74;\n      return `\u003cli style=\"--w:${(two ? 4.4 : 3.3) + (c.detail ? .9 : 0)}rem;--h:${80 + (ER.hash(t) % 5) * 5}%\">\u003cbutton type=\"button\" class=\"vol\" style=\"--c:${BOOK_COLORS[i % BOOK_COLORS.length]};--fs:${fs}rem\" ${ex(objCard(c, m.code[c.k]), { label: t })}>\n      \u003cspan class=\"band\" aria-hidden=\"true\">\u003c/span>\n      \u003cspan class=\"letter\">\u003cspan class=\"sr\">Code \u003c/span>\u003cb>${esc(m.code[c.k])}\u003c/b>\u003cspan class=\"sr\">: \u003c/span>\u003c/span>\n      \u003cspan class=\"title\">${fmt(c.term)}${c.detail?` \u003csmall>${fmt(c.detail)}\u003c/small>`:\"\"}\u003c/span>\n      \u003cspan class=\"band\" aria-hidden=\"true\">\u003c/span>\u003c/button>\u003c/li>`; }).join(\"\")}\u003cli class=\"filler\" aria-hidden=\"true\">\u003c/li>\u003c/ul>`,\n  portraits: (m) => `\u003cul class=\"gallery\" role=\"list\" style=\"--cols:${m.display.length \u003c= 8 ? Math.max(4, m.display.length) : Math.ceil(m.display.length/2)};--colst:${m.display.length \u003c= 3 ? 3 : 4}\">${m.display.map((c,i)=>`\u003cli class=\"portrait\">\u003cbutton type=\"button\" ${ex(objCard(c, m.code[c.k]), { label: plain(c.term) })}>\n      \u003cspan class=\"gilt\" aria-hidden=\"true\">\u003cspan class=\"sitter\" style=\"--pc:${PAINT[ER.hash(plain(c.term)) % PAINT.length]}\">${bust(plain(c.term))}${c.icon?`\u003cspan class=\"ico\">${esc(c.icon)}\u003c/span>`:\"\"}\u003ci>${esc(ER.initials(c.term))}\u003c/i>\u003c/span>\u003c/span>\n      \u003cspan class=\"pname\">\u003cstrong>${fmt(c.term)}\u003c/strong>${c.detail?` \u003cspan class=\"yrs\">${fmt(c.detail)}\u003c/span>`:\"\"}\n      \u003cspan class=\"plate\">\u003cspan class=\"sr\"> Code \u003c/span>${m.numbers?`\u003csmall aria-hidden=\"true\">No.\u003c/small>`:\"\"}\u003cb>${esc(m.code[c.k])}\u003c/b>\u003c/span>\u003c/span>\u003c/button>\u003c/li>`).join(\"\")}\u003c/ul>`\n};\nfunction matching(r, n){\n  const m = ER.matching(r), look = ER.look(r), cn = m.answerCards.length;\n  const clueName = i => m.numbers ? String.fromCharCode(65 + i) : String(i + 1);\n  stage.innerHTML = roomHead(r,n) + `\u003cdiv class=\"obj\">${LOOK[look](m)}\n    \u003ch3 class=\"cap\">${esc(r.cluesHeading || \"Clues\")}\u003c/h3>\n    \u003col class=\"clues\" role=\"list\" style=\"--per:${cn > 6 ? Math.ceil(cn/2) : Math.max(cn, 3)}\">${m.answerCards.map((c,i)=>`\u003cli style=\"--r:${(rot(i)*2.2).toFixed(2)}deg;--y:${((i*53)%5-2)*.14}rem\">\u003cbutton type=\"button\" class=\"icard paper ruled\" ${ex(`\u003ch3>Clue ${clueName(i)}\u003c/h3>\u003cp>${fmt(c.clue)}\u003c/p>`, { cls: \"ruled\", label: \"Clue \" + clueName(i) })}>\u003cspan class=\"pin\" aria-hidden=\"true\">\u003c/span>\u003cspan class=\"no\">Clue ${clueName(i)}\u003c/span>\u003cspan class=\"p\">${fmt(c.clue)}\u003c/span>\u003c/button>\u003c/li>`).join(\"\")}\u003c/ol>\u003c/div>`\n    + mech(dialLock(r, m), r);\n  const check = () => {\n    const typed = $(\"#answer\").value.replace(/\\s+/g,\"\").toUpperCase();\n    if (!typed) return notYet(\"Type the code first.\");\n    if (typed === m.answer) pass(r.successMessage || \"The lock opens!\");\n    else fail(r.failMessage || \"The lock won't budge. Check each clue again.\");\n  };\n  $(\"#try\").onclick = check; wireDials(m, check);\n}\n\n/* ---- Quiz: question slips on the strongbox; typed answers and levers; all must be right ---- */\nfunction quiz(r, n){\n  const qs = r.questions || [];\n  stage.innerHTML = roomHead(r,n) + `\u003cdiv class=\"obj\">\u003cform id=\"qf\" novalidate>${qs.map((q,i)=>`\n    \u003cfieldset class=\"slip paper\" style=\"--r:${(rot(i)*.4).toFixed(2)}deg\">\u003cspan class=\"qn\" aria-hidden=\"true\">${i+1}\u003c/span>\u003clegend>\u003cspan class=\"sr\">${i+1}. \u003c/span>${fmt(q.prompt)}\u003c/legend>${\n      q.kind===\"choice\"\n        ? (q.choices||[]).map((c,j)=>String(c).trim()?`\u003clabel class=\"lever\">\u003cinput type=\"radio\" name=\"q${i}\" value=\"${j}\">\u003cspan class=\"lev\" aria-hidden=\"true\">\u003c/span>\u003cspan class=\"lt\">${fmt(c)}\u003c/span>\u003c/label>`:\"\").join(\"\")\n        : `\u003cspan class=\"typer\">\u003cinput type=\"text\" name=\"q${i}\" aria-label=\"Answer to question ${i+1}\" autocomplete=\"off\" spellcheck=\"false\">\u003c/span>`\n    }\u003c/fieldset>`).join(\"\")}\u003c/form>\u003c/div>`\n    + mech(`\u003cdiv class=\"sbox\">\u003cspan class=\"rivets\" aria-hidden=\"true\">\u003ci>\u003c/i>\u003ci>\u003c/i>\u003ci>\u003c/i>\u003ci>\u003c/i>\u003c/span>${keyLock(lockText(r.lockLabel) || \"Strongbox\", \"Check answers\", { form: \"qf\", total: qs.length })}\u003c/div>`, r);\n  wireInputs($(\"#qf\"));\n  $(\"#qf\").onsubmit = e => {\n    e.preventDefault();\n    const blank = qs.some((q,i) => q.kind===\"choice\" ? !document.querySelector(`input[name=q${i}]:checked`) : !ER.norm(document.querySelector(`input[name=q${i}]`).value));\n    if (blank) return notYet(\"Answer every question first.\");\n    let right = 0;\n    qs.forEach((q,i) => {\n      if (q.kind===\"choice\") { const v = document.querySelector(`input[name=q${i}]:checked`); if (v && +v.value === q.correct) right++; }\n      else { const v = ER.norm(document.querySelector(`input[name=q${i}]`).value); if (v && ER.accepted(q.answers).includes(v)) right++; }\n    });\n    if (right === qs.length) pass(r.successMessage || \"Every answer is right. The lock opens!\", right);\n    else fail(`${right} of ${qs.length} answers are correct.`, right);\n  };\n}\n/* Typewriter keys and lever throws: sound, and a one-notch carriage nudge on the typed line. */\nfunction wireInputs(form){\n  form.addEventListener(\"input\", e => { if (e.target.type !== \"text\") return; SND.play(\"key\");\n    const t = e.target.closest(\".typer\"); if (t && !calm() && t.animate) t.animate([{ transform: \"translateX(-2px)\" }, { transform: \"none\" }], { duration: 70 }); });\n  form.addEventListener(\"change\", e => { if (e.target.type === \"radio\") SND.play(\"clack\"); });\n  stage.querySelectorAll(\".klabel\").forEach(k => { k.style.pointerEvents = \"auto\"; k.style.cursor = \"pointer\"; k.onclick = () => $(\"#try\").click(); });\n}\n\n/* ---- Ordering: cards pinned along a string; move them with the studs or by dragging the number ---- */\nfunction ordering(r, n){\n  const items = r.items || [];\n  let order = ER.scramble(items.length, (r.title||\"\") + items.map(i=>i.text).join(\"|\"));\n  stage.innerHTML = roomHead(r,n) + `\u003cdiv class=\"obj\">\u003cdiv class=\"board\">\u003col id=\"order\">${order.map((idx,i)=>`\u003cli class=\"paper\" data-idx=\"${idx}\" style=\"--r:${(rot(idx)*.45).toFixed(2)}deg\">\u003cspan class=\"grip\" title=\"Drag to move\">\u003cspan class=\"pos\">\u003c/span>\u003c/span>\u003cspan class=\"t\">${fmt(items[idx].text)}\u003c/span>\n      \u003cbutton type=\"button\" class=\"stud\" aria-label=\"Move up\" data-d=\"-1\">${ICON.up}\u003c/button>\u003cbutton type=\"button\" class=\"stud\" aria-label=\"Move down\" data-d=\"1\">${ICON.down}\u003c/button>\u003c/li>`).join(\"\")}\u003c/ol>\u003c/div>\u003c/div>`\n    + mech(keyLock(lockText(r.lockLabel) || \"Order lock\", \"Check order\", { total: items.length }), r);\n  const ol = $(\"#order\"); wireInputs(ol);\n  const renum = () => { const k = [...ol.children]; k.forEach((li,i) => { li.querySelector(\".pos\").textContent = i+1; const u = li.querySelector(\"[data-d='-1']\"), d = li.querySelector(\"[data-d='1']\"); if (u) { u.disabled = i===0; d.disabled = i===k.length-1; } }); order = k.map(li => +li.dataset.idx); };\n  // li itself never moves in the DOM (its neighbour does), so keyboard focus and a drag in progress survive.\n  const move = (li, d, quiet) => {\n    const sib = d \u003c 0 ? li.previousElementSibling : li.nextElementSibling; if (!sib) return false;\n    const a = li.getBoundingClientRect().top, b = sib.getBoundingClientRect().top;\n    if (d \u003c 0) ol.insertBefore(sib, li.nextSibling); else ol.insertBefore(sib, li);\n    renum(); SND.play(\"rustle\");\n    if (!calm() && li.animate) { const slide = (el, from) => el.animate([{ transform: `translateY(${from - el.getBoundingClientRect().top}px)` }, { transform: \"translateY(0)\" }], { duration: 190, easing: \"cubic-bezier(.3,1.4,.5,1)\" }); slide(sib, b); if (!quiet) slide(li, a); }\n    return true;\n  };\n  renum();\n  ol.addEventListener(\"click\", e => {\n    const b = e.target.closest(\"button[data-d]\"); if (!b || b.disabled) return;\n    const li = b.closest(\"li\"); move(li, +b.dataset.d);\n    if (b.disabled) (li.querySelector(\"button[data-d]:not(:disabled)\") || stage).focus();\n  });\n  ol.addEventListener(\"pointerdown\", e => {\n    const g = e.target.closest(\".grip\"); if (!g || (e.button != null && e.button > 0)) return;\n    const li = g.closest(\"li\"); e.preventDefault(); li.classList.add(\"drag\");\n    const mid = el => { const q = el.getBoundingClientRect(); return q.top + q.height/2; };\n    const mv = ev => { let guard = 0; while (guard++ \u003c 20) { const p = li.previousElementSibling, x = li.nextElementSibling;\n      if (p && ev.clientY \u003c mid(p)) move(li, -1, true); else if (x && ev.clientY > mid(x)) move(li, 1, true); else break; } };\n    const up = () => { li.classList.remove(\"drag\"); g.removeEventListener(\"pointermove\", mv); g.removeEventListener(\"pointerup\", up); g.removeEventListener(\"pointercancel\", up); };\n    try { g.setPointerCapture(e.pointerId); } catch(err){}\n    g.addEventListener(\"pointermove\", mv); g.addEventListener(\"pointerup\", up); g.addEventListener(\"pointercancel\", up);\n  });\n  $(\"#try\").onclick = () => {\n    const right = order.filter((v,i)=>v===i).length;\n    if (right !== order.length) return fail(`${right} of ${order.length} are in the correct position.`, right);\n    [...ol.children].forEach((li, i) => {              // solved: the studs come off and each date is stamped on in red ink\n      li.querySelectorAll(\".stud\").forEach(b => b.remove()); li.querySelector(\".grip\").removeAttribute(\"title\");\n      const lab = items[+li.dataset.idx].label; if (!lab) return;\n      li.insertAdjacentHTML(\"beforeend\", `\u003cstrong class=\"when\">${fmt(lab)}\u003c/strong>`);\n      const w = li.lastElementChild;\n      if (!calm() && w.animate) { w.animate([{ transform: \"rotate(-5deg) scale(2.2)\", opacity: 0 }, { transform: \"rotate(-5deg) scale(.9)\", opacity: 1, offset: .7 }, { transform: \"rotate(-5deg) scale(1)\", opacity: .9 }], { duration: 220, delay: i*80, fill: \"backwards\", easing: \"ease-in\" }); if (i \u003c 8) setTimeout(() => SND.play(\"thump\"), i*80 + 140); }\n    });\n    pass(r.successMessage || \"Everything is in order. The lock opens!\", right);\n  };\n}\n\n/* ---- Sorting: evidence slips and rubber stamps ----\n   Each slip has a printed box per category (the real, labelled buttons). Pressing one stamps the slip.\n   The big stamps on the ink pad do the same to the slip that is picked up, then move on to the next. */\nconst INKS = [\"#9b2218\", \"#27406b\", \"#2d5a35\", \"#5b2a66\"];\nfunction sorting(r, n){\n  const items = r.items || [], cats = r.categories || [];\n  const pick = new Array(items.length).fill(null); let sel = -1;\n  stage.innerHTML = roomHead(r,n) + `\u003cdiv class=\"obj\">\u003cdiv class=\"desk\">\u003cul class=\"slips\" role=\"list\">${items.map((it,i)=>`\u003cli class=\"ev paper\" data-i=\"${i}\" style=\"--r:${(rot(i)*.6).toFixed(2)}deg\">\n     \u003cbutton type=\"button\" class=\"pick\" aria-pressed=\"false\">\u003csmall>Slip ${i+1}\u003c/small>${fmt(it.text)}\u003c/button>\n     \u003cspan class=\"seg\" role=\"group\" aria-label=\"Item ${i+1}\">${cats.map((c,j)=>`\u003cbutton type=\"button\" data-i=\"${i}\" data-v=\"${j}\" aria-pressed=\"false\" style=\"--sc:${INKS[j % INKS.length]};--sr:${[-4,3,-2,5][j % 4]}deg\">${esc(c)}\u003c/button>`).join(\"\")}\u003c/span>\u003c/li>`).join(\"\")}\u003c/ul>\u003c/div>\u003c/div>`\n    + mech(`\u003cdiv class=\"stamps\" role=\"group\" aria-label=\"Rubber stamps: stamp the slip you picked up\">${cats.map((c,j)=>`\u003cbutton type=\"button\" class=\"stamp\" data-v=\"${j}\" style=\"--sc:${INKS[j % INKS.length]}\">\u003cspan class=\"knob\" aria-hidden=\"true\">\u003c/span>\u003cspan class=\"neck\" aria-hidden=\"true\">\u003c/span>\u003cspan class=\"base\">${esc(c)}\u003cspan class=\"sr\"> stamp\u003c/span>\u003c/span>\u003cspan class=\"rub\" aria-hidden=\"true\">\u003c/span>\u003c/button>`).join(\"\")}\u003c/div>`\n      + keyLock(lockText(r.lockLabel) || \"Sorting lock\", \"Submit\", { total: items.length }), r);\n  const slips = [...stage.querySelectorAll(\".ev\")]; wireInputs(stage.querySelector(\".slips\"));\n  const select = i => { sel = i; slips.forEach((s, k) => { s.classList.toggle(\"sel\", k === i); s.querySelector(\".pick\").setAttribute(\"aria-pressed\", k === i); }); };\n  const stampIt = (i, v) => {\n    pick[i] = v; SND.play(\"thump\");\n    slips[i].querySelectorAll(\".seg button\").forEach(x => { const on = +x.dataset.v === v; x.classList.toggle(\"on\", on); x.setAttribute(\"aria-pressed\", on);\n      if (on && !calm() && x.animate) x.animate([{ transform: \"rotate(var(--sr)) scale(1.9)\", opacity: 0 }, { transform: \"rotate(var(--sr)) scale(.9)\", opacity: 1, offset: .65 }, { transform: \"rotate(var(--sr)) scale(1)\" }], { duration: 200, easing: \"ease-in\" }); });\n    if (!calm() && slips[i].animate) slips[i].animate([{ transform: \"scale(1)\" }, { transform: \"scale(1.03,.95)\", offset: .55 }, { transform: \"scale(1)\" }], { duration: 240, composite: \"add\" });\n  };\n  stage.querySelector(\".slips\").addEventListener(\"click\", e => {\n    const b = e.target.closest(\".seg button\"), p = e.target.closest(\".pick\");\n    if (b) { select(+b.dataset.i); stampIt(+b.dataset.i, +b.dataset.v); }\n    else if (p) { select(+p.closest(\".ev\").dataset.i); SND.play(\"rustle\"); }\n  });\n  stage.querySelectorAll(\".stamp\").forEach(s => s.onclick = () => {\n    if (sel \u003c 0) select(Math.max(0, pick.indexOf(null)));\n    stampIt(sel, +s.dataset.v);\n    if (!calm() && s.animate) s.animate([{ transform: \"translateY(-.6rem)\" }, { transform: \"translateY(.2rem) scaleY(.88)\", offset: .5 }, { transform: \"translateY(-.1rem) scaleY(1.04)\", offset: .8 }, { transform: \"none\" }], { duration: 260, easing: \"ease-out\" });\n    const next = pick.indexOf(null, sel + 1) >= 0 ? pick.indexOf(null, sel + 1) : pick.indexOf(null);\n    if (next >= 0) { select(next); try { slips[next].scrollIntoView({ block: \"nearest\" }); } catch(e){} }\n  });\n  $(\"#try\").onclick = () => {\n    if (pick.includes(null)) return notYet(\"Choose a category for every item first.\");\n    const right = pick.filter((p,i)=>p===items[i].category).length;\n    if (right===items.length) pass(r.successMessage || \"All sorted. The lock opens!\", right);\n    else fail(`${right} of ${items.length} are in the correct category.`, right);\n  };\n}\n\n/* ---- Reflection: the mirror asks one question at a time; no wrong answers ---- */\nfunction reflection(r, n){\n  const qs = r.questions || []; let cur = 0;\n  stage.innerHTML = roomHead(r,n) + `\u003cdiv class=\"obj\">\u003cdiv class=\"mirrorwrap\">\u003cdiv class=\"mirror lock\" aria-hidden=\"true\">\u003cdiv class=\"glass\">\u003cspan class=\"fog\">\u003c/span>\u003cdiv>\u003csmall id=\"gq\">\u003c/small>\u003cp id=\"gp\">\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\n    \u003cform id=\"mf\" novalidate>${qs.map((q,qi)=>`\u003cfieldset class=\"qcard\" data-q=\"${qi}\"${qi ? \" hidden\" : \"\"}>\u003clegend class=\"sr\">${qi+1}. ${fmt(q.prompt)}\u003c/legend>${(q.options||[]).map(o=>\n     `\u003clabel class=\"lever paper\">\u003cinput type=\"radio\" name=\"q${qi}\" value=\"${esc(o.profile)}\">\u003cspan class=\"lev\" aria-hidden=\"true\">\u003c/span>\u003cspan class=\"lt\">${fmt(o.text)}\u003c/span>\u003c/label>`).join(\"\")}\u003c/fieldset>`).join(\"\")}\n    \u003cdiv class=\"qnav\">${qs.length > 1 ? qs.map((_,i)=>`\u003cbutton type=\"button\" class=\"n\" data-go=\"${i}\" aria-label=\"Question ${i+1}\">${i+1}\u003c/button>`).join(\"\") + `\u003cspan class=\"sp\">\u003c/span>\u003cbutton type=\"button\" class=\"stud\" id=\"q-prev\" aria-label=\"Previous question\">${ICON.left}\u003c/button>\u003cbutton type=\"button\" class=\"stud\" id=\"q-next\" aria-label=\"Next question\">${ICON.right}\u003c/button>` : \"\"}\u003c/div>\n    \u003cdiv class=\"titlerow\" style=\"align-items:center\">\u003cbutton id=\"try\" type=\"submit\" class=\"pushplate\">${esc(deco(r.buttonLabel) || \"Continue\")}\u003c/button>\u003cp class=\"msg\" id=\"msg\" role=\"status\" style=\"text-align:left;flex:1 1 8rem;min-height:0\">\u003c/p>\u003c/div>${hintBlock(r)}\u003c/form>`;\n  const form = $(\"#mf\"), cards = [...form.querySelectorAll(\".qcard\")], fog = stage.querySelector(\".fog\");\n  const answered = i => !!form.querySelector(`input[name=q${i}]:checked`);\n  const paint = () => {\n    $(\"#gq\").textContent = qs.length > 1 ? `Question ${cur+1} of ${qs.length}` : \"\"; $(\"#gp\").innerHTML = qs[cur] ? fmt(qs[cur].prompt) : \"\";\n    cards.forEach((c,i) => c.hidden = i !== cur);\n    form.querySelectorAll(\".qnav .n\").forEach((b,i) => { b.classList.toggle(\"done\", answered(i)); if (i === cur) b.setAttribute(\"aria-current\", \"step\"); else b.removeAttribute(\"aria-current\"); });\n    const p = $(\"#q-prev\"), x = $(\"#q-next\"); if (p) { p.disabled = cur === 0; x.disabled = cur === qs.length-1; }\n  };\n  // The glass fogs over, the next question is written while it is hidden, and it clears again.\n  const show = (i, focus) => {\n    i = Math.max(0, Math.min(qs.length-1, i)); if (i === cur) return paint(); cur = i;\n    if (!calm() && fog.animate) { fog.animate([{ opacity: 0 }, { opacity: 1, offset: .4 }, { opacity: 1, offset: .55 }, { opacity: 0 }], { duration: 620, easing: \"ease-in-out\" }); SND.play(\"rustle\"); }\n    paint(); if (focus) (cards[cur].querySelector(\"input:checked\") || cards[cur].querySelector(\"input\"))?.focus();\n  };\n  paint();\n  form.addEventListener(\"change\", e => { if (e.target.type === \"radio\") { SND.play(\"clack\"); paint(); } });\n  // A mouse or touch choice moves on by itself; keyboard users move on with the Next stud (arrow keys change the choice).\n  form.addEventListener(\"click\", e => { if (e.target.type === \"radio\" && e.detail > 0 && cur \u003c qs.length-1) { const at = cur; setTimeout(() => { if (cur === at && S.room === n) show(at+1); }, calm() ? 0 : 260); } });\n  form.querySelector(\".qnav\").addEventListener(\"click\", e => { const b = e.target.closest(\"button\"); if (!b) return;\n    if (b.dataset.go != null) show(+b.dataset.go, true); else if (b.id === \"q-prev\") show(cur-1, true); else if (b.id === \"q-next\") show(cur+1, true); });\n  form.onsubmit = e => {\n    e.preventDefault();\n    const miss = qs.findIndex((_,i) => !answered(i));\n    if (miss >= 0) { show(miss, true); return notYet(\"Answer every question first.\"); }\n    const tally = {}; qs.forEach((q,qi)=>{ const v=form.querySelector(`input[name=q${qi}]:checked`); if (v) tally[v.value]=(tally[v.value]||0)+1; });\n    const ranked = Object.entries(tally).sort((a,b)=>b[1]-a[1]);\n    const prof = k => (r.profiles||[]).find(p=>p.key===k);\n    S.reflection = { room:r, first: ranked[0] && prof(ranked[0][0]), second: ranked[1] && prof(ranked[1][0]) };\n    $(\"#gq\").textContent = \"\"; $(\"#gp\").textContent = \"\";\n    pass(r.successMessage || \"Done!\");\n  };\n}\n\n/* ---- Finish ---- */\nfunction score(){\n  const sc = CFG.scoring || {};\n  if (sc.mode !== \"deductions\") return 100;\n  return Math.max(+sc.minScore||0, Math.min(100, 100 - S.hints*(+sc.hintPenalty||0) - S.wrong*(+sc.wrongPenalty||0)));\n}\nfunction finish(){\n  if (!S.end) S.end = Date.now();\n  clearInterval(tick); drawClock();\n  root.dataset.screen = \"end\"; delete root.dataset.type;\n  const secs = elapsed(), pts = score();\n  const prefix = String(CFG.meta?.codePrefix || \"ESC\").replace(/[^A-Za-z0-9]/g,\"\").toUpperCase() || \"ESC\";\n  const code = `${prefix}-${S.hints}${Math.min(S.wrong,9)}-${((secs*7919)+S.hints*31+S.wrong*17)%9000+1000}`;\n  SCORM.complete(pts, secs);\n  const f = CFG.finish || {}, R = S.reflection;\n  const result = R && R.first ? `\u003ch3>${esc(R.room.resultHeading || \"Your result\")}: ${esc(R.first.name)}\u003c/h3>\n    ${paras(R.first.desc)}\n    ${R.first.who ? `\u003cp>\u003cstrong>Thinkers to explore:\u003c/strong> ${fmt(R.first.who)}\u003c/p>` : \"\"}\n    ${R.second && R.second !== R.first ? `\u003cp>\u003cstrong>Your second-strongest lean:\u003c/strong> ${esc(R.second.name)}${R.second.who?` (${fmt(R.second.who)})`:\"\"}\u003c/p>` : \"\"}\n    ${R.first.next ? `\u003cp>\u003cstrong>Next step:\u003c/strong> ${fmt(R.first.next)}\u003c/p>` : \"\"}\n    ${R.room.resultNote ? `\u003cp class=\"sub\">${fmt(R.room.resultNote)}\u003c/p>` : \"\"}` : \"\";\n  stage.innerHTML = `\n  \u003cdiv class=\"dawn\" aria-hidden=\"true\">\u003cdiv class=\"sky\">\u003c/div>\u003ci class=\"l\">\u003c/i>\u003ci class=\"r\">\u003c/i>\u003c/div>\n  \u003cdiv class=\"head\">\u003ch2 class=\"bplate\">You Escaped!\u003c/h2>\u003c/div>\n  \u003cdiv class=\"obj\">\u003cdiv class=\"endrow\">\n    \u003cdiv class=\"cert\">\n      \u003cdiv class=\"kicker\">This certifies that\u003c/div>\n      \u003cdiv class=\"name\">${esc(S.player)}\u003c/div>\n      \u003cdiv class=\"line\">${fmt(f.certificateLine || \"escaped the room\")}\u003c/div>\n      \u003cp class=\"facts\">Time: \u003cstrong>${fmtTime(secs)}\u003c/strong> · Hints used: \u003cstrong>${S.hints}\u003c/strong>${CFG.scoring?.mode===\"deductions\"?` · Score: \u003cstrong>${pts}%\u003c/strong>`:\"\"} · ${new Date().toLocaleDateString()}\u003c/p>\n      ${f.exitPassword ? `\u003cdiv class=\"small\">Exit password (enter this in your course quiz)\u003c/div>\u003cdiv class=\"code pass\" id=\"exit-password\" translate=\"no\">${esc(f.exitPassword)}\u003c/div>` : \"\"}\n      \u003cdiv class=\"small\">Personal completion code\u003c/div>\u003cdiv class=\"code\" translate=\"no\">${code}\u003c/div>\n      \u003cdiv class=\"seal\" aria-hidden=\"true\">\u003cspan>${prefix.length > 8 ? \"&#10022;\" : prefix.replace(/^([A-Z]+)(\\d+)$/, \"$1\u003cbr>$2\")}\u003c/span>\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"side\">\n      ${result ? `\u003cbutton type=\"button\" class=\"result paper\" ${ex(result, { label: \"Your result\" })}>\u003cspan class=\"pin\" aria-hidden=\"true\">\u003c/span>\u003cspan class=\"clip\">${result.replace(/\u003c(\\/?)(h3|p)\\b/g, (_, s, t) => `\u003c${s}span${s ? \"\" : ` class=\"${t === \"h3\" ? \"h\" : \"p\"}\"`}`)}\u003c/span>\u003c/button>` : \"\"}\n      \u003cdiv class=\"titlerow noprint\" style=\"gap:.7rem\">\u003cbutton type=\"button\" class=\"pushplate small\" id=\"print\">Print / save as PDF\u003c/button>\n        \u003cbutton type=\"button\" class=\"pushplate small\" id=\"again\">Play again\u003c/button>\u003c/div>\n      ${f.instructions ? `\u003cp class=\"note\">${fmt(f.instructions)}\u003c/p>` : \"\"}\n    \u003c/div>\n  \u003c/div>\u003c/div>`;\n  $(\"#print\").onclick = () => window.print(); $(\"#again\").onclick = () => location.reload();\n  celebrate();\n}\n/* The wax seal is pressed into the paper, and one short burst of brass and paper flecks flies from it.\n   Drawn on a canvas that removes itself. */\nlet party = 0;\nfunction celebrate(){\n  clearTimeout(party);\n  if (calm()) return;\n  const seal = stage.querySelector(\".seal\");\n  if (seal && seal.animate) seal.animate([{ transform: \"rotate(-9deg) scale(2.1)\", opacity: 0 }, { transform: \"rotate(-9deg) scale(.9,.86)\", opacity: 1, offset: .72 }, { transform: \"rotate(-9deg) scale(1.04)\", offset: .88 }, { transform: \"rotate(-9deg) scale(1)\" }], { duration: 420, delay: 480, fill: \"backwards\", easing: \"ease-in\" });\n  party = setTimeout(() => {\n    const seal = stage.querySelector(\".seal\"); if (!seal || calm()) return;\n    SND.play(\"thump\");\n    const r = seal.getBoundingClientRect();\n    confetti(r.left + r.width/2, Math.max(60, Math.min(r.top + r.height/2, window.innerHeight * .8)));\n  }, 800);\n}\nfunction confetti(x, y){\n  document.getElementById(\"confetti\")?.remove();\n  const c = document.createElement(\"canvas\"); c.id = \"confetti\"; c.setAttribute(\"aria-hidden\", \"true\");\n  const g = c.getContext && c.getContext(\"2d\"); if (!g) return;\n  const W = window.innerWidth, H = window.innerHeight, dpr = Math.min(2, window.devicePixelRatio || 1);\n  c.width = Math.round(W*dpr); c.height = Math.round(H*dpr); g.scale(dpr, dpr);\n  document.body.append(c);\n  const COLORS = [\"#f1d38a\", \"#b08a3e\", \"#e9dcc0\", \"#8e1b1b\", \"#f6eed8\", \"#d2ae5e\"], LIFE = 1400;\n  const bits = Array.from({ length: 44 }, (_, i) => {\n    const a = -Math.PI/2 + (Math.random() - .5) * 2.6, v = 260 + Math.random() * 560;\n    return { x, y, vx: Math.cos(a)*v, vy: Math.sin(a)*v, r: Math.random()*6.3, vr: (Math.random() - .5)*16, w: 4 + Math.random()*6, h: 3 + Math.random()*4, f: Math.random()*6.3, c: COLORS[i % COLORS.length] };\n  });\n  let raf = 0, last = performance.now(); const t0 = last;\n  const done = () => { cancelAnimationFrame(raf); clearTimeout(kill); c.remove(); };\n  const kill = setTimeout(done, LIFE + 1000);                 // in case frames are throttled (hidden tab or LMS frame)\n  const frame = now => {\n    const dt = Math.min(.034, (now - last)/1000), age = now - t0; last = now;\n    if (age >= LIFE || calm()) return done();\n    g.clearRect(0, 0, W, H); g.globalAlpha = Math.min(1, (LIFE - age)/350);\n    for (const b of bits) {\n      b.vy += 1500*dt; b.vx *= 1 - 1.8*dt; b.vy *= 1 - .8*dt; b.x += b.vx*dt; b.y += b.vy*dt; b.r += b.vr*dt; b.f += 9*dt;\n      g.save(); g.translate(b.x, b.y); g.rotate(b.r); g.scale(1, Math.cos(b.f)); g.fillStyle = b.c; g.fillRect(-b.w/2, -b.h/2, b.w, b.h); g.restore();\n    }\n    raf = requestAnimationFrame(frame);\n  };\n  raf = requestAnimationFrame(frame);\n}\n\n/* ===================== Teacher preview (editor only) ===================== */\nfunction teacherKey(){\n  document.getElementById(\"teacher-key\")?.remove();\n  const r = ROOMS[S.room-1];\n  $(\"#draft\").classList.toggle(\"away\", PREVIEW && S.showKey && !!r);\n  if (!PREVIEW || !S.showKey || !r) return;\n  const hints = roomHints(r);\n  const box = document.createElement(\"div\"); box.id = \"teacher-key\";\n  box.innerHTML = `\u003ch3>Answer (only you can see this in preview)\u003c/h3>\u003cul>${ER.answerKey(r).map(l=>`\u003cli>${fmt(l)}\u003c/li>`).join(\"\")}\u003c/ul>`\n    + (hints.length ? `\u003cp>Hints (students unlock them after wrong tries):\u003c/p>\u003col>${hints.map(h=>`\u003cli>${fmt(h)}\u003c/li>`).join(\"\")}\u003c/ol>` : \"\");\n  scene.insertBefore(box, stage);\n}\nif (PREVIEW) window.addEventListener(\"message\", e => {\n  const d = e.data || {};\n  if (d.er === \"goto\") { if (!S.player) S.player = \"Preview Student\"; startTimer(); go(Math.max(0, Math.min(ROOMS.length+1, d.room|0))); }\n  if (d.er === \"key\") { S.showKey = !!d.on; teacherKey(); }\n});\n\n/* ===================== Fitting the scene to the window ===================== */\n/* Every size in the game is in rem, so one number scales the whole scene. Wide windows get the\n   landscape scene; tall ones (phones held upright) get the stacked one with the lock at the bottom. */\nfunction fit(){\n  const w = window.innerWidth, h = window.innerHeight, tall = w / h \u003c .82;\n  root.dataset.shape = tall ? \"tall\" : \"wide\";\n  const sw = Math.min(w, h * 1.78);\n  const px = tall ? Math.min(w / 26, h / 44) : Math.min(sw / 80, h / 46);\n  root.style.fontSize = Math.max(12.5, Math.min(20, px)).toFixed(2) + \"px\";\n  stage.querySelectorAll(\".vol .title\").forEach(t => { let f = parseFloat(t.parentElement.style.getPropertyValue(\"--fs\")) || 1; t.style.fontSize = \"\";\n    for (let i = 0; i \u003c 8 && f > .6 && (t.scrollHeight > t.clientHeight + 1 || t.scrollWidth > t.clientWidth + 1); i++) { f -= .06; t.style.fontSize = f.toFixed(2) + \"rem\"; } });\n  const b = $(\"#begin\");          // the Begin plate is on the door in the wide scene and docked under the ledger in the tall one\n  if (b) { const home = tall ? stage.querySelector(\".obj\") : stage.querySelector(\".doorway\"); if (home && b.parentElement !== home) home.append(b); }\n}\nwindow.addEventListener(\"resize\", fit);\n\n/* Parallax: the wall, window, lamp glow and dust drift a few pixels against each other as the pointer moves. */\nlet pend = false, px = 0, py = 0;\nwindow.addEventListener(\"pointermove\", e => {\n  if (calm() || e.pointerType === \"touch\") return;\n  px = (e.clientX / window.innerWidth) * 2 - 1; py = (e.clientY / window.innerHeight) * 2 - 1;\n  if (!pend) { pend = true; requestAnimationFrame(() => { pend = false; if (calm()) return; [bg, light].forEach(el => { el.style.setProperty(\"--px\", px.toFixed(3)); el.style.setProperty(\"--py\", py.toFixed(3)); }); }); }\n}, { passive: true });\ndocument.addEventListener(\"visibilitychange\", () => { if (document.hidden) root.dataset.away = \"1\"; else delete root.dataset.away; });\nbg.querySelector(\".dust\").innerHTML = Array.from({ length: 14 }, (_, i) => { const q = k => ((ER.hash(\"mote\" + i + k) % 1000) / 1000);\n  return `\u003ci style=\"left:${(38 + q(\"x\")*56).toFixed(1)}%;top:${(22 + q(\"y\")*60).toFixed(1)}%;--d:${(11 + q(\"d\")*12).toFixed(1)}s;--dl:${(-q(\"l\")*20).toFixed(1)}s;--mx:${((q(\"a\") - .5)*8).toFixed(1)}rem;--my:${(-4 - q(\"b\")*9).toFixed(1)}rem\">\u003c/i>`; }).join(\"\");\n\n/* ===================== Start ===================== */\ndocument.title = CFG.meta?.title || document.title;\n$(\"#game-title\").textContent = CFG.meta?.title || \"Escape Room\";\nconst review = ER.reviewStatus(CFG);\nif (review.unverified) {\n  const d = $(\"#draft\"); d.hidden = false;\n  d.innerHTML = `\u003cspan class=\"less\">\u003cu>Draft\u003c/u>: answers not yet checked by your instructor\u003c/span>\u003cspan class=\"more\">\u003cu>Draft\u003c/u>: ${review.unverified} of ${review.total} items haven't been checked by the instructor yet. Answers may contain errors.\u003c/span>`;\n  d.onclick = () => { d.setAttribute(\"aria-expanded\", d.getAttribute(\"aria-expanded\") !== \"true\"); SND.play(\"rustle\"); };\n}\nfit(); renderDoors(); go(0);\n\u003c/script>\n\u003cstyle>\n@font-face{font-family:\"Special Elite\";font-style:normal;font-weight:400;font-display:block;src:url(data:font/woff2;base64,d09GMgABAAAAANAwABAAAAAByUgAAM/RAAEAAAAAAAAAAAAAAAAAAAAAAAAAAAAAG8QwHIQ2BmAAg0wIAgmCYREQCoarNIWDdQuDOAABNgIkA4ZsBCAFhWoHg2UMB1u1cnFAdWsGR3Q7gLj+fzasgB17BHRHkWSvAgVnRe0mrdTJ/v8/JydjCJgw1co/MjuIqqCKEmMU5sCaA55wuXhlu/Y9MZ5nIV5jlnyDxXeVSoLDaYlyw6MnPd60+zWNi9JPXiSiaPBpj1O56JYpWFqZLGy4zZaGhYXFDy8s3GKzYcP054/PdRvrE6e/o+vF2EWz3xXGLbxUTZx const SAMPLE = {"schema":1,"meta":{"title":"Escape the Old Schoolhouse","course":"EDU 216","codePrefix":"EDU216","learningOutcome":"Explore your own personal philosophy of education based on the historical and philosophical foundations of education."},"intro":{"heading":"The Door Clicks Shut Behind You…","story":"You came to the old county schoolhouse, now a museum of education history, to research your Philosophy assignment. You lost track of time in the archives. When you look up, the lights are dim, the caretaker has gone home, and every door is locked.\n\nA note is pinned to the chalkboard: *\"Only someone who understands where our ideas about school came from may leave. Five rooms. Five locks. Good luck, future educator.\"*"},"scoring":{"mode":"completion","hintPenalty":5,"wrongPenalty":2,"minScore":50},"finish":{"exitPassword":"DEWEY1916","certificateLine":"escaped the Old Schoolhouse by mastering the historical and philosophical foundations of education","instructions":"Enter the **exit password** in your course quiz, or submit your completion code or a screenshot of this page, as your instructor directs."},"rooms":[{"type":"matching","title":"The Library","look":"books","codeStyle":"letters","codeWord":"LEARN","story":"Five dusty books glow on the shelf, each with one letter painted on its spine. A librarian's card catalog lists five descriptions, but the titles have been torn off. The lock on the library door takes a **5-letter word**.","cluesHeading":"Card Catalog","lockLabel":"🔒 Library lock","successMessage":"🔓 Click! The library door swings open.","failMessage":"The lock won't budge. Check which philosophy matches each description.","reference":"","cards":[{"term":"Essentialism","detail":"","icon":"","code":"","clue":"All students should master a common core of basic knowledge and skills: the “3 R’s,” history, and science. Teachers are the authorities, and the classroom is orderly and disciplined. (William C. Bagley, E. D. Hirsch Jr.)","source":"","verified":false},{"term":"Existentialism","detail":"","icon":"","code":"","clue":"Each student is a free individual who must make choices and create meaning in their own life. The curriculum emphasizes personal choice, the arts, and self-reflection. (Jean-Paul Sartre; in education, Maxine Greene)","source":"","verified":false},{"term":"Perennialism","detail":"","icon":"","code":"","clue":"Truth is universal and unchanging, so every student should study the same enduring ideas found in the “Great Books” of Western civilization. (Robert M. Hutchins, Mortimer Adler)","source":"","verified":false},{"term":"Social Reconstructionism","detail":"","icon":"","code":"","clue":"Schools should be agents of change. Students study real social problems like poverty and injustice and work to build a fairer society. (George S. Counts, Theodore Brameld, Paulo Freire)","source":"","verified":false},{"term":"Progressivism","detail":"","icon":"","code":"","clue":"Education should grow out of students’ interests and experiences. Learning happens through hands-on problem solving, cooperation, and life in a democratic classroom community. (John Dewey)","source":"","verified":false}],"hints":["Look for one key idea in each description, such as \"great books,\" \"basic skills,\" \"social change,\" or \"free choice,\" and ask which philosophy is known for it.","Start with the descriptions you're surest about and write down each book's letter as you go. When you have all five letters in order, they spell a word."],"hintsEnabled":false},{"type":"matching","title":"The Portrait Gallery","look":"portraits","codeStyle":"numbers","codeWord":"","story":"Eight portraits line the hallway. Each has a numbered brass plate. A keypad by the far door asks for a **4-digit code**, and someone has scratched four clues into the wall.","cluesHeading":"Scratched on the wall","lockLabel":"🔢 Keypad","successMessage":"🔓 Beep-beep! The gallery door unlocks.","failMessage":"ERROR. Check each clue against the portraits.", /* ===================== Tiny DOM helper ===================== */
function h(tag, props = {}, ...kids){
  const el = document.createElement(tag);
  for (const [k,v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "class") el.className = v;
    else if (k === "value") el.value = v;
    else if (k === "checked") el.checked = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  return el;
}
let uid = 0;
/* A labelled input bound to obj[key]. opts: {type, help, rows, placeholder, content(bool: editing it un-verifies the item), item, onChange} */
function field(label, obj, key, opts = {}){
  const id = "f" + (++uid);
  const tag = opts.type === "textarea" ? "textarea" : "input";
  const input = h(tag, { id, type: tag === "input" ? (opts.type || "text") : null, rows: opts.rows, placeholder: opts.placeholder,
    value: obj[key] ?? "", min: opts.min, max: opts.max,
    oninput: e => {
      obj[key] = opts.type === "number" ? Number(e.target.value) : e.target.value;
      if (opts.item) unverify(opts.item, e.target);
      opts.onChange && opts.onChange(e);
      changed();
    }});
  return h("label", { class: "field", for: id }, h("span", {}, label, opts.help ? h("small", {}, " — " + opts.help) : null), input);
}
function select(label, obj, key, options, opts = {}){
  const id = "f" + (++uid);
  const s = h("select", { id, onchange: e => { const v = e.target.value; obj[key] = opts.number ? Number(v) : v;
    if (opts.item && opts.item.verified) { opts.item.verified = false; }
    changed(); opts.rerender ? render() : null; } },
    options.map(([v, t]) => h("option", { value: v }, t)));
  s.value = obj[key] ?? opts.fallback ?? "";
  if (s.selectedIndex < 0 && opts.fallback != null) s.value = opts.fallback;     // missing or unknown value: show the default
  return h("label", { class: "field", for: id }, h("span", {}, label, opts.help ? h("small", {}, " — " + opts.help) : null), s);
}
/* Mark an item unchecked and update its checkbox without re-rendering (keeps typing focus). */
function unverify(item, el){
  if (!item.verified) return; item.verified = false;
  const box = el.closest(".entry"); if (box) { box.classList.remove("verified"); const c = box.querySelector(".verify input[type=checkbox]"); if (c) c.checked = false; }

/* Source + "I checked this" row shown on every gradable item. */
function verifyRow(item){

    field("Source", item, "source", { placeholder: "e.g. Textbook ch. 3, p. 45" }),
    h("label", { class: "chk" }, h("input", { type: "checkbox", checked: item.verified === true, onchange: e => {
      item.verified = e.target.checked; e.target.closest(".entry").classList.toggle("verified", item.verified); changed(); } }),

/* Generic list editor: move / delete / add. */
function listEditor(list, renderItem, opts){
  const wrap = h("div", {});
  list.forEach((it, i) => {
    const gradable = opts.gradable !== false;
    wrap.append(h("div", { class: "entry" + (gradable && it.verified ? " verified" : "") + (gradable ? "" : " verified") },
      h("div", { class: "head" }, h("strong", {}, `${opts.noun} ${i+1}`),
        h("button", { class: "small", title: "Move up", "aria-label": `Move ${opts.noun} ${i+1} up`, disabled: i === 0, onclick: () => { [list[i-1], list[i]] = [list[i], list[i-1]]; changed(); render(); } }, "▲"),
        h("button", { class: "small", title: "Move down", "aria-label": `Move ${opts.noun} ${i+1} down`, disabled: i === list.length - 1, onclick: () => { [list[i+1], list[i]] = [list[i], list[i+1]]; changed(); render(); } }, "▼"),
        h("button", { class: "small danger", "aria-label": `Delete ${opts.noun} ${i+1}`, onclick: () => { if (confirm(`Delete ${opts.noun.toLowerCase()} ${i+1}?`)) { list.splice(i, 1); changed(); render(); } } }, "Delete")),
      renderItem(it, i),
      gradable ? verifyRow(it) : null));
  });
  wrap.append(h("button", { onclick: () => { list.push(opts.blank()); changed(); render(); } }, `+ Add ${opts.noun.toLowerCase()}`));
  return wrap;
}
function hintsEditor(room){

  const box = h("div", { class: "box" },
    h("div", { class: "row", style: "align-items:center;justify-content:space-between" }, h("h3", { style: "margin:0" }, "💡 Hints"),
      h("label", { class: "switch" }, h("input", { type: "checkbox", id: "hints-toggle", checked: !!room.hintsEnabled,
        onchange: e => { room.hintsEnabled = e.target.checked; changed(); render(); } }), h("span", { class: "track", "aria-hidden": "true" }),
        room.hintsEnabled ? "Hints on" : "Hints off")),

  showWarnings();

}

      if ((m = l.match(/^q\s*[:)]\s*(.*)$/i))) q.prompt = m[1];
      else if ((m = l.match(/^a\s*[:)]\s*(.*)$/i))) { q.answers = m[1]; hasA = true; }
      else if ((m = l.match(/^([*-])\s+(.*)$/))) { if (m[1] === "*") q.correct = q.choices.length; q.choices.push(m[2]); }
      else if ((m = l.match(/^source\s*:\s*(.*)$/i))) q.source = m[1];
      else if (/^verified\s*:\s*(yes|y|true|✔|✓)\s*$/i.test(l)) q.verified = true;
      else if (l) q.prompt = q.prompt ? q.prompt + " " + l : l;
    });
    q.kind = q.choices.length ? "choice" : "short";
    if (!q.choices.length) q.choices = ["", "", "", ""];
    if (!q.prompt) problems.push(`Question ${n+1} has no "Q:" line.`);
    if (q.kind === "short" && !hasA) problems.push(`Question ${n+1} has no "A:" answer line or choices.`);
    if (q.kind === "choice" && !block.split("\n").some(l => l.trim().startsWith("*"))) problems.push(`Question ${n+1}: mark the correct choice with * instead of -.`);
    out.push(q);
  });
  return { questions: out, problems };
}

/* Full-screen "student view" of the game. The bar on top is the teacher's: jump to any room,
   show the answers, restart, or exit (button or Esc). Nothing is saved or graded. */
function openPreview(startRoom = 0){
  if (!checkReady("preview")) return;
  document.querySelector(".preview")?.remove();
  const n = cfg.rooms.length;
  let current = 0, showKey = false;
  const frame = h("iframe", { title: "Student view of the escape room" });
  const send = msg => frame.contentWindow && frame.contentWindow.postMessage(msg, "*");
  const steps = [["Intro", 0], ...cfg.rooms.map((r, i) => [String(i + 1), i + 1, r.title]), ["🏁", n + 1, "Certificate"]];
  const roomBtns = steps.map(([label, k, title]) => h("button", { "data-room": k, title: title || (k === 0 ? "Intro" : ""), "aria-label": k === 0 ? "Go to intro" : k > n ? "Go to certificate" : `Go to room ${k}: ${title}`,
    onclick: () => send({ er: "goto", room: k }) }, label));
  const mark = () => roomBtns.forEach(b => b.setAttribute("aria-current", +b.dataset.room === current ? "step" : "false"));
  const prev = h("button", { "aria-label": "Previous room", onclick: () => send({ er: "goto", room: Math.max(0, current - 1) }) }, "◀");
  const next = h("button", { "aria-label": "Next room", onclick: () => send({ er: "goto", room: Math.min(n + 1, current + 1) }) }, "▶");
  const keyToggle = h("label", { class: "switch" }, h("input", { type: "checkbox", id: "preview-answers", onchange: e => { showKey = e.target.checked; send({ er: "key", on: showKey }); } }),
    h("span", { class: "track", "aria-hidden": "true" }), "Show answers");
  const exit = () => { layer.remove(); window.removeEventListener("message", onMsg); document.removeEventListener("keydown", onKey); document.getElementById("btn-preview").focus(); };
  const onKey = e => { if (e.key === "Escape") exit(); };
  const onMsg = e => {
    if (e.source !== frame.contentWindow) return;
    if (e.data?.er === "escape") return exit();
    if (e.data?.er === "room") { current = e.data.room; mark(); prev.disabled = current === 0; next.disabled = current === n + 1; }
  };
  const load = (room) => {
    frame.onload = () => { if (showKey) send({ er: "key", on: true }); if (room) send({ er: "goto", room }); };
    frame.srcdoc = ER.buildGame(GAME_TEMPLATE, { ...cfg, __preview: true });
  };
  const layer = h("div", { class: "preview", role: "dialog", "aria-label": "Student preview" },
    h("div", { class: "pbar" },
      h("div", { class: "badge" }, h("i", {}, "PREVIEW"), "Student view"),
      h("div", { class: "rooms", role: "group", "aria-label": "Jump to a room" }, prev, ...roomBtns, next),
      h("div", { class: "ctrl" }, keyToggle,
        h("button", { onclick: () => load(0), title: "Start over from the intro" }, "↻ Restart"),
        h("button", { class: "exit", id: "preview-exit", onclick: exit }, "✕ Exit preview"))),
    frame);
  document.body.append(layer);
  window.addEventListener("message", onMsg); document.addEventListener("keydown", onKey);
  load(startRoom);
  layer.querySelector("#preview-exit").focus();
}

document.getElementById("btn-review").onclick = () => {
  const E = ER.esc, F = ER.fmt;
  const chk = it => `<span class="ck">${it.verified ? "☑" : "☐"}</span>`;
  const src = it => it.source ? `<div class="src">Source: ${E(it.source)}</div>` : `<div class="src none">Source: ________________________</div>`;
  const rooms = cfg.rooms.map((r, i) => {
    let body = "";
    if (r.type === "matching") { const m = ER.matching(r);
      body = `<p><strong>Lock combination:</strong> <code>${E(m.answer)}</code> · Cards shown as: ${({ books: "books on a shelf", portraits: "framed portraits" })[ER.look(r)] || "plain cards"}</p><ol>${r.cards.map(c => `<li>${chk(c)} <strong>${F(c.term)}</strong>${c.detail ? ` (${F(c.detail)})` : ""} — code <code>${E(m.code[r.cards.indexOf(c)])}</code><br>${c.clue ? "Clue: " + F(c.clue) : "<em>Decoy card (no clue)</em>"}${src(c)}</li>`).join("")}</ol>`; }
    if (r.type === "quiz") body = `<ol>${r.questions.map(q => `<li>${chk(q)} ${F(q.prompt)}<br><strong>Answer:</strong> ${q.kind === "choice" ? (q.choices || []).filter(c=>String(c).trim()).map((c, j) => j === q.correct ? `<u><strong>${F(c)}</strong></u>` : F(c)).join(" · ") : E(q.answers)}${src(q)}</li>`).join("")}</ol>`;
    if (r.type === "ordering") body = `<p>Correct order:</p><ol>${r.items.map(it => `<li>${chk(it)} ${F(it.text)}${it.label ? ` <strong>(${F(it.label)})</strong>` : ""}${src(it)}</li>`).join("")}</ol>`;
    if (r.type === "sorting") body = `<ol>${r.items.map(it => `<li>${chk(it)} ${F(it.text)} → <strong>${E(r.categories[it.category] || "?")}</strong>${src(it)}</li>`).join("")}</ol>`;
    if (r.type === "reflection") body = `<p>Results:</p><ol>${r.profiles.map(p => `<li>${chk(p)} <strong>${E(p.name)}</strong> — ${F(p.desc)}${p.who ? `<br>Thinkers: ${F(p.who)}` : ""}${p.next ? `<br>Next step: ${F(p.next)}` : ""}${src(p)}</li>`).join("")}</ol>
      <p>Questions:</p><ol>${r.questions.map(q => `<li>${chk(q)} ${F(q.prompt)}<ul>${(q.options||[]).map(o => `<li>${F(o.text)} → ${E((r.profiles.find(p => p.key === o.profile) || {}).name || "?")}</li>`).join("")}</ul>${src(q)}</li>`).join("")}</ol>`;
    const hints = (r.hints || []).length ? `<p class="hints"><strong>Hints:</strong></p><ol class="hints">${r.hints.map(x => `<li>${F(x)}</li>`).join("")}</ol>` : "";
    return `<section><h2>Room ${i+1}: ${E(r.title)}</h2><p class="story">${F(r.story || "")}</p>${r.reference ? `<p>Reference shown to students: ${F(r.reference)}</p>` : ""}${body}${hints}</section>`;
  }).join("");
  const st = ER.reviewStatus(cfg);
  const doc = `<!DOCTYPE html><html><head><meta charset="utf-8"><title>Review sheet: ${E(cfg.meta.title)}</title><style>
    body{font-family:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;max-width:46rem;margin:2rem auto 3rem;padding:0 1.25rem;color:#1b1710;line-height:1.5;font-size:1.0625rem}
    h1{font-size:1.75rem;line-height:1.2;margin:0 0 .6rem;padding-bottom:.6rem;border-bottom:3px double #8a6a2a}
    h2{font-size:1.25rem;line-height:1.25;margin:2.25rem 0 .6rem;padding:.4rem .75rem;background:#f4ecd8;border-left:5px solid #8c5b33;border-radius:0 6px 6px 0;break-after:avoid}
    ol{padding-left:1.6rem} li{margin:.6rem 0;break-inside:avoid} ul li{margin:.2rem 0}
    .ck{font-size:1.2rem;line-height:1} .src{font-size:.875rem;color:#4a4335;margin-top:.15rem} .src.none{color:#857c6b}
    .story{font-style:italic;color:#4a4335} .hints{font-size:.9375rem;color:#4a4335}
    code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.95em;font-weight:700;background:#f4ecd8;border:1px solid #d9cba8;border-radius:4px;padding:.05rem .4rem}
    section{break-inside:auto}
    @media print{.noprint{display:none}body{margin:0;max-width:none;padding:0;font-size:11pt}h2{background:none;padding-left:.6rem}code{background:none}}</style></head><body>
    <h1>Review sheet: ${E(cfg.meta.title)}</h1>
    <p>${E(cfg.meta.course || "")} · ${st.verified} of ${st.total} items checked · ☐ = not yet checked<br>
    Exit password: <strong>${E(cfg.finish?.exitPassword || "(none)")}</strong> · Grading: ${cfg.scoring?.mode === "deductions" ? "accuracy" : "completion"}</p>
    <p><em>Check every item against your textbook or sources. Content written with AI help can contain mistakes. Mark items as checked in the editor.</em></p>
    ${rooms}</body></html>`;
  const frame = h("iframe", { title: "Review sheet" }); frame.srcdoc = doc;
  overlay("Review sheet (contains answers: for instructors only)", frame, [h("button", { onclick: () => frame.contentWindow.print() }, "🖨️ Print")]);
};

render();
</script>
</body>
</html>
