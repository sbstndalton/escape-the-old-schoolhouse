c/title>\n      \u003citem identifier=\"ITEM1\" identifierref=\"RES1\">\u003ctitle>${xml(title)}\u003c/title>\u003c/item>\n    \u003c/organization>\n  \u003c/organizations>\n  \u003cresources>\n    \u003cresource identifier=\"RES1\" type=\"webcontent\" adlcp:scormtype=\"sco\" href=\"index.html\">\u003cfile href=\"index.html\"/>\u003c/resource>\n  \u003c/resources>\n\u003c/manifest>\n`;\n  }\n  const scorm = (gameHtml, title, date) => zip([{ name: \"imsmanifest.xml\", data: manifest(title) }, { name: \"index.html\", data: gameHtml }], date);\n  const fileSlug = s => String(s || \"escape-room\").normalize(\"NFD\").replace(/[\\u0300-\\u036f]/g, \"\").replace(/[^A-Za-z0-9]+/g, \"-\").replace(/^-|-$/g, \"\") || \"escape-room\";\n\n  return { esc, fmt, paras, norm, accepted, hash, scramble, matching, answerKey, HINT_ROOMS, hintRules, hintWarnings, reviewItems, reviewStatus, validate,\n    encodeConfig, decodeConfig, buildGame, configFromHtml, zip, crc32, manifest, scorm, fileSlug };\n})();\nif (typeof module !== \"undefined\") module.exports = ER;\n\n\u003c/script>\n\u003cscript>\n/* ===================== SCORM 1.2 (optional — runs only inside an LMS) ===================== */\nconst SCORM = (() => {\n  let api = null;\n  function find(w){ let n=0; while(w && !w.API && w.parent && w.parent!==w && n\u003c10){ w=w.parent; n++; } return w && w.API ? w.API : null; }\n  try { api = find(window) || (window.opener ? find(window.opener) : null); } catch(e){ api = null; }\n  const ok = !!api;\n  if (ok) { try { api.LMSInitialize(\"\");\n    if (api.LMSGetValue(\"cmi.core.lesson_status\") === \"not attempted\") api.LMSSetValue(\"cmi.core.lesson_status\",\"incomplete\");\n    api.LMSCommit(\"\"); } catch(e){} }\n  return {\n    ok,\n    name(){ if(!ok) return \"\"; try{ const n=api.LMSGetValue(\"cmi.core.student_name\")||\"\"; const p=n.split(\",\"); return p.length===2? (p[1].trim()+\" \"+p[0].trim()):n; }catch(e){return \"\"} },\n    complete(score, seconds){\n      if(!ok) return;\n      try{\n        api.LMSSetValue(\"cmi.core.score.min\",\"0\"); api.LMSSetValue(\"cmi.core.score.max\",\"100\");\n        api.LMSSetValue(\"cmi.core.score.raw\", String(score));\n        const h=String(Math.floor(seconds/3600)).padStart(4,\"0\"), m=String(Math.floor(seconds%3600/60)).padStart(2,\"0\"), s=String(seconds%60).padStart(2,\"0\");\n        api.LMSSetValue(\"cmi.core.session_time\", `${h}:${m}:${s}`);\n        api.LMSSetValue(\"cmi.core.lesson_status\",\"completed\");\n        api.LMSCommit(\"\");\n      }catch(e){}\n    },\n    finish(){ if(ok){ try{ api.LMSFinish(\"\"); }catch(e){} } }\n  };\n})();\nwindow.addEventListener(\"beforeunload\", () => SCORM.finish());\n\n/* ===================== Content ===================== */\nconst CFG = ER.decodeConfig(document.getElementById(\"escape-config\").textContent);\nconst ROOMS = CFG.rooms || [];\nconst { esc, fmt, paras } = ER;\n\n/* ===================== State ===================== */\nconst S = { room:0, start:null, hints:0, wrong:0, hintsShown:{}, wrongIn:{}, reflection:null, showKey:false };\nconst PREVIEW = CFG.__preview === true;   // set only by the editor's preview, never in exported games\nlet tick = null;\nconst $ = s => document.querySelector(s);\nconst stage = $(\"#stage\");\nconst say = t => { $(\"#live\").textContent = t; };\n\nfunction fmtTime(sec){ return String(Math.floor(sec/60)).padStart(2,\"0\")+\":\"+String(sec%60).padStart(2,\"0\"); }\nfunction elapsed(){ return S.start ? Math.floor((Date.now()-S.start)/1000) : 0; }\nfunction startTimer(){ if(!S.start){ S.start=Date.now(); tick=setInterval(()=>$(\"#timer\").textContent=fmtTime(elapsed()),1000);} }\n\nfunction renderDoors(){\n  $(\"#doors\").innerHTML = ROOMS.map((_,i)=>{\n    const r=i+1; const cls = S.room>r ? \"door open\" : (S.room===r ? \"door current\" : \"door\");\n    return `\u003cdiv class=\"${cls}\" title=\"Room ${r}\">${S.room>r?\"🔓\":r}\u003c/div>`;\n  }).join(\"\");\n}\n\nconst roomHints = room => (room.hintsEnabled && ER.HINT_ROOMS.includes(room.type)) ? (room.hints||[]).slice(0,2).filter(h => String(h||\"\").trim()) : [];\nfunction hintBlock(room){\n  if (!roomHints(room).length) return \"\";\n  return `\u003cdiv class=\"row hint-btn-wrap\">\u003cbutton class=\"ghost\" id=\"hint-btn\">💡 Get a hint\u003c/button>\u003cspan class=\"lockednote\" id=\"hint-note\">\u003c/span>\u003c/div>\u003cdiv id=\"hints\">\u003c/div>`;\n}\n/* Hints unlock only after wrong tries in this room (teacher sets how many), so a student can't\n   open the room and read the hint straight away. */\nfunction updateHints(){\n  const r = ROOMS[S.room-1]; const btn = $(\"#hint-btn\"); if (!r || !btn) return;\n  const list = roomHints(r), rules = ER.hintRules(CFG);\n  const shown = S.hintsShown[S.room] || 0, wrong = S.wrongIn[S.room] || 0;\n  $(\"#hints\").innerHTML = list.slice(0,shown).map((h,i)=>`\u003cdiv class=\"hint\">\u003cstrong>Hint ${i+1}:\u003c/strong> ${fmt(h)}\u003c/div>`).join(\"\");\n  const note = $(\"#hint-note\");\n  if (shown >= list.length) { btn.disabled = true; btn.textContent = \"No more hints\"; note.textContent = \"\"; return; }\n  const need = shown === 0 ? rules.first : Math.max(rules.second, rules.first);\n  const left = need - wrong;\n  btn.disabled = left > 0;\n  btn.textContent = `💡 Get hint ${shown+1}`;\n  note.textContent = left > 0 ? `Unlocks after ${left} more wrong ${left===1?\"try\":\"tries\"}.` : \"\";\n}\nfunction wireHints(room){\n  const btn = $(\"#hint-btn\"); if (!btn) return;\n  btn.onclick = () => { const n = S.hintsShown[S.room] || 0; if (n >= roomHints(room).length || btn.disabled) return; S.hintsShown[S.room] = n+1; S.hints++; $(\"#hintCount\").textContent = S.hints; updateHints(); };\n  updateHints();\n}\n\nfunction fail(text){\n  S.wrong++; S.wrongIn[S.room] = (S.wrongIn[S.room]||0) + 1; updateHints(); const m=$(\"#msg\"); m.className=\"msg bad\"; m.textContent=text; say(text);\n  stage.classList.remove(\"shake\"); void stage.offsetWidth; stage.classList.add(\"shake\");\n}\n// Incomplete answer: tell the student, but don't count a wrong try (no penalty, no hint unlock).\nfunction notYet(text){ const m=$(\"#msg\"); m.className=\"msg bad\"; m.textContent=text; say(text); }\nfunction pass(text){\n  const m=$(\"#msg\"); m.className=\"msg good\"; m.textContent=text; say(text);\n  stage.querySelectorAll(\".lock button, #answer\").forEach(el => el.disabled = true);\n  setTimeout(() => go(S.room+1), 1300);\n}\nfunction go(n){\n  S.room=n; renderDoors(); (n===0 ? intro : n>ROOMS.length ? finish : () => room(n))();\n  if (PREVIEW) { teacherKey(); parent.postMessage({ er: \"room\", room: n }, \"*\"); }\n  stage.focus(); window.scrollTo(0,0);\n}\n\nfunction roomHead(r, n){\n  return `\u003ch2>\u003cspan class=\"rn\">Room ${n}\u003c/span>\u003cspan class=\"sep\"> · \u003c/span>${esc(r.title||\"\")}\u003c/h2>${paras(r.story,\"story\")}${r.reference?`\u003cp class=\"ref\">📖 ${fmt(r.reference)}\u003c/p>`:\"\"}`;\n}\n/* The brass keyhole is decoration only: CSS turns it when #msg reports success. */\nconst LATCH = '\u003cspan class=\"latch\" aria-hidden=\"true\">\u003csvg viewBox=\"0 0 40 40\" focusable=\"false\">\u003ccircle cx=\"20\" cy=\"16\" r=\"4.6\"/>\u003cpath d=\"M17.5 18h5l1.7 10.5h-8.4z\"/>\u003c/svg>\u003c/span>';\nconst lockRow = (label, inner) => `\u003cdiv class=\"lock\">${LATCH}${label?`\u003cspan>\u003cstrong>${fmt(label)}\u003c/strong>\u003c/span>`:\"\"}${inner}\u003cspan class=\"msg\" id=\"msg\" role=\"status\">\u003c/span>\u003c/div>`;\n\n/* ===================== Screens ===================== */\nfunction intro(){\n  const n = ROOMS.length;\n  stage.innerHTML = `\n  \u003ch2>${esc(CFG.intro?.heading || CFG.meta?.title || \"\")}\u003c/h2>\n  ${paras(CFG.intro?.story, \"story\")}\n  \u003cdiv class=\"card\">\n    \u003cstrong>How to play\u003c/strong>\n    \u003cul>\n      \u003cli>Solve the puzzle in each room to open its lock. There ${n===1?\"is 1 room\":`are ${n} rooms`}.\u003c/li>\n      \u003cli>Wrong answers ${CFG.scoring?.mode===\"deductions\" && CFG.scoring.wrongPenalty ? `cost ${CFG.scoring.wrongPenalty} points each, so think before you try` : \"cost nothing, so keep trying\"}.\u003c/li>\n      ${ROOMS.some(r => roomHints(r).length) ? `\u003cli>Stuck? Some rooms have hints that unlock after a wrong try. ${CFG.scoring?.mode===\"deductions\" && CFG.scoring.hintPenalty ? `Each hint costs ${CFG.scoring.hintPenalty} points.` : \"They're counted, but they don't affect your grade.\"}\u003c/li>` : \"\"}\n      \u003cli>At the end you'll get a \u003cstrong>certificate\u003c/strong>${CFG.finish?.exitPassword ? \" with the exit password\" : \"\"}.\u003c/li>\n    \u003c/ul>\n    ${CFG.meta?.learningOutcome ? `\u003cp class=\"small\">Learning Outcome: \u003cem>${fmt(CFG.meta.learningOutcome)}\u003c/em>\u003c/p>` : \"\"}\n  \u003c/div>\n  \u003cdiv class=\"row\">\u003clabel for=\"pname\">\u003cstrong>Your name:\u003c/strong>\u003c/label>\n    \u003cinput id=\"pname\" name=\"name\" type=\"text\" class=\"free\" style=\"width:16rem\" value=\"${esc(SCORM.name())}\" autocomplete=\"name\">\n    \u003cbutton id=\"begin\">Enter →\u003c/button>\u003c/div>`;\n  $(\"#begin\").onclick = () => { S.player = ($(\"#pname\").value||\"\").trim() || \"Student\"; startTimer(); go(1); };\n}\n\nfunction room(n){\n  const r = ROOMS[n-1];\n  ({ matching, quiz, ordering, sorting, reflection }[r.type] || unknown)(r, n);\n  wireHints(r);\n}\nfunction unknown(r, n){ stage.innerHTML = roomHead(r,n) + `\u003cp>This room type isn't supported.\u003c/p>\u003cbutton onclick=\"go(${n+1})\">Skip\u003c/button>`; }\n\n/* ---- Matching: cards with codes, numbered clues, enter the code ---- */\nfunction matching(r, n){\n  const m = ER.matching(r);\n  const clueStyle = m.numbers ? \"A\" : \"1\";\n  stage.innerHTML = roomHead(r,n) + `\n    \u003cdiv class=\"grid\">${m.display.map(c=>`\u003cdiv class=\"card mcard\">\u003cdiv class=\"badge\">${esc(m.code[c.k])}\u003c/div>\n      ${c.icon?`\u003cspan class=\"icon\" aria-hidden=\"true\">${esc(c.icon)}\u003c/span>`:\"\"}\u003cdiv>\u003cstrong>${fmt(c.term)}\u003c/strong>${c.detail?`\u003cdiv class=\"small\">${fmt(c.detail)}\u003c/div>`:\"\"}\u003c/div>\u003c/div>`).join(\"\")}\u003c/div>\n    \u003ch3>${esc(r.cluesHeading || \"Clues\")}\u003c/h3>\n    \u003col class=\"clues\" type=\"${clueStyle}\">${m.answerCards.map(c=>`\u003cli>${fmt(c.clue)}\u003c/li>`).join(\"\")}\u003c/ol>\n    ${lockRow(\"\", `\u003clabel for=\"answer\">${fmt(r.lockLabel || \"🔒 Lock\")}:\u003c/label>\n      \u003cinput id=\"answer\" type=\"text\" maxlength=\"${m.answer.length}\" ${m.numbers?'inputmode=\"numeric\"':\"\"} autocomplete=\"off\" autocapitalize=\"characters\" spellcheck=\"false\">\n      \u003cbutton id=\"try\">Try it\u003c/button>`)}\n    ${hintBlock(r)}`;\n  const check = () => {\n    const typed = $(\"#answer\").value.replace(/\\s+/g,\"\").toUpperCase();\n    if (!typed) return notYet(\"Type the code first.\");\n    if (typed === m.answer) pass(r.successMessage || \"🔓 The lock opens!\");\n    else fail(r.failMessage || \"The lock won't budge. Check each clue again.\");\n  };\n  $(\"#try\").onclick = check; $(\"#answer\").onkeydown = e => { if (e.key===\"Enter\") check(); };\n}\n\n/* ---- Quiz: short-answer and multiple-choice questions; all must be right ---- */\nfunction quiz(r, n){\n  const qs = r.questions || [];\n  stage.innerHTML = roomHead(r,n) + `\u003cform id=\"qf\" novalidate>${qs.map((q,i)=>`\n    \u003cfieldset>\u003clegend>${i+1}. ${fmt(q.prompt)}\u003c/legend>${\n      q.kind===\"choice\"\n        ? (q.choices||[]).map((c,j)=>String(c).trim()?`\u003clabel>\u003cinput type=\"radio\" name=\"q${i}\" value=\"${j}\"> ${fmt(c)}\u003c/label>`:\"\").join(\"\")\n        : `\u003cinput type=\"text\" class=\"free\" name=\"q${i}\" aria-label=\"Answer to question ${i+1}\" autocomplete=\"off\" spellcheck=\"false\">`\n    }\u003c/fieldset>`).join(\"\")}\n    ${lockRow(r.lockLabel || \"🔒 Question lock\", `\u003cbutton id=\"try\" type=\"submit\">Check answers\u003c/button>`)}\u003c/form>\n    ${hintBlock(r)}`;\n  $(\"#qf\").onsubmit = e => {\n    e.preventDefault();\n    const blank = qs.some((q,i) => q.kind===\"choice\" ? !document.querySelector(`input[name=q${i}]:checked`) : !ER.norm(document.querySelector(`input[name=q${i}]`).value));\n    if (blank) return notYet(\"Answer every question first.\");\n    let right = 0;\n    qs.forEach((q,i) => {\n      if (q.kind===\"choice\") { const v = document.querySelector(`input[name=q${i}]:checked`); if (v && +v.value === q.correct) right++; }\n      else { const v = ER.norm(document.querySelector(`input[name=q${i}]`).value); if (v && ER.accepted(q.answers).includes(v)) right++; }\n    });\n    if (right === qs.length) pass(r.successMessage || \"🔓 Every answer is right. The lock opens!\");\n    else fail(`${right} of ${qs.length} answers are correct.`);\n  };\n}\n\n/* ---- Ordering: put items in the right order ---- */\nfunction ordering(r, n){\n  const items = r.items || [];\n  let order = ER.scramble(items.length, (r.title||\"\") + items.map(i=>i.text).join(\"|\"));\n  const draw = () => {\n    $(\"#order\").innerHTML = order.map((idx,i)=>`\u003cli>\u003cspan class=\"pos\">${i+1}.\u003c/span>\u003cspan>${fmt(items[idx].text)}\u003c/span>\n      \u003cbutton class=\"mv ghost\" aria-label=\"Move up\" ${i===0?\"disabled\":\"\"} data-i=\"${i}\" data-d=\"-1\">▲\u003c/button>\n      \u003cbutton class=\"mv ghost\" aria-label=\"Move down\" ${i===order.length-1?\"disabled\":\"\"} data-i=\"${i}\" data-d=\"1\">▼\u003c/button>\u003c/li>`).join(\"\");\n  };\n  stage.innerHTML = roomHead(r,n) + `\u003cul class=\"list\" id=\"order\">\u003c/ul>\n    ${lockRow(r.lockLabel || \"🔒 Order lock\", `\u003cbutton id=\"try\">Check order\u003c/button>`)}${hintBlock(r)}`;\n  $(\"#order\").onclick = e => {\n    const b = e.target.closest(\"button[data-i]\"); if (!b) return;\n    const i = +b.dataset.i, d = +b.dataset.d, j = i + d;\n    [order[i], order[j]] = [order[j], order[i]]; draw();\n    const nb = $(\"#order\").children[j].querySelectorAll(\"button\")[d\u003c0?0:1]; if (nb && !nb.disabled) nb.focus();\n  };\n  draw();\n  $(\"#try\").onclick = () => {\n    const right = order.filter((v,i)=>v===i).length;\n    if (right === order.length) {\n      $(\"#order\").innerHTML = order.map((idx,i)=>`\u003cli>\u003cspan class=\"pos\">${i+1}.\u003c/span>\u003cspan>${fmt(items[idx].text)}${items[idx].label?` \u003cstrong style=\"color:var(--gold)\">(${fmt(items[idx].label)})\u003c/strong>`:\"\"}\u003c/span>\u003c/li>`).join(\"\");\n      pass(r.successMessage || \"🔓 Everything is in order. The lock opens!\");\n    } else fail(`${right} of ${order.length} are in the correct position.`);\n  };\n}\n\n/* ---- Sorting: put each item in a category ---- */\nfunction sorting(r, n){\n  const items = r.items || [], cats = r.categories || [];\n  const pick = new Array(items.length).fill(null);\n  stage.innerHTML = roomHead(r,n) + `\u003cul class=\"list scene\">${items.map((it,i)=>`\u003cli>\u003cspan style=\"flex:1;min-width:220px\">${fmt(it.text)}\u003c/span>\n     \u003cspan class=\"seg\" role=\"group\" aria-label=\"Item ${i+1}\">${cats.map((c,j)=>`\u003cbutton data-i=\"${i}\" data-v=\"${j}\" aria-pressed=\"false\">${esc(c)}\u003c/button>`).join(\"\")}\u003c/span>\u003c/li>`).join(\"\")}\u003c/ul>\n    ${lockRow(r.lockLabel || \"📋 Sorting lock\", `\u003cbutton id=\"try\">Submit\u003c/button>`)}${hintBlock(r)}`;\n  stage.querySelectorAll(\".seg button\").forEach(b => b.onclick = () => {\n    const i=+b.dataset.i; pick[i]=+b.dataset.v;\n    b.parentElement.querySelectorAll(\"button\").forEach(x=>{ const on=+x.dataset.v===pick[i]; x.classList.toggle(\"on\",on); x.setAttribute(\"aria-pressed\",on); });\n  });\n  $(\"#try\").onclick = () => {\n    if (pick.includes(null)) return notYet(\"Choose a category for every item first.\");\n    const right = pick.filter((p,i)=>p===items[i].category).length;\n    if (right===items.length) pass(r.successMessage || \"🔓 All sorted. The lock opens!\");\n    else fail(`${right} of ${items.length} are in the correct category.`);\n  };\n}\n\n/* ---- Reflection: no wrong answers; result profile shown on the certificate ---- */\nfunction reflection(r, n){\n  const qs = r.questions || [];\n  stage.innerHTML = roomHead(r,n) + `\u003cform id=\"mf\">${qs.map((q,qi)=>`\u003cfieldset>\u003clegend>${qi+1}. ${fmt(q.prompt)}\u003c/legend>${(q.options||[]).map(o=>\n     `\u003clabel>\u003cinput type=\"radio\" name=\"q${qi}\" value=\"${esc(o.profile)}\" required> ${fmt(o.text)}\u003c/label>`).join(\"\")}\u003c/fieldset>`).join(\"\")}\n    ${lockRow(\"🪞\", `\u003cbutton id=\"try\" type=\"submit\">${esc(r.buttonLabel || \"Continue\")}\u003c/button>`)}\u003c/form>${hintBlock(r)}`;\n  $(\"#mf\").onsubmit = e => {\n    e.preventDefault();\n    const tally = {}; qs.forEach((q,qi)=>{ const v=document.querySelector(`input[name=q${qi}]:checked`); if (v) tally[v.value]=(tally[v.value]||0)+1; });\n    const ranked = Object.entries(tally).sort((a,b)=>b[1]-a[1]);\n    const prof = k => (r.profiles||[]).find(p=>p.key===k);\n    S.reflection = { room:r, first: ranked[0] && prof(ranked[0][0]), second: ranked[1] && prof(ranked[1][0]) };\n    pass(r.successMessage || \"✨ Done!\");\n  };\n}\n\n/* ---- Finish ---- */\nfunction score(){\n  const sc = CFG.scoring || {};\n  if (sc.mode !== \"deductions\") return 100;\n  return Math.max(+sc.minScore||0, Math.min(100, 100 - S.hints*(+sc.hintPenalty||0) - S.wrong*(+sc.wrongPenalty||0)));\n}\nfunction finish(){\n  clearInterval(tick);\n  const secs = elapsed(), pts = score();\n  const prefix = String(CFG.meta?.codePrefix || \"ESC\").replace(/[^A-Za-z0-9]/g,\"\").toUpperCase() || \"ESC\";\n  const code = `${prefix}-${S.hints}${Math.min(S.wrong,9)}-${((secs*7919)+S.hints*31+S.wrong*17)%9000+1000}`;\n  SCORM.complete(pts, secs);\n  const f = CFG.finish || {}, R = S.reflection;\n  stage.innerHTML = `\n  \u003ch2>🎉 You Escaped!\u003c/h2>\n  \u003cdiv class=\"cert\">\n    \u003cdiv class=\"small kicker\">THIS CERTIFIES THAT\u003c/div>\n    \u003cdiv class=\"name\">${esc(S.player)}\u003c/div>\n    \u003cdiv class=\"small\">${fmt(f.certificateLine || \"escaped the room\")}\u003c/div>\n    \u003cp>Time: \u003cstrong>${fmtTime(secs)}\u003c/strong> · Hints used: \u003cstrong>${S.hints}\u003c/strong>${CFG.scoring?.mode===\"deductions\"?` · Score: \u003cstrong>${pts}%\u003c/strong>`:\"\"} · ${new Date().toLocaleDateString()}\u003c/p>\n    ${f.exitPassword ? `\u003cdiv class=\"small\">Exit password (enter this in your course quiz)\u003c/div>\u003cdiv class=\"code pass\" id=\"exit-password\" translate=\"no\">${esc(f.exitPassword)}\u003c/div>` : \"\"}\n    \u003cdiv class=\"small gap\">Personal completion code\u003c/div>\u003cdiv class=\"code\" translate=\"no\">${code}\u003c/div>\n  \u003c/div>\n  ${R && R.first ? `\u003cdiv class=\"result\">\n    \u003ch3>🪞 ${esc(R.room.resultHeading || \"Your result\")}: ${esc(R.first.name)}\u003c/h3>\n    ${paras(R.first.desc)}\n    ${R.first.who ? `\u003cp>\u003cstrong>Thinkers to explore:\u003c/strong> ${fmt(R.first.who)}\u003c/p>` : \"\"}\n    ${R.second && R.second !== R.first ? `\u003cp>\u003cstrong>Your second-strongest lean:\u003c/strong> ${esc(R.second.name)}${R.second.who?` (${fmt(R.second.who)})`:\"\"}\u003c/p>` : \"\"}\n    ${R.first.next ? `\u003cp>\u003cstrong>Next step:\u003c/strong> ${fmt(R.first.next)}\u003c/p>` : \"\"}\n    ${R.room.resultNote ? `\u003cp class=\"small\" style=\"color:#24402f\">${fmt(R.room.resultNote)}\u003c/p>` : \"\"}\n  \u003c/div>` : \"\"}\n  \u003cdiv class=\"row\">\u003cbutton onclick=\"window.print()\">🖨️ Print / save as PDF\u003c/button>\n    \u003cbutton class=\"ghost\" onclick=\"location.reload()\">Play again\u003c/button>\u003c/div>\n  ${f.instructions ? `\u003cp class=\"small\">${fmt(f.instructions)}\u003c/p>` : \"\"}`;\n}\n\n/* ===================== Teacher preview (editor only) ===================== */\nfunction teacherKey(){\n  document.getElementById(\"teacher-key\")?.remove();\n  const r = ROOMS[S.room-1];\n  if (!PREVIEW || !S.showKey || !r) return;\n  const hints = roomHints(r);\n  const box = document.createElement(\"div\"); box.id = \"teacher-key\"; box.className = \"teacher-key\";\n  box.innerHTML = `\u003ch3>👩‍🏫 Answer (only you can see this in preview)\u003c/h3>\u003cul>${ER.answerKey(r).map(l=>`\u003cli>${fmt(l)}\u003c/li>`).join(\"\")}\u003c/ul>`\n    + (hints.length ? `\u003cp class=\"small\" style=\"margin:.5rem 0 .2rem\">Hints (students unlock them after wrong tries):\u003c/p>\u003col>${hints.map(h=>`\u003cli>${fmt(h)}\u003c/li>`).join(\"\")}\u003c/ol>` : \"\");\n  stage.append(box);\n}\n// Esc inside the preview frame should still close the editor's preview.\nif (PREVIEW) document.addEventListener(\"keydown\", e => { if (e.key === \"Escape\") parent.postMessage({ er: \"escape\" }, \"*\"); });\nif (PREVIEW) window.addEventListener(\"message\", e => {\n  const d = e.data || {};\n  if (d.er === \"goto\") { if (!S.player) S.player = \"Preview Student\"; startTimer(); go(Math.max(0, Math.min(ROOMS.length+1, d.room|0))); }\n  if (d.er === \"key\") { S.showKey = !!d.on; teacherKey(); }\n});\n\n/* ===================== Start ===================== */\ndocument.title = CFG.meta?.title || document.title;\n$(\"#game-title\").textContent = \"🏫 \" + (CFG.meta?.title || \"Escape Room\");\nconst review = ER.reviewStatus(CFG);\nif (review.unverified) {\n  const d = $(\"#draft\"); d.hidden = false;\n  d.textContent = `⚠️ Draft: ${review.unverified} of ${review.total} items haven't been checked by the instructor yet. Answers may contain errors.`;\n}\nrenderDoors(); go(0);\n\u003c/script>\n\u003c/body>\n\u003c/html>\n";
const SAMPLE = {"schema":1,"meta":{"title":"Escape the Old Schoolhouse","course":"EDU 216","codePrefix":"EDU216","learningOutcome":"Explore your own personal philosophy of education based on the historical and philosophical foundations of education."},"intro":{"heading":"The Door Clicks Shut Behind You…","story":"You came to the old county schoolhouse, now a museum of education history, to research your Philosophy assignment. You lost track of time in the archives. When you look up, the lights are dim, the caretaker has gone home, and every door is locked.\n\nA note is pinned to the chalkboard: *\"Only someone who understands where our ideas about school came from may leave. Five rooms. Five locks. Good luck, future educator.\"*"},"scoring":{"mode":"completion","hintPenalty":5,"wrongPenalty":2,"minScore":50},"finish":{"exitPassword":"DEWEY1916","certificateLine":"escaped the Old Schoolhouse by mastering the historical and philosophical foundations of education","instructions":"Enter the **exit password** in your course quiz, or submit your completion code or a screenshot of this page, as your instructor directs."},"rooms":[{"type":"matching","title":"The Library","codeStyle":"letters","codeWord":"LEARN","story":"Five dusty books glow on the shelf, each with one letter painted on its spine. A librarian's card catalog lists five descriptions, but the titles have been torn off. The lock on the library door takes a **5-letter word**.","cluesHeading":"Card Catalog","lockLabel":"🔒 Library lock","successMessage":"🔓 Click! The library door swings open.","failMessage":"The lock won't budge. Check which philosophy matches each description.","reference":"","cards":[{"term":"Essentialism","detail":"","icon":"","code":"","clue":"All students should master a common core of basic knowledge and skills (the \"3 R's,\" history, science). Teachers are authorities, and the classroom is orderly and disciplined. (William Bagley, E. D. Hirsch)","source":"","verified":false},{"term":"Existentialism","detail":"","icon":"","code":"","clue":"Each student is a free individual who must make choices and create meaning in their own life. The curriculum emphasizes personal choice, the arts, and self-reflection. (Jean-Paul Sartre, Maxine Greene)","source":"","verified":false},{"term":"Perennialism","detail":"","icon":"","code":"","clue":"Truth is universal and unchanging, so every student should study the same enduring ideas found in the \"Great Books\" of Western civilization. (Robert Hutchins, Mortimer Adler)","source":"","verified":false},{"term":"Social Reconstructionism","detail":"","icon":"","code":"","clue":"Schools should be agents of change. Students study real social problems like poverty and injustice and work to build a fairer society. (George Counts, Paulo Freire)","source":"","verified":false},{"term":"Progressivism","detail":"","icon":"","code":"","clue":"Education should be child-centered and grow out of students' interests and experiences. Learning happens through hands-on problem solving and cooperation. (John Dewey)","source":"","verified":false}],"hints":["Look for one key idea in each description, such as \"great books,\" \"basic skills,\" \"social change,\" or \"free choice,\" and ask which philosophy is known for it.","Start with the descriptions you're surest about and write down each book's letter as you go. When you have all five letters in order, they spell a word."],"hintsEnabled":false},{"type":"matching","title":"The Portrait Gallery","codeStyle":"numbers","codeWord":"","story":"Eight portraits line the hallway. Each has a numbered brass plate. A keypad by the far door asks for a **4-digit code**, and someone has scratched four clues into the wall.","cluesHeading":"Scratched on the wall","lockLabel":"🔢 Keypad","successMessage":"🔓 Beep-beep! The gallery door unlocks.","failMessage":"ERROR. Check each clue against the portraits.","reference":"","cards":[{"term":"John Dewey","detail":"1859–1952","icon":"🔬","code":"9","clue":"I believed school should be a small democratic community where children learn by doing. I wrote *Democracy and Education* (1916).","source":"","verified":false},{"term":"Maria Montessori","detail":"1870–1952","icon":"🧸","code":"1","clue":"I was one of Italy's first women physicians. I designed a \"prepared environment\" with child-sized materials so young children could direct their own learning.","source":"","verified":false},{"term":"Paulo Freire","detail":"1921–1997","icon":"✊","code":"5","clue":"I criticized the \"banking concept\" of education, where teachers deposit facts into passive students. I called for dialogue and critical consciousness instead.","source":"","verified":false},{"term":"Horace Mann","detail":"1796–1859","icon":"🔔","code":"4","clue":"I led the \"common school\" movement for free, tax-supported public schools. I called education \"the great equalizer of the conditions of men.\"","source":"","verified":false},{"term":"Plato","detail":"c. 428–348 BCE","icon":"🏛️","code":"7","clue":"","source":"","verified":false},{"term":"Jean-Jacques Rousseau","detail":"1712–1778","icon":"🌿","code":"3","clue":"","source":"","verified":false},{"term":"George Counts","detail":"1889–1974","icon":"⚖️","code":"2","clue":"","source":"","verified":false},{"term":"Mortimer Adler","detail":"1902–2001","icon":"📚","code":"8","clue":"","source":"","verified":false}],"hints":["Only four of the eight portraits match a clue. Each clue has a giveaway detail: a book title, a country, a famous phrase, or a movement.","Type the plate numbers in the order of the clues (A, B, C, D), not in the order the portraits hang on the wall."],"hintsEnabled":false},{"type":"ordering","title":"The History Hall","story":"A long wooden timeline covers the wall, but someone has knocked the event cards out of order. A brass lock is wired to the timeline. It will open only when every card is in **chronological order**, oldest at the top.","lockLabel":"🔒 Timeline lock","successMessage":"🔓 The timeline lights up and the lock drops open!","reference":"","items":[{"text":"Plato describes the education of philosopher-kings in *The Republic*.","label":"c. 375 BCE","source":"","verified":false},{"text":"Rousseau publishes *Émile*, arguing that children learn best through nature and experience.","label":"1762","source":"","verified":false},{"text":"Horace Mann becomes the first secretary of the Massachusetts Board of Education.","label":"1837","source":"","verified":false},{"text":"Maria Montessori opens the first Casa dei Bambini (Children's House) in Rome.","label":"1907","source":"","verified":false},{"text":"John Dewey publishes *Democracy and Education*.","label":"1916","source":"","verified":false},{"text":"Paulo Freire writes *Pedagogy of the Oppressed*.","label":"1968","source":"","verified":false},{"text":"Mortimer Adler publishes *The Paideia Proposal*, calling for one rigorous curriculum for all students.","label":"1982","source":"","verified":false}],"hints":["Sort the events by century first. These ideas about education span more than 2,000 years.","Four of the events happened in the 1900s. Of those, the earliest one is about young children in Rome, and the latest one is a call for one curriculum for all students."],"hintsEnabled":false},{"type":"sorting","title":"The Observation Room","story":"Behind a one-way mirror, you watch scenes from classrooms across the decades play out on old film reels. An observer's clipboard hangs on the door: label every observation as **Traditional (classical)** or **Progressive** to unlock it.","categories":["Traditional","Progressive"],"lockLabel":"📋 Clipboard lock","successMessage":"🔓 Sharp eye! The observation room door opens.","reference":"","items":[{"text":"Desks sit in straight rows facing the teacher's desk and chalkboard.","category":0,"source":"","verified":false},{"text":"Students design their own experiment to find out which brand of paper towel absorbs the most water.","category":1,"source":"","verified":false},{"text":"The teacher lectures on the causes of the Civil War while students copy notes from the board.","category":0,"source":"","verified":false},{"text":"Small groups plan and plant a class garden, measuring plots (math) and tracking plant growth (science).","category":1,"source":"","verified":false},{"text":"Students recite multiplication tables together in timed drills until they've memorized them.","category":0,"source":"","verified":false},{"text":"Each student chooses a local issue to research and presents solutions to community members.","category":1,"source":"","verified":false},{"text":"The class works through the textbook chapter by chapter, with a unit test at the end of each one.","category":0,"source":"","verified":false},{"text":"The class holds a meeting to discuss a playground problem and vote on new classroom rules.","category":1,"source":"","verified":false}],"hints":["For each scene, ask who is doing most of the thinking and choosing: the teacher or the students?","Traditional scenes pass a set body of content from teacher to students. Progressive scenes start from a real problem or the students' own questions."],"hintsEnabled":false},{"type":"reflection","title":"The Mirror","story":"The last door has no keyhole, only a tall, old mirror. Words appear in the glass: *\"You have learned the philosophies of others. Now show me your own.\"*","buttonLabel":"Look into the mirror","successMessage":"✨ The mirror shimmers and becomes a doorway…","reference":"","resultHeading":"Your reflection","resultNote":"Most teachers blend philosophies. Use this result as a starting point, not a label.","profiles":[{"key":"ESS","name":"Essentialism","who":"William Bagley, E. D. Hirsch Jr.","desc":"You believe every student deserves a strong foundation in core knowledge and skills, taught clearly by a knowledgeable teacher in an orderly classroom.","next":"Consider William Bagley for your Philosophy PowerPoint, and look into his critique of progressive education in the 1930s.","source":"","verified":false},{"key":"PER","name":"Perennialism","who":"Robert Hutchins, Mortimer Adler (with roots in Plato and Aristotle)","desc":"You value timeless ideas, great works, and the same rigorous intellectual education for every student.","next":"Consider Mortimer Adler (*The Paideia Proposal*) or Plato for your Philosophy PowerPoint.","source":"","verified":false},{"key":"PRO","name":"Progressivism","who":"John Dewey (with roots in Rousseau)","desc":"You see learning as active and experiential. It should grow out of students' interests and real problems, and classrooms should be small democracies.","next":"Consider John Dewey for your Philosophy PowerPoint, and look into his Laboratory School at the University of Chicago.","source":"","verified":false},{"key":"SOC","name":"Social Reconstructionism","who":"George Counts, Paulo Freire","desc":"You see schools as engines of social change, places where students learn to question injustice and act to improve their communities.","next":"Consider Paulo Freire (*Pedagogy of the Oppressed*) or George Counts for your Philosophy PowerPoint.","source":"","verified":false},{"key":"EXI","name":"Existentialism","who":"Jean-Paul Sartre, Maxine Greene, A. S. Neill","desc":"You put the individual student at the center. School should help each person discover who they are and take responsibility for their own choices.","next":"Consider Maxine Greene or A. S. Neill (Summerhill School) for your Philosophy PowerPoint.","source":"","verified":false},{"key":"MON","name":"Child-Centered / Montessori","who":"Maria Montessori","desc":"You trust children's natural drive to learn when they have a carefully prepared environment and the freedom to choose their work.","next":"Consider Maria Montessori for your Philosophy PowerPoint.","source":"","verified":false}],"questions":[{"prompt":"The main purpose of school is to…","options":[{"text":"pass on the essential knowledge and skills every citizen needs.","profile":"ESS"},{"text":"develop the mind through humanity's greatest and most lasting ideas.","profile":"PER"},{"text":"help students solve real problems and live in a democracy.","profile":"PRO"},{"text":"prepare students to recognize and fix injustice in society.","profile":"SOC"},{"text":"help each student discover who they are and what they value.","profile":"EXI"}],"source":"","verified":false},{"prompt":"In my ideal classroom, the teacher is mainly…","options":[{"text":"an expert who explains content clearly and keeps high standards.","profile":"ESS"},{"text":"a guide who leads students through the great books by asking questions.","profile":"PER"},{"text":"a facilitator who sets up projects and supports students' inquiry.","profile":"PRO"},{"text":"a partner in dialogue who learns alongside students.","profile":"SOC"},{"text":"an observer who prepares the space and steps back.","profile":"MON"}],"source":"","verified":false},{"prompt":"The curriculum should be based on…","options":[{"text":"core subjects, including reading, writing, math, science, and history.","profile":"ESS"},{"text":"classic works of literature, philosophy, and science.","profile":"PER"},{"text":"students' interests and real-world experiences.","profile":"PRO"},{"text":"current social issues and students' communities.","profile":"SOC"},{"text":"students' own choices, the arts, and personal reflection.","profile":"EXI"}],"source":"","verified":false},{"prompt":"The best way to know whether a student has learned is…","options":[{"text":"tests that measure mastery of the standards.","profile":"ESS"},{"text":"seminar discussion and writing about big ideas.","profile":"PER"},{"text":"a project or product that solves a real problem.","profile":"PRO"},{"text":"action the student takes in the community.","profile":"SOC"},{"text":"the student's own self-assessment and portfolio.","profile":"EXI"}],"source":"","verified":false},{"prompt":"A young child walks into my room. I want them to…","options":[{"text":"learn the routines and basic skills that set them up for success.","profile":"ESS"},{"text":"hear great stories and start asking big questions.","profile":"PER"},{"text":"explore, build, and play with classmates.","profile":"PRO"},{"text":"choose their own activity from shelves of hands-on materials.","profile":"MON"},{"text":"feel free to be themselves and express their feelings.","profile":"EXI"}],"source":"","verified":false},{"prompt":"The educator I'd most like to have coffee with is…","options":[{"text":"E. D. Hirsch, the cultural literacy advocate.","profile":"ESS"},{"text":"Mortimer Adler, the Great Books champion.","profile":"PER"},{"text":"John Dewey, the leading voice of progressive education.","profile":"PRO"},{"text":"Paulo Freire, the critical pedagogue.","profile":"SOC"},{"text":"Maria Montessori, the physician turned educator.","profile":"MON"}],"source":"","verified":false}],"hints":[],"hintsEnabled":false}],"hintRules":{"first":1,"second":3}};

function load(){ try { const s = localStorage.getItem(STORE); return s ? JSON.parse(s) : null; } catch(e){ return null; } }

function changed(){ clearTimeout(saveTimer); saveTimer = setTimeout(() => { try { localStorage.setItem(STORE, JSON.stringify(cfg)); } catch(e){} }, 300); refreshStatus(); refreshAnswerKey(); }

/* ===================== Tiny DOM helper ===================== */
function h(tag, props = {}, ...kids){
  const el = document.createElement(tag);
  for (const [k,v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "class") el.className = v;
    else if (k === "value") el.value = v;
    else if (k === "checked") el.checked = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  return el;
}
let uid = 0;
/* A labelled input bound to obj[key]. opts: {type, help, rows, placeholder, content(bool: editing it un-verifies the item), item, onChange} */
function field(label, obj, key, opts = {}){
  const id = "f" + (++uid);
  const tag = opts.type === "textarea" ? "textarea" : "input";
  const input = h(tag, { id, type: tag === "input" ? (opts.type || "text") : null, rows: opts.rows, placeholder: opts.placeholder,
    value: obj[key] ?? "", min: opts.min, max: opts.max,
    oninput: e => {
      obj[key] = opts.type === "number" ? Number(e.target.value) : e.target.value;
      if (opts.item) unverify(opts.item, e.target);
      opts.onChange && opts.onChange(e);
      changed();
    }});
  return h("label", { class: "field", for: id }, h("span", {}, label, opts.help ? h("small", {}, " — " + opts.help) : null), input);
}
function select(label, obj, key, options, opts = {}){
  const id = "f" + (++uid);
  const s = h("select", { id, onchange: e => { const v = e.target.value; obj[key] = opts.number ? Number(v) : v;
    if (opts.item && opts.item.verified) { opts.item.verified = false; }
    changed(); opts.rerender ? render() : null; } },
    options.map(([v, t]) => h("option", { value: v }, t)));
  s.value = obj[key] ?? "";
  return h("label", { class: "field", for: id }, h("span", {}, label, opts.help ? h("small", {}, " — " + opts.help) : null), s);
}
/* Mark an item unchecked and update its checkbox without re-rendering (keeps typing focus). */
function unverify(item, el){
  if (!item.verified) return; item.verified = false;
  const box = el.closest(".entry"); if (box) { box.classList.remove("verified"); const c = box.querySelector(".verify input[type=checkbox]"); if (c) c.checked = false; }
}
/* Source + "I checked this" row shown on every gradable item. */
function verifyRow(item){
  return h("div", { class: "verify" },
    field("Source", item, "source", { placeholder: "e.g. Textbook ch. 3, p. 45" }),
    h("label", { class: "chk" }, h("input", { type: "checkbox", checked: item.verified === true, onchange: e => {
      item.verified = e.target.checked; e.target.closest(".entry").classList.toggle("verified", item.verified); changed(); } }),
      "✔ I checked this is correct"));
}
/* Generic list editor: move / delete / add. */
function listEditor(list, renderItem, opts){
  const wrap = h("div", {});
  list.forEach((it, i) => {
    const gradable = opts.gradable !== false;
    wrap.append(h("div", { class: "entry" + (gradable && it.verified ? " verified" : "") + (gradable ? "" : " verified") },
      h("div", { class: "head" }, h("strong", {}, `${opts.noun} ${i+1}`),
        h("button", { class: "small", title: "Move up", "aria-label": `Move ${opts.noun} ${i+1} up`, disabled: i === 0, onclick: () => { [list[i-1], list[i]] = [list[i], list[i-1]]; changed(); render(); } }, "▲"),
        h("button", { class: "small", title: "Move down", "aria-label": `Move ${opts.noun} ${i+1} down`, disabled: i === list.length - 1, onclick: () => { [list[i+1], list[i]] = [list[i], list[i+1]]; changed(); render(); } }, "▼"),
        h("button", { class: "small danger", "aria-label": `Delete ${opts.noun} ${i+1}`, onclick: () => { if (confirm(`Delete ${opts.noun.toLowerCase()} ${i+1}?`)) { list.splice(i, 1); changed(); render(); } } }, "Delete")),
      renderItem(it, i),
      gradable ? verifyRow(it) : null));
  });
  wrap.append(h("button", { onclick: () => { list.push(opts.blank()); changed(); render(); } }, `+ Add ${opts.noun.toLowerCase()}`));
  return wrap;
}
function hintsEditor(room){
  if (!ER.HINT_ROOMS.includes(room.type)) return null;      // reflection rooms have no wrong answers
  room.hints = (room.hints || []).slice(0, 2); while (room.hints.length < 2) room.hints.push("");
  const rules = ER.hintRules(cfg);
  const warn = h("div", { id: "hint-warnings" });
  const showWarnings = () => warn.replaceChildren(...ER.hintWarnings(room).map(w => h("div", { class: "warnline", role: "status" }, "⚠️ " + w.message + " Try pointing students toward how to find it instead.")));
  const box = h("div", { class: "box" },
    h("div", { class: "row", style: "align-items:center;justify-content:space-between" }, h("h3", { style: "margin:0" }, "💡 Hints"),
      h("label", { class: "switch" }, h("input", { type: "checkbox", id: "hints-toggle", checked: !!room.hintsEnabled,
        onchange: e => { room.hintsEnabled = e.target.checked; changed(); render(); } }), h("span", { class: "track", "aria-hidden": "true" }),
        room.hintsEnabled ? "Hints on" : "Hints off")),
    room.hintsEnabled ? [
      h("p", { class: "help" }, `Up to two hints. Hint 1 unlocks after ${rules.first} wrong ${rules.first === 1 ? "try" : "tries"} in this room, and hint 2 after ${Math.max(rules.first, rules.second)} (change this in Settings). Write hints that point students toward how to find the answer, not the answer itself.`),
      field("Hint 1: a gentle nudge", room.hints, 0, { type: "textarea", rows: 2, placeholder: "e.g. Look for one key idea in each description…", onChange: showWarnings }),
      field("Hint 2: a stronger nudge", room.hints, 1, { type: "textarea", rows: 2, placeholder: "e.g. Start with the ones you're surest about…", onChange: showWarnings }),
      warn
    ] : h("p", { class: "help", style: "margin:.4rem 0 0" }, "Students get no hints in this room. Turn hints on to write up to two.",
        (room.hints || []).some(x => String(x).trim()) ? " Your saved hints are kept." : ""));
  showWarnings();
  return box;
}

function choicesEditor(q){

  return h("div", { class: "field choices" }, h("span", {}, "Choices ", h("small", {}, "— select the correct one")),

/* Plain-text quiz format:
   Q: question            A: answer | other accepted answer
   - wrong choice         * correct choice
   Source: …              Verified: yes          (blank line between questions) */
function quizToText(qs){
  return qs.map(q => [ `Q: ${q.prompt}`,
    ...(q.kind === "choice" ? (q.choices || []).map((c, j) => [c, j]).filter(([c]) => String(c).trim()).map(([c, j]) => `${j === q.correct ? "*" : "-"} ${c}`) : [`A: ${q.answers}`]),
    q.source ? `Source: ${q.source}` : null, q.verified ? "Verified: yes" : null ].filter(x => x != null).join("\n")).join("\n\n");
}
function textToQuiz(text){
  const out = [], problems = [];
  text.replace(/\r/g, "").split(/\n\s*\n/).map(b => b.trim()).filter(Boolean).forEach((block, n) => {
    const q = blankQuestion(); q.choices = []; let hasA = false;
    block.split("\n").forEach(line => {
      const l = line.trim(); let m;
      if ((m = l.match(/^q\s*[:)]\s*(.*)$/i))) q.prompt = m[1];
      else if ((m = l.match(/^a\s*[:)]\s*(.*)$/i))) { q.answers = m[1]; hasA = true; }
      else if ((m = l.match(/^([*-])\s+(.*)$/))) { if (m[1] === "*") q.correct = q.choices.length; q.choices.push(m[2]); }
      else if ((m = l.match(/^source\s*:\s*(.*)$/i))) q.source = m[1];
      else if (/^verified\s*:\s*(yes|y|true|✔|✓)\s*$/i.test(l)) q.verified = true;
      else if (l) q.prompt = q.prompt ? q.prompt + " " + l : l;
    });
    q.kind = q.choices.length ? "choice" : "short";
    if (!q.choices.length) q.choices = ["", "", "", ""];
    if (!q.prompt) problems.push(`Question ${n+1} has no "Q:" line.`);
    if (q.kind === "short" && !hasA) problems.push(`Question ${n+1} has no "A:" answer line or choices.`);
    if (q.kind === "choice" && !block.split("\n").some(l => l.trim().startsWith("*"))) problems.push(`Question ${n+1}: mark the correct choice with * instead of -.`);
    out.push(q);
  });
  return { questions: out, problems };
}
function quizTextEditor(room, r){
  const ta = h("textarea", { class: "mono", rows: 18, "aria-label": "Questions as text", value: quizToText(room.questions) });
  const msg = h("div", {});
  return h("div", {},
    h("div", { class: "notice" }, h("strong", {}, "Format: "), "one question per paragraph (leave a blank line between questions). Questions you add or change here come back un-checked; tick ✔ I checked this is correct in the form view after checking them.",
      h("pre", { class: "mono", style: "margin:.4rem 0 0;white-space:pre-wrap" },
        "Q: Who wrote Democracy and Education (1916)?\nA: John Dewey | Dewey\nSource: Ch. 3, p. 45\n\nQ: Which philosophy focuses on the \"Great Books\"?\n- Essentialism\n* Perennialism\n- Existentialism\nVerified: yes")),
    ta, msg,
    h("div", { class: "row", style: "margin-top:.5rem" },
      h("button", { onclick: () => {
        const { questions, problems } = textToQuiz(ta.value);
        const same = (a, b) => a.prompt === b.prompt && a.kind === b.kind && (a.kind === "choice"
          ? a.correct === b.correct && JSON.stringify(a.choices.filter(c => String(c).trim())) === JSON.stringify((b.choices || []).filter(c => String(c).trim()))
          : a.answers === b.answers);
        questions.forEach(q => { if (q.verified) q.verified = room.questions.some(old => old.verified && same(q, old)); });
        msg.replaceChildren(problems.length ? h("div", { class: "errors" }, h("strong", {}, "Please fix:"), h("ul", {}, problems.map(p => h("li", {}, p)))) : "");
        if (problems.length) return;
        room.questions = questions; changed(); toast(`Saved ${questions.length} questions.`); quizText.delete(room); render();
      } }, "Use this text")));
}

      field("Certificate line", cfg.finish, "certificateLine", { help: "after the student's name" }),
      field("Instructions under the certificate", cfg.finish, "instructions", { type: "textarea", rows: 2 })),
    h("div", { class: "box" }, h("h3", {}, "Grade sent to Moodle/Canvas (SCORM version)"),
      select("Grading", cfg.scoring, "mode", [["completion", "Completion: 100% for finishing"], ["deductions", "Accuracy: points off for hints and wrong tries"]], { rerender: true }),
      deductions ? h("div", { class: "row" },
        field("Points off per hint", cfg.scoring, "hintPenalty", { type: "number", min: 0, max: 100 }),
        field("Points off per wrong try", cfg.scoring, "wrongPenalty", { type: "number", min: 0, max: 100 }),
        field("Lowest possible score", cfg.scoring, "minScore", { type: "number", min: 0, max: 100, help: "for finishing" })) : null,
      h("p", { class: "help" }, "The plain HTML version can't send grades. Use the exit password with an LMS quiz instead.")) ];
}
function editRoom(r){
  const room = cfg.rooms[r]; const t = TYPES[room.type];
  const body = { matching: editMatching, quiz: editQuiz, ordering: editOrdering, sorting: editSorting, reflection: editReflection }[room.type];
  return [ h("div", { class: "pagehead" },
      h("div", {}, h("span", { class: "chip" }, `${t ? t.icon + " " + t.name : room.type}`), h("h2", {}, `Room ${r+1}: ${room.title || "Untitled"}`), h("p", { class: "help" }, t ? t.desc : "")),
      h("button", { class: "primary", id: "preview-room", onclick: () => openPreview(r + 1) }, "▶ Preview this room")),
    answerKeyBox(room),
    body ? body(room, r) : h("p", {}, "This room type can't be edited here.") ];
}

/* Teacher-only answer key for the room being edited; refreshed as you type. */
let keyOpen = true;
function answerKeyBox(room){
  const d = h("details", { class: "answerkey", id: "answer-key", open: keyOpen, ontoggle: e => { keyOpen = e.target.open; } },
    h("summary", {}, "👁 Answer key ", h("span", { class: "help", style: "margin:0;font-weight:400" }, "(only you see this)")), h("ul", {}));
  fillKey(d, room); return d;
}
function fillKey(d, room){ d.querySelector("ul").innerHTML = ER.answerKey(room).map(l => `<li>${ER.fmt(l)}</li>`).join("") || "<li>Nothing to answer yet.</li>"; }
function refreshAnswerKey(){ const d = document.getElementById("answer-key"); if (d && typeof sel === "number" && cfg.rooms[sel]) fillKey(d, cfg.rooms[sel]); }

/* ===================== Navigation & status ===================== */
function roomStatus(r){ const items = ER.reviewItems({ rooms: [cfg.rooms[r]] }); const left = items.filter(x => x.item.verified !== true).length; return { left, total: items.length }; }
function renderNav(){
  const nav = document.getElementById("nav");
  const item = (key, icon, label, pill) => h("div", { class: "item" + (sel === key ? " sel" : ""), tabindex: 0, role: "button", "aria-current": sel === key ? "page" : null,
      onclick: () => { sel = key; render(); window.scrollTo({ top: 0 }); }, onkeydown: e => { if (e.target === e.currentTarget && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); sel = key; render(); } } },
    h("span", { class: "ic", "aria-hidden": "true" }, icon), h("span", { class: "t" }, h("span", {}, label), pill || null));
  const addSel = h("select", { "aria-label": "Add a room", onchange: e => { if (!e.target.value) return; cfg.rooms.push(TYPES[e.target.value].blank()); sel = cfg.rooms.length - 1; changed(); render(); } },
    h("option", { value: "" }, "+ Add a room…"), Object.entries(TYPES).map(([k, t]) => h("option", { value: k }, t.name)));
  nav.replaceChildren(
    item("settings", "⚙️", "Settings"), item("intro", "📜", "Story & intro"),
    h("h3", {}, "Rooms"),
    ...cfg.rooms.map((room, r) => {
      const st = roomStatus(r);
      const pill = st.total ? h("span", { class: "pill" + (st.left ? "" : " ok"), title: `${st.total - st.left} of ${st.total} checked` }, st.left ? `${st.left} to check` : "✔ checked") : null;
      const el = item(r, TYPES[room.type]?.icon || "🚪", `${r+1}. ${room.title || "Untitled"}`, pill);
      el.append(h("span", { class: "acts" },
        h("button", { class: "small", title: "Move up", "aria-label": `Move room ${r+1} up`, disabled: r === 0, onclick: e => { e.stopPropagation(); [cfg.rooms[r-1], cfg.rooms[r]] = [cfg.rooms[r], cfg.rooms[r-1]]; if (sel === r) sel = r - 1; else if (sel === r - 1) sel = r; changed(); render(); } }, "▲"),
        h("button", { class: "small danger", title: "Delete room", "aria-label": `Delete room ${r+1}`, onclick: e => { e.stopPropagation(); if (confirm(`Delete room ${r+1} "${room.title}"? This can't be undone.`)) { cfg.rooms.splice(r, 1); sel = "settings"; changed(); render(); } } }, "✕")));
      return el;
    }),
    addSel,
    h("h3", {}, "End"), item("finish", "🏁", "Finish & grading"),
    h("p", { class: "help", style: "margin-top:1rem" }, "Changes save automatically in this browser. Use ", h("strong", {}, "Save project"), " or ", h("strong", {}, "Export"), " to keep a file you can share or reopen."));
}
function refreshStatus(){
  const st = ER.reviewStatus(cfg); const pct = st.total ? Math.round(100 * st.verified / st.total) : 100;
  document.getElementById("meter").replaceChildren(h("div", { class: "bar" }, h("i", { style: `width:${pct}%` })), `${st.verified} of ${st.total} checked`);
  clearTimeout(refreshStatus.t); refreshStatus.t = setTimeout(renderNav, 400);
}
function render(){
  if (typeof sel === "number" && !cfg.rooms[sel]) sel = "settings";
  renderNav(); refreshStatus();
  const main = document.getElementById("main");
  const st = ER.reviewStatus(cfg);
  const banner = st.unverified ? h("div", { class: "notice" }, "⚠️ ", h("strong", {}, `${st.unverified} of ${st.total} items haven't been checked yet.`),
    " Everything in the sample was written with AI help and may contain mistakes. Check each item against your textbook or sources, then tick ", h("em", {}, "✔ I checked this is correct"),
    ". Students see a “Draft” notice until every item is checked. Tip: ", h("strong", {}, "Answer sheet"), " lists everything with the answers, ready to print.") : null;
  const view = sel === "settings" ? editSettings() : sel === "intro" ? editIntro() : sel === "finish" ? editFinish() : editRoom(sel);
  main.replaceChildren(banner || "", ...view.flat(Infinity));
}

/* ===================== Files ===================== */
function download(name, data, type){
  const url = URL.createObjectURL(new Blob([data], { type }));
  const a = h("a", { href: url, download: name }); document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}
function toast(text){ document.querySelectorAll(".toast").forEach(t => t.remove()); const t = h("div", { class: "toast", role: "status" }, text); document.body.append(t); setTimeout(() => t.remove(), 2600); }
function checkReady(action){
  const errs = ER.validate(cfg);
  if (errs.length) { showErrors(errs); return false; }
  const st = ER.reviewStatus(cfg);
  if (st.unverified && action === "export" && !confirm(`${st.unverified} of ${st.total} items haven't been checked yet.\n\nStudents will see a "Draft" notice saying answers may contain errors.\n\nExport anyway?`)) return false;
  return true;
}
function showErrors(errs){
  overlay("Fix these before previewing or exporting", h("div", { class: "sheet" },
    h("div", { class: "errors" }, h("ul", {}, errs.map(e => h("li", {}, e))))));
}
function overlay(title, content, extraButtons = []){
  const close = () => { o.remove(); document.removeEventListener("keydown", onKey); };
  const onKey = e => { if (e.key === "Escape") close(); };
  const o = h("div", { class: "overlay", role: "dialog", "aria-label": title },
    h("div", { class: "bar" }, h("span", {}, title), ...extraButtons, h("button", { onclick: close, id: "overlay-close" }, "✕ Close")), content);
  document.body.append(o); document.addEventListener("keydown", onKey);
  o.querySelector("#overlay-close").focus();
  return o;
}
const gameHtml = () => ER.buildGame(GAME_TEMPLATE, cfg);
const slug = () => ER.fileSlug(cfg.meta?.title);

/* ===================== Student preview ===================== */
/* Full-screen "student view" of the game. The bar on top is the teacher's: jump to any room,
   show the answers, restart, or exit (button or Esc). Nothing is saved or graded. */
function openPreview(startRoom = 0){
  if (!checkReady("preview")) return;
  document.querySelector(".preview")?.remove();
  const n = cfg.rooms.length;
  let current = 0, showKey = false;
  const frame = h("iframe", { title: "Student view of the escape room" });
  const send = msg => frame.contentWindow && frame.contentWindow.postMessage(msg, "*");
  const steps = [["Intro", 0], ...cfg.rooms.map((r, i) => [String(i + 1), i + 1, r.title]), ["🏁", n + 1, "Certificate"]];
  const roomBtns = steps.map(([label, k, title]) => h("button", { "data-room": k, title: title || (k === 0 ? "Intro" : ""), "aria-label": k === 0 ? "Go to intro" : k > n ? "Go to certificate" : `Go to room ${k}: ${title}`,
    onclick: () => send({ er: "goto", room: k }) }, label));
  const mark = () => roomBtns.forEach(b => b.setAttribute("aria-current", +b.dataset.room === current ? "step" : "false"));
  const prev = h("button", { "aria-label": "Previous room", onclick: () => send({ er: "goto", room: Math.max(0, current - 1) }) }, "◀");
  const next = h("button", { "aria-label": "Next room", onclick: () => send({ er: "goto", room: Math.min(n + 1, current + 1) }) }, "▶");
  const keyToggle = h("label", { class: "switch" }, h("input", { type: "checkbox", id: "preview-answers", onchange: e => { showKey = e.target.checked; send({ er: "key", on: showKey }); } }),
    h("span", { class: "track", "aria-hidden": "true" }), "Show answers");
  const exit = () => { layer.remove(); window.removeEventListener("message", onMsg); document.removeEventListener("keydown", onKey); document.getElementById("btn-preview").focus(); };
  const onKey = e => { if (e.key === "Escape") exit(); };
  const onMsg = e => {
    if (e.source !== frame.contentWindow) return;
    if (e.data?.er === "escape") return exit();
    if (e.data?.er === "room") { current = e.data.room; mark(); prev.disabled = current === 0; next.disabled = current === n + 1; }
  };
  const load = (room) => {
    frame.onload = () => { if (showKey) send({ er: "key", on: true }); if (room) send({ er: "goto", room }); };
    frame.srcdoc = ER.buildGame(GAME_TEMPLATE, { ...cfg, __preview: true });
  };
  const layer = h("div", { class: "preview", role: "dialog", "aria-label": "Student preview" },
    h("div", { class: "pbar" },
      h("div", { class: "badge" }, h("i", {}, "PREVIEW"), "Student view"),
      h("div", { class: "rooms", role: "group", "aria-label": "Jump to a room" }, prev, ...roomBtns, next),
      h("div", { class: "ctrl" }, keyToggle,
        h("button", { onclick: () => load(0), title: "Start over from the intro" }, "↻ Restart"),
        h("button", { class: "exit", id: "preview-exit", onclick: exit }, "✕ Exit preview"))),
    frame);
  document.body.append(layer);
  window.addEventListener("message", onMsg); document.addEventListener("keydown", onKey);
  load(startRoom);
  layer.querySelector("#preview-exit").focus();
}
document.getElementById("btn-preview").onclick = () => openPreview(typeof sel === "number" ? sel + 1 : 0);
document.getElementById("btn-export").onclick = () => {
  const box = h("div", { class: "sheet" },
    h("h2", {}, "Export for students"),
    h("div", { class: "box" }, h("h3", {}, "SCORM package (.zip) for Moodle or Canvas"),
      h("p", { class: "help" }, "Grades go to the gradebook automatically. Moodle: Add an activity → SCORM package. Canvas: SCORM tool. Upload the zip without unzipping it."),
      h("button", { id: "export-scorm", class: "primary", onclick: () => { if (checkReady("export")) { download(`${slug()}-SCORM.zip`, ER.scorm(gameHtml(), cfg.meta.title), "application/zip"); toast("SCORM package downloaded."); } } }, "⬇ Download SCORM .zip")),
    h("div", { class: "box" }, h("h3", {}, "Web page (.html)"),
      h("p", { class: "help" }, "One file that works anywhere: double-click it, upload it as a Moodle/Canvas file, or put it on a website. Pair it with the exit password and an LMS quiz for credit. You can also reopen this file in the editor later."),
      h("button", { id: "export-html", class: "primary", onclick: () => { if (checkReady("export")) { download(`${slug()}.html`, gameHtml(), "text/html"); toast("Game file downloaded."); } } }, "⬇ Download game .html")));
  overlay("Export", box);
};
document.getElementById("btn-save").onclick = () => { download(`${slug()}-project.json`, JSON.stringify(cfg, null, 2), "application/json"); toast("Project saved. Open it again with Open…"); };
document.getElementById("btn-open").onclick = () => document.getElementById("file").click();
document.getElementById("file").onchange = async e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  try {
    const text = await f.text();
    const next = /\.html?$/i.test(f.name) ? ER.configFromHtml(text) : JSON.parse(text);
    if (!next || !Array.isArray(next.rooms)) throw new Error("This file doesn't contain an escape room.");
    if (!confirm(`Open "${next.meta?.title || f.name}"? This replaces what's in the editor now (save it first if you need it).`)) return;
    cfg = next; sel = "settings"; changed(); render(); toast("Opened " + f.name);
  } catch (err) { alert("Couldn't open that file: " + err.message); }
};
document.getElementById("btn-new").onclick = () => {
  const box = h("div", { class: "sheet" },
    h("h2", {}, "Start a new escape room"),
    h("p", { class: "notice" }, "This replaces what's in the editor now. Save project first if you want to keep it."),
    h("div", { class: "row" },
      h("button", { id: "new-blank", onclick: () => { cfg = blankConfig(); sel = "settings"; changed(); render(); document.querySelector(".overlay")?.remove(); toast("Started a blank escape room."); } }, "Blank (one question room)"),
      h("button", { id: "new-sample", onclick: () => { cfg = clone(SAMPLE); sel = "settings"; changed(); render(); document.querySelector(".overlay")?.remove(); toast("Loaded the sample escape room."); } }, "Copy of the sample (Old Schoolhouse)")));
  overlay("New", box);
};
function blankConfig(){
  return { schema: 1, meta: { title: "New Escape Room", course: cfg.meta?.course || "", codePrefix: cfg.meta?.codePrefix || "", learningOutcome: "" },
    intro: { heading: "You're locked in!", story: "Solve every room to escape." },
    scoring: { mode: "completion", hintPenalty: 5, wrongPenalty: 2, minScore: 50 },
    finish: { exitPassword: "", certificateLine: "escaped by mastering this chapter", instructions: "" },
    rooms: [TYPES.quiz.blank()] };
}

/* ===================== Review sheet ===================== */
document.getElementById("btn-review").onclick = () => {
  const E = ER.esc, F = ER.fmt;
  const chk = it => `<span class="ck">${it.verified ? "☑" : "☐"}</span>`;
  const src = it => it.source ? `<div class="src">Source: ${E(it.source)}</div>` : `<div class="src none">Source: ________________________</div>`;
  const rooms = cfg.rooms.map((r, i) => {
    let body = "";
    if (r.type === "matching") { const m = ER.matching(r);
      body = `<p><strong>Lock combination:</strong> <code>${E(m.answer)}</code></p><ol>${r.cards.map(c => `<li>${chk(c)} <strong>${F(c.term)}</strong>${c.detail ? ` (${F(c.detail)})` : ""} — code <code>${E(m.code[r.cards.indexOf(c)])}</code><br>${c.clue ? "Clue: " + F(c.clue) : "<em>Decoy card (no clue)</em>"}${src(c)}</li>`).join("")}</ol>`; }
    if (r.type === "quiz") body = `<ol>${r.questions.map(q => `<li>${chk(q)} ${F(q.prompt)}<br><strong>Answer:</strong> ${q.kind === "choice" ? (q.choices || []).filter(c=>String(c).trim()).map((c, j) => j === q.correct ? `<u><strong>${F(c)}</strong></u>` : F(c)).join(" · ") : E(q.answers)}${src(q)}</li>`).join("")}</ol>`;
    if (r.type === "ordering") body = `<p>Correct order:</p><ol>${r.items.map(it => `<li>${chk(it)} ${F(it.text)}${it.label ? ` <strong>(${F(it.label)})</strong>` : ""}${src(it)}</li>`).join("")}</ol>`;
    if (r.type === "sorting") body = `<ol>${r.items.map(it => `<li>${chk(it)} ${F(it.text)} → <strong>${E(r.categories[it.category] || "?")}</strong>${src(it)}</li>`).join("")}</ol>`;
    if (r.type === "reflection") body = `<p>Results:</p><ol>${r.profiles.map(p => `<li>${chk(p)} <strong>${E(p.name)}</strong> — ${F(p.desc)}${p.who ? `<br>Thinkers: ${F(p.who)}` : ""}${p.next ? `<br>Next step: ${F(p.next)}` : ""}${src(p)}</li>`).join("")}</ol>
      <p>Questions:</p><ol>${r.questions.map(q => `<li>${chk(q)} ${F(q.prompt)}<ul>${(q.options||[]).map(o => `<li>${F(o.text)} → ${E((r.profiles.find(p => p.key === o.profile) || {}).name || "?")}</li>`).join("")}</ul>${src(q)}</li>`).join("")}</ol>`;
    const hints = (r.hints || []).length ? `<p class="hints"><strong>Hints:</strong></p><ol class="hints">${r.hints.map(x => `<li>${F(x)}</li>`).join("")}</ol>` : "";
    return `<section><h2>Room ${i+1}: ${E(r.title)}</h2><p class="story">${F(r.story || "")}</p>${r.reference ? `<p>Reference shown to students: ${F(r.reference)}</p>` : ""}${body}${hints}</section>`;
  }).join("");
  const st = ER.reviewStatus(cfg);
  const doc = `<!DOCTYPE html><html><head><meta charset="utf-8"><title>Review sheet: ${E(cfg.meta.title)}</title><style>
    body{font-family:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;max-width:46rem;margin:2rem auto 3rem;padding:0 1.25rem;color:#1b1710;line-height:1.5;font-size:1.0625rem}
    h1{font-size:1.75rem;line-height:1.2;margin:0 0 .6rem;padding-bottom:.6rem;border-bottom:3px double #8a6a2a}
    h2{font-size:1.25rem;line-height:1.25;margin:2.25rem 0 .6rem;padding:.4rem .75rem;background:#f4ecd8;border-left:5px solid #8c5b33;border-radius:0 6px 6px 0;break-after:avoid}
    ol{padding-left:1.6rem} li{margin:.6rem 0;break-inside:avoid} ul li{margin:.2rem 0}
    .ck{font-size:1.2rem;line-height:1} .src{font-size:.875rem;color:#4a4335;margin-top:.15rem} .src.none{color:#857c6b}
    .story{font-style:italic;color:#4a4335} .hints{font-size:.9375rem;color:#4a4335}
    code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.95em;font-weight:700;background:#f4ecd8;border:1px solid #d9cba8;border-radius:4px;padding:.05rem .4rem}
    section{break-inside:auto}
    @media print{.noprint{display:none}body{margin:0;max-width:none;padding:0;font-size:11pt}h2{background:none;padding-left:.6rem}code{background:none}}</style></head><body>
    <h1>Review sheet: ${E(cfg.meta.title)}</h1>
    <p>${E(cfg.meta.course || "")} · ${st.verified} of ${st.total} items checked · ☐ = not yet checked<br>
    Exit password: <strong>${E(cfg.finish?.exitPassword || "(none)")}</strong> · Grading: ${cfg.scoring?.mode === "deductions" ? "accuracy" : "completion"}</p>
    <p><em>Check every item against your textbook or sources. Content written with AI help can contain mistakes. Mark items as checked in the editor.</em></p>
    ${rooms}</body></html>`;
  const frame = h("iframe", { title: "Review sheet" }); frame.srcdoc = doc;
  overlay("Review sheet (contains answers: for instructors only)", frame, [h("button", { onclick: () => frame.contentWindow.print() }, "🖨️ Print")]);
};

render();
</script>
</body>
