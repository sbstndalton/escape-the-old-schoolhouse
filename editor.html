/* ===================== Display options: High contrast and Readable text =====================
   Remembered in this browser under the same keys as the game, so the student preview follows them.
   High contrast also follows the system (prefers-contrast: more, and forced colours) until the teacher chooses. */
const PREF = { contrast: "escape-room-contrast", readable: "escape-room-readable" };
const prefGet = k => { try { return localStorage.getItem(k); } catch(e){ return null; } };
const prefSet = (k, v) => { try { localStorage.setItem(k, v); } catch(e){} };
const mqContrast = matchMedia("(prefers-contrast: more)"), mqForced = matchMedia("(forced-colors: active)");
function contrastOn(){ const s = prefGet(PREF.contrast); return s === "on" || mqForced.matches || (s !== "off" && mqContrast.matches); }
function readableOn(){ return prefGet(PREF.readable) === "on"; }
function applyDisplay(){
  const d = document.documentElement;
  if (contrastOn()) d.dataset.contrast = "more"; else delete d.dataset.contrast;
  if (readableOn()) d.dataset.readable = "on"; else delete d.dataset.readable;
  const c = document.getElementById("contrast-toggle"), r = document.getElementById("readable-toggle");
  if (c) c.checked = contrastOn(); if (r) r.checked = readableOn();
  document.querySelectorAll("main textarea, #wizard textarea").forEach(grow);
}
[mqContrast, mqForced].forEach(m => m.addEventListener && m.addEventListener("change", applyDisplay));

/* Said quietly to screen readers when something changes that sighted teachers simply see. */
let sayTimer = 0;
function say(text){ const live = document.getElementById("live"); clearTimeout(sayTimer); live.textContent = ""; sayTimer = setTimeout(() => { live.textContent = text; }, 80); }

/* Modal layers (folders, confirm slips, the preview, the phone cabinet). While one is open everything behind it is
   inert, Tab stays inside it, Esc closes the top one, and focus goes back to whatever opened it. */
const modals = [];
function modalOpen(el, onEsc, opener){
  const behind = [...document.body.children].filter(n => n !== el && !n.inert && !n.hasAttribute("data-keep") && n.tagName !== "SCRIPT");
  behind.forEach(n => { n.inert = true; });
  const m = { el, onEsc, back: opener || document.activeElement, behind };
  modals.push(m); return m;
}
function modalClose(m, refocus = true){
  const i = modals.indexOf(m); if (i < 0) return;
  modals.splice(i, 1); m.behind.forEach(n => { n.inert = false; });
  if (refocus) focusBack(m.back);
}
const canFocus = el => el && el.isConnected && !el.disabled && !el.closest("[inert]") && el.getClientRects().length > 0 && getComputedStyle(el).visibility !== "hidden";
function focusBack(el){
  if (canFocus(el)) return el.focus();
  const top = modals[modals.length - 1];
  if (top) return (top.el.querySelector("#overlay-close,#cabinet-close,button") || top.el).focus();
  if (el && el.closest && el.closest("#tools") && canFocus(more)) return more.focus();     // the file list on a phone has folded away
  document.getElementById("page-title")?.focus();
}
const TABBABLE = "a[href],button:not(:disabled),input:not(:disabled):not([type=hidden]),textarea:not(:disabled),summary,iframe,[tabindex]:not([tabindex='-1'])";
document.addEventListener("keydown", e => {
  if (e.key === "Tab") {
    const top = modals[modals.length - 1]; if (!top || top.el.querySelector("iframe")) return;
    const stops = [...top.el.querySelectorAll(TABBABLE)].filter(el => canFocus(el) && !(el.type === "radio" && !el.checked && top.el.querySelector(`input[type=radio][name="${el.name}"]:checked`)));
    if (!stops.length) return;
    const first = stops[0], last = stops[stops.length - 1];
    if (e.shiftKey && (document.activeElement === first || !top.el.contains(document.activeElement))) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && (document.activeElement === last || !top.el.contains(document.activeElement))) { e.preventDefault(); first.focus(); }
    return;
  }
  if (e.key !== "Escape") return;
  if (tipClose) { tipClose(); e.preventDefault(); return; }                                 // a help slip goes first, whatever is under it
  if (addOpen) { addOpen = false; renderNav(); document.getElementById("add-room").focus(); e.preventDefault(); return; }
  const top = modals[modals.length - 1];
  if (top) { e.preventDefault(); top.onEsc(); return; }
  if (tools.classList.contains("open")) { closeTools(); more.focus(); }
});

/* ===================== Saving =====================
   Work is saved in this browser as the teacher types. Alongside it we keep a little bookkeeping (meta): how many
   changes there have been, and how many there were when the last backup file was downloaded, so the page can say
   plainly where the work is and warn before the tab is closed with changes that exist nowhere else. */
let meta = readMeta();
let stored = !!load();                // is anything of this escape room saved in this browser yet?
let saveTimer = null;
function saveNow(){
  clearTimeout(saveTimer); saveTimer = null;
  if (!curId) { curId = newId(); lib.list.push({ id: curId, title: "", created: Date.now(), updated: 0 }); }
  lib.current = curId;
  if (lsSet(keyOf(curId), JSON.stringify(cfg))) { meta.savedAt = Date.now(); meta.failed = false; stored = true; } else meta.failed = true;
  const e = lib.list.find(x => x.id === curId); e.title = cfg.meta?.title || ""; e.updated = Date.now();
  writeLib(); saveMeta();
  refreshSave();
}
function saveMeta(){ if (curId) lsSet(keyOf(curId, true), JSON.stringify(meta)); }
/* Open another escape room from this browser's list. */
function switchTo(id){
  if (saveTimer) saveNow();
  const next = load(id); if (!next) return false;
  curId = id; lib.current = id; writeLib(); cfg = next; meta = readMeta(id); stored = true;
  sel = "settings"; tabOf.clear(); refreshSave(); render(); return true;
}
function changed(){ meta.rev++; clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 300); refreshStatus(); refreshAnswerKey(); }
// Changes that are only in this browser: nothing has been backed up since they were made.
const unbacked = () => meta.rev > meta.backupRev;
addEventListener("beforeunload", e => { if (saveTimer) saveNow(); if (unbacked()) { e.preventDefault(); e.returnValue = ""; } });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden" && saveTimer) saveNow(); });
addEventListener("pagehide", () => { if (saveTimer) saveNow(); });
const when = t => { const d = new Date(t), now = new Date(), time = d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  return d.toDateString() === now.toDateString() ? "at " + time : "on " + d.toLocaleDateString([], { weekday: "long", day: "numeric", month: "long" }) + " at " + time; };
/* The one line that says where the work is: "Saved in this browser at 3:42 pm. Not backed up yet." */
function saveWords(){
  if (meta.failed) return ["This browser couldn't save your work.", "Download a backup to keep it."];
  if (!stored) return ["Nothing saved in this browser yet.", "If you worked on this before, open your saved file."];
  const saved = meta.savedAt ? `Saved in this browser ${when(meta.savedAt)}.` : "Saved in this browser.";
  if (!meta.backupAt) return [saved, "Not backed up yet."];
  return [saved, unbacked() ? `Changed since your backup ${when(meta.backupAt)}.` : `Backup downloaded ${when(meta.backupAt)}.`];
}
const saveBoxes = new Set();         // every place the save line is shown (the cabinet, the guided steps)
function refreshSave(){ saveBoxes.forEach(fill => fill()); }
function saveStatus(id, cls){
  const line = h("p", { class: "line", id: id + "-line" });
  const help = tip("Your work is saved in this browser, on this computer only, as you type. Another browser or computer won't have it, and clearing your browsing history removes it. A backup is one file you keep: it plays as the game in any browser, and you can open it here to keep working.", "saving");
  const openBtn = h("button", { type: "button", class: "cut", id: id + "-open", onclick: () => document.getElementById("file").click() }, icon("folder"), "Open your saved file");
  const backBtn = h("button", { type: "button", class: "cut", id: id + "-backup", onclick: backup }, icon("save"), "Download a backup");
  const box = h("div", { class: cls, id }, line, openBtn, backBtn, help);
  const fill = () => {
    const [a, b] = saveWords(); line.replaceChildren(h("span", {}, a), " ", h("span", {}, b));
    const fresh = !stored && !meta.failed;
    const moving = document.activeElement === (fresh ? backBtn : openBtn);
    openBtn.hidden = !fresh; backBtn.hidden = fresh; if (moving) (fresh ? openBtn : backBtn).focus();
  };
  saveBoxes.add(fill); fill();
  return box;
}
/* A backup is the game file itself: it plays in any browser, and it opens again in this editor. */
const fileName = s => String(s || "").replace(/[\\/:*?"<>|\u0000-\u001f]+/g, " ").replace(/\s+/g, " ").trim().slice(0, 80) || "Escape room";
function backedUp(){ meta.backupRev = meta.rev; meta.backupAt = Date.now(); saveNow(); }
function backup(){
  download(`${fileName(cfg.meta?.title)} (backup).html`, gameHtml(), "text/html"); backedUp();
  toast("Backup downloaded to your Downloads folder. Keep it somewhere safe. To work on it again, open it in this editor.");
}

/* The sample was written with AI help; a teacher's own words were not. Items whose wording is still the sample's
   (and that no one has checked) are the only ones the "written with AI help" warning is about. */
const stripCheck = o => JSON.stringify(o, (k, v) => (k === "verified" || k === "source") ? undefined : v);
let sampleSigs = null;
function sampleUnchecked(c){
  if (!sampleSigs) sampleSigs = new Set(ER.reviewItems(SAMPLE).map(x => stripCheck(x.item)));
  return ER.reviewItems(c).filter(x => x.item.verified !== true && sampleSigs.has(stripCheck(x.item))).length;
}

/* ===================== Tiny DOM helper ===================== */
function h(tag, props = {}, ...kids){
  const el = document.createElement(tag);
  for (const [k,v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "class") el.className = v;
    else if (k === "value") el.value = v;
    else if (k === "checked") el.checked = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat(Infinity)) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  return el;
}

/* Plain-text quiz format:
   Q: question            A: answer | other accepted answer
   - wrong choice         * correct choice
   Source: …              Verified: yes          (blank line between questions) */
function quizToText(qs){
  return qs.map(q => [ `Q: ${q.prompt}`,
    ...(q.kind === "choice" ? (q.choices || []).map((c, j) => [c, j]).filter(([c]) => String(c).trim()).map(([c, j]) => `${j === q.correct ? "*" : "-"} ${c}`) : [`A: ${q.answers}`]),
    q.source ? `Source: ${q.source}` : null, q.verified ? "Verified: yes" : null ].filter(x => x != null).join("\n")).join("\n\n");
}
function textToQuiz(text){
  const out = [], problems = [];
  text.replace(/\r/g, "").split(/\n\s*\n/).map(b => b.trim()).filter(Boolean).forEach((block, n) => {
    const q = blankQuestion(); q.choices = []; let hasA = false;
    block.split("\n").forEach(line => {
      const l = line.trim(); let m;
      if ((m = l.match(/^q\s*[:)]\s*(.*)$/i))) q.prompt = m[1];
      else if ((m = l.match(/^a\s*[:)]\s*(.*)$/i))) { q.answers = m[1]; hasA = true; }
      else if ((m = l.match(/^([*-])\s+(.*)$/))) { if (m[1] === "*") q.correct = q.choices.length; q.choices.push(m[2]); }
      else if ((m = l.match(/^source\s*:\s*(.*)$/i))) q.source = m[1];
      else if (/^verified\s*:\s*(yes|y|true|✔|✓)\s*$/i.test(l)) q.verified = true;
      else if (l) q.prompt = q.prompt ? q.prompt + " " + l : l;
    });
    q.kind = q.choices.length ? "choice" : "short";
    if (!q.choices.length) q.choices = ["", "", "", ""];
    if (!q.prompt) problems.push(`Question ${n+1} has no "Q:" line.`);
    if (q.kind === "short" && !hasA) problems.push(`Question ${n+1} has no "A:" answer line or choices.`);
    if (q.kind === "choice" && !block.split("\n").some(l => l.trim().startsWith("*"))) problems.push(`Question ${n+1}: mark the correct choice with * instead of -.`);
    out.push(q);
  });
  return { questions: out, problems };
}
function quizTextEditor(room, r){
  const ta = h("textarea", { class: "mono", id: "quiz-text", rows: 12, value: quizToText(room.questions), spellcheck: "false", oninput: e => grow(e.target) });
  const msg = h("div", { id: "quiz-text-errors" });
  return h("div", {},
    h("details", { class: "crib" }, h("summary", {}, "How to type the questions"),
      h("pre", {}, "One question per paragraph, with a blank line between questions.\nQuestions you add or change here come back without their seal;\npress the seal in the form view after checking them.\n\n" +
        "Q: Who wrote Democracy and Education (1916)?\nA: John Dewey | Dewey\nSource: Ch. 3, p. 45\n\nQ: Which philosophy focuses on the \"Great Books\"?\n- Essentialism\n* Perennialism\n- Existentialism\nVerified: yes")),
    h("div", { class: "field" }, h("label", { for: "quiz-text" }, "Questions as text"), ta), msg,
    h("div", { class: "actions" },
      h("button", { class: "stamp", onclick: () => {
        const { questions, problems } = textToQuiz(ta.value);
        const same = (a, b) => a.prompt === b.prompt && a.kind === b.kind && (a.kind === "choice"
          ? a.correct === b.correct && JSON.stringify(a.choices.filter(c => String(c).trim())) === JSON.stringify((b.choices || []).filter(c => String(c).trim()))
          : a.answers === b.answers);

      } }, icon("tick"), "Use this text")));

/* ===================== Accessibility check =====================

   export, and every note says where it is, what was found, and what to do, in plain words.
   a11yCheck(config) returns [{ rule, page, tab, where, text, quote }]; page is "settings", "intro", "finish" or a room index. */
const A11Y_LIMITS = { dials: 8, cards: 12, clue: 300, story: 900, prompt: 300, item: 200, hint: 300, answer: 40, choices: 6, orderItems: 8, sortItems: 14, roomWords: 500 };
const A11Y_THING = "(?:books?|cards?|buttons?|box(?:es)?|ones?|portraits?|frames?|pictures?|keys?|stamps?|slips?|levers?|doors?|locks?|labels?|text|letters?|words?|lines?|circles?|squares?|dots?|marks?|tabs?|drawers?|spines?|items?|clues?|answers?|options?|arrows?|icons?|lights?|numbers?|codes?|sections?|parts?|areas?|shapes?|stars?|rows?|columns?|shel(?:f|ves)|dials?)";

  colour: [
    new RegExp("\\b(?:the|a|an|this|that|these|those|each|every|which|what|any)\\s+(?:(?:bright|dark|light|pale)\\s+)?(?:red|green|blue|yellow|orange|purple|pink|brown|gr[ae]y|black|white|gold(?:en)?|silver)\\s+" + A11Y_THING + "\\b", "i"),
    /\b(?:marked|shown|written|highlighted|printed|painted|circled|underlined|glow(?:s|ing)?)\s+in\s+(?:red|green|blue|yellow|orange|purple|pink|gold|silver)\b/i,
    /\b(?:colou?r[- ]coded|the same colou?r|different colou?rs?|by (?:its |their )?colou?r|matching colou?rs?|the colou?r of the)\b/i ],
  position: [
    /\b(?:on|to|at|in|from)\s+(?:the|your)\s+(?:far\s+|upper\s+|lower\s+)?(?:left|right|top|bottom)\b(?!\s+(?:to|of way)\b)/i,
    /\b(?:top|bottom|upper|lower)[ -](?:left|right)\b/i, /\b(?:left|right)[- ]hand (?:side|column|corner|panel|page|shelf)\b/i,
    /\b(?:first|second|third|fourth|fifth|last|left|right|top|bottom|middle|leftmost|rightmost)\s+(?:shel(?:f|ves)|rows?|columns?|books?|cards?|portraits?|frames?|pictures?|drawers?|slips?|levers?|stamps?|dials?|box(?:es)?|buttons?|tabs?|spines?|icons?)\b/i,
    new RegExp("\\b(?:above|below|beneath|underneath|beside|next to|to the side of)\\s+(?:the|this|each|that)\\s+" + A11Y_THING + "\\b", "i"),
    /\b(?:shown|listed|pictured|seen|see|the (?:cards?|clues?|list|picture|image|table|boxe?s?))\s+(?:above|below)\b/i ],
  shape: [ new RegExp("\\b(?:round|square|circular|triangular|oval|biggest|largest|smallest|bigger|larger|smaller|tallest|shortest)\\s+" + A11Y_THING + "\\b", "i") ],
  sound: [ /\b(?:listen (?:for|to)|when you hear|until you hear|you(?:'ll| will) hear|after the (?:sound|chime|beep|bell|click)|wait for the (?:sound|chime|beep|bell|click))\b/i ],
  device: [ /\b(?:double|right)[- ]click/i, /\bclick(?:ing)?\s+(?:on|the|a|an|each|every|any|here|to|and|or|it|them)\b/i, /\b(?:drag(?:ging)?|swip(?:e|ing))\s+(?:the|a|an|each|every|it|them|and|to|left|right|up|down)\b/i,
    /\btap(?:ping)?\s+(?:on|the|a|an|each|every|any|here|to|it|them)\b/i, /\bhover(?:ing)?\s+(?:over|on)\b/i, /\b(?:your|the|with a|with the) mouse\b/i ],
  time: [ /\b(?:\d+|one|two|three|five|ten|fifteen|twenty|thirty|sixty)[- ]?(?:minutes?|mins?|seconds?|secs?)\b/i,
    /\b(?:hurry|race against|against the clock|beat the clock|before (?:the )?time runs out|time is running out|running out of time|time limit|countdown|as fast as you can|be quick|quickly now)\b/i ],
  caps: [ /(?:\b[A-Z]{2,}\b[\s,;:!?'’.-]+){3,}\b[A-Z]{2,}\b/ ],
  above: [ /\b(?:all|none|any|both) of the above\b/i, /\ball of these\b/i, /\bboth [a-d] (?:and|&) [a-d]\b/i ]

const A11Y_ADVICE = {
  colour: "This points to something by its colour. Students who are colour-blind, or who use a screen reader, can't tell which one is meant. Name it instead (its title, or its code).",
  position: "This points to something by where it sits on the screen. The layout changes on phones, when zoomed in, and for screen readers. Name the thing instead.",
  shape: "This points to something by its shape or size. That doesn't reach students who can't see the screen well. Name the thing instead.",
  sound: "This relies on hearing something. Sound can be switched off, and some students can't hear it. Say the same thing in words.",
  device: "This names one way of working (“click”, “drag”, “tap”). Students may be using a keyboard, a switch or their voice. “Choose”, “select” or “enter” fits everyone.",
  time: "This sounds like a time limit. The game has none, and time pressure shuts out students who need longer. Leave it out, or say there is no rush.",
  caps: "A long run of capital letters is slower to read, and some screen readers spell it out letter by letter. Use ordinary capitals, and **bold** for emphasis.",
  above: "This choice depends on the order of the choices. Students who listen to the choices one at a time can't see what is “above”. Write out what it stands for."
};
function a11yCheck(c){
  const out = [], L = A11Y_LIMITS;
  const str = v => String(v == null ? "" : v);
  const note = (rule, page, tab, where, text, quote) => out.push({ rule, page, tab, where, text, quote: str(quote) });
  const count = s => (str(s).trim().match(/\S+/g) || []).length;
  const noWords = s => str(s).trim() !== "" && !/[\p{L}\p{N}]/u.test(str(s));
  const short = s => { s = str(s).replace(/\s+/g, " ").trim(); return s.length > 70 ? s.slice(0, 70) + "…" : s; };
  const hit = (s, list) => { for (const re of list) { const m = str(s).match(re); if (m) return m[0]; } return null; };
  const wording = (s, page, tab, where, kinds = ["colour", "position", "shape", "sound", "device", "time", "caps"]) => {
    if (!str(s).trim()) return;
    for (const k of kinds) { const m = hit(s, A11Y_WORDS[k]); if (m) note(k, page, tab, where, A11Y_ADVICE[k], short(m)); }
  };
  const long = (s, max, page, tab, where, what) => { if (str(s).length > max) note("long-text", page, tab, where,
    `This ${what} is long (${count(s)} words). Long passages are hard going for students with dyslexia, students reading in a second language and anyone on a phone. Try shorter sentences, or split it.`); };
  const alike = s => { s = str(s); return /[A-Za-z]/.test(s) && /\d/.test(s) && ((/O/i.test(s) && /0/.test(s)) || (/[Il]/.test(s) && /1/.test(s))); };

  const meta = c.meta || {}, intro = c.intro || {}, finish = c.finish || {};
  if (!str(meta.title).trim()) note("missing-text", "settings", "about", "Settings · Escape room title", "There is no title. It names the browser tab and the certificate, and it is the first thing a screen reader says.");
  if (!str(intro.story).trim()) note("missing-text", "intro", "intro", "Story & intro · Story", "There is no opening story. Students, and especially students using a screen reader, need to be told what this is and what to do.");
  wording(intro.heading, "intro", "intro", "Story & intro · Heading"); wording(intro.story, "intro", "intro", "Story & intro · Story");
  long(intro.story, L.story * 1.5, "intro", "intro", "Story & intro · Story", "story");
  wording(finish.instructions, "finish", "cert", "Finish · Instructions under the certificate");
  if (alike(finish.exitPassword)) note("look-alike", "finish", "cert", "Finish · Exit password", "The exit password mixes characters that look alike (O and 0, or I, l and 1). Students copying it by eye will mistype it. Swap those characters for clearer ones.", finish.exitPassword);

  (c.rooms || []).forEach((room, r) => {
    const R = `Room ${r + 1}`;
    let total = count(room.story);
    if (!str(room.title).trim()) note("missing-text", r, "text", `${R} · Room title`, "This room has no title. The title is its heading, and it is how students using a screen reader know they have moved on.");
    if (!str(room.story).trim()) note("missing-text", r, "text", `${R} · Story / instructions`, "This room has no story or instructions. Say what students have to do here; not everyone can work it out from the picture.");
    wording(room.story, r, "text", `${R} · Story / instructions`); long(room.story, L.story, r, "text", `${R} · Story / instructions`, "story");
    wording(room.reference, r, "text", `${R} · Reading reference`, ["colour", "position", "device"]);

/* A folder laid on the bench: a modal dialog. Esc, the Close mark, or a click on the dark bench puts it away, and the
   keyboard goes back to whatever opened it. */
function overlay(title, content, extraButtons = [], wide = false, describedby = null){
  document.querySelector(".overlay")?.close();
  const tid = "ov" + (++uid);
  let m = null;
  const close = () => { if (!o.isConnected) return; o.remove(); modalClose(m); };
  const o = h("div", { class: "overlay", role: describedby ? "alertdialog" : "dialog", "aria-modal": "true", "aria-labelledby": tid, "aria-describedby": describedby, onclick: e => { if (e.target === o) close(); } },
    h("div", { class: "folder" + (wide ? " wide" : "") },
      h("div", { class: "bar" }, h("span", { id: tid }, title), ...extraButtons, h("button", { class: "inkline", onclick: close, id: "overlay-close" }, icon("x"), "Close")), content));
  o.close = close;
  m = modalOpen(o, close);
  document.body.append(o);
  o.querySelector("#overlay-close").focus();
  return o;
}

/* Full-screen "student view" of the game: a modal dialog. The brass rail on top is the teacher's: jump to any room,
   show the answers, restart, or exit (button or Esc). Nothing is saved or graded. */
async function openPreview(startRoom = 0){
  const opener = document.activeElement;
  if (!(await checkReady("preview"))) return;
  document.querySelector(".preview")?.remove();
  const n = cfg.rooms.length;
  let current = 0, showKey = false, m = null;
  const frame = h("iframe", { title: "Student view of the escape room" });
  const send = msg => frame.contentWindow && frame.contentWindow.postMessage(msg, "*");
  const stepName = k => k === 0 ? "the intro" : k > n ? "the certificate" : `room ${k} of ${n}: ${cfg.rooms[k - 1].title || "Untitled"}`;
  const steps = [[icon("door"), 0], ...cfg.rooms.map((r, i) => [String(i + 1), i + 1, r.title]), [icon("rosette"), n + 1, "Certificate"]];
  const roomBtns = steps.map(([label, k, title]) => h("button", { "data-room": k, title: title || (k === 0 ? "Intro" : ""), "aria-label": "Go to " + stepName(k),
    onclick: () => send({ er: "goto", room: k }) }, label));
  const where = h("span", { class: "sr", role: "status" });
  const mark = () => roomBtns.forEach(b => { if (+b.dataset.room === current) b.setAttribute("aria-current", "step"); else b.removeAttribute("aria-current"); });
  const prev = h("button", { "aria-label": "Previous room", onclick: () => send({ er: "goto", room: Math.max(0, current - 1) }) }, icon("left"));
  const next = h("button", { "aria-label": "Next room", onclick: () => send({ er: "goto", room: Math.min(n + 1, current + 1) }) }, icon("right"));
  const keyToggle = toggle("preview-answers", "Show answers", false, on => { showKey = on; send({ er: "key", on: showKey }); }, { state: false });
  const exit = () => { if (!layer.isConnected) return; layer.remove(); window.removeEventListener("message", onMsg); modalClose(m); };
  const onMsg = e => {
    if (e.source !== frame.contentWindow) return;
    if (e.data?.er === "escape") return exit();
    if (e.data?.er === "key" && !e.data.on) {      // "Hide answers" in the game's answer strip: the switch follows, and keeps the keyboard
      showKey = false; const sw = keyToggle.querySelector("input"); sw.checked = false; sw.focus(); where.textContent = "Answers hidden."; return;
    }
    if (e.data?.er === "room") {
      const moved = current !== e.data.room; current = e.data.room; mark();
      // a disabled button can't keep the keyboard, so it moves to the other arrow before one is switched off
      const at = document.activeElement; prev.disabled = current === 0; next.disabled = current === n + 1;
      if (at === prev && prev.disabled) next.focus(); if (at === next && next.disabled) prev.focus();
      if (moved) where.textContent = "The preview is showing " + stepName(current) + ".";
    }
  };
  const load = (room) => {
    frame.onload = () => { if (showKey) send({ er: "key", on: true }); if (room) send({ er: "goto", room }); };
    frame.srcdoc = ER.buildGame(GAME_TEMPLATE, { ...cfg, __preview: true });
  };
  const layer = h("div", { class: "preview", role: "dialog", "aria-modal": "true", "aria-label": "Student preview" },
    h("div", { class: "pbar" },
      h("div", { class: "badge" }, "Preview"),
      h("div", { class: "rooms", role: "group", "aria-label": "Jump to a room" }, prev, ...roomBtns, next),
      h("div", { class: "ctrl" }, keyToggle,
        h("button", { class: "eng", onclick: () => { load(0); where.textContent = "The preview has started again from the intro."; }, title: "Start over from the intro" }, icon("restart"), "Restart"),
        h("button", { class: "eng exit", id: "preview-exit", onclick: exit }, icon("x"), "Exit preview")), where),
    frame);
  m = modalOpen(layer, exit, opener);
  document.body.append(layer);
  window.addEventListener("message", onMsg);
  load(startRoom);
  layer.querySelector("#preview-exit").focus();
}

function answerSheetHtml(){
  const E = ER.esc, F = ER.fmt;
  const chk = it => `<span class="ck${it.verified ? " on" : ""}" role="img" aria-label="${it.verified ? "Checked" : "Not yet checked"}"></span>`;
  const src = it => it.source ? `<div class="src">Source: ${E(it.source)}</div>` : `<div class="src none">Source: <span aria-hidden="true">________________________</span><span class="sr">not written yet</span></div>`;
  const rooms = cfg.rooms.map((r, i) => {
    let body = "";
    if (r.type === "matching") { const m = ER.matching(r);
      body = `<p><strong>Lock combination:</strong> <code>${E(m.answer)}</code> · Cards shown as: ${({ books: "books on a shelf", portraits: "framed portraits" })[ER.look(r)] || "plain cards"}</p><ol>${r.cards.map(c => `<li>${chk(c)} <strong>${F(c.term)}</strong>${c.detail ? ` (${F(c.detail)})` : ""}, code <code>${E(m.code[r.cards.indexOf(c)])}</code><br>${c.clue ? "Clue: " + F(c.clue) : "<em>Decoy card (no clue)</em>"}${src(c)}</li>`).join("")}</ol>`; }
    if (r.type === "quiz") body = `<ol>${r.questions.map(q => `<li>${chk(q)} ${F(q.prompt)}<br><strong>Answer:</strong> ${q.kind === "choice" ? (q.choices || []).filter(c=>String(c).trim()).map((c, j) => j === q.correct ? `<u><strong>${F(c)}</strong></u> (correct)` : F(c)).join(" · ") : E(q.answers)}${src(q)}</li>`).join("")}</ol>`;
    if (r.type === "ordering") body = `<p>Correct order:</p><ol>${r.items.map(it => `<li>${chk(it)} ${F(it.text)}${it.label ? ` <strong>(${F(it.label)})</strong>` : ""}${src(it)}</li>`).join("")}</ol>`;
    if (r.type === "sorting") body = `<ol>${r.items.map(it => `<li>${chk(it)} ${F(it.text)} → <strong>${E(r.categories[it.category] || "?")}</strong>${src(it)}</li>`).join("")}</ol>`;
    if (r.type === "reflection") body = `<p>Results:</p><ol>${r.profiles.map(p => `<li>${chk(p)} <strong>${E(p.name)}</strong>: ${F(p.desc)}${p.who ? `<br>Thinkers: ${F(p.who)}` : ""}${p.next ? `<br>Next step: ${F(p.next)}` : ""}${src(p)}</li>`).join("")}</ol>
      <p>Questions:</p><ol>${r.questions.map(q => `<li>${chk(q)} ${F(q.prompt)}<ul>${(q.options||[]).map(o => `<li>${F(o.text)} → ${E((r.profiles.find(p => p.key === o.profile) || {}).name || "?")}</li>`).join("")}</ul>${src(q)}</li>`).join("")}</ol>`;
    const hints = (r.hints || []).filter(x => String(x).trim()).length ? `<p class="hints"><strong>Hints${r.hintsEnabled ? "" : " (switched off)"}:</strong></p><ol class="hints">${r.hints.filter(x => String(x).trim()).map(x => `<li>${F(x)}</li>`).join("")}</ol>` : "";
    return `<section><h2><span>Room ${i+1}</span> ${E(r.title || "Untitled")}</h2>${r.story ? `<p class="story">${F(r.story)}</p>` : ""}${r.reference ? `<p>Reference shown to students: ${F(r.reference)}</p>` : ""}${body}${hints}</section>`;
  }).join("");
  const st = ER.reviewStatus(cfg);
  const notes = a11yCheck(cfg), groups = a11yGroups(notes);
  const check = `<section id="a11y"><h2><span>Before you publish</span> Accessibility check</h2>` + (notes.length
    ? `<p>${notes.length} ${notes.length === 1 ? "note" : "notes"} on what is written. These are advice, not errors.</p>` + [...groups].map(([title, items]) => `<h3>${E(title)}</h3><ul class="notes">${items.map(n => `<li><strong>${E(n.where.replace(/^Room \d+ · /, ""))}</strong>${n.quote ? ` <em>“${E(n.quote)}”</em>` : ""}<br>${E(n.text)}</li>`).join("")}</ul>`).join("")
    : `<p>Nothing flagged in what is written.</p>`) + `<h3>By hand</h3><ul class="notes">${A11Y_BY_HAND.map(x => `<li>${E(x)}</li>`).join("")}</ul></section>`;
  const fonts = document.getElementById("fonts")?.textContent || "";
  const hc = contrastOn(), big = readableOn();
  const READ = big ? `"Atkinson Hyperlegible",Verdana,"Segoe UI","Helvetica Neue","DejaVu Sans",Arial,sans-serif` : `Georgia,"Iowan Old Style","Palatino Linotype","Book Antiqua","DejaVu Serif","Times New Roman",serif`;
  const HEAD = big ? READ : `"IM Fell English",Georgia,serif`, CAPS = big ? READ : `"IM Fell English SC",Georgia,serif`;

    Exit password: <code>${E(cfg.finish?.exitPassword || "(none)")}</code> · Grading: ${cfg.scoring?.mode === "deductions" ? "accuracy" : "completion"}</p>
    <p><em>Check every item against your textbook or sources.${sampleUnchecked(cfg) ? " The sample content was written with AI help and can contain mistakes." : ""} Mark items as checked in the editor.</em></p>

/* =====================================================================
   Guided steps (the wizard). The first way in for a teacher: one question per page, ten steps, then a hub
   ("Your escape room") to come back to. It edits the same content (cfg) and the same browser storage as the
   workshop, which is "Advanced mode" (all settings). Every step can open Advanced mode, and Advanced mode can come
   back. The page address says where you are (#step=name, #step=room&room=2&part=questions, #advanced&room=2), so
   the browser's Back and Forward buttons work, and a reload stays put.
   ===================================================================== */
const STEP_ORDER = ["welcome", "start", "name", "rooms", "room", "facts", "try", "deliver", "walk", "done"];
const STEP_LABEL = { welcome: "Welcome", start: "How to start", name: "Name it", rooms: "Your rooms", room: "Fill in each room", facts: "Check your facts",
  try: "Try it as a student", deliver: "How students get it", walk: "Put it in your course", done: "Done" };
const WSTEPS = {};
const WIZ = { route: null, errors: [], start: null, fileCfg: null, fileName: "", fileErr: "", stepsOpen: null };
const hashFor = (step, extra = {}) => "#" + new URLSearchParams({ step, ...extra }).toString();
function readHash(){
  const raw = location.hash.replace(/^#/, "");
  if (/^advanced(&|$)/.test(raw)) { const q = new URLSearchParams(raw.slice(8)); return { advanced: true, room: q.get("room"), page: q.get("page") }; }
  const q = new URLSearchParams(raw), step = q.get("step");
  if (!step) return null;                                   // some other mark in the address (the skip link's #main): not a page
  return { step, r: Math.max(0, (parseInt(q.get("room"), 10) || 1) - 1), part: q.get("part") || "", q };
}
const stepNo = step => { const i = STEP_ORDER.indexOf(step === "add" ? "rooms" : step); return i < 0 ? 0 : i + 1; };
function setMode(m){
  document.documentElement.dataset.mode = m;
  const skip = document.querySelector(".skip"); skip.textContent = m === "wizard" ? "Skip to the question" : "Skip to the editing area"; skip.setAttribute("href", m === "wizard" ? "#wiz-main" : "#main");
}
document.querySelector(".skip").addEventListener("click", e => { e.preventDefault(); document.getElementById(document.documentElement.dataset.mode === "wizard" ? "wiz-main" : "main").focus(); });
function wizGo(hash){ WIZ.errors = []; WIZ.warn = null; if (location.hash === hash) routeTo(readHash(), true); else location.hash = hash; }
const homeRoute = () => (/[?&]mode=advanced/.test(location.search) ? { advanced: true } : { step: stored ? "hub" : "welcome", r: 0, part: "", q: new URLSearchParams() });
addEventListener("hashchange", () => { const r = readHash() || (location.hash.length <= 1 ? homeRoute() : null); if (r) { WIZ.errors = []; WIZ.warn = null; routeTo(r, true); } });
function routeTo(r, focus){
  if (r.advanced) {
    const was = document.documentElement.dataset.mode;
    setMode("advanced");
    if (r.room != null && cfg.rooms[+r.room - 1]) sel = +r.room - 1; else if (r.page && (PAGES[r.page])) sel = r.page;
    render();
    if (focus || was === "wizard") document.getElementById("page-title").focus({ preventScroll: true });
    return;
  }
  if (!WSTEPS[r.step] || (r.step === "hub" && !stored)) r = { step: stored ? "hub" : "welcome", r: 0, part: "", q: new URLSearchParams() };
  if (r.step === "room") { const seq = roomSeq(); if (!seq.some(([k, p]) => k === r.r && p === r.part)) { const first = seq.find(([k]) => k === r.r) || seq[0]; if (first) { r.r = first[0]; r.part = first[1]; } else r.step = "rooms"; } }
  closeCabinet(false);
  setMode("wizard");
  WIZ.route = r;
  const n = stepNo(r.step); if (n > (meta.reached || 0) && stored) { meta.reached = n; saveMeta(); }
  renderWizard(focus ? "heading" : null);
  if (focus) scrollTo(0, 0);
}

/* ---------- small builders for the steps ---------- */
const wErr = key => WIZ.errors.find(e => e.key === key);
const wbtn = (props, ...kids) => h("button", { type: "button", ...props }, ...kids);
const wHelp = (...kids) => h("details", { class: "whelp", id: "wiz-help" }, h("summary", {}, "Help with this step"), h("div", {}, ...kids));
const H1 = text => h("h1", { id: "wiz-h1", tabindex: "-1" }, text);
/* A field: a label you can read (or the page's question as its label), an optional hint, the error if any, then the box. */
function wField({ id, label, value, set, hint, area, rows, asH1, placeholder, item, key }){
  const err = wErr(key || id);
  const desc = [hint ? id + "-hint" : null, err ? id + "-err" : null].filter(Boolean).join(" ") || null;
  const input = h(area ? "textarea" : "input", { id, type: area ? null : "text", rows: area ? (rows || 3) : null, value: value ?? "", autocomplete: "off", spellcheck: area ? "true" : null,
    placeholder, "aria-describedby": desc, "aria-invalid": err ? "true" : null,
    oninput: e => { set(e.target.value); if (area) grow(e.target); if (item) wUnverify(item); changed(); } });
  const lab = h("label", { for: id, class: asH1 ? null : "wlabel" }, label);
  return h("div", { class: "wf" + (err ? " bad" : "") }, asH1 ? h("h1", { id: "wiz-h1", tabindex: "-1" }, lab) : lab,
    hint ? h("p", { class: "whint", id: id + "-hint" }, hint) : null,
    err ? h("p", { class: "ferr", id: id + "-err" }, h("span", { class: "sr" }, "Error: "), err.text) : null, input);
}
/* Radio "cards": a real fieldset and legend (the page's question when asH1), real radios, one slip per choice. */
function wRadios({ name, legend, asH1, hint, options, value, set, cls }){
  const err = wErr(name);

        h("div", { class: "wacts", style: "margin-top:.6rem" }, wbtn({ class: "stamp", id: "wiz-check-now", onclick: () => { WIZ.warn = false; nextUnchecked(); } }, "Check them now"),
          wbtn({ class: "stamp", id: "wiz-continue-anyway", onclick: () => wizGo(hashFor("try")) }, "Continue anyway"))) : null,
      h("div", { class: "wacts", style: "margin-top:.8rem" },
        wbtn({ class: "stamp", id: "wiz-next-unchecked", onclick: nextUnchecked }, icon("down"), "Next not checked"),
        wbtn({ class: "inkline", id: "wiz-print", onclick: openAnswerSheet }, icon("print"), "Print the answer key")),
      wHelp(h("p", {}, "Nothing is ever checked for you. Tick an item only after you have checked it yourself."),
        h("p", {}, "If you change an item later, its tick is taken off, so you can check it again."),
        h("p", {}, "To check on paper, print the answer key, then come back and tick the items here.")),
      cfg.rooms.map((room, r) => {
        const mine = items.filter(x => x.room === r);
        if (!mine.length) return null;
        return [h("h2", {}, `Room ${r + 1}: ${room.title || "Untitled"}`), h("ul", { class: "wfacts" }, mine.map(x => {
          const it = x.item, k = `f${r + 1}-${x.list}-${x.i + 1}`, name = `room ${r + 1}, ${NOUN[x.list] || "item"} ${x.i + 1}`;
          const [what, ans] = factWords(room, x.list, it);
          const again = changedAfterCheck.has(it) && !it.verified ? h("p", { class: "again" }, "You changed this after checking it, so check it again.") : null;
          return h("li", {}, h("p", { class: "what" }, what), ans ? h("p", { class: "ans" }, ans) : null, again,
            h("div", { class: "wline" },
              wField({ id: k + "-src", label: "Where you checked it", value: it.source, placeholder: "e.g. Textbook ch. 3, p. 45", set: v => { it.source = v; } }),
              h("label", { class: "wchk" }, h("input", { type: "checkbox", id: k + "-ok", checked: it.verified === true, onchange: e => {
                it.verified = e.target.checked; changedAfterCheck.delete(it); changed(); recount();
                const s = ER.reviewStatus(cfg); say(`${e.target.checked ? "Checked" : "No longer checked"}: ${name}. ${s.verified} of ${s.total} checked.`); } }),
                h("span", { class: "box", "aria-hidden": "true" }, icon("tick")), "I checked this is correct", h("span", { class: "sr" }, ` (${name})`))));
        }))];
      })];
  },
  gate: () => { if (ER.reviewStatus(cfg).unverified && !WIZ.warn) { WIZ.warn = true; renderWizard(); document.getElementById("wiz-warn").focus(); return true; } return false; },
  next: () => hashFor("try")
};

/* ---------- 7 Try it as a student (the same preview as Advanced mode) ---------- */
/* Problems that would make a room impossible to solve, each linked to the step where it is fixed. */
function problemsLinked(){
  return ER.validate(cfg).map(text => {
    const m = text.match(/^Room (\d+)/), r = m ? +m[1] - 1 : -1;
    const href = r >= 0 ? (PARTS[cfg.rooms[r]?.type] ? hashFor("room", { room: r + 1 }) : `#advanced&room=${r + 1}`) : /^Settings/.test(text) ? hashFor("name") : hashFor("rooms");
    return { key: "problem", href, text };
  });
}
WSTEPS.try = {
  title: () => "Try it as a student",
  back: () => hashFor("facts"),
  body: () => [H1("Try it as a student"),
    h("p", {}, "Play it the way your students will. In the bar at the top you can jump to any room and use “Show answers” to skip ahead. Nothing you do here is graded or saved."),
    h("div", { class: "wacts", style: "margin-top:1rem" }, wbtn({ class: "plate", id: "wiz-try", onclick: () => {
      const errs = problemsLinked();
      if (errs.length) { WIZ.errors = errs; renderWizard("errors"); return; }
      WIZ.errors = []; openPreview(0);
    } }, icon("play"), "Start the student view")),
    wHelp(h("p", {}, "The student view fills the screen. Press Esc, or “Exit preview” at the top, to come back to this page."),
      h("p", {}, "If something needs fixing first, a list of problems appears here, each with a link to the page where you fix it."))],
  next: () => hashFor("deliver")
};

/* ---------- the exit password: never empty, and never the sample's on someone else's escape room ---------- */
const SAMPLE_PW = String(SAMPLE.finish?.exitPassword || "");
const withoutPw = c => stripCheck({ ...c, finish: { ...(c.finish || {}), exitPassword: "" } }).replace(/,?"decoy":(true|false)/g, "");
const sameAsSample = c => withoutPw(c) === withoutPw(SAMPLE);
function needsPassword(){
  const pw = String(cfg.finish?.exitPassword || "").trim();
  if (!pw) return true;
  return pw === SAMPLE_PW && meta.pwOk !== pw && !sameAsSample(cfg);
}
function suggestPassword(){
  const words = String(cfg.meta?.title || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toUpperCase().match(/[A-Z0-9]+/g) || [];
  const num = words.find(w => /^\d+$/.test(w)) || "";
  const word = words.find(w => /^[A-Z]{3,}$/.test(w) && !["THE", "AND", "FOR", "ESCAPE", "ROOM"].includes(w)) || "CLASS";
  let s = word.slice(0, 8) + (num ? num.slice(0, 4) : "ESCAPE");
  if ((/O/.test(s) && /0/.test(s)) || (/[IL]/.test(s) && /1/.test(s)) || s === SAMPLE_PW) s = word.slice(0, 8) + "ESCAPE";
  return s;
}
/* A slip that asks for the password before a student file is made. Resolves the password, or null to go back. */
function askPassword(){
  return new Promise(resolve => {
    const old = String(cfg.finish?.exitPassword || "").trim();
    let m = null;
    const input = h("input", { type: "text", id: "ask-password", value: suggestPassword(), autocomplete: "off", spellcheck: "false", "aria-describedby": "ask-password-hint",
      onkeydown: e => { if (e.key === "Enter") { e.preventDefault(); ok(); } } });
    const err = h("p", { class: "ferr", id: "ask-password-err", hidden: true }, h("span", { class: "sr" }, "Error: "), "Enter an exit password");
    const done = v => { box.remove(); modalClose(m); resolve(v); };
    const ok = () => {
      const v = input.value.trim();
      if (!v) { err.hidden = false; input.setAttribute("aria-invalid", "true"); input.setAttribute("aria-describedby", "ask-password-err ask-password-hint"); input.focus(); return; }
      done(v);
    };
    const box = h("div", { class: "modal", role: "dialog", "aria-modal": "true", "aria-labelledby": "ask-password-title", "aria-describedby": "ask-password-why", onclick: e => { if (e.target === box) done(null); } },
      h("div", { class: "slipbox" }, h("h2", { id: "ask-password-title" }, "What should the exit password be?"),
        h("p", { id: "ask-password-why" }, old ? `This escape room started as a copy of the sample, so it still has the sample's password, ${old}. Students who played the sample could use it again.` : "This escape room has no exit password yet."),
        h("div", { class: "wf" }, h("label", { class: "wlabel", for: "ask-password" }, "Exit password"),
          h("p", { class: "whint", id: "ask-password-hint" }, "Students see it on their certificate and type it into your course quiz. Letters and numbers that are easy to copy work best. We suggest one; you can change it."),
          err, input),
        h("div", { class: "actions" }, h("button", { type: "button", class: "stamp", id: "ask-cancel", onclick: () => done(null) }, "Go back"),
          h("button", { type: "button", class: "stamp", id: "ask-ok", onclick: ok }, "Use this password"))));
    m = modalOpen(box, () => done(null));
    document.body.append(box);
    input.focus(); input.select();
  });
}
/* Before any file for students is made: nothing that would stop a room working, an exit password of its own,
   and a word about unchecked items. Used by Advanced mode's Export and by the guided steps. */
async function readyToDownload(){
  const errs = ER.validate(cfg);
  if (errs.length) {
    if (document.documentElement.dataset.mode === "wizard") { WIZ.errors = problemsLinked(); renderWizard("errors"); } else showErrors(errs);
    return false;
  }
  if (needsPassword()) {
    const pw = await askPassword(); if (pw == null) return false;
    cfg.finish = cfg.finish || {}; cfg.finish.exitPassword = pw; meta.pwOk = pw; changed(); saveNow();
    say(`The exit password is now ${pw}.`);
  }
  const st = ER.reviewStatus(cfg);
  if (st.unverified) return ask("Download a draft?",
    [`${st.unverified} of ${st.total} items haven't been checked yet.`, "Students will see a “Draft” notice saying answers may contain errors."], { ok: "Download anyway", cancel: "Go back" });
  return true;
}

/* ---------- 8 How will students get it? ---------- */

};

/* ---------- 9 Walkthroughs: the download, then the menus to use ---------- */
const B = t => h("b", {}, t);
const MENUS = () => h("span", { class: "menus" }, " Menus can differ by version.");
async function copyText(text, btn, what){
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; } catch(e){
    const ta = h("textarea", { style: "position:fixed;left:0;top:0;opacity:0", "aria-hidden": "true", tabindex: "-1" }); ta.value = text; document.body.append(ta); ta.select();
    try { ok = document.execCommand("copy"); } catch(e2){} ta.remove(); btn.focus();
  }
  const note = btn.parentElement.querySelector(".done"); if (note) note.textContent = ok ? "Copied." : "Couldn't copy here: select the text and copy it yourself.";
  say(ok ? `${what} copied.` : "Couldn't copy. Select the text and copy it yourself.");
}
const copyRow = (id, label, text, what, cls = "") => h("div", { class: "copy" }, h("span", { class: "val " + cls, id }, text),
  wbtn({ class: "stamp", id: id + "-copy", onclick: e => copyText(text, e.currentTarget, what) }, "Copy", h("span", { class: "sr" }, " " + label)), h("span", { class: "done" }));

const WALK_TITLE = { "moodle-scorm": "Put it in Moodle (grade file)", "moodle-quiz": "Put it in Moodle (file and exit-password quiz)", "canvas-scorm": "Put it in Canvas (grade file)",
  "canvas-quiz": "Put it in Canvas (file and exit-password quiz)", other: "Put it in your course system", file: "Share it as a file" };
const QUIZ_Q = "Type the exit password from the certificate at the end of the escape room.";
function downloadStep(route){
  const zip = /scorm$/.test(route), lms = LMS[(meta.delivery || {}).where];
  const label = zip ? `Download the ${lms} grade file (.zip)` : "Download the game file (.html)";
  return h("li", {}, wbtn({ class: "plate", id: "wiz-download", onclick: async () => {
      if (!(await readyToDownload())) return;
      if (zip) { download(`${slug()}-SCORM.zip`, ER.scorm(gameHtml(), cfg.meta.title), "application/zip"); toast(`The ${lms} grade file is in your Downloads folder. Don't unzip it.`); }
      else { download(`${slug()}.html`, gameHtml(), "text/html"); backedUp(); toast("The game file is in your Downloads folder. It is also your backup: it opens again in this maker."); }
      meta.downloaded = Date.now(); saveMeta(); renderWizard(); document.getElementById("wiz-download")?.focus();
    } }, icon("save"), label),
    zip ? h("p", {}, "Don't unzip it: ", B(lms), " needs the .zip file exactly as it is.") : h("p", {}, "This one file is the whole escape room. It is also your backup copy: it opens again in this maker."),
    meta.downloaded ? h("p", { class: "wnote", id: "wiz-downloaded" }, `Downloaded ${when(meta.downloaded)}.`) : null);
}
function passwordPart(withQuiz){
  const pw = String(cfg.finish?.exitPassword || "").trim(), ready = pw && !needsPassword();
  return [h("h2", {}, "Your exit password"),
    ready ? [h("p", {}, "Students see it on their certificate at the end."), copyRow("wiz-password", "the exit password", pw, "The exit password")]
      : h("p", { id: "wiz-password-later" }, "You choose it when you download the file in step 1."),
    withQuiz ? [h("h2", {}, "Ready to copy into your quiz"),
      h("p", {}, "Question text:"), copyRow("wiz-quiz-q", "the question text", QUIZ_Q, "The question text", "text"),
      ready ? [h("p", {}, "Correct answer:"), copyRow("wiz-quiz-a", "the correct answer", pw, "The answer")] : null,
      h("p", {}, "Set the quiz to ignore capital letters, so ", h("i", {}, (ready ? pw : suggestPassword()).toLowerCase()), " and ", h("i", {}, (ready ? pw : suggestPassword()).toUpperCase()), " both count. If you change the password after students have played, keep the old one as a second correct answer.")] : null];
}
const trouble = (q, ...a) => h("details", { class: "wtrouble" }, h("summary", {}, q), h("div", {}, ...a));
const WALKS = {

      h("li", {}, "Click ", B("Add an activity or resource"), " (in Moodle 5, the ", B("+"), " and then ", B("Activity or resource"), "), choose ", B("File"), ", and drag in the game file. Under ", B("Appearance"), ", set ", B("Display"), " to ", B("Open"), ". Click ", B("Save and return to course"), ".", MENUS()),
      h("li", {}, "Add another activity: ", B("Quiz"), `. Name it “${cfg.meta?.title || "Escape room"}: exit password” and click `, B("Save and display"), "."),
      h("li", {}, "Click ", B("Add"), ", then ", B("a new question"), ", then ", B("Short answer"), ". Paste the question text below. Set ", B("Case sensitivity"), " to ", B("No, case is unimportant"), ". Paste the exit password as ", B("Answer 1"), " with ", B("Grade"), " 100%. Save."),
      h("li", {}, "To try it as a student, open your user menu and choose ", B("Switch role to…"), ", then ", B("Student"), ".")),
    passwordPart(true),
    h("h2", {}, "If something goes wrong"),
    trouble("The file downloads instead of playing", h("p", {}, "Some Moodle sites always download files. That's fine: tell students to open the downloaded file. It opens in their browser.")),
    trouble("I need to fix a mistake after students have started", h("p", {}, "Fix it here and download the game file again. In Moodle, open the file's ", B("Settings"), ", delete the old file, drag in the new one, and save."))],
  "canvas-scorm": () => [h("ol", { class: "walk" }, downloadStep("canvas-scorm"),
      h("li", {}, "Look for ", B("SCORM"), " in your course menu. If it isn't there, go to ", B("Settings"), ", then ", B("Navigation"), ", drag ", B("SCORM"), " into the top list (or use its menu and choose ", B("Enable"), "), and click ", B("Save"), ". If SCORM isn't in the list at all, your school hasn't switched it on: ask your Canvas administrator, or ", h("a", { href: hashFor("deliver") }, "choose the quiz instead"), ".", MENUS()),
      h("li", {}, "Click ", B("SCORM"), ", then ", B("Upload"), ", choose the .zip file, and click ", B("Open"), ". Don't unzip it first.", MENUS()),
      h("li", {}, "Under ", B("Choose Import Type"), ", choose ", B("Import as a graded assignment"), " and click ", B("Go"), ". This choice can't be changed later.", MENUS()),
      h("li", {}, "It appears under ", B("Assignments"), ", worth 100 points. Publish it. To try it as a student, use ", B("Student View"), " in the course settings."),
      h("li", {}, "To remove it later, delete it from the ", B("SCORM"), " page, not from Assignments.")),
    h("h2", {}, "If something goes wrong"),
    trouble("I don't see SCORM anywhere", h("p", {}, "SCORM is an extra tool that your Canvas administrator has to switch on. Ask them, or use the file and exit-password quiz, which always works.")),
    trouble("My Mac unzipped it into a folder", h("p", {}, "Safari opens “safe” files after downloading. In Safari, open ", B("Settings"), ", then ", B("General"), ", and untick ", B("Open “safe” files after downloading"), ". Then download the file again."), MENUS()),
    trouble("A student finished but has no grade", h("p", {}, "Canvas sometimes loses the grade if the student closes the tab straight away or their browser blocks cookies. Ask them to stay on the certificate for a few seconds, then grade them by hand."))],
  "canvas-quiz": () => [h("ol", { class: "walk" }, downloadStep("canvas-quiz"),
      h("li", {}, "In your Canvas course, go to ", B("Files"), " and click ", B("Upload"), " to add the game file."),
      h("li", {}, "Go to ", B("Pages"), " and click ", B("+ Page"), `. Call it “${cfg.meta?.title || "Escape room"}”. In the editor, add a link to the file (`, B("Link"), ", then ", B("Course Links"), ", then ", B("Files"), "). Click ", B("Save & Publish"), ".", MENUS()),
      h("li", {}, "Go to ", B("Quizzes"), " and click ", B("+ Quiz"), ". Add a ", B("Fill in the Blank"), " question. Paste the question text below, and the exit password as the answer. To ignore capital letters, choose ", B("Close enough"), " and ", B("Spelling only (ignore case)"), ", or add the password in small letters as a second answer.", MENUS()),
      h("li", {}, "To try it as a student, use ", B("Student View"), " in the course settings.")),
    passwordPart(true),
    h("h2", {}, "If something goes wrong"),
    trouble("The file downloads instead of playing", h("p", {}, "That's fine: tell students to open the downloaded file. It opens in their browser.")),
    trouble("I need to fix a mistake after students have started", h("p", {}, "Fix it here and download the game file again. In ", B("Files"), ", upload the new file with the same name and choose to replace the old one."), MENUS())],
  other: () => [h("ol", { class: "walk" }, downloadStep("other"),
      h("li", {}, "Upload the game file to your course as a file. Tell students to download it and open it: it opens in their browser."),
      h("li", {}, "For the grade, make a one-question quiz in your course system, with the exit password as the answer. The text is below, ready to copy."),
      h("li", {}, "Try it yourself the way a student would.")),
    passwordPart(true)],
  file: () => [h("ol", { class: "walk" }, downloadStep("file"),
      h("li", {}, "Email or post the game file. Students download it and double-click it: it opens in their browser, and needs no internet connection."),
      h("li", {}, "Phones and tablets sometimes show the file as code instead of playing it. Ask students to use a computer."),
      h("li", {}, "Ask students to send you the exit password from their certificate, or a screenshot of it.")),
    passwordPart(false)]
};
WSTEPS.walk = {
  title: () => WALK_TITLE[walkRoute()] || "Put it in your course",
  back: () => hashFor("deliver"),

    if (!WALKS[route]) return [H1("Put it in your course"), h("p", {}, "First choose how your students will get to the escape room."), h("p", {}, h("a", { href: hashFor("deliver") }, "Choose how students get it"))];
    return [H1(WALK_TITLE[route]), h("p", { class: "whint" }, "Do these in order. Step 1 is here; the rest happen in your course."), ...WALKS[route]()];
  },
  next: () => hashFor("done")
};

applyDisplay();
render();
routeTo(readHash() || homeRoute(), false);
</script>
