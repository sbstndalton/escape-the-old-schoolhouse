<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escape Room Editor</title>
<style>
  :root{--bg:#f6f4ee;--panel:#fff;--ink:#1f2a24;--muted:#5d6b63;--line:#d9d5ca;--accent:#24402f;--gold:#c9952b;--warn:#fff4d6;--warnline:#e3b64a;--ok:#e7f4ea;--okline:#7bb58a;--bad:#b3261e}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg);font-size:15px;line-height:1.45}
  header{position:sticky;top:0;z-index:5;background:var(--accent);color:#fff;padding:.55rem 1rem;display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
  header h1{font-size:1.05rem;margin:0 1rem 0 0}
  header .spacer{flex:1}
  .meter{display:flex;align-items:center;gap:.5rem;font-size:.85rem}
  .meter .bar{width:120px;height:8px;background:rgba(255,255,255,.25);border-radius:4px;overflow:hidden}
  .meter .bar i{display:block;height:100%;background:#7ccf8a}
  button,.btn{font:inherit;font-size:.9rem;cursor:pointer;border-radius:6px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:.38rem .75rem}
  header button{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.35)}
  header button.primary{background:#e8b84a;color:#2b1d0b;border-color:#e8b84a;font-weight:600}
  button:hover{filter:brightness(.97)}
  button.small{font-size:.8rem;padding:.2rem .5rem}
  button.danger{color:var(--bad)}
  button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #4a90e2;outline-offset:1px}
  .layout{display:grid;grid-template-columns:300px 1fr;min-height:calc(100vh - 48px)}
  nav{border-right:1px solid var(--line);background:#efece3;padding:.75rem;display:flex;flex-direction:column;gap:.3rem}
  nav .item{display:flex;align-items:center;gap:.35rem;padding:.45rem .55rem;border-radius:6px;cursor:pointer;border:1px solid transparent}
  nav .item.sel{background:#fff;border-color:var(--line);font-weight:600}
  nav .item .t{flex:1;overflow-wrap:anywhere}
  nav .pill{font-size:.72rem;border-radius:10px;padding:0 .45rem;background:var(--warn);border:1px solid var(--warnline);white-space:nowrap}
  nav .pill.ok{background:var(--ok);border-color:var(--okline)}
  nav h3{font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:.8rem 0 .2rem}
  main{padding:1.2rem 1.5rem 4rem;max-width:980px}
  h2{margin:.2rem 0 .3rem;font-size:1.35rem}
  .help{color:var(--muted);font-size:.88rem;margin:.1rem 0 .6rem}
  .field{display:flex;flex-direction:column;gap:.2rem;margin:.55rem 0}
  .field>span{font-weight:600;font-size:.88rem}
  .field small{color:var(--muted);font-weight:normal}
  input[type=text],input[type=number],textarea,select{font:inherit;font-size:.92rem;padding:.4rem .5rem;border:1px solid #c8c3b6;border-radius:6px;background:#fff;color:var(--ink);width:100%}
  textarea{min-height:3.2rem;resize:vertical}
  .row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:flex-end}
  .row>.field{flex:1;min-width:160px}
  .box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:.8rem 1rem;margin:.8rem 0}
  .box h3{margin:.1rem 0 .4rem;font-size:1rem}
  .entry{border:1px solid var(--line);border-left:5px solid var(--warnline);background:#fffdf6;border-radius:8px;padding:.6rem .8rem;margin:.6rem 0}
  .entry.verified{border-left-color:var(--okline);background:#fbfefb}
  .entry .head{display:flex;align-items:center;gap:.4rem;margin-bottom:.2rem}
  .entry .head strong{flex:1;font-size:.85rem;color:var(--muted)}
  .verify{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;margin-top:.4rem;padding-top:.45rem;border-top:1px dashed var(--line)}
  .verify .field{margin:0;flex:1;min-width:200px}
  .verify label.chk{display:flex;gap:.35rem;align-items:center;font-weight:600;font-size:.88rem;white-space:nowrap}
  .answer{background:#eef5f0;border:1px solid var(--okline);border-radius:8px;padding:.5rem .8rem;font-size:.92rem}
  .answer code{font-size:1.05rem;font-weight:700;letter-spacing:.08em}
  .choices .choice{display:flex;gap:.4rem;align-items:center;margin:.25rem 0}
  .choices .choice input[type=text]{flex:1}
  .notice{background:var(--warn);border:1px solid var(--warnline);border-radius:8px;padding:.6rem .8rem;margin:.6rem 0}
  .errors{background:#fdecea;border:1px solid #f1b0aa;border-radius:8px;padding:.6rem .8rem;margin:.6rem 0}
  .errors li{margin:.15rem 0}
  .overlay{position:fixed;inset:0;background:rgba(10,20,15,.6);z-index:20;display:flex;flex-direction:column}
  .overlay .bar{background:var(--accent);color:#fff;display:flex;gap:.5rem;align-items:center;padding:.5rem 1rem}
  .overlay .bar span{flex:1;font-weight:600}
  .overlay iframe{flex:1;border:0;background:#fff;width:100%}
  .toast{position:fixed;bottom:1rem;left:50%;transform:translateX(-50%);background:#1f2a24;color:#fff;padding:.55rem 1rem;border-radius:8px;z-index:30;font-size:.9rem}
  .mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.88rem}
  @media (max-width:760px){.layout{grid-template-columns:1fr}nav{border-right:0;border-bottom:1px solid var(--line)}}
</style>
</head>
<body>
<header>
  <h1>🛠️ Escape Room Editor</h1>
  <div class="meter" id="meter" title="Items checked against your sources"></div>
  <span class="spacer"></span>
  <button id="btn-new">New…</button>
  <button id="btn-open">Open…</button>
  <button id="btn-save">Save project</button>
  <button id="btn-review">Review sheet</button>
  <button id="btn-preview">▶ Preview</button>
  <button id="btn-export" class="primary">Export for students ▾</button>
  <input type="file" id="file" accept=".json,.html,.htm" hidden>
</header>
<div class="layout">
  <nav id="nav" aria-label="Sections"></nav>
  <main id="main"></main>
</div>

<script>
/*__SHARED__*/
</script>
<script>
const GAME_TEMPLATE = "__GAME_TEMPLATE__";
const SAMPLE = "__DEFAULT_CONFIG__";
const STORE = "escape-room-editor-v1";
const clone = o => JSON.parse(JSON.stringify(o));

/* ===================== State ===================== */
let cfg = load() || clone(SAMPLE);
let sel = "settings";      // "settings" | "intro" | "finish" | room index (number)
let quizText = {};         // room index -> true when editing a quiz as plain text

function load(){ try { const s = localStorage.getItem(STORE); return s ? JSON.parse(s) : null; } catch(e){ return null; } }
let saveTimer = null;
function changed(){ clearTimeout(saveTimer); saveTimer = setTimeout(() => { try { localStorage.setItem(STORE, JSON.stringify(cfg)); } catch(e){} }, 300); refreshStatus(); }

/* ===================== Tiny DOM helper ===================== */
function h(tag, props = {}, ...kids){
  const el = document.createElement(tag);
  for (const [k,v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "class") el.className = v;
    else if (k === "value") el.value = v;
    else if (k === "checked") el.checked = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  return el;
}
let uid = 0;
/* A labelled input bound to obj[key]. opts: {type, help, rows, placeholder, content(bool: editing it un-verifies the item), item, onChange} */
function field(label, obj, key, opts = {}){
  const id = "f" + (++uid);
  const tag = opts.type === "textarea" ? "textarea" : "input";
  const input = h(tag, { id, type: tag === "input" ? (opts.type || "text") : null, rows: opts.rows, placeholder: opts.placeholder,
    value: obj[key] ?? "", min: opts.min, max: opts.max,
    oninput: e => {
      obj[key] = opts.type === "number" ? Number(e.target.value) : e.target.value;
      if (opts.item && opts.item.verified) { opts.item.verified = false; const box = e.target.closest(".entry"); if (box) { box.classList.remove("verified"); const c = box.querySelector(".verify input[type=checkbox]"); if (c) c.checked = false; } }
      opts.onChange && opts.onChange(e);
      changed();
    }});
  return h("label", { class: "field", for: id }, h("span", {}, label, opts.help ? h("small", {}, " — " + opts.help) : null), input);
}
function select(label, obj, key, options, opts = {}){
  const id = "f" + (++uid);
  const s = h("select", { id, onchange: e => { const v = e.target.value; obj[key] = opts.number ? Number(v) : v;
    if (opts.item && opts.item.verified) { opts.item.verified = false; }
    changed(); opts.rerender ? render() : null; } },
    options.map(([v, t]) => h("option", { value: v }, t)));
  s.value = obj[key] ?? "";
  return h("label", { class: "field", for: id }, h("span", {}, label, opts.help ? h("small", {}, " — " + opts.help) : null), s);
}
/* Source + "I checked this" row shown on every gradable item. */
function verifyRow(item){
  return h("div", { class: "verify" },
    field("Source", item, "source", { placeholder: "e.g. Textbook ch. 3, p. 45" }),
    h("label", { class: "chk" }, h("input", { type: "checkbox", checked: item.verified === true, onchange: e => {
      item.verified = e.target.checked; e.target.closest(".entry").classList.toggle("verified", item.verified); changed(); } }),
      "✔ I checked this is correct"));
}
/* Generic list editor: move / delete / add. */
function listEditor(list, renderItem, opts){
  const wrap = h("div", {});
  list.forEach((it, i) => {
    const gradable = opts.gradable !== false;
    wrap.append(h("div", { class: "entry" + (gradable && it.verified ? " verified" : "") + (gradable ? "" : " verified") },
      h("div", { class: "head" }, h("strong", {}, `${opts.noun} ${i+1}`),
        h("button", { class: "small", title: "Move up", "aria-label": `Move ${opts.noun} ${i+1} up`, disabled: i === 0, onclick: () => { [list[i-1], list[i]] = [list[i], list[i-1]]; changed(); render(); } }, "▲"),
        h("button", { class: "small", title: "Move down", "aria-label": `Move ${opts.noun} ${i+1} down`, disabled: i === list.length - 1, onclick: () => { [list[i+1], list[i]] = [list[i], list[i+1]]; changed(); render(); } }, "▼"),
        h("button", { class: "small danger", "aria-label": `Delete ${opts.noun} ${i+1}`, onclick: () => { if (confirm(`Delete ${opts.noun.toLowerCase()} ${i+1}?`)) { list.splice(i, 1); changed(); render(); } } }, "Delete")),
      renderItem(it, i),
      gradable ? verifyRow(it) : null));
  });
  wrap.append(h("button", { onclick: () => { list.push(opts.blank()); changed(); render(); } }, `+ Add ${opts.noun.toLowerCase()}`));
  return wrap;
}
function hintsEditor(room){
  room.hints = room.hints || [];
  return h("div", { class: "box" }, h("h3", {}, "Hints"),
    h("p", { class: "help" }, "Students reveal these one at a time. Leave empty for no hints."),
    room.hints.map((hint, i) => h("div", { class: "row" },
      field(`Hint ${i+1}`, room.hints, i, { type: "textarea", rows: 2 }),
      h("button", { class: "small danger", onclick: () => { room.hints.splice(i, 1); changed(); render(); } }, "Remove"))),
    h("button", { onclick: () => { room.hints.push(""); changed(); render(); } }, "+ Add hint"));
}

/* ===================== Room types ===================== */
const TYPES = {
  quiz:       { name: "Question lock", desc: "Short-answer or multiple-choice questions. All must be right to open the lock. Works like a chapter quiz.",
                blank: () => ({ type: "quiz", title: "New question room", story: "", reference: "", lockLabel: "🔒 Question lock", successMessage: "🔓 Every answer is right. The lock opens!", hints: [], questions: [blankQuestion()] }) },
  matching:   { name: "Matching code", desc: "Cards with codes and clues. Students match each clue to a card and enter the codes as the lock combination.",
                blank: () => ({ type: "matching", title: "New matching room", story: "", reference: "", codeStyle: "letters", codeWord: "", cluesHeading: "Clues", lockLabel: "🔒 Lock", successMessage: "🔓 The lock opens!", failMessage: "The lock won't budge. Check each clue again.", hints: [], cards: [blankCard(), blankCard()] }) },
  ordering:   { name: "Put in order", desc: "Students arrange items in the correct order (timelines, steps in a process).",
                blank: () => ({ type: "ordering", title: "New timeline room", story: "", reference: "", lockLabel: "🔒 Order lock", successMessage: "🔓 Everything is in order. The lock opens!", hints: [], items: [blankOrder(), blankOrder()] }) },
  sorting:    { name: "Sort into groups", desc: "Students put each item into the right category.",
                blank: () => ({ type: "sorting", title: "New sorting room", story: "", reference: "", categories: ["Group A", "Group B"], lockLabel: "📋 Sorting lock", successMessage: "🔓 All sorted. The lock opens!", hints: [], items: [blankSort()] }) },
  reflection: { name: "Reflection survey", desc: "No wrong answers. Each choice counts toward a result profile, shown on the certificate.",
                blank: () => ({ type: "reflection", title: "New reflection room", story: "", reference: "", buttonLabel: "Continue", successMessage: "✨ Done!", resultHeading: "Your result", resultNote: "", hints: [], profiles: [blankProfile("A"), blankProfile("B")], questions: [] }) }
};
function blankQuestion(kind = "short"){ return { prompt: "", kind, answers: "", choices: ["", "", "", ""], correct: 0, source: "", verified: false }; }
function blankCard(){ return { term: "", detail: "", icon: "", clue: "", code: "", source: "", verified: false }; }
function blankOrder(){ return { text: "", label: "", source: "", verified: false }; }
function blankSort(){ return { text: "", category: 0, source: "", verified: false }; }
function blankProfile(k){ return { key: k || ("P" + Date.now().toString(36)), name: "", who: "", desc: "", next: "", source: "", verified: false }; }

function commonRoomFields(room){
  return h("div", { class: "box" }, h("h3", {}, "Room text"),
    field("Room title", room, "title", { onChange: () => renderNav() }),
    field("Story / instructions", room, "story", { type: "textarea", rows: 3, help: "what students read when they enter. Use **bold** and *italics*" }),
    field("Reading reference shown to students", room, "reference", { placeholder: "e.g. Review: Chapter 4, pages 88–102", help: "optional" }),
    h("div", { class: "row" },
      field("Lock label", room, "lockLabel"),
      field("Message when solved", room, "successMessage")));
}

function editMatching(room){
  const m = ER.matching(room);
  const answer = h("div", { class: "answer" }, "Lock combination students must enter: ", h("code", {}, m.answer || "—"),
    h("div", { class: "help", style: "margin:.3rem 0 0" }, "Calculated from the cards below. Cards are shown to students in A–Z order; clues are shown in the order you list them."));
  return [
    commonRoomFields(room),
    h("div", { class: "box" }, h("h3", {}, "Lock"),
      h("div", { class: "row" },
        select("Code on each card", room, "codeStyle", [["letters", "Letters (A–Z)"], ["numbers", "Numbers (1–9)"]], { rerender: true }),
        room.codeStyle !== "numbers" ? field("Code word (optional)", room, "codeWord", { help: "one letter per clue, e.g. LEARN", onChange: () => render() }) : null,
        field("Clues heading", room, "cluesHeading")),
      field("Message for a wrong code", room, "failMessage"),
      answer),
    h("div", { class: "box" }, h("h3", {}, "Cards and clues"),
      h("p", { class: "help" }, "Each card is a term or person. Give it a clue to make it part of the answer. A card with no clue is a decoy."),
      listEditor(room.cards, c => [
        h("div", { class: "row" }, field("Name on card", c, "term", { item: c, onChange: refreshAnswer }), field("Small detail", c, "detail", { help: "e.g. dates", item: c }),
          field("Icon", c, "icon", { help: "emoji, optional" }), field("Fixed code", c, "code", { help: "optional", onChange: refreshAnswer })),
        field("Clue (blank = decoy card)", c, "clue", { type: "textarea", rows: 2, item: c, onChange: refreshAnswer })
      ], { noun: "Card", blank: blankCard })),
    hintsEditor(room)
  ];
  function refreshAnswer(){ answer.querySelector("code").textContent = ER.matching(room).answer || "—"; }
}

function editQuiz(room, r){
  const asText = !!quizText[r];
  const body = asText ? quizTextEditor(room, r) : listEditor(room.questions, q => [
    field("Question", q, "prompt", { type: "textarea", rows: 2, item: q }),
    select("Answer type", q, "kind", [["short", "Short answer (typed)"], ["choice", "Multiple choice"]], { rerender: true, item: q }),
    q.kind === "choice" ? choicesEditor(q) :
      field("Accepted answers", q, "answers", { item: q, help: "separate different acceptable answers with |  e.g.  John Dewey | Dewey. Capitals, accents and punctuation are ignored." })
  ], { noun: "Question", blank: () => blankQuestion() });
  return [
    commonRoomFields(room),
    h("div", { class: "box" }, h("h3", {}, "Questions"),
      h("p", { class: "help" }, "Students must get every question right to open the lock. They're told how many are right, not which ones."),
      h("div", { class: "row", style: "margin-bottom:.4rem" },
        h("button", { onclick: () => { quizText[r] = !asText; render(); } }, asText ? "← Back to form view" : "✎ Edit all questions as text")),
      body),
    hintsEditor(room)
  ];
}
function choicesEditor(q){
  q.choices = q.choices || [];
  const name = "c" + (++uid);
  return h("div", { class: "field choices" }, h("span", {}, "Choices ", h("small", {}, "— select the correct one")),
    q.choices.map((c, j) => h("div", { class: "choice" },
      h("input", { type: "radio", name, checked: q.correct === j, "aria-label": `Choice ${j+1} is correct`, onchange: () => { q.correct = j; q.verified = false; changed(); render(); } }),
      h("input", { type: "text", value: c, "aria-label": `Choice ${j+1}`, oninput: e => { q.choices[j] = e.target.value; q.verified = false; changed(); } }),
      h("button", { class: "small danger", onclick: () => { q.choices.splice(j, 1); if (q.correct >= q.choices.length) q.correct = 0; changed(); render(); } }, "✕"))),
    h("div", {}, h("button", { class: "small", onclick: () => { q.choices.push(""); changed(); render(); } }, "+ Add choice")));
}
/* Plain-text quiz format:
   Q: question            A: answer | other accepted answer
   - wrong choice         * correct choice
   Source: …              Verified: yes          (blank line between questions) */
function quizToText(qs){
  return qs.map(q => [ `Q: ${q.prompt}`,
    ...(q.kind === "choice" ? (q.choices || []).filter(c => String(c).trim()).map((c, j) => `${j === q.correct ? "*" : "-"} ${c}`) : [`A: ${q.answers}`]),
    q.source ? `Source: ${q.source}` : null, q.verified ? "Verified: yes" : null ].filter(x => x != null).join("\n")).join("\n\n");
}
function textToQuiz(text){
  const out = [], problems = [];
  text.replace(/\r/g, "").split(/\n\s*\n/).map(b => b.trim()).filter(Boolean).forEach((block, n) => {
    const q = blankQuestion(); q.choices = []; let hasA = false;
    block.split("\n").forEach(line => {
      const l = line.trim(); let m;
      if ((m = l.match(/^q\s*[:.)]\s*(.*)$/i))) q.prompt = m[1];
      else if ((m = l.match(/^a\s*[:.)]\s*(.*)$/i))) { q.answers = m[1]; hasA = true; }
      else if ((m = l.match(/^([*-])\s*(.*)$/))) { if (m[1] === "*") q.correct = q.choices.length; q.choices.push(m[2]); }
      else if ((m = l.match(/^source\s*:\s*(.*)$/i))) q.source = m[1];
      else if (/^verified\s*:\s*(yes|y|true|✔|✓)\s*$/i.test(l)) q.verified = true;
      else if (l) q.prompt = q.prompt ? q.prompt + " " + l : l;
    });
    q.kind = q.choices.length ? "choice" : "short";
    if (!q.choices.length) q.choices = ["", "", "", ""];
    if (!q.prompt) problems.push(`Question ${n+1} has no "Q:" line.`);
    if (q.kind === "short" && !hasA) problems.push(`Question ${n+1} has no "A:" answer line or choices.`);
    if (q.kind === "choice" && !block.split("\n").some(l => l.trim().startsWith("*"))) problems.push(`Question ${n+1}: mark the correct choice with * instead of -.`);
    out.push(q);
  });
  return { questions: out, problems };
}
function quizTextEditor(room, r){
  const ta = h("textarea", { class: "mono", rows: 18, "aria-label": "Questions as text", value: quizToText(room.questions) });
  const msg = h("div", {});
  return h("div", {},
    h("div", { class: "notice" }, h("strong", {}, "Format: "), "one question per paragraph (leave a blank line between questions).",
      h("pre", { class: "mono", style: "margin:.4rem 0 0;white-space:pre-wrap" },
        "Q: Who wrote Democracy and Education (1916)?\nA: John Dewey | Dewey\nSource: Ch. 3, p. 45\n\nQ: Which philosophy focuses on the \"Great Books\"?\n- Essentialism\n* Perennialism\n- Existentialism\nVerified: yes")),
    ta, msg,
    h("div", { class: "row", style: "margin-top:.5rem" },
      h("button", { onclick: () => {
        const { questions, problems } = textToQuiz(ta.value);
        msg.replaceChildren(problems.length ? h("div", { class: "errors" }, h("strong", {}, "Please fix:"), h("ul", {}, problems.map(p => h("li", {}, p)))) : "");
        if (problems.length) return;
        room.questions = questions; changed(); toast(`Saved ${questions.length} questions.`); quizText[r] = false; render();
      } }, "Use this text")));
}

function editOrdering(room){
  return [ commonRoomFields(room),
    h("div", { class: "box" }, h("h3", {}, "Items, in the correct order"),
      h("p", { class: "help" }, "List these in the right order (first at the top). Students see them shuffled. The label (like a year) is revealed after they solve it."),
      listEditor(room.items, it => h("div", { class: "row" },
        h("div", { style: "flex:3" }, field("Item", it, "text", { type: "textarea", rows: 2, item: it })),
        h("div", { style: "flex:1" }, field("Label shown after solving", it, "label", { item: it, help: "optional" }))),
      { noun: "Item", blank: blankOrder })),
    hintsEditor(room) ];
}

function editSorting(room){
  room.categories = room.categories || [];
  return [ commonRoomFields(room),
    h("div", { class: "box" }, h("h3", {}, "Categories"),
      room.categories.map((c, j) => h("div", { class: "row" }, field(`Category ${j+1}`, room.categories, j, { onChange: () => {} }),
        room.categories.length > 2 ? h("button", { class: "small danger", onclick: () => { room.categories.splice(j, 1); room.items.forEach(it => { if (it.category === j) it.category = 0; else if (it.category > j) it.category--; }); changed(); render(); } }, "Remove") : null)),
      h("button", { onclick: () => { room.categories.push(""); changed(); render(); } }, "+ Add category")),
    h("div", { class: "box" }, h("h3", {}, "Items to sort"),
      listEditor(room.items, it => h("div", { class: "row" },
        h("div", { style: "flex:3" }, field("Item", it, "text", { type: "textarea", rows: 2, item: it })),
        h("div", { style: "flex:1" }, select("Correct category", it, "category", room.categories.map((c, j) => [j, c || `Category ${j+1}`]), { number: true, item: it, rerender: true }))),
      { noun: "Item", blank: blankSort })),
    hintsEditor(room) ];
}

function editReflection(room){
  const profOpts = () => room.profiles.map(p => [p.key, p.name || "(unnamed result)"]);
  return [ commonRoomFields(room),
    h("div", { class: "box" }, h("h3", {}, "Result screen"),
      h("div", { class: "row" }, field("Result heading", room, "resultHeading"), field("Button label", room, "buttonLabel")),
      field("Note under the result", room, "resultNote", { type: "textarea", rows: 2 })),
    h("div", { class: "box" }, h("h3", {}, "Possible results"),
      h("p", { class: "help" }, "The result with the most matching answers is shown on the certificate."),
      listEditor(room.profiles, p => [
        h("div", { class: "row" }, field("Result name", p, "name", { item: p, onChange: () => {} }), field("Thinkers to explore", p, "who", { item: p })),
        field("Description", p, "desc", { type: "textarea", rows: 2, item: p }),
        field("Next step", p, "next", { type: "textarea", rows: 2, item: p })
      ], { noun: "Result", blank: () => blankProfile() })),
    h("div", { class: "box" }, h("h3", {}, "Questions"),
      listEditor(room.questions, q => {
        q.options = q.options || [];
        return [ field("Question", q, "prompt", { item: q }),
          h("div", { class: "field" }, h("span", {}, "Options ", h("small", {}, "— each counts toward one result")),
            q.options.map((o, j) => h("div", { class: "row" },
              h("div", { style: "flex:3" }, field(`Option ${j+1}`, o, "text", { item: q })),
              h("div", { style: "flex:1" }, select("Counts toward", o, "profile", [["", "— choose —"], ...profOpts()], { item: q, rerender: true })),
              h("button", { class: "small danger", onclick: () => { q.options.splice(j, 1); changed(); render(); } }, "✕"))),
            h("div", {}, h("button", { class: "small", onclick: () => { q.options.push({ text: "", profile: "" }); changed(); render(); } }, "+ Add option"))) ];
      }, { noun: "Question", blank: () => ({ prompt: "", options: [{ text: "", profile: "" }, { text: "", profile: "" }], source: "", verified: false }) })),
    hintsEditor(room) ];
}

/* ===================== Sections ===================== */
function editSettings(){
  cfg.meta = cfg.meta || {};
  return [ h("h2", {}, "Settings"), h("p", { class: "help" }, "Basic information about this escape room. Make one escape room per chapter or unit, and save each as its own file."),
    h("div", { class: "box" },
      field("Escape room title", cfg.meta, "title", { onChange: () => renderNav() }),
      h("div", { class: "row" }, field("Course", cfg.meta, "course", { placeholder: "e.g. EDU 216" }),
        field("Completion code prefix", cfg.meta, "codePrefix", { help: "letters/numbers, starts each student's code" })),
      field("Learning outcome shown to students", cfg.meta, "learningOutcome", { type: "textarea", rows: 2 })),
    h("div", { class: "box" }, h("h3", {}, "Rooms"),
      h("p", { class: "help" }, "Add, remove and reorder rooms in the list on the left. Room types:"),
      h("ul", {}, Object.values(TYPES).map(t => h("li", {}, h("strong", {}, t.name + ": "), t.desc)))) ];
}
function editIntro(){
  cfg.intro = cfg.intro || {};
  return [ h("h2", {}, "Story & intro"), h("p", { class: "help" }, "The first screen students see. The \"How to play\" box is added automatically."),
    h("div", { class: "box" }, field("Heading", cfg.intro, "heading"),
      field("Story", cfg.intro, "story", { type: "textarea", rows: 7, help: "leave a blank line between paragraphs. Use **bold** and *italics*" })) ];
}
function editFinish(){
  cfg.finish = cfg.finish || {}; cfg.scoring = cfg.scoring || { mode: "completion" };
  const deductions = cfg.scoring.mode === "deductions";
  return [ h("h2", {}, "Finish & grading"),
    h("div", { class: "box" }, h("h3", {}, "Certificate"),
      field("Exit password", cfg.finish, "exitPassword", { help: "same for every student. Use it as the answer to a one-question LMS quiz. Leave blank for none" }),
      field("Certificate line", cfg.finish, "certificateLine", { help: "after the student's name" }),
      field("Instructions under the certificate", cfg.finish, "instructions", { type: "textarea", rows: 2 })),
    h("div", { class: "box" }, h("h3", {}, "Grade sent to Moodle/Canvas (SCORM version)"),
      select("Grading", cfg.scoring, "mode", [["completion", "Completion: 100% for finishing"], ["deductions", "Accuracy: points off for hints and wrong tries"]], { rerender: true }),
      deductions ? h("div", { class: "row" },
        field("Points off per hint", cfg.scoring, "hintPenalty", { type: "number", min: 0, max: 100 }),
        field("Points off per wrong try", cfg.scoring, "wrongPenalty", { type: "number", min: 0, max: 100 }),
        field("Lowest possible score", cfg.scoring, "minScore", { type: "number", min: 0, max: 100, help: "for finishing" })) : null,
      h("p", { class: "help" }, "The plain HTML version can't send grades. Use the exit password with an LMS quiz instead.")) ];
}
function editRoom(r){
  const room = cfg.rooms[r]; const t = TYPES[room.type];
  const body = { matching: editMatching, quiz: editQuiz, ordering: editOrdering, sorting: editSorting, reflection: editReflection }[room.type];
  return [ h("h2", {}, `Room ${r+1}: ${room.title || "Untitled"}`), h("p", { class: "help" }, `${t ? t.name : room.type}. ${t ? t.desc : ""}`),
    body ? body(room, r) : h("p", {}, "This room type can't be edited here.") ];
}

/* ===================== Navigation & status ===================== */
function roomStatus(r){ const items = ER.reviewItems({ rooms: [cfg.rooms[r]] }); const left = items.filter(x => x.item.verified !== true).length; return { left, total: items.length }; }
function renderNav(){
  const nav = document.getElementById("nav");
  const item = (key, label, pill) => h("div", { class: "item" + (sel === key ? " sel" : ""), tabindex: 0, role: "button",
      onclick: () => { sel = key; render(); }, onkeydown: e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); sel = key; render(); } } },
    h("span", { class: "t" }, label), pill || null);
  const addSel = h("select", { "aria-label": "Add a room", onchange: e => { if (!e.target.value) return; cfg.rooms.push(TYPES[e.target.value].blank()); sel = cfg.rooms.length - 1; changed(); render(); } },
    h("option", { value: "" }, "+ Add a room…"), Object.entries(TYPES).map(([k, t]) => h("option", { value: k }, t.name)));
  nav.replaceChildren(
    item("settings", "⚙️ Settings"), item("intro", "📜 Story & intro"),
    h("h3", {}, "Rooms"),
    ...cfg.rooms.map((room, r) => {
      const st = roomStatus(r);
      const pill = st.total ? h("span", { class: "pill" + (st.left ? "" : " ok"), title: `${st.total - st.left} of ${st.total} checked` }, st.left ? `${st.left} to check` : "✔ checked") : null;
      const el = item(r, `${r+1}. ${room.title || "Untitled"}`, pill);
      el.append(
        h("button", { class: "small", title: "Move up", "aria-label": `Move room ${r+1} up`, disabled: r === 0, onclick: e => { e.stopPropagation(); [cfg.rooms[r-1], cfg.rooms[r]] = [cfg.rooms[r], cfg.rooms[r-1]]; if (sel === r) sel = r - 1; changed(); render(); } }, "▲"),
        h("button", { class: "small danger", title: "Delete room", "aria-label": `Delete room ${r+1}`, onclick: e => { e.stopPropagation(); if (confirm(`Delete room ${r+1} "${room.title}"? This can't be undone.`)) { cfg.rooms.splice(r, 1); sel = "settings"; changed(); render(); } } }, "✕"));
      return el;
    }),
    addSel,
    h("h3", {}, "End"), item("finish", "🏁 Finish & grading"),
    h("p", { class: "help", style: "margin-top:1rem" }, "Changes save automatically in this browser. Use ", h("strong", {}, "Save project"), " or ", h("strong", {}, "Export"), " to keep a file you can share or reopen."));
}
function refreshStatus(){
  const st = ER.reviewStatus(cfg); const pct = st.total ? Math.round(100 * st.verified / st.total) : 100;
  document.getElementById("meter").replaceChildren(h("div", { class: "bar" }, h("i", { style: `width:${pct}%` })), `${st.verified} of ${st.total} items checked`);
  clearTimeout(refreshStatus.t); refreshStatus.t = setTimeout(renderNav, 400);
}
function render(){
  if (typeof sel === "number" && !cfg.rooms[sel]) sel = "settings";
  renderNav(); refreshStatus();
  const main = document.getElementById("main");
  const st = ER.reviewStatus(cfg);
  const banner = st.unverified ? h("div", { class: "notice" }, "⚠️ ", h("strong", {}, `${st.unverified} of ${st.total} items haven't been checked yet.`),
    " Everything in the sample was written with AI help and may contain mistakes. Check each item against your textbook or sources, then tick ", h("em", {}, "✔ I checked this is correct"),
    ". Students see a “Draft” notice until every item is checked. Tip: ", h("strong", {}, "Review sheet"), " prints everything with the answers.") : null;
  const view = sel === "settings" ? editSettings() : sel === "intro" ? editIntro() : sel === "finish" ? editFinish() : editRoom(sel);
  main.replaceChildren(banner || "", ...view.flat(Infinity));
}

/* ===================== Files ===================== */
function download(name, data, type){
  const url = URL.createObjectURL(new Blob([data], { type }));
  const a = h("a", { href: url, download: name }); document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}
function toast(text){ document.querySelectorAll(".toast").forEach(t => t.remove()); const t = h("div", { class: "toast", role: "status" }, text); document.body.append(t); setTimeout(() => t.remove(), 2600); }
function checkReady(action){
  const errs = ER.validate(cfg);
  if (errs.length) { showErrors(errs); return false; }
  const st = ER.reviewStatus(cfg);
  if (st.unverified && action === "export" && !confirm(`${st.unverified} of ${st.total} items haven't been checked yet.\n\nStudents will see a "Draft" notice saying answers may contain errors.\n\nExport anyway?`)) return false;
  return true;
}
function showErrors(errs){
  overlay("Fix these before previewing or exporting", h("div", { style: "padding:1rem 1.5rem;background:#fff;overflow:auto;flex:1" },
    h("div", { class: "errors" }, h("ul", {}, errs.map(e => h("li", {}, e))))));
}
function overlay(title, content, extraButtons = []){
  const close = () => { o.remove(); document.removeEventListener("keydown", onKey); };
  const onKey = e => { if (e.key === "Escape") close(); };
  const o = h("div", { class: "overlay", role: "dialog", "aria-label": title },
    h("div", { class: "bar" }, h("span", {}, title), ...extraButtons, h("button", { onclick: close, id: "overlay-close" }, "✕ Close")), content);
  document.body.append(o); document.addEventListener("keydown", onKey);
  o.querySelector("#overlay-close").focus();
  return o;
}
const gameHtml = () => ER.buildGame(GAME_TEMPLATE, cfg);
const slug = () => ER.fileSlug(cfg.meta?.title);

document.getElementById("btn-preview").onclick = () => {
  if (!checkReady("preview")) return;
  const frame = h("iframe", { title: "Preview of the student game" });
  frame.srcdoc = gameHtml();
  overlay("Preview: this is what students see (nothing is saved or graded)", frame, [h("button", { onclick: () => { frame.srcdoc = gameHtml(); } }, "↻ Restart")]);
};
document.getElementById("btn-export").onclick = () => {
  const box = h("div", { style: "padding:1.2rem 1.5rem;background:#fff;overflow:auto;flex:1" },
    h("h2", {}, "Export for students"),
    h("div", { class: "box" }, h("h3", {}, "SCORM package (.zip) for Moodle or Canvas"),
      h("p", { class: "help" }, "Grades go to the gradebook automatically. Moodle: Add an activity → SCORM package. Canvas: SCORM tool. Upload the zip without unzipping it."),
      h("button", { id: "export-scorm", onclick: () => { if (checkReady("export")) { download(`${slug()}-SCORM.zip`, ER.scorm(gameHtml(), cfg.meta.title), "application/zip"); toast("SCORM package downloaded."); } } }, "⬇ Download SCORM .zip")),
    h("div", { class: "box" }, h("h3", {}, "Web page (.html)"),
      h("p", { class: "help" }, "One file that works anywhere: double-click it, upload it as a Moodle/Canvas file, or put it on a website. Pair it with the exit password and an LMS quiz for credit. You can also reopen this file in the editor later."),
      h("button", { id: "export-html", onclick: () => { if (checkReady("export")) { download(`${slug()}.html`, gameHtml(), "text/html"); toast("Game file downloaded."); } } }, "⬇ Download game .html")));
  overlay("Export", box);
};
document.getElementById("btn-save").onclick = () => { download(`${slug()}-project.json`, JSON.stringify(cfg, null, 2), "application/json"); toast("Project saved. Open it again with Open…"); };
document.getElementById("btn-open").onclick = () => document.getElementById("file").click();
document.getElementById("file").onchange = async e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  try {
    const text = await f.text();
    const next = /\.html?$/i.test(f.name) ? ER.configFromHtml(text) : JSON.parse(text);
    if (!next || !Array.isArray(next.rooms)) throw new Error("This file doesn't contain an escape room.");
    if (!confirm(`Open "${next.meta?.title || f.name}"? This replaces what's in the editor now (save it first if you need it).`)) return;
    cfg = next; sel = "settings"; changed(); render(); toast("Opened " + f.name);
  } catch (err) { alert("Couldn't open that file: " + err.message); }
};
document.getElementById("btn-new").onclick = () => {
  const box = h("div", { style: "padding:1.2rem 1.5rem;background:#fff;overflow:auto;flex:1" },
    h("h2", {}, "Start a new escape room"),
    h("p", { class: "notice" }, "This replaces what's in the editor now. Save project first if you want to keep it."),
    h("div", { class: "row" },
      h("button", { id: "new-blank", onclick: () => { cfg = blankConfig(); sel = "settings"; changed(); render(); document.querySelector(".overlay")?.remove(); toast("Started a blank escape room."); } }, "Blank (one question room)"),
      h("button", { id: "new-sample", onclick: () => { cfg = clone(SAMPLE); sel = "settings"; changed(); render(); document.querySelector(".overlay")?.remove(); toast("Loaded the sample escape room."); } }, "Copy of the sample (Old Schoolhouse)")));
  overlay("New", box);
};
function blankConfig(){
  return { schema: 1, meta: { title: "New Escape Room", course: cfg.meta?.course || "", codePrefix: cfg.meta?.codePrefix || "", learningOutcome: "" },
    intro: { heading: "You're locked in!", story: "Solve every room to escape." },
    scoring: { mode: "completion", hintPenalty: 5, wrongPenalty: 2, minScore: 50 },
    finish: { exitPassword: "", certificateLine: "escaped by mastering this chapter", instructions: "" },
    rooms: [TYPES.quiz.blank()] };
}

/* ===================== Review sheet ===================== */
document.getElementById("btn-review").onclick = () => {
  const E = ER.esc, F = ER.fmt;
  const chk = it => `<span class="ck">${it.verified ? "☑" : "☐"}</span>`;
  const src = it => it.source ? `<div class="src">Source: ${E(it.source)}</div>` : `<div class="src none">Source: ________________________</div>`;
  const rooms = cfg.rooms.map((r, i) => {
    let body = "";
    if (r.type === "matching") { const m = ER.matching(r);
      body = `<p><strong>Lock combination:</strong> <code>${E(m.answer)}</code></p><ol>${r.cards.map(c => `<li>${chk(c)} <strong>${F(c.term)}</strong>${c.detail ? ` (${F(c.detail)})` : ""} — code <code>${E(m.code[r.cards.indexOf(c)])}</code><br>${c.clue ? "Clue: " + F(c.clue) : "<em>Decoy card (no clue)</em>"}${src(c)}</li>`).join("")}</ol>`; }
    if (r.type === "quiz") body = `<ol>${r.questions.map(q => `<li>${chk(q)} ${F(q.prompt)}<br><strong>Answer:</strong> ${q.kind === "choice" ? (q.choices || []).filter(c=>String(c).trim()).map((c, j) => j === q.correct ? `<u><strong>${F(c)}</strong></u>` : F(c)).join(" · ") : E(q.answers)}${src(q)}</li>`).join("")}</ol>`;
    if (r.type === "ordering") body = `<p>Correct order:</p><ol>${r.items.map(it => `<li>${chk(it)} ${F(it.text)}${it.label ? ` <strong>(${F(it.label)})</strong>` : ""}${src(it)}</li>`).join("")}</ol>`;
    if (r.type === "sorting") body = `<ol>${r.items.map(it => `<li>${chk(it)} ${F(it.text)} → <strong>${E(r.categories[it.category] || "?")}</strong>${src(it)}</li>`).join("")}</ol>`;
    if (r.type === "reflection") body = `<p>Results:</p><ol>${r.profiles.map(p => `<li>${chk(p)} <strong>${E(p.name)}</strong> — ${F(p.desc)}${p.who ? `<br>Thinkers: ${F(p.who)}` : ""}${p.next ? `<br>Next step: ${F(p.next)}` : ""}${src(p)}</li>`).join("")}</ol>
      <p>Questions:</p><ol>${r.questions.map(q => `<li>${chk(q)} ${F(q.prompt)}<ul>${(q.options||[]).map(o => `<li>${F(o.text)} → ${E((r.profiles.find(p => p.key === o.profile) || {}).name || "?")}</li>`).join("")}</ul>${src(q)}</li>`).join("")}</ol>`;
    const hints = (r.hints || []).length ? `<p class="hints"><strong>Hints:</strong></p><ol class="hints">${r.hints.map(x => `<li>${F(x)}</li>`).join("")}</ol>` : "";
    return `<section><h2>Room ${i+1}: ${E(r.title)}</h2><p class="story">${F(r.story || "")}</p>${r.reference ? `<p>Reference shown to students: ${F(r.reference)}</p>` : ""}${body}${hints}</section>`;
  }).join("");
  const st = ER.reviewStatus(cfg);
  const doc = `<!DOCTYPE html><html><head><meta charset="utf-8"><title>Review sheet: ${E(cfg.meta.title)}</title><style>
    body{font-family:Georgia,serif;max-width:800px;margin:1.5rem auto;padding:0 1rem;color:#111;line-height:1.45}
    h1{font-size:1.5rem;margin-bottom:.2rem} h2{font-size:1.15rem;border-bottom:1px solid #999;margin-top:1.6rem}
    li{margin:.45rem 0} .ck{font-size:1.15rem} .src{font-size:.85rem;color:#444} .src.none{color:#999}
    .story{font-style:italic;color:#444} .hints{font-size:.9rem;color:#444} code{font-size:1.05rem}
    section{break-inside:auto} @media print{.noprint{display:none}}</style></head><body>
    <h1>Review sheet: ${E(cfg.meta.title)}</h1>
    <p>${E(cfg.meta.course || "")} · ${st.verified} of ${st.total} items checked · ☐ = not yet checked<br>
    Exit password: <strong>${E(cfg.finish?.exitPassword || "(none)")}</strong> · Grading: ${cfg.scoring?.mode === "deductions" ? "accuracy" : "completion"}</p>
    <p><em>Check every item against your textbook or sources. Content written with AI help can contain mistakes. Mark items as checked in the editor.</em></p>
    ${rooms}</body></html>`;
  const frame = h("iframe", { title: "Review sheet" }); frame.srcdoc = doc;
  overlay("Review sheet (contains answers: for instructors only)", frame, [h("button", { onclick: () => frame.contentWindow.print() }, "🖨️ Print")]);
};

render();
</script>
</body>
</html>
