function readStartFile(f){
  WIZ.fileCfg = null; WIZ.fileErr = ""; WIZ.fileName = f ? f.name : "";
  if (!f) return renderWizard();
  f.text().then(text => {
    try { WIZ.fileCfg = parseSaved(text, f.name); }
    catch (err) { WIZ.fileErr = "That file couldn't be opened. Choose a backup copy or a game file made with this editor."; }
    WIZ.errors = WIZ.errors.filter(e => e.key !== "start-file");
    renderWizard();
    say(WIZ.fileCfg ? `Chosen: ${f.name}.` : WIZ.fileErr);
  });
}
function parseSaved(text, name){
  const next = /\.json$/i.test(name) ? JSON.parse(text) : ER.configFromHtml(text);
  if (!next || !Array.isArray(next.rooms)) throw new Error("This file doesn't contain an escape room.");
  return next;
}

}

const plainText = s => String(s ?? "").replace(/\*\*(.+?)\*\*/g, "$1").replace(/\*(.+?)\*/g, "$1").trim();
function factWords(room, list, it){
  if (list === "cards") return [`Card: ${plainText(it.term) || "(no name)"}${it.detail ? ` (${plainText(it.detail)})` : ""}`, String(it.clue || "").trim() ? `Clue: ${plainText(it.clue)}` : "An extra card, with no clue"];
  if (room.type === "quiz") return [`Question: ${plainText(it.prompt) || "(not written yet)"}`, `Answer: ${it.kind === "choice" ? plainText((it.choices || [])[it.correct]) || "(none marked)" : ER.accepted(it.answers).length ? String(it.answers).split("|").map(x => x.trim()).filter(Boolean).join(" / ") : "(none yet)"}`];
  if (room.type === "ordering") { const i = room.items.indexOf(it); return [`Number ${i + 1} in the order: ${plainText(it.text)}`, it.label ? `Shown after solving: ${plainText(it.label)}` : ""]; }
  if (room.type === "sorting") return [`Item: ${plainText(it.text)}`, `Group: ${plainText((room.categories || [])[it.category]) || "(none chosen)"}`];
  if (list === "profiles") return [`Result: ${plainText(it.name)}`, plainText(it.desc)];
  return [`Question: ${plainText(it.prompt)}`, (it.options || []).map(o => `${plainText(o.text)} → ${plainText((room.profiles.find(p => p.key === o.profile) || {}).name || "?")}`).join("; ")];
}

/* ---------- the exit password: never empty, and never the sample's on someone else's escape room ---------- */
const SAMPLE_PW = String(SAMPLE.finish?.exitPassword || "");
const withoutPw = c => stripCheck({ ...c, finish: { ...(c.finish || {}), exitPassword: "" } }).replace(/,?"decoy":(true|false)/g, "");
const sameAsSample = c => withoutPw(c) === withoutPw(SAMPLE);
function needsPassword(){
  const pw = String(cfg.finish?.exitPassword || "").trim();
  if (!pw) return true;
  return pw === SAMPLE_PW && meta.pwOk !== pw && !sameAsSample(cfg);
}
function suggestPassword(){
  const words = String(cfg.meta?.title || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toUpperCase().match(/[A-Z0-9]+/g) || [];
  const num = words.find(w => /^\d+$/.test(w)) || "";
  const word = words.find(w => /^[A-Z]{3,}$/.test(w) && !["THE", "AND", "FOR", "ESCAPE", "ROOM"].includes(w)) || "CLASS";
  let s = word.slice(0, 8) + (num ? num.slice(0, 4) : "ESCAPE");
  if ((/O/.test(s) && /0/.test(s)) || (/[IL]/.test(s) && /1/.test(s)) || s === SAMPLE_PW) s = word.slice(0, 8) + "ESCAPE";
  return s;
}
/* A slip that asks for the password before a student file is made. Resolves the password, or null to go back. */
function askPassword(){
  return new Promise(resolve => {
    const old = String(cfg.finish?.exitPassword || "").trim();
    let m = null;
    const input = h("input", { type: "text", id: "ask-password", value: suggestPassword(), autocomplete: "off", spellcheck: "false", "aria-describedby": "ask-password-hint",
      onkeydown: e => { if (e.key === "Enter") { e.preventDefault(); ok(); } } });
    const err = h("p", { class: "ferr", id: "ask-password-err", hidden: true }, h("span", { class: "sr" }, "Error: "), "Enter an exit password");
    const done = v => { box.remove(); modalClose(m); resolve(v); };
    const ok = () => {
      const v = input.value.trim();

      done(v);

      h("div", { class: "slipbox" }, h("h2", { id: "ask-password-title" }, "What should the exit password be?"),
        h("p", { id: "ask-password-why" }, old ? `This escape room started as a copy of the sample, so it still has the sample's password, ${old}. Students who played the sample could use it again.` : "This escape room has no exit password yet."),
        h("div", { class: "wf" }, h("label", { class: "wlabel", for: "ask-password" }, "Exit password"),
          h("p", { class: "whint", id: "ask-password-hint" }, "Students see it on their certificate and type it into your course quiz. Letters and numbers that are easy to copy work best. We suggest one; you can change it."),

    trouble("A student finished but has no grade", h("p", {}, "Canvas sometimes loses the grade if the student closes the tab straight away or their browser blocks cookies. Ask them to stay on the certificate for a few seconds, then grade them by hand."))],
  "canvas-quiz": () => [h("ol", { class: "walk" }, downloadStep("canvas-quiz"),
      h("li", {}, "In your Canvas course, go to ", B("Files"), " and click ", B("Upload"), " to add the game file."),
      h("li", {}, "Go to ", B("Pages"), " and click ", B("+ Page"), `. Call it “${cfg.meta?.title || "Escape room"}”. In the editor, add a link to the file (`, B("Link"), ", then ", B("Course Links"), ", then ", B("Files"), "). Click ", B("Save & Publish"), ".", MENUS()),
      h("li", {}, "Go to ", B("Quizzes"), " and click ", B("+ Quiz"), ". Add a ", B("Fill in the Blank"), " question. Paste the question text below, and the exit password as the answer. To ignore capital letters, choose ", B("Close enough"), " and ", B("Spelling only (ignore case)"), ", or add the password in small letters as a second answer.", MENUS()),
      h("li", {}, "To try it as a student, use ", B("Student View"), " in the course settings.")),
    passwordPart(true),
    h("h2", {}, "If something goes wrong"),
    trouble("The file downloads instead of playing", h("p", {}, "That's fine: tell students to open the downloaded file. It opens in their browser.")),
    trouble("I need to fix a mistake after students have started", h("p", {}, "Fix it here and download the game file again. In ", B("Files"), ", upload the new file with the same name and choose to replace the old one."), MENUS())],
  other: () => [h("ol", { class: "walk" }, downloadStep("other"),
      h("li", {}, "Upload the game file to your course as a file. Tell students to download it and open it: it opens in their browser."),
      h("li", {}, "For the grade, make a one-question quiz in your course system, with the exit password as the answer. The text is below, ready to copy."),
      h("li", {}, "Try it yourself the way a student would.")),
    passwordPart(true)],
  file: () => [h("ol", { class: "walk" }, downloadStep("file"),
      h("li", {}, "Email or post the game file. Students download it and double-click it: it opens in their browser, and needs no internet connection."),
      h("li", {}, "Phones and tablets sometimes show the file as code instead of playing it. Ask students to use a computer."),
      h("li", {}, "Ask students to send you the exit password from their certificate, or a screenshot of it.")),
    passwordPart(false)]
};
WSTEPS.walk = {
  title: () => WALK_TITLE[walkRoute()] || "Put it in your course",
  back: () => hashFor("deliver"),
  body: () => {
    const route = walkRoute();
    if (!WALKS[route]) return [H1("Put it in your course"), h("p", {}, "First choose how your students will get to the escape room."), h("p", {}, h("a", { href: hashFor("deliver") }, "Choose how students get it"))];
    return [H1(WALK_TITLE[route]), h("p", { class: "whint" }, "Do these in order. Step 1 is here; the rest happen in your course."), ...WALKS[route]()];
  },
  next: () => hashFor("done")
};

applyDisplay();
render();
routeTo(readHash() || homeRoute(), false);
</script>
</body>
</html>
