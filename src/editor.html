<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escape Room Editor</title>
<style>
  :root{
    --bg:#f4f5f2; --panel:#fff; --ink:#1c2420; --muted:#66706a; --line:#e3e5df; --line2:#cfd3cb;
    --accent:#24402f; --accent2:#2f5a40; --accent-soft:#e8f0eb; --gold:#e8b84a; --gold-soft:#fdf5e1;
    --warn:#fff6dd; --warnline:#e9b949; --ok:#e9f6ee; --okline:#5fae79; --bad:#c0362c; --bad-soft:#fdeceb;
    --radius:14px; --shadow:0 1px 2px rgba(20,30,25,.06),0 4px 16px rgba(20,30,25,.06);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
  /* ---- top bar ---- */
  header{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.92);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line);padding:.6rem 1.1rem;display:flex;flex-wrap:wrap;gap:.6rem;align-items:center}
  header h1{font-size:1.02rem;margin:0 .6rem 0 0;display:flex;align-items:center;gap:.45rem;letter-spacing:-.01em}
  header h1 .logo{width:30px;height:30px;border-radius:9px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:1rem}
  header .spacer{flex:1}
  header .group{display:flex;gap:.35rem;flex-wrap:wrap}
  .meter{display:flex;align-items:center;gap:.55rem;font-size:.82rem;color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:.25rem .7rem .25rem .35rem}
  .meter .bar{width:80px;height:8px;background:var(--line);border-radius:99px;overflow:hidden}
  .meter .bar i{display:block;height:100%;background:var(--okline);border-radius:99px;transition:width .3s}
  /* ---- buttons ---- */
  button,.btn{font:inherit;font-size:.88rem;cursor:pointer;border-radius:10px;border:1px solid var(--line2);background:#fff;color:var(--ink);padding:.42rem .8rem;transition:background .15s,border-color .15s,box-shadow .15s}
  button:hover:not(:disabled){background:#f6f7f4;border-color:#b9beb4}
  button:disabled{opacity:.45;cursor:not-allowed}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  button.primary:hover:not(:disabled){background:var(--accent2)}
  button.accent{background:var(--gold);border-color:var(--gold);color:#2b1d0b;font-weight:600}
  button.accent:hover:not(:disabled){background:#f0c35f}
  button.ghost{background:transparent;border-color:transparent}
  button.small{font-size:.78rem;padding:.2rem .5rem;border-radius:8px}
  button.danger{color:var(--bad)}
  button.danger:hover:not(:disabled){background:var(--bad-soft);border-color:#f0b7b2}
  button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:3px solid #6aa7ff;outline-offset:2px}
  /* ---- layout ---- */
  .layout{display:grid;grid-template-columns:290px 1fr;min-height:calc(100vh - 54px)}
  nav{border-right:1px solid var(--line);background:#fafbf8;padding:.9rem .7rem;display:flex;flex-direction:column;gap:.25rem;position:sticky;top:54px;align-self:start;max-height:calc(100vh - 54px);overflow:auto}
  nav .item{display:flex;align-items:center;gap:.5rem;padding:.5rem .6rem;border-radius:10px;cursor:pointer;border:1px solid transparent;transition:background .12s}
  nav .item:hover{background:#f0f2ed}
  nav .item.sel{background:#fff;border-color:var(--line);box-shadow:var(--shadow);font-weight:600}
  nav .item .ic{width:26px;height:26px;border-radius:8px;background:var(--accent-soft);display:grid;place-items:center;font-size:.85rem;flex:none}
  nav .item .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:.15rem;font-size:.9rem;overflow-wrap:break-word}
  nav .item .t .pill{align-self:flex-start}
  nav .item .acts{display:flex;gap:.15rem;opacity:0;transition:opacity .12s}
  nav .item:hover .acts,nav .item.sel .acts,nav .item:focus-within .acts{opacity:1}
  nav .pill{font-size:.7rem;border-radius:99px;padding:.05rem .5rem;background:var(--warn);color:#7a5a0c;white-space:nowrap;font-weight:600}
  nav .pill.ok{background:var(--ok);color:#2c6b40}
  nav h3{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:1rem .6rem .3rem;font-weight:700}
  nav select{margin-top:.3rem}
  main{padding:1.4rem 2rem 5rem;max-width:1000px;width:100%}
  h2{margin:.1rem 0 .25rem;font-size:1.45rem;letter-spacing:-.015em}
  .pagehead{display:flex;gap:.8rem;align-items:flex-start;flex-wrap:wrap;margin-bottom:.4rem}
  .pagehead>div{flex:1;min-width:240px}
  .chip{display:inline-flex;align-items:center;gap:.3rem;font-size:.76rem;font-weight:600;border-radius:99px;padding:.15rem .6rem;background:var(--accent-soft);color:var(--accent)}
  .help{color:var(--muted);font-size:.87rem;margin:.15rem 0 .6rem}
  /* ---- forms ---- */
  .field{display:flex;flex-direction:column;gap:.25rem;margin:.6rem 0}
  .field>span{font-weight:600;font-size:.84rem}
  .field small{color:var(--muted);font-weight:normal}
  input[type=text],input[type=number],textarea,select{font:inherit;font-size:.92rem;padding:.5rem .65rem;border:1px solid var(--line2);border-radius:10px;background:#fff;color:var(--ink);width:100%;transition:border-color .15s,box-shadow .15s}
  input[type=text]:focus,input[type=number]:focus,textarea:focus,select:focus{border-color:#6aa7ff;box-shadow:0 0 0 3px rgba(106,167,255,.18);outline:none}
  textarea{min-height:3.2rem;resize:vertical}
  .row{display:flex;gap:.7rem;flex-wrap:wrap;align-items:flex-end}
  .row>.field{flex:1;min-width:160px}
  .box{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:1rem 1.15rem;margin:1rem 0;box-shadow:var(--shadow)}
  .box h3{margin:0 0 .35rem;font-size:1rem;letter-spacing:-.01em}
  .entry{border:1px solid var(--line);border-left:4px solid var(--warnline);background:#fff;border-radius:12px;padding:.7rem .9rem;margin:.7rem 0}
  .entry.verified{border-left-color:var(--okline)}
  .entry .head{display:flex;align-items:center;gap:.35rem;margin-bottom:.15rem}
  .entry .head strong{flex:1;font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .verify{display:flex;flex-wrap:wrap;gap:.7rem;align-items:center;margin-top:.5rem;padding-top:.55rem;border-top:1px dashed var(--line)}
  .verify .field{margin:0;flex:1;min-width:200px}
  .verify label.chk{display:flex;gap:.45rem;align-items:center;font-weight:600;font-size:.86rem;white-space:nowrap;padding:.35rem .7rem;border-radius:99px;background:var(--warn);cursor:pointer}
  .entry.verified .verify label.chk{background:var(--ok)}
  .choices .choice{display:flex;gap:.45rem;align-items:center;margin:.3rem 0}
  .choices .choice input[type=text]{flex:1}
  /* switch */
  .switch{display:inline-flex;align-items:center;gap:.6rem;cursor:pointer;font-weight:600;font-size:.92rem;user-select:none}
  .switch input{position:absolute;opacity:0;width:1px;height:1px}
  .switch .track{width:42px;height:24px;border-radius:99px;background:#c9cec6;position:relative;transition:background .15s;flex:none}
  .switch .track::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
  .switch input:checked+.track{background:var(--okline)}
  .switch input:checked+.track::after{transform:translateX(18px)}
  .switch input:focus-visible+.track{outline:3px solid #6aa7ff;outline-offset:2px}
  /* answer key */
  .answerkey{background:linear-gradient(180deg,#f2faf5,#fff);border:1px solid #bfe0cb;border-radius:var(--radius);padding:.85rem 1.1rem;margin:1rem 0;box-shadow:var(--shadow)}
  .answerkey summary{cursor:pointer;font-weight:700;color:#2c6b40;list-style:none;display:flex;align-items:center;gap:.4rem}
  .answerkey summary::-webkit-details-marker{display:none}
  .answerkey summary::after{content:"Hide";margin-left:auto;font-weight:500;font-size:.8rem;color:var(--muted)}
  .answerkey:not([open]) summary::after{content:"Show"}
  .answerkey ul{margin:.5rem 0 .1rem;padding-left:1.2rem}
  .answerkey li{margin:.2rem 0}
  .notice{background:var(--warn);border:1px solid #f1d48a;border-radius:12px;padding:.7rem .9rem;margin:.7rem 0}
  .warnline{background:var(--gold-soft);border:1px solid #f1d48a;border-radius:10px;padding:.45rem .7rem;margin:.3rem 0;font-size:.86rem}
  .errors{background:var(--bad-soft);border:1px solid #f0b7b2;border-radius:12px;padding:.7rem .9rem;margin:.7rem 0}
  .errors li{margin:.15rem 0}
  /* dialogs */
  .overlay{position:fixed;inset:0;background:rgba(15,22,18,.55);backdrop-filter:blur(2px);z-index:20;display:flex;flex-direction:column}
  .overlay .bar{background:var(--accent);color:#fff;display:flex;gap:.5rem;align-items:center;padding:.6rem 1rem}
  .overlay .bar span{flex:1;font-weight:600}
  .overlay .bar button{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.3)}
  .overlay iframe{flex:1;border:0;background:#fff;width:100%}
  .sheet{padding:1.4rem 1.8rem;background:#fff;overflow:auto;flex:1}
  /* student preview */
  .preview{position:fixed;inset:0;z-index:25;display:flex;flex-direction:column;background:#111a15}
  .pbar{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;padding:.55rem .9rem;background:#0f1713;color:#e9efe9;border-bottom:1px solid #2a3a30}
  .pbar .badge{display:flex;align-items:center;gap:.45rem;font-weight:700;font-size:.9rem}
  .pbar .badge i{font-style:normal;background:#e8b84a;color:#2b1d0b;border-radius:99px;padding:.1rem .55rem;font-size:.72rem;letter-spacing:.06em}
  .pbar .rooms{display:flex;gap:.25rem;flex-wrap:wrap;flex:1;justify-content:center}
  .pbar .rooms button{min-width:2.2rem;background:#1d2b23;color:#cfe0d4;border-color:#2f4337;border-radius:9px;padding:.3rem .55rem;font-size:.82rem}
  .pbar .rooms button[aria-current="step"]{background:#e8b84a;color:#2b1d0b;border-color:#e8b84a;font-weight:700}
  .pbar .ctrl{display:flex;gap:.4rem;align-items:center}
  .pbar button{background:#1d2b23;color:#e9efe9;border-color:#2f4337}
  .pbar button:hover:not(:disabled){background:#26382d;border-color:#3d5546}
  .pbar .exit{background:#fff;color:#14201a;border-color:#fff;font-weight:700}
  .pbar .exit:hover:not(:disabled){background:#e9efe9}
  .pbar .switch{color:#e9efe9;font-size:.85rem}
  .preview iframe{flex:1;border:0;width:100%;background:#16281d}
  .toast{position:fixed;bottom:1.2rem;left:50%;transform:translateX(-50%);background:#1c2420;color:#fff;padding:.6rem 1.1rem;border-radius:12px;z-index:40;font-size:.9rem;box-shadow:0 8px 24px rgba(0,0,0,.2)}
  .mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.86rem}
  @media (prefers-reduced-motion: reduce){*{transition:none!important}}
  @media (max-width:1100px){nav{position:static;max-height:none}}
  @media (max-width:820px){.layout{grid-template-columns:1fr}nav{position:static;max-height:none;border-right:0;border-bottom:1px solid var(--line)}main{padding:1rem}nav .item .acts{opacity:1}}
</style>
</head>
<body>
<header>
  <h1><span class="logo" aria-hidden="true">🗝️</span> Escape Room Editor</h1>
  <div class="meter" id="meter" title="Items checked against your sources"></div>
  <span class="spacer"></span>
  <div class="group">
    <button id="btn-new">New…</button>
    <button id="btn-open">Open…</button>
    <button id="btn-save">Save project</button>
    <button id="btn-review" title="Every room with its answers, for checking against your sources">Answer sheet</button>
  </div>
  <div class="group">
    <button id="btn-preview" class="primary">▶ Preview as student</button>
    <button id="btn-export" class="accent">Export</button>
  </div>
  <input type="file" id="file" accept=".json,.html,.htm" hidden>
</header>
<div class="layout">
  <nav id="nav" aria-label="Sections"></nav>
  <main id="main"></main>
</div>

<script>
/*__SHARED__*/
</script>
<script>
const GAME_TEMPLATE = "__GAME_TEMPLATE__";
const SAMPLE = "__DEFAULT_CONFIG__";
const STORE = "escape-room-editor-v1";
const clone = o => JSON.parse(JSON.stringify(o));

/* ===================== State ===================== */
let cfg = load() || clone(SAMPLE);
let sel = "settings";      // "settings" | "intro" | "finish" | room index (number)
let quizText = {};         // room index -> true when editing a quiz as plain text

function load(){ try { const s = localStorage.getItem(STORE); return s ? JSON.parse(s) : null; } catch(e){ return null; } }
let saveTimer = null;
function changed(){ clearTimeout(saveTimer); saveTimer = setTimeout(() => { try { localStorage.setItem(STORE, JSON.stringify(cfg)); } catch(e){} }, 300); refreshStatus(); refreshAnswerKey(); }

/* ===================== Tiny DOM helper ===================== */
function h(tag, props = {}, ...kids){
  const el = document.createElement(tag);
  for (const [k,v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "class") el.className = v;
    else if (k === "value") el.value = v;
    else if (k === "checked") el.checked = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  return el;
}
let uid = 0;
/* A labelled input bound to obj[key]. opts: {type, help, rows, placeholder, content(bool: editing it un-verifies the item), item, onChange} */
function field(label, obj, key, opts = {}){
  const id = "f" + (++uid);
  const tag = opts.type === "textarea" ? "textarea" : "input";
  const input = h(tag, { id, type: tag === "input" ? (opts.type || "text") : null, rows: opts.rows, placeholder: opts.placeholder,
    value: obj[key] ?? "", min: opts.min, max: opts.max,
    oninput: e => {
      obj[key] = opts.type === "number" ? Number(e.target.value) : e.target.value;
      if (opts.item && opts.item.verified) { opts.item.verified = false; const box = e.target.closest(".entry"); if (box) { box.classList.remove("verified"); const c = box.querySelector(".verify input[type=checkbox]"); if (c) c.checked = false; } }
      opts.onChange && opts.onChange(e);
      changed();
    }});
  return h("label", { class: "field", for: id }, h("span", {}, label, opts.help ? h("small", {}, " — " + opts.help) : null), input);
}
function select(label, obj, key, options, opts = {}){
  const id = "f" + (++uid);
  const s = h("select", { id, onchange: e => { const v = e.target.value; obj[key] = opts.number ? Number(v) : v;
    if (opts.item && opts.item.verified) { opts.item.verified = false; }
    changed(); opts.rerender ? render() : null; } },
    options.map(([v, t]) => h("option", { value: v }, t)));
  s.value = obj[key] ?? "";
  return h("label", { class: "field", for: id }, h("span", {}, label, opts.help ? h("small", {}, " — " + opts.help) : null), s);
}
/* Source + "I checked this" row shown on every gradable item. */
function verifyRow(item){
  return h("div", { class: "verify" },
    field("Source", item, "source", { placeholder: "e.g. Textbook ch. 3, p. 45" }),
    h("label", { class: "chk" }, h("input", { type: "checkbox", checked: item.verified === true, onchange: e => {
      item.verified = e.target.checked; e.target.closest(".entry").classList.toggle("verified", item.verified); changed(); } }),
      "✔ I checked this is correct"));
}
/* Generic list editor: move / delete / add. */
function listEditor(list, renderItem, opts){
  const wrap = h("div", {});
  list.forEach((it, i) => {
    const gradable = opts.gradable !== false;
    wrap.append(h("div", { class: "entry" + (gradable && it.verified ? " verified" : "") + (gradable ? "" : " verified") },
      h("div", { class: "head" }, h("strong", {}, `${opts.noun} ${i+1}`),
        h("button", { class: "small", title: "Move up", "aria-label": `Move ${opts.noun} ${i+1} up`, disabled: i === 0, onclick: () => { [list[i-1], list[i]] = [list[i], list[i-1]]; changed(); render(); } }, "▲"),
        h("button", { class: "small", title: "Move down", "aria-label": `Move ${opts.noun} ${i+1} down`, disabled: i === list.length - 1, onclick: () => { [list[i+1], list[i]] = [list[i], list[i+1]]; changed(); render(); } }, "▼"),
        h("button", { class: "small danger", "aria-label": `Delete ${opts.noun} ${i+1}`, onclick: () => { if (confirm(`Delete ${opts.noun.toLowerCase()} ${i+1}?`)) { list.splice(i, 1); changed(); render(); } } }, "Delete")),
      renderItem(it, i),
      gradable ? verifyRow(it) : null));
  });
  wrap.append(h("button", { onclick: () => { list.push(opts.blank()); changed(); render(); } }, `+ Add ${opts.noun.toLowerCase()}`));
  return wrap;
}
function hintsEditor(room){
  if (!ER.HINT_ROOMS.includes(room.type)) return null;      // reflection rooms have no wrong answers
  room.hints = (room.hints || []).slice(0, 2); while (room.hints.length < 2) room.hints.push("");
  const rules = ER.hintRules(cfg);
  const warn = h("div", { id: "hint-warnings" });
  const showWarnings = () => warn.replaceChildren(...ER.hintWarnings(room).map(w => h("div", { class: "warnline", role: "status" }, "⚠️ " + w.message + " Try pointing students toward how to find it instead.")));
  const box = h("div", { class: "box" },
    h("div", { class: "row", style: "align-items:center;justify-content:space-between" }, h("h3", { style: "margin:0" }, "💡 Hints"),
      h("label", { class: "switch" }, h("input", { type: "checkbox", id: "hints-toggle", checked: !!room.hintsEnabled,
        onchange: e => { room.hintsEnabled = e.target.checked; changed(); render(); } }), h("span", { class: "track", "aria-hidden": "true" }),
        room.hintsEnabled ? "Hints on" : "Hints off")),
    room.hintsEnabled ? [
      h("p", { class: "help" }, `Up to two hints. Hint 1 unlocks after ${rules.first} wrong ${rules.first === 1 ? "try" : "tries"} in this room, and hint 2 after ${Math.max(rules.first, rules.second)} (change this in Settings). Write hints that point students toward how to find the answer, not the answer itself.`),
      field("Hint 1: a gentle nudge", room.hints, 0, { type: "textarea", rows: 2, placeholder: "e.g. Look for one key idea in each description…", onChange: showWarnings }),
      field("Hint 2: a stronger nudge", room.hints, 1, { type: "textarea", rows: 2, placeholder: "e.g. Start with the ones you're surest about…", onChange: showWarnings }),
      warn
    ] : h("p", { class: "help", style: "margin:.4rem 0 0" }, "Students get no hints in this room. Turn hints on to write up to two.",
        (room.hints || []).some(x => String(x).trim()) ? " Your saved hints are kept." : ""));
  showWarnings();
  return box;
}

/* ===================== Room types ===================== */
const TYPES = {
  quiz:       { icon: "❓", name: "Question lock", desc: "Short-answer or multiple-choice questions. All must be right to open the lock. Works like a chapter quiz.",
                blank: () => ({ type: "quiz", title: "New question room", story: "", reference: "", lockLabel: "🔒 Question lock", successMessage: "🔓 Every answer is right. The lock opens!", hints: [], questions: [blankQuestion()] }) },
  matching:   { icon: "🔤", name: "Matching code", desc: "Cards with codes and clues. Students match each clue to a card and enter the codes as the lock combination.",
                blank: () => ({ type: "matching", title: "New matching room", story: "", reference: "", codeStyle: "letters", codeWord: "", cluesHeading: "Clues", lockLabel: "🔒 Lock", successMessage: "🔓 The lock opens!", failMessage: "The lock won't budge. Check each clue again.", hints: [], cards: [blankCard(), blankCard()] }) },
  ordering:   { icon: "🕰️", name: "Put in order", desc: "Students arrange items in the correct order (timelines, steps in a process).",
                blank: () => ({ type: "ordering", title: "New timeline room", story: "", reference: "", lockLabel: "🔒 Order lock", successMessage: "🔓 Everything is in order. The lock opens!", hints: [], items: [blankOrder(), blankOrder()] }) },
  sorting:    { icon: "🗂️", name: "Sort into groups", desc: "Students put each item into the right category.",
                blank: () => ({ type: "sorting", title: "New sorting room", story: "", reference: "", categories: ["Group A", "Group B"], lockLabel: "📋 Sorting lock", successMessage: "🔓 All sorted. The lock opens!", hints: [], items: [blankSort()] }) },
  reflection: { icon: "🪞", name: "Reflection survey", desc: "No wrong answers. Each choice counts toward a result profile, shown on the certificate.",
                blank: () => ({ type: "reflection", title: "New reflection room", story: "", reference: "", buttonLabel: "Continue", successMessage: "✨ Done!", resultHeading: "Your result", resultNote: "", hints: [], profiles: [blankProfile("A"), blankProfile("B")], questions: [] }) }
};
function blankQuestion(kind = "short"){ return { prompt: "", kind, answers: "", choices: ["", "", "", ""], correct: 0, source: "", verified: false }; }
function blankCard(){ return { term: "", detail: "", icon: "", clue: "", code: "", source: "", verified: false }; }
function blankOrder(){ return { text: "", label: "", source: "", verified: false }; }
function blankSort(){ return { text: "", category: 0, source: "", verified: false }; }
function blankProfile(k){ return { key: k || ("P" + Date.now().toString(36)), name: "", who: "", desc: "", next: "", source: "", verified: false }; }

function commonRoomFields(room){
  return h("div", { class: "box" }, h("h3", {}, "Room text"),
    field("Room title", room, "title", { onChange: () => renderNav() }),
    field("Story / instructions", room, "story", { type: "textarea", rows: 3, help: "what students read when they enter. Use **bold** and *italics*" }),
    field("Reading reference shown to students", room, "reference", { placeholder: "e.g. Review: Chapter 4, pages 88–102", help: "optional" }),
    h("div", { class: "row" },
      field("Lock label", room, "lockLabel"),
      field("Message when solved", room, "successMessage")));
}

function editMatching(room){
  return [
    commonRoomFields(room),
    h("div", { class: "box" }, h("h3", {}, "Lock"),
      h("div", { class: "row" },
        select("Code on each card", room, "codeStyle", [["letters", "Letters (A–Z)"], ["numbers", "Numbers (1–9)"]], { rerender: true }),
        room.codeStyle !== "numbers" ? field("Code word (optional)", room, "codeWord", { help: "one letter per clue, e.g. LEARN" }) : null,

/* Plain-text quiz format:
   Q: question            A: answer | other accepted answer
   - wrong choice         * correct choice
   Source: …              Verified: yes          (blank line between questions) */
function quizToText(qs){
  return qs.map(q => [ `Q: ${q.prompt}`,
    ...(q.kind === "choice" ? (q.choices || []).filter(c => String(c).trim()).map((c, j) => `${j === q.correct ? "*" : "-"} ${c}`) : [`A: ${q.answers}`]),
    q.source ? `Source: ${q.source}` : null, q.verified ? "Verified: yes" : null ].filter(x => x != null).join("\n")).join("\n\n");
}
function textToQuiz(text){
  const out = [], problems = [];
  text.replace(/\r/g, "").split(/\n\s*\n/).map(b => b.trim()).filter(Boolean).forEach((block, n) => {
    const q = blankQuestion(); q.choices = []; let hasA = false;
    block.split("\n").forEach(line => {
      const l = line.trim(); let m;
      if ((m = l.match(/^q\s*[:.)]\s*(.*)$/i))) q.prompt = m[1];
      else if ((m = l.match(/^a\s*[:.)]\s*(.*)$/i))) { q.answers = m[1]; hasA = true; }
      else if ((m = l.match(/^([*-])\s*(.*)$/))) { if (m[1] === "*") q.correct = q.choices.length; q.choices.push(m[2]); }
      else if ((m = l.match(/^source\s*:\s*(.*)$/i))) q.source = m[1];
      else if (/^verified\s*:\s*(yes|y|true|✔|✓)\s*$/i.test(l)) q.verified = true;
      else if (l) q.prompt = q.prompt ? q.prompt + " " + l : l;
    });
    q.kind = q.choices.length ? "choice" : "short";
    if (!q.choices.length) q.choices = ["", "", "", ""];
    if (!q.prompt) problems.push(`Question ${n+1} has no "Q:" line.`);
    if (q.kind === "short" && !hasA) problems.push(`Question ${n+1} has no "A:" answer line or choices.`);
    if (q.kind === "choice" && !block.split("\n").some(l => l.trim().startsWith("*"))) problems.push(`Question ${n+1}: mark the correct choice with * instead of -.`);
    out.push(q);
  });
  return { questions: out, problems };
}

  if (!checkReady("preview")) return;

  let current = 0, showKey = false;
  const frame = h("iframe", { title: "Student view of the escape room" });
  const send = msg => frame.contentWindow && frame.contentWindow.postMessage(msg, "*");
  const steps = [["Intro", 0], ...cfg.rooms.map((r, i) => [String(i + 1), i + 1, r.title]), ["🏁", n + 1, "Certificate"]];
  const roomBtns = steps.map(([label, k, title]) => h("button", { "data-room": k, title: title || (k === 0 ? "Intro" : ""), "aria-label": k === 0 ? "Go to intro" : k > n ? "Go to certificate" : `Go to room ${k}: ${title}`,
    onclick: () => send({ er: "goto", room: k }) }, label));
  const mark = () => roomBtns.forEach(b => b.setAttribute("aria-current", +b.dataset.room === current ? "step" : "false"));
  const prev = h("button", { "aria-label": "Previous room", onclick: () => send({ er: "goto", room: Math.max(0, current - 1) }) }, "◀");
  const next = h("button", { "aria-label": "Next room", onclick: () => send({ er: "goto", room: Math.min(n + 1, current + 1) }) }, "▶");
  const keyToggle = h("label", { class: "switch" }, h("input", { type: "checkbox", id: "preview-answers", onchange: e => { showKey = e.target.checked; send({ er: "key", on: showKey }); } }),
    h("span", { class: "track", "aria-hidden": "true" }), "Show answers");
  const exit = () => { layer.remove(); window.removeEventListener("message", onMsg); document.removeEventListener("keydown", onKey); document.getElementById("btn-preview").focus(); };
  const onKey = e => { if (e.key === "Escape") exit(); };
  const onMsg = e => {
    if (e.source !== frame.contentWindow) return;
    if (e.data?.er === "escape") return exit();
    if (e.data?.er === "room") { current = e.data.room; mark(); prev.disabled = current === 0; next.disabled = current === n + 1; }
  };
  const load = (room) => {
    frame.onload = () => { if (showKey) send({ er: "key", on: true }); if (room) send({ er: "goto", room }); };

      h("div", { class: "badge" }, h("i", {}, "PREVIEW"), "Student view"),
      h("div", { class: "rooms", role: "group", "aria-label": "Jump to a room" }, prev, ...roomBtns, next),
      h("div", { class: "ctrl" }, keyToggle,
        h("button", { onclick: () => load(0), title: "Start over from the intro" }, "↻ Restart"),
        h("button", { class: "exit", id: "preview-exit", onclick: exit }, "✕ Exit preview"))),
    frame);
  document.body.append(layer);
  window.addEventListener("message", onMsg); document.addEventListener("keydown", onKey);
  load(startRoom);
  layer.querySelector("#preview-exit").focus();
}
document.getElementById("btn-preview").onclick = () => openPreview(typeof sel === "number" ? sel + 1 : 0);
document.getElementById("btn-export").onclick = () => {
  const box = h("div", { class: "sheet" },
    h("h2", {}, "Export for students"),
    h("div", { class: "box" }, h("h3", {}, "SCORM package (.zip) for Moodle or Canvas"),
      h("p", { class: "help" }, "Grades go to the gradebook automatically. Moodle: Add an activity → SCORM package. Canvas: SCORM tool. Upload the zip without unzipping it."),
      h("button", { id: "export-scorm", onclick: () => { if (checkReady("export")) { download(`${slug()}-SCORM.zip`, ER.scorm(gameHtml(), cfg.meta.title), "application/zip"); toast("SCORM package downloaded."); } } }, "⬇ Download SCORM .zip")),
    h("div", { class: "box" }, h("h3", {}, "Web page (.html)"),
      h("p", { class: "help" }, "One file that works anywhere: double-click it, upload it as a Moodle/Canvas file, or put it on a website. Pair it with the exit password and an LMS quiz for credit. You can also reopen this file in the editor later."),
      h("button", { id: "export-html", onclick: () => { if (checkReady("export")) { download(`${slug()}.html`, gameHtml(), "text/html"); toast("Game file downloaded."); } } }, "⬇ Download game .html")));
  overlay("Export", box);
};
document.getElementById("btn-save").onclick = () => { download(`${slug()}-project.json`, JSON.stringify(cfg, null, 2), "application/json"); toast("Project saved. Open it again with Open…"); };
document.getElementById("btn-open").onclick = () => document.getElementById("file").click();
document.getElementById("file").onchange = async e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  try {
    const text = await f.text();
    const next = /\.html?$/i.test(f.name) ? ER.configFromHtml(text) : JSON.parse(text);
    if (!next || !Array.isArray(next.rooms)) throw new Error("This file doesn't contain an escape room.");
    if (!confirm(`Open "${next.meta?.title || f.name}"? This replaces what's in the editor now (save it first if you need it).`)) return;
    cfg = next; sel = "settings"; changed(); render(); toast("Opened " + f.name);
  } catch (err) { alert("Couldn't open that file: " + err.message); }
};
document.getElementById("btn-new").onclick = () => {
  const box = h("div", { class: "sheet" },
    h("h2", {}, "Start a new escape room"),
    h("p", { class: "notice" }, "This replaces what's in the editor now. Save project first if you want to keep it."),
    h("div", { class: "row" },
      h("button", { id: "new-blank", onclick: () => { cfg = blankConfig(); sel = "settings"; changed(); render(); document.querySelector(".overlay")?.remove(); toast("Started a blank escape room."); } }, "Blank (one question room)"),
      h("button", { id: "new-sample", onclick: () => { cfg = clone(SAMPLE); sel = "settings"; changed(); render(); document.querySelector(".overlay")?.remove(); toast("Loaded the sample escape room."); } }, "Copy of the sample (Old Schoolhouse)")));
  overlay("New", box);
};
function blankConfig(){
  return { schema: 1, meta: { title: "New Escape Room", course: cfg.meta?.course || "", codePrefix: cfg.meta?.codePrefix || "", learningOutcome: "" },
    intro: { heading: "You're locked in!", story: "Solve every room to escape." },
    scoring: { mode: "completion", hintPenalty: 5, wrongPenalty: 2, minScore: 50 },
    finish: { exitPassword: "", certificateLine: "escaped by mastering this chapter", instructions: "" },
    rooms: [TYPES.quiz.blank()] };
}

/* ===================== Review sheet ===================== */
document.getElementById("btn-review").onclick = () => {
  const E = ER.esc, F = ER.fmt;
  const chk = it => `<span class="ck">${it.verified ? "☑" : "☐"}</span>`;
  const src = it => it.source ? `<div class="src">Source: ${E(it.source)}</div>` : `<div class="src none">Source: ________________________</div>`;
  const rooms = cfg.rooms.map((r, i) => {
    let body = "";
    if (r.type === "matching") { const m = ER.matching(r);
      body = `<p><strong>Lock combination:</strong> <code>${E(m.answer)}</code></p><ol>${r.cards.map(c => `<li>${chk(c)} <strong>${F(c.term)}</strong>${c.detail ? ` (${F(c.detail)})` : ""} — code <code>${E(m.code[r.cards.indexOf(c)])}</code><br>${c.clue ? "Clue: " + F(c.clue) : "<em>Decoy card (no clue)</em>"}${src(c)}</li>`).join("")}</ol>`; }
    if (r.type === "quiz") body = `<ol>${r.questions.map(q => `<li>${chk(q)} ${F(q.prompt)}<br><strong>Answer:</strong> ${q.kind === "choice" ? (q.choices || []).filter(c=>String(c).trim()).map((c, j) => j === q.correct ? `<u><strong>${F(c)}</strong></u>` : F(c)).join(" · ") : E(q.answers)}${src(q)}</li>`).join("")}</ol>`;
    if (r.type === "ordering") body = `<p>Correct order:</p><ol>${r.items.map(it => `<li>${chk(it)} ${F(it.text)}${it.label ? ` <strong>(${F(it.label)})</strong>` : ""}${src(it)}</li>`).join("")}</ol>`;
    if (r.type === "sorting") body = `<ol>${r.items.map(it => `<li>${chk(it)} ${F(it.text)} → <strong>${E(r.categories[it.category] || "?")}</strong>${src(it)}</li>`).join("")}</ol>`;
    if (r.type === "reflection") body = `<p>Results:</p><ol>${r.profiles.map(p => `<li>${chk(p)} <strong>${E(p.name)}</strong> — ${F(p.desc)}${p.who ? `<br>Thinkers: ${F(p.who)}` : ""}${p.next ? `<br>Next step: ${F(p.next)}` : ""}${src(p)}</li>`).join("")}</ol>
      <p>Questions:</p><ol>${r.questions.map(q => `<li>${chk(q)} ${F(q.prompt)}<ul>${(q.options||[]).map(o => `<li>${F(o.text)} → ${E((r.profiles.find(p => p.key === o.profile) || {}).name || "?")}</li>`).join("")}</ul>${src(q)}</li>`).join("")}</ol>`;
    const hints = (r.hints || []).length ? `<p class="hints"><strong>Hints:</strong></p><ol class="hints">${r.hints.map(x => `<li>${F(x)}</li>`).join("")}</ol>` : "";
    return `<section><h2>Room ${i+1}: ${E(r.title)}</h2><p class="story">${F(r.story || "")}</p>${r.reference ? `<p>Reference shown to students: ${F(r.reference)}</p>` : ""}${body}${hints}</section>`;
  }).join("");
  const st = ER.reviewStatus(cfg);
  const doc = `<!DOCTYPE html><html><head><meta charset="utf-8"><title>Review sheet: ${E(cfg.meta.title)}</title><style>
    body{font-family:Georgia,serif;max-width:800px;margin:1.5rem auto;padding:0 1rem;color:#111;line-height:1.45}
    h1{font-size:1.5rem;margin-bottom:.2rem} h2{font-size:1.15rem;border-bottom:1px solid #999;margin-top:1.6rem}
    li{margin:.45rem 0} .ck{font-size:1.15rem} .src{font-size:.85rem;color:#444} .src.none{color:#999}
    .story{font-style:italic;color:#444} .hints{font-size:.9rem;color:#444} code{font-size:1.05rem}
    section{break-inside:auto} @media print{.noprint{display:none}}</style></head><body>
    <h1>Review sheet: ${E(cfg.meta.title)}</h1>
    <p>${E(cfg.meta.course || "")} · ${st.verified} of ${st.total} items checked · ☐ = not yet checked<br>
    Exit password: <strong>${E(cfg.finish?.exitPassword || "(none)")}</strong> · Grading: ${cfg.scoring?.mode === "deductions" ? "accuracy" : "completion"}</p>
    <p><em>Check every item against your textbook or sources. Content written with AI help can contain mistakes. Mark items as checked in the editor.</em></p>
    ${rooms}</body></html>`;
  const frame = h("iframe", { title: "Review sheet" }); frame.srcdoc = doc;
  overlay("Review sheet (contains answers: for instructors only)", frame, [h("button", { onclick: () => frame.contentWindow.print() }, "🖨️ Print")]);
};

render();
</script>
</body>
</html>
