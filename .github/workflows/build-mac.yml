name: Build Mac app

on:
  push:
    paths: ["play.html", "mac/**", ".github/workflows/build-mac.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the app
        run: ./mac/build.sh
      - name: Smoke test (launch the app and take a screenshot)
        run: |
          "mac/build/Escape the Old Schoolhouse.app/Contents/MacOS/EscapeSchoolhouse" &
          PID=$!
          sleep 10
          kill -0 $PID && echo "App is running"
          screencapture -x smoke-test.png || true
          kill $PID
      - name: Upload smoke-test screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-screenshot
          path: smoke-test.png
          if-no-files-found: ignore
      - name: Upload app (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: EscapeTheOldSchoolhouse-mac
          path: mac/build/EscapeTheOldSchoolhouse-mac.zip
      - name: Publish "Mac app" release (main branch only)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete mac-latest --yes --cleanup-tag || true
          gh release create mac-latest mac/build/EscapeTheOldSchoolhouse-mac.zip \
            --title "Mac app (latest)" \
            --notes "Download **EscapeTheOldSchoolhouse-mac.zip**, unzip it, then right-click the app → **Open** the first time. See the README for details."
