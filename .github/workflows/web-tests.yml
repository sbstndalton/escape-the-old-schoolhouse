name: Web tests

on:
  push:
    paths: ["index.html", "play.html", "editor.html", "accessibility.html", "ACCESSIBILITY.md", "src/**", "content/**", "tests/**", "scripts/**", "package.json", "package-lock.json", ".github/workflows/web-tests.yml"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Check the built files are committed
        run: |
          git diff --exit-code -- index.html play.html editor.html accessibility.html EscapeRoom_SCORM.zip imsmanifest.xml \
            || { echo "::error::Built files are out of date. Run 'npm run build' and commit the result."; exit 1; }
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: tests/screenshots/
